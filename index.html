function renderIndicatorPage(key, title, localKey, faixaKey, higherIsBetter=false, showDailyBanner=false) {
  const d = DATA[key];
  const mesesLocais = d.meses || MESES.slice(0, d.total_mes.length);
  const ultimoIdx = Math.min(MES_ATUAL_IDX, mesesLocais.length - 1); // mês mais recente disponível pra esse indicador, capado no mês atual real
  let monthIdx = ultimoIdx;
  try { const s = localStorage.getItem('indMes_' + key); if (/^\d+$/.test(s || '') && parseInt(s) <= ultimoIdx) monthIdx = parseInt(s); } catch (e) {}
  const showCharts = !!(localKey && faixaKey && DATA[localKey] && DATA[faixaKey]);
  const comTaxa = ['mv', 'cvpe', 'cvpa'].includes(key); // indicadores de crime têm taxa por 100 mil habitantes
  const rotLim = higherIsBetter ? 'Meta' : 'Teto'; // MV/CVPE/CVPa/Furto são TETO (menor é melhor); Armas/Padrinhos/Saque são META
  const unidade = ({ mv: 'mortes', cvpe: 'vítimas', cvpa: 'vítimas' })[key] || ''; // MV/CVPE/CVPa contam vítimas (1 ocorrência pode ter várias)
  const redsMes = Array.isArray(d.reds_mes) ? d.reds_mes : null, prisMes = Array.isArray(d.reds_prisao_mes) ? d.reds_prisao_mes : null;
  const somaA = (arr, n) => (arr || []).slice(0, n + 1).reduce((a, b) => a + b, 0);
  const fRitmo = !higherIsBetter && MES_ATUAL_IDX < (d.meses || MESES).length ? fatorMesEmAndamento(d, MES_ATUAL_IDX) : 1; // fração fechada do mês corrente (ritmo do teto)
  const munFiltro = normMun(getMunFiltro());
  const fMesAtual = higherIsBetter ? fatorMesEmAndamento(d, ultimoIdx) : 1; // fração do mês corrente já fechada (só pesa na META de piso)

  // Situação contra o limite: teto = folga/estouro; meta = cumprida/faltam. Verde ✓ / vermelho ✕ (mesma convenção do painel).
  // Com tetos de 0 a 5 o percentual ("+200%", "−100%") só assustava; a diferença em unidades diz o que importa.
  function situacao(real, lim) {
    const saldo = higherIsBetter ? real - lim : lim - real;
    if (higherIsBetter) return saldo >= 0 ? `<span class="neg">cumprida${saldo > 0 ? ' (+' + saldo + ')' : ''}</span>` : `<span class="pos">faltam ${-saldo}</span>`;
    return saldo > 0 ? `<span class="neg">folga de ${saldo}</span>` : (saldo === 0 ? `<span class="neg">no teto</span>` : `<span class="pos">estourou em ${-saldo}</span>`);
  }
  const par = (real, lim) => `<span class="par"><b>${real}</b> <span class="ind-lim">/ ${lim}</span></span>`;
  const pctMeta = (real, lim) => (lim ? fmtBr(real / lim * 100, 0) + '%' : '—');
  const taxa = (real, pop) => (pop ? fmtBr(real / pop * 100000, 1) : '—');
  // META (piso) no mês em andamento é proporcional aos dias já fechados — mesma regra do quadro e do cartão da Home; com a meta cheia,
  // "faltam 39" num mês de 13 dias era um número que ninguém conseguiria cumprir. TETO segue com o teto cheio (mais tolerante).
  const limMes = (meta, f) => (higherIsBetter ? Math.floor(meta * f + 1e-9) : meta);
  const limAcum = (metaAcum, metaMes, f) => (higherIsBetter ? Math.floor(metaAcum - metaMes * (1 - f) + 1e-9) : metaAcum);
  const fDe = (mi) => (mi === ultimoIdx ? fMesAtual : 1);

  function table(mi) {
    let rows = '', popTotal = 0;
    const f = higherIsBetter ? fatorMesEmAndamento(d, mi) : 1;
    d.municipios.forEach(m => {
      const pop = comTaxa ? popMunicipio(m.nome) : 0; popTotal += pop;
      const lMes = limMes(m.meta_mes[mi], f), lAcum = limAcum(m.meta_acum[mi], m.meta_mes[mi], f);
      rows += `<tr class="rank-clic${normMun(m.nome) === munFiltro ? ' sel' : ''}" data-mun="${m.nome}" title="Filtrar por ${m.nome}">
        <td style="text-align:left">${m.nome}</td>
        <td>${par(m.realizado_mes[mi], lMes)}${!higherIsBetter && mi === MES_ATUAL_IDX && m.meta_mes[mi] > 0 && fRitmo < 1 ? `<br><span class="ind-lim">esperado até hoje ${fmtBr(m.meta_mes[mi] * fRitmo, 1)}</span>` : ''}</td>
        <td class="col-divider">${par(m.realizado_acum[mi], lAcum)}</td>
        <td>${comTaxa ? taxa(m.realizado_acum[mi], pop) : pctMeta(m.realizado_acum[mi], lAcum)}</td>
        <td style="text-align:left">${situacao(m.realizado_acum[mi], lAcum)}</td>
      </tr>`;
    });
    const totRealAcum = d.total_acum[mi], totMetaAcum = limAcum(d.total_meta_acum[mi], d.total_meta_mes[mi], f);
    rows += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)">
        <td style="text-align:left">TOTAL</td>
        <td>${par(d.total_mes[mi], limMes(d.total_meta_mes[mi], f))}</td>
        <td class="col-divider">${par(totRealAcum, totMetaAcum)}</td>
        <td>${comTaxa ? taxa(totRealAcum, popTotal) : pctMeta(totRealAcum, totMetaAcum)}</td>
        <td style="text-align:left">${situacao(totRealAcum, totMetaAcum)}</td>
      </tr>`;
    return rows;
  }

  // ---- ano: acumulado x limite e projeção linear até dezembro (batalhão) ----
  const nAno = d.total_meta_acum.length;
  const projAno = (realAcum, mi) => { const decorrido = mi + fDe(mi); return decorrido >= 1 ? realAcum / decorrido * nAno : null; };
  function anoHtml() {
    const reais = d.total_acum.slice(0, ultimoIdx + 1), limites = d.total_meta_acum.slice();
    const lAte = limAcum(d.total_meta_acum[ultimoIdx], d.total_meta_mes[ultimoIdx], fMesAtual), anual = d.total_meta_acum[nAno - 1];
    const proj = ultimoIdx < nAno - 1 ? projAno(reais[ultimoIdx], ultimoIdx) : reais[ultimoIdx];
    const ruim = proj !== null && (higherIsBetter ? proj < anual : proj > anual);
    let h = `<div class="ind-sec"><h3 class="ind-tit page-title" style="font-size:16px">O ano contra o ${rotLim.toLowerCase()} — 70º BPM</h3>`;
    h += `<div class="kpi-grid">`;
    h += `<div class="kpi-card ${(higherIsBetter ? reais[ultimoIdx] >= lAte : reais[ultimoIdx] <= lAte) ? 'kpi-green' : 'kpi-red'}"><div class="val">${reais[ultimoIdx]}</div><div class="lbl">Acumulado até ${mesesLocais[ultimoIdx]}${unidade ? ' (' + unidade + ')' : ''}</div><div class="sub">${rotLim.toLowerCase()} até aqui: ${lAte} · ${situacao(reais[ultimoIdx], lAte)}</div></div>`;
    h += `<div class="kpi-card ${ruim ? 'kpi-red' : 'kpi-green'}"><div class="val">${proj === null ? '—' : fmtBr(proj, 0)}</div><div class="lbl">Projeção para o ano (ritmo atual)</div><div class="sub">${rotLim.toLowerCase()} do ano: ${anual}${proj === null ? '' : ' · ' + (ruim ? (higherIsBetter ? 'abaixo da meta' : 'acima do teto') : (higherIsBetter ? 'meta alcançada no ritmo atual' : 'dentro do teto no ritmo atual'))}</div></div>`;
    if (comTaxa) { const pt = d.municipios.reduce((a, m) => a + popMunicipio(m.nome), 0); h += `<div class="kpi-card kpi-neutral"><div class="val">${taxa(reais[ultimoIdx], pt)}</div><div class="lbl">Taxa por 100 mil hab. (acumulado)</div></div>`; }
    if (redsMes) { const nR = somaA(redsMes, ultimoIdx); h += `<div class="kpi-card kpi-neutral"><div class="val">${nR}</div><div class="lbl">Ocorrências (REDS)</div><div class="sub">${reais[ultimoIdx]} ${unidade}${nR && reais[ultimoIdx] !== nR ? ' — algumas ocorrências têm mais de uma' : ''}</div></div>`; }
    if (redsMes && prisMes) { const nR = somaA(redsMes, ultimoIdx), nP = somaA(prisMes, ultimoIdx); h += `<div class="kpi-card ${nR && nP < nR ? 'kpi-neutral' : 'kpi-green'}"><div class="val">${nP}</div><div class="lbl">Ocorrências com autor preso</div><div class="sub">de ${nR}${nR ? ' (' + fmtBr(nP / nR * 100, 0) + '%)' : ''}</div></div>`; }
    if (key === 'cvpe' && DATA.cvpe_detalhado && DATA.cvpe_detalhado.total) { const pm = DATA.cvpe_detalhado.total.militar || 0; h += `<div class="kpi-card ${pm > 0 ? 'kpi-red' : 'kpi-green'}"><div class="val">${pm}</div><div class="lbl">Policial militar vítima</div><div class="sub">homicídio tentado contra PM no ano</div></div>`; }
    const tcCons = d.tentado_consumado;
    if (tcCons && (tcCons.tentado > 0 || key !== 'mv')) h += `<div class="kpi-card kpi-neutral"><div class="val">${tcCons.tentado} × ${tcCons.consumado}</div><div class="lbl">Tentados × consumados (${unidade || 'vítimas'})</div><div class="sub">${tcCons.tentado + tcCons.consumado ? fmtBr(tcCons.tentado / (tcCons.tentado + tcCons.consumado) * 100, 0) + '% tentados' : ''}</div></div>`;
    const rodv = DATA[key + '_rodovia'];
    if (Array.isArray(rodv) && rodv.length && unidade) { const nRod = rodv.reduce((a, x) => a + x[1], 0); h += `<div class="kpi-card kpi-neutral"><div class="val">${nRod}</div><div class="lbl">Em rodovia (${unidade})</div><div class="sub">${reais[ultimoIdx] ? fmtBr(nRod / reais[ultimoIdx] * 100, 0) + '% do total' : ''}${nRod ? ' · ' + rodv.slice(0, 2).map(x => x[0] + ' ' + x[1]).join(', ') : ''}</div></div>`; }
    if (typeof d.reds_bairro_invalido === 'number' && d.reds_bairro_invalido > 0 && redsMes) { const nR2 = somaA(redsMes, ultimoIdx); h += `<div class="kpi-card kpi-amber"><div class="val">${d.reds_bairro_invalido}</div><div class="lbl">Ocorrências com bairro inválido</div><div class="sub">de ${nR2}${nR2 ? ' (' + fmtBr(d.reds_bairro_invalido / nR2 * 100, 0) + '%)' : ''} — o bairro foi cadastrado como "inválido" no REDS; corrigir melhora o mapa e a lista restrita</div></div>`; }
    const vpo = d.vitimas_por_ocorrencia;
    if (vpo && (vpo['2'] + vpo['3+']) > 0) h += `<div class="kpi-card kpi-neutral"><div class="val">${vpo['2'] + vpo['3+']}</div><div class="lbl">Ocorrências com mais de uma vítima</div><div class="sub">${vpo['2']} com 2${vpo['3+'] ? ' · ' + vpo['3+'] + ' com 3 ou mais' : ''}</div></div>`;
    h += `</div>`;
    h += svgAcumuladoAno(reais, limites, proj, `Acumulado do ano contra o ${rotLim.toLowerCase()}, com projeção até dezembro`);
    h += `<div class="ano-leg"><span><i></i>realizado acumulado</span><span><i class="l"></i>${rotLim.toLowerCase()} acumulado</span><span><i class="p"></i>projeção linear (realizado ÷ meses decorridos × ${nAno})</span></div></div>`;
    return h;
  }

  // ---- painel da cidade escolhida no filtro global ----
  function cidadeHtml() {
    const m = d.municipios.find(x => normMun(x.nome) === munFiltro);
    if (!m) return '';
    const reais = m.realizado_mes.slice(0, ultimoIdx + 1), limites = reais.map((_, i) => limMes(m.meta_mes[i], fDe(i)));
    const lAte = limAcum(m.meta_acum[ultimoIdx], m.meta_mes[ultimoIdx], fMesAtual), anual = m.meta_acum[nAno - 1];
    const proj = ultimoIdx < nAno - 1 ? projAno(m.realizado_acum[ultimoIdx], ultimoIdx) : m.realizado_acum[ultimoIdx];
    const ruim = proj !== null && (higherIsBetter ? proj < anual : proj > anual);
    let h = `<div class="ind-sec"><h3 class="ind-tit page-title" style="font-size:16px">${m.nome} — mês a mês</h3><div class="ppvd-card">`;
    h += `<div class="kpi-grid"><div class="kpi-card ${(higherIsBetter ? m.realizado_acum[ultimoIdx] >= lAte : m.realizado_acum[ultimoIdx] <= lAte) ? 'kpi-green' : 'kpi-red'}"><div class="val">${m.realizado_acum[ultimoIdx]}</div><div class="lbl">Acumulado até ${mesesLocais[ultimoIdx]}</div><div class="sub">${rotLim.toLowerCase()} até aqui: ${lAte} · ${situacao(m.realizado_acum[ultimoIdx], lAte)}</div></div>`;
    h += `<div class="kpi-card ${ruim ? 'kpi-red' : 'kpi-green'}"><div class="val">${proj === null ? '—' : fmtBr(proj, 1)}</div><div class="lbl">Projeção para o ano</div><div class="sub">${rotLim.toLowerCase()} do ano: ${anual}</div></div>`;
    if (comTaxa) h += `<div class="kpi-card kpi-neutral"><div class="val">${taxa(m.realizado_acum[ultimoIdx], popMunicipio(m.nome))}</div><div class="lbl">Taxa por 100 mil hab.</div></div>`;
    h += `</div>` + svgBarrasMes(reais, limites, higherIsBetter, `${m.nome}: realizado por mês e ${rotLim.toLowerCase()} do mês`);
    h += `<div class="ano-leg"><span>barra = realizado do mês (vermelha: ${higherIsBetter ? 'abaixo da meta' : 'acima do teto'})</span><span><i class="l"></i>${rotLim.toLowerCase()} do mês</span></div>`;
    const detCfg = DETALHADO_CONFIG[key], det = detCfg && DATA[detCfg.dataKey];
    if (det) {
      let nat = null;
      (det.cias || []).forEach(c => c.municipios.forEach(x => { if (normMun(x.nome) === normMun(m.nome)) nat = x; }));
      if (nat) { const cols = detCfg.colunas.concat(nat.outros ? [{ key: 'outros', label: 'Outros' }] : []).filter(c => nat[c.key] > 0); h += `<div class="nat-chips" aria-label="Naturezas no ano">${cols.length ? cols.map(c => `<span>${c.label}: <b>${nat[c.key]}</b></span>`).join('') : '<span>Nenhuma ocorrência no ano</span>'}</div>`; }
    }
    const alvoMun = key === 'cvpa' ? (DATA.cvpa_alvo_municipio || {}) : null;
    if (alvoMun) { const kA = Object.keys(alvoMun).find(x => normMun(x) === normMun(m.nome)); if (kA && alvoMun[kA].length) h += `<div class="nat-chips" aria-label="Alvo do roubo no ano">${alvoMun[kA].map(x => `<span>${msgEsc(x[0])}: <b>${x[1]}</b></span>`).join('')}</div>`; }
    return h + `</div></div>`;
  }

  // ---- quadro município x mês (cada célula é o realizado do mês; cor = situação contra o limite do mês) ----
  function quadroHtml() {
    const cel = (real, lim) => {
      const ruim = higherIsBetter ? real < lim : real > lim;
      const cls = real === 0 && lim === 0 ? 'hm-zero' : (ruim ? 'hm-ruim' : (real === 0 ? 'hm-zero' : 'hm-ok'));
      return `<td class="${cls}" title="realizado ${real} · ${rotLim.toLowerCase()} ${lim}">${real}</td>`;
    };
    let h = `<div class="ind-sec"><h3 class="ind-tit page-title" style="font-size:16px">Mês a mês por município</h3>`;
    h += `<div class="vd-recorte">Cada célula é o realizado do mês; vermelho = ${higherIsBetter ? 'abaixo da meta' : 'acima do teto'} do mês, verde = ${higherIsBetter ? 'meta do mês cumprida' : 'dentro do teto'}, cinza = sem ocorrência. Passe o mouse (ou toque) para ver o ${rotLim.toLowerCase()} do mês.</div>`;
    h += `<div class="table-wrap"><table class="data-table hm" id="indQuadro"><thead><tr><th style="text-align:left">Município</th>${mesesLocais.slice(0, ultimoIdx + 1).map((m, i) => `<th>${MES_ABREV[i]}</th>`).join('')}<th class="col-divider">Total</th></tr></thead><tbody>`;
    d.municipios.forEach(m => {
      h += `<tr class="rank-clic${normMun(m.nome) === munFiltro ? ' sel' : ''}" data-mun="${m.nome}"><td style="text-align:left">${m.nome}</td>` + m.realizado_mes.slice(0, ultimoIdx + 1).map((v, i) => cel(v, limMes(m.meta_mes[i], fDe(i)))).join('') + `<td class="col-divider"><b>${m.realizado_acum[ultimoIdx]}</b></td></tr>`;
    });
    h += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)"><td style="text-align:left">TOTAL</td>` + d.total_mes.slice(0, ultimoIdx + 1).map((v, i) => cel(v, limMes(d.total_meta_mes[i], fDe(i)))).join('') + `<td class="col-divider">${d.total_acum[ultimoIdx]}</td></tr>`;
    return h + `</tbody></table></div></div>`;
  }

  // ---- causa presumida e meio utilizado (MV, CVPE, CVPa): mesmas barras do local/faixa; aviso se não cobrirem o total ----
  function causaMeioHtml() {
    const causa = DATA[key + '_causa'], meio = DATA[key + '_meio'];
    if (!Array.isArray(causa) || !Array.isArray(meio)) return '';
    const esperado = d.total_acum[ultimoIdx];
    const bloco = (lista, rot, classe) => {
      const soma = lista.reduce((a, x) => a + x[1], 0);
      const nota = soma !== esperado ? `<div class="vd-recorte">Cobre ${soma} de ${esperado} ${unidade || 'ocorrência(s)'} do ano — a lista está desatualizada em relação ao total.</div>` : '';
      return `<div class="chart-box"><h3>${rot}</h3>${barrasHtml(lista, false, classe)}${nota}</div>`;
    };
    return `<div class="ind-sec charts-row" style="gap:16px">${bloco(causa, 'Causa presumida', '')}${bloco(meio, 'Meio utilizado', 'verde')}</div>`;
  }

  // ---- quando e onde: dia da semana x faixa horária, rodovias e (CVPa) alvo do roubo ----
  function quandoOndeHtml() {
    const df = DATA[key + '_dia_faixa'], rod = DATA[key + '_rodovia'], alvo = DATA[key + '_alvo'];
    let h = '';
    const boxes = [];
    if (Array.isArray(alvo) && alvo.length) boxes.push(`<div class="chart-box"><h3>Alvo do roubo (o que foi levado de quem)</h3>${barrasHtml(alvo, false, '')}</div>`);
    if (Array.isArray(rod) && rod.length) { const n = rod.reduce((a, x) => a + x[1], 0), tot = d.total_acum[ultimoIdx]; boxes.push(`<div class="chart-box"><h3>Rodovias</h3>${barrasHtml(rod, false, 'verde')}<div class="vd-recorte">${n} de ${tot} ${unidade || 'ocorrência(s)'} (${tot ? fmtBr(n / tot * 100, 0) : 0}%) ocorreram em rodovia.</div></div>`); }
    if (boxes.length) h += `<div class="ind-sec charts-row" style="gap:16px">${boxes.join('')}</div>`;
    if (df && Array.isArray(df.matriz)) {
      const max = Math.max(1, ...df.matriz.flat()), colTot = df.faixas.map((_, j) => df.matriz.reduce((a, l) => a + l[j], 0)), geral = colTot.reduce((a, b) => a + b, 0);
      h += `<div class="ind-sec"><h3 class="ind-tit page-title" style="font-size:16px">Quando acontece — dia da semana × faixa horária</h3>`;
      h += `<div class="vd-recorte">Contagem em ${unidade || 'ocorrências'} no ano; quanto mais forte a cor, mais ocorrências. Serve para orientar escala e patrulha.</div>`;
      h += `<div class="table-wrap"><table class="data-table hm2" id="indDiaFaixa"><thead><tr><th style="text-align:left">Dia</th>${df.faixas.map(f => `<th>${f}</th>`).join('')}<th class="col-divider">Total</th></tr></thead><tbody>`;
      df.dias.forEach((dia, i) => {
        const linha = df.matriz[i], tot = linha.reduce((a, b) => a + b, 0);
        h += `<tr><td style="text-align:left">${dia}</td>${linha.map(v => `<td style="background:rgba(232,168,60,${(v / max * 0.4).toFixed(2)})"${v ? ' class="hm2-n"' : ' class="z0"'}>${v || '·'}</td>`).join('')}<td class="col-divider"><b>${tot}</b></td></tr>`;
      });
      h += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)"><td style="text-align:left">Total</td>${colTot.map(v => `<td>${v}</td>`).join('')}<td class="col-divider">${geral}</td></tr></tbody></table></div></div>`;
    }
    return h;
  }

  // ---- local imediato / faixa horária (ou causa / logradouro): barras legíveis, com aviso se não cobrem o total ----
  function localFaixaHtml() {
    const rotulos = key === 'furto' ? ['Causa', 'Logradouro (rodovias; propriedades agrupadas)'] : ['Local imediato', 'Faixa horária'];
    const esperado = d.total_acum[ultimoIdx];
    const bloco = (lista, rot, cron, classe) => {
      const soma = lista.reduce((a, x) => a + x[1], 0);
      const nota = soma !== esperado ? `<div class="vd-recorte">Cobre ${soma} de ${esperado} ocorrência(s) do ano${key === 'furto' && rot.startsWith('Logradouro') ? '' : ' — a lista está desatualizada em relação ao total'}.</div>` : '';
      return `<div class="chart-box"><h3>${rot}</h3>${barrasHtml(lista, cron, classe)}${nota}</div>`;
    };
    return `<div class="ind-sec charts-row" style="gap:16px">${bloco(DATA[localKey], rotulos[0], false, '')}${bloco(DATA[faixaKey], rotulos[1], key !== 'furto', 'verde')}</div>`;
  }

  // ---- ocorrências de MV (RESTRITO: só PPVD aprovado; REDS e endereço vêm do Supabase, nunca do arquivo público) ----
  function mvOcorrenciasHtml() {
    const nomeFiltro = munFiltro ? ((d.municipios.find(x => normMun(x.nome) === munFiltro) || {}).nome || getMunFiltro()) : '';
    let h = `<div class="ind-sec"><h3 class="ind-tit page-title" style="font-size:16px">Ocorrências de MV${nomeFiltro ? ' — ' + nomeFiltro : ''}</h3>`;
    if (!ppvdDadosRestritosLiberados()) return h + ppvdAvisoRestrito() + `</div>`;
    const oc = (DATA.crimes_violentos || {}).mv_ocorrencias || {};
    const { vdReds, reincKeys } = pgCrossIndices();
    let lista = [];
    Object.keys(oc).forEach(cid => (oc[cid] || []).forEach(o => lista.push({ cid, o })));
    if (munFiltro) lista = lista.filter(x => normMun(x.cid) === munFiltro);
    const dk = (s) => (s || '').split('/').reverse().join('');
    lista.sort((a, b) => dk(b.o.d).localeCompare(dk(a.o.d)) || (b.o.h || '').localeCompare(a.o.h || ''));
    const info = lista.map(({ cid, o }) => ({ cid, o, vdCtx: vdReds.has(o.r), nVd: vdNoEndereco(cid, o, o.r), reinc: reincKeys.has(pgEndChave(cid, o)) }));
    if (!info.length) return h + `<div class="pending-box">Nenhuma ocorrência de MV${nomeFiltro ? ' em ' + nomeFiltro : ''} no ano.</div></div>`;
    const acentua = acentuaNat;
    const cont = (f) => info.filter(x => (f === 'vdctx' && x.vdCtx) || (f === 'vdend' && x.nVd > 0) || (f === 'reinc' && x.reinc) || (f === 'arma' && x.o.a)).length;
    h += `<div class="vd-recorte">${info.length} ocorrência(s) no ano, da mais recente para a mais antiga. "Contexto VD" = o REDS também está na lista de Violência Doméstica; "VD no endereço" = há chamado de Violência Doméstica no mesmo endereço; "Reincidente" = endereço com 2+ chamados em 60 dias.</div>`;
    h += pgFiltrosHtml('mvFiltros', [['todos', 'Todas', info.length], ['vdctx', 'Contexto VD', cont('vdctx')], ['vdend', 'VD no endereço', cont('vdend')], ['reinc', 'Endereço reincidente', cont('reinc')], ['arma', 'Com arma', cont('arma')]], 'Buscar REDS, rua, natureza ou causa');
    h += `<div style="overflow-x:auto" id="mvTabelaBox"><table class="data-table vd-casos"><thead><tr><th>Data / REDS</th><th>Município</th><th>Natureza / Causa</th><th>Local / Meio</th><th>Endereço</th><th>Marcadores</th></tr></thead><tbody>`;
    info.forEach(({ cid, o, vdCtx, nVd, reinc }) => {

// ---- Operações, onda 3: onde e quando operamos x onde e quando acontece o crime ----
// "Operações por crime" de cada faixa/dia/cidade, comparado com a média do batalhão. Muito abaixo da média = pouca operação para o crime.
function opIndiceSituacao(ops, crimes, ref) {
  if (!crimes) return { v: '—', sit: `<span style="color:var(--muted)">sem ${ref.unidade}</span>`, cls: 'ok', idx: Infinity };
  const r = ops / crimes, idx = ref.media ? r / ref.media * 100 : 100, pctTxt = fmtBr(idx, 0) + '% da média';
  let sit;
  if (ops === 0) sit = `<span class="pos">sem operação</span>`;
  else if (idx < 50) sit = `<span class="pos">muito abaixo (${pctTxt})</span>`;
  else if (idx < 75) sit = `<span style="color:var(--caution)">! abaixo (${pctTxt})</span>`;
  else if (idx < 150) sit = `<span class="neg">em linha (${pctTxt})</span>`;
  else sit = `<span style="color:var(--muted)">acima (${pctTxt})</span>`;
  return { v: fmtBr(r, r >= 10 ? 0 : 1), sit, idx };
}
function opCruzaTabelaHtml(id, rotCol, linhas, unidade, munFiltro) {

  const dados = linhas.map(l => ({ l, i: opIndiceSituacao(l.ops, l.crimes, ref) }));
  if (linhas.some(l => l.mun)) dados.sort((a, b) => (a.i.idx - b.i.idx) || (b.l.crimes - a.l.crimes));

  dados.forEach(({ l, i }) => {

  return h;
}

// Cruzamentos disponíveis (dados públicos já agregados): POG x crimes violentos; PPAG Y07012 x violência doméstica; Y07014 x furto rural. Y15001 (escolar) não tem crime correspondente.

function opBairroCrimeHtml(det, munFiltro) {

  if (!ppvdDadosRestritosLiberados()) return h + ppvdAvisoRestrito() + `</div>`;
  const cv = DATA.crimes_violentos || {}, comp = det.bairro_completo || {}, compN = {};
  Object.keys(comp).forEach(c => { compN[normMun(c)] = {}; Object.keys(comp[c]).forEach(b => { compN[normMun(c)][normKey(b)] = comp[c][b]; }); });
  const linhas = {}; let invalidos = 0, totalOc = 0;
  [['mv', 'MV'], ['cvpe', 'CVPE'], ['cvpa', 'CVPa']].forEach(([k]) => {
    const oc = cv[k + '_ocorrencias'] || {};
    Object.keys(oc).forEach(cid => (oc[cid] || []).forEach(o => {
      totalOc++;

  // por bairro o volume de operações é pequeno e muito desigual (o Centro concentra): só aponta o que importa — nenhuma operação ou poucas (até 5 no ano)
  const POUCAS = 5;
  const dados = rows.map(r => { const q = r.ops / r.crimes; return { r, i: { v: fmtBr(q, q >= 10 ? 0 : 1), sit: r.ops === 0 ? `<span class="pos">sem operação</span>` : (r.ops <= POUCAS ? `<span style="color:var(--caution)">! poucas operações</span>` : `<span style="color:var(--muted)">com operação</span>`) } }; }).sort((a, b) => (a.r.ops - b.r.ops) || (b.r.crimes - a.r.crimes));
  const semOp = dados.filter(x => x.r.ops === 0).length, poucas = dados.filter(x => x.r.ops > 0 && x.r.ops <= POUCAS).length;
  h += `<div class="vd-recorte">${rows.length} bairro(s) com ocorrência de MV, CVPE ou CVPa no ano, do que tem menos operação para o que tem mais${semOp ? `; ${semOp} sem nenhuma operação registrada no bairro` : ''}${poucas ? `, ${poucas} com até ${POUCAS} no ano` : ''}. ${invalidos ? invalidos + ' ocorrência(s) com bairro "inválido" no REDS não entram aqui (corrigir o bairro no REDS completa o cruzamento). ' : ''}O bairro do RAT da operação e o do REDS do crime podem ser escritos diferente: se um bairro aparece "sem operação", confira o nome antes de concluir.</div>`;
  h += `<div style="overflow-x:auto"><table class="data-table vd-casos" id="opBairroCrime"><thead><tr><th>Município</th><th>Bairro</th><th>Crimes violentos</th><th>Operações no bairro</th><th>Operações por ocorrência</th><th>Situação</th></tr></thead><tbody>`;
  dados.forEach(({ r, i }) => {
    const comp2 = [r.mv ? r.mv + ' MV' : '', r.cvpe ? r.cvpe + ' CVPE' : '', r.cvpa ? r.cvpa + ' CVPa' : ''].filter(Boolean).join(' · ');
    h += `<tr><td data-l="Município">${msgEsc(r.cid)}</td><td data-l="Bairro">${msgEsc(r.b)}</td><td data-l="Crimes violentos">${r.crimes} <small>(${comp2})</small></td><td data-l="Operações no bairro">${r.ops}</td><td data-l="Operações por ocorrência">${i.v}</td><td data-l="Situação">${i.sit}</td></tr>`;
  });
  return h + `</tbody></table></div></div>`;
}

function pogBandColor(v) {
  if (v >= 95 && v <= 105) return { bg: 'rgba(33,201,138,0.22)', fg: '#3fe0a5' };
  if ((v >= 90 && v < 95) || (v > 105 && v <= 110)) return { bg: 'rgba(212,194,42,0.22)', fg: '#d4c22a' };
  return { bg: 'rgba(230,72,79,0.22)', fg: '#ff8a8f' };
}
function pogCell(v) {
  const c = pogBandColor(v);
  return `<td style="background:${c.bg};color:${c.fg};font-weight:600">${v.toFixed(2)}%</td>`;
}

function idobColor(v) {
  if (v >= 95) return 'rgba(33,201,138,0.22)';
  if (v >= 85) return 'rgba(212,194,42,0.22)';
  return 'rgba(230,72,79,0.22)';
}
function idobTextColor(v) {
  if (v >= 95) return '#3fe0a5';
  if (v >= 85) return '#d4c22a';
  return '#ff8a8f';
}

// operações a mais, com as vítimas de hoje, para o IDOB acumulado chegar em `alvo`% (cada vítima em bar vale 10 operações)
function idobFaltam(q, v, alvo) {
  if (!v) return 0;
  return Math.max(0, Math.ceil(v * 10 / (1 - alvo / 100) - q - 1e-9));
}
function idobSituacao(q, v) {
  if (!v) return `<span class="neg">sem vítima em bar</span>`;
  const idx = calcIdobIndice(q, v), f95 = idobFaltam(q, v, 95), vit = `${v} vítima${v > 1 ? 's' : ''}`;
  if (idx >= 95) return `<span class="neg">no verde · ${vit}</span>`;
  if (idx >= 85) return `<span style="color:var(--caution)">! ${vit} · +${f95} op. para 95%</span>`;
  return `<span class="pos">${vit} · +${idobFaltam(q, v, 85)} op. para sair do vermelho</span><br><small>+${f95} para chegar a 95%</small>`;
}

// ---- IDOB, onda 2: regularidade por fim de semana (informativa), local das operações e o mesmo detalhamento do POG (esforço, dia × faixa, bairro) ----
// Fim de semana = sexta a domingo, só os já encerrados. Não entra na nota nem nos semáforos: a meta mensal de Boemia é sempre cumprida e aqui se vê se a cidade operou todo fim de semana.
function idobRegularidadeHtml(det, munFiltro) {
  const fs = det.fins_de_semana;
  if (!fs || !fs.rotulos.length) return '';
  const N = fs.rotulos.length, ULT = 12;
  const linhas = Object.keys(fs.municipios).map(nome => {
    const v = fs.municipios[nome], cob = v.filter(x => x > 0).length;
    let seq = 0, atual = 0;
    v.forEach(x => { atual = x > 0 ? 0 : atual + 1; seq = Math.max(seq, atual); });
    let aberto = 0;
    for (let i = v.length - 1; i >= 0 && v[i] === 0; i--) aberto++;
    return { nome, v, cob, sem: N - cob, seq, aberto };
  }).sort((a, b) => (a.cob - b.cob) || a.nome.localeCompare(b.nome));
  const todas = fs.rotulos.filter((_, i) => linhas.every(l => l.v[i] > 0)).length;
  let h = `<div class="ind-sec"><h3 class="ind-tit page-title" style="font-size:16px">Regularidade — fins de semana com operação Boemia</h3>`;
  h += `<div class="vd-recorte">Indicador informativo (não entra na nota nem nos semáforos): a meta mensal de Boemia é sempre cumprida, então aqui se vê se cada cidade operou em todo fim de semana (sexta a domingo, só os já encerrados — ${N} até ${fs.ate}). Em ${todas} deles houve Boemia nas ${linhas.length} cidades. Da que tem menos fins de semana cobertos para a que tem mais; clique numa cidade para filtrar. Leitura: verde = 90% ou mais, amarelo = 75% a 90%, vermelho = abaixo disso.</div>`;
  h += `<div class="table-wrap"><table class="data-table ind-tab" id="idobReg"><thead><tr><th style="text-align:left">Município</th><th>Cobertos</th><th style="text-align:left">Últimos ${ULT} fins de semana</th></tr></thead><tbody>`;
  linhas.forEach(l => {
    const pc = l.cob / N * 100, st = pc >= 90 ? 'verde' : (pc >= 75 ? 'amarelo' : 'vermelho');
    const cor = st === 'verde' ? 'neg' : '';
    const pcTxt = `${l.cob} de ${N} · ${fmtBr(pc, 0)}%`;
    const pcHtml = st === 'verde' ? `<span class="neg">${pcTxt}</span>` : (st === 'amarelo' ? `<span style="color:var(--caution)">! ${pcTxt}</span>` : `<span class="pos">${pcTxt}</span>`);
    const strip = l.v.slice(-ULT).map((x, k) => { const rot = fs.rotulos[N - Math.min(ULT, N) + k]; return `<span class="fs ${x > 0 ? 'ok' : 'no'}" title="Fim de semana de ${rot}: ${x} operação(ões)">${x > 0 ? '●' : '○'}</span>`; }).join('');
    h += `<tr class="rank-clic${normMun(l.nome) === munFiltro ? ' sel' : ''}" data-mun="${l.nome}" title="Filtrar por ${l.nome}"><td style="text-align:left">${l.nome}</td><td>${pcHtml}<br><small>${l.sem} sem operação${l.seq > 1 ? ' · maior sequência ' + l.seq : ''}</small></td><td style="text-align:left">${strip}${l.aberto ? '<br><small>sem Boemia há ' + l.aberto + ' fim' + (l.aberto > 1 ? 's' : '') + ' de semana</small>' : ''}</td></tr>`;
  });
  return h + `</tbody></table></div><div class="vd-recorte">● = houve operação Boemia no fim de semana · ○ = nenhuma. Passe o mouse (ou toque) para ver a data e a quantidade.</div></div>`;
}
function idobLocalHtml(det) {
  const l = det.local, q = det.qualidade, tot = det.total || 1;
  if (!l) return '';
  let h = `<div class="ind-sec"><h3 class="ind-tit page-title" style="font-size:16px">Onde as operações acontecem</h3><div class="kpi-grid">`;
  h += `<div class="kpi-card kpi-neutral"><div class="val">${l.em_bar}</div><div class="lbl">Em bar, lanchonete ou boate</div><div class="sub">${fmtBr(l.em_bar / tot * 100, 0)}% das operações Boemia</div></div>`;
  h += `<div class="kpi-card kpi-neutral"><div class="val">${l.fora_bar}</div><div class="lbl">Fora de bar</div><div class="sub">${fmtBr(l.fora_bar / tot * 100, 0)}% — via pública e outros. O IDOB conta todas as operações Boemia, em bar ou não.</div></div>`;
  if (q && (q.localizacao_erro || q.zona_rural)) h += `<div class="kpi-card ${q.localizacao_erro ? 'kpi-amber' : 'kpi-neutral'}"><div class="val">${q.localizacao_erro}</div><div class="lbl">Localização com erro de processamento</div><div class="sub">${q.zona_rural} em zona rural</div></div>`;

}

// ---- IDOB, onda 3: operações Boemia x vítimas em bar/boate ----
// PÚBLICO: faixa, dia e cidade (poucas vítimas: leitura como tendência). RESTRITO (PPVD aprovado): cada ocorrência em bar que derrubou o índice, com a Boemia ao redor dela.

}
function idobOcorrenciasHtml(dd, munFiltro) {
  const nomeF = munFiltro ? ((DATA.idob.municipios.find(m => normMun(m.nome) === munFiltro) || {}).nome || '') : '';

  if (!ppvdDadosRestritosLiberados()) return h + ppvdAvisoRestrito() + `</div>`;
  const oc = (DATA.crimes_violentos || {}).idob_ocorrencias || {};
  let lista = [];
  Object.keys(oc).forEach(cid => (oc[cid] || []).forEach(o => lista.push({ cid, o })));
  if (munFiltro) lista = lista.filter(x => normMun(x.cid) === munFiltro);
  if (!lista.length) return h + `<div class="pending-box">Nenhuma ocorrência com vítima em bar ou boate${nomeF ? ' em ' + nomeF : ''} no ano.</div></div>`;
  const dk = (s) => (s || '').split('/').reverse().join('');
  lista.sort((a, b) => dk(b.o.d).localeCompare(dk(a.o.d)));
  const vit = lista.reduce((a, x) => a + (x.o.mv || 0) + (x.o.cvpe || 0) + (x.o.cvpa || 0), 0);
  const df = dd && dd.dia_faixa, noturna = df ? (df.matriz.reduce((a, l) => a + l[0] + l[3], 0) / Math.max(1, df.matriz.flat().reduce((a, b) => a + b, 0)) * 100) : 0;
  h += `<div class="vd-recorte">${lista.length} ocorrência(s) com ${vit} vítima(s) em bar, lanchonete ou boate no ano, da mais recente para a mais antiga. Cada vítima vale 10 operações no IDOB. Para cada uma, a coluna "Boemia ao redor" mostra quantas operações Boemia houve na cidade no dia do fato e nos 7 dias antes, a última antes do fato e as do bairro (30 dias antes e no ano). Não prova falha nem nexo: mostra se havia presença Boemia por perto.</div>`;
  h += `<div style="overflow-x:auto"><table class="data-table vd-casos" id="idobOcorrencias"><thead><tr><th>Data / REDS</th><th>Município</th><th>Natureza / Causa</th><th>Vítimas</th><th>Bairro</th><th>Boemia ao redor</th><th>Marcadores</th></tr></thead><tbody>`;
  lista.forEach(({ cid, o }) => {
    const hora = parseInt((o.h || '').slice(0, 2)), fora = !isNaN(hora) && hora >= 6 && hora < 18;
    const tipos = [o.mv ? o.mv + ' MV' : '', o.cvpe ? o.cvpe + ' CVPE' : '', o.cvpa ? o.cvpa + ' CVPa' : ''].filter(Boolean).join(' · ');
    const bairro = o.ops_bairro_ano === null || o.ops_bairro_ano === undefined ? 'bairro inválido no REDS — sem como cruzar' : `${o.ops_bairro_30d} nos 30 dias antes · ${o.ops_bairro_ano} no ano`;
    const ao_redor = `Dia do fato: <b>${o.ops_dia}</b><br>7 dias antes: <b>${o.ops_7d}</b><br>Última antes: ${o.ultima ? msgEsc(o.ultima) + ' (há ' + o.dias_ultima + ' dia' + (o.dias_ultima === 1 ? '' : 's') + ')' : 'nenhuma no ano'}<br>Bairro: ${bairro}`;
    const marc = [
      !o.ops_dia && !o.ops_7d ? pgMk('Sem Boemia na semana anterior', 'Nenhuma operação Boemia na cidade no dia do fato nem nos 7 dias antes', 'risco') : '',
      o.ops_bairro_ano === 0 ? pgMk('Bairro sem Boemia no ano', 'Nenhuma operação Boemia registrada nesse bairro em 2026', 'risco') : '',
      fora ? pgMk('Fora do horário da Boemia', `Fato às ${msgEsc(o.h)}; ${fmtBr(noturna, 0)}% das operações Boemia são de 18h a 6h`, 'risco') : '',
      o.ops_dia ? pgMk('Boemia no dia', 'Houve operação Boemia na cidade no dia do fato') : '',
    ].join('') || '—';
    h += `<tr><td data-l="Data / REDS">${msgEsc(o.d)}${o.h ? ' ' + msgEsc(o.h) : ''}<br><small>${msgEsc(o.r)}</small></td><td data-l="Município">${msgEsc(cid)}</td><td data-l="Natureza / Causa">${msgEsc(acentuaNat(o.n))}${o.c ? '<br><small>' + msgEsc(o.c) + '</small>' : ''}</td><td data-l="Vítimas">${msgEsc(tipos)}</td><td data-l="Bairro">${msgEsc(o.b) || '—'}</td><td data-l="Boemia ao redor">${ao_redor}</td><td data-l="Marcadores">${marc}</td></tr>`;
  });
  return h + `</tbody></table></div></div>`;
}

function renderITVDPage() {

  let mi = Math.min(MES_ATUAL_IDX, mesesLocais.length - 1);

    let html = '';
    const list = d.municipios.map(m => ({
      nome: m.nome,

function renderCavaloAcoPage() {
  const d = DATA.cavaloaco;
  const mesesLocais = d.meses || MESES.slice(0, d.total_mes.length);
  let mi = Math.min(MES_ATUAL_IDX, mesesLocais.length - 1);

  function monthCell(cumpriu) {
    return cumpriu
      ? `<td style="background:rgba(33,201,138,0.22);color:#3fe0a5;font-weight:600">CUMPRIU</td>`
      : `<td style="background:rgba(230,72,79,0.22);color:#ff8a8f;font-weight:600">NÃO CUMPRIU</td>`;
  }

  function rows(mi) {
    let html = '';
    d.municipios.forEach(m => {
      const rMes=m.realizado_mes[mi], mMes=m.meta_mes[mi], rAc=m.realizado_acum[mi], mAc=m.meta_acum[mi];
      const dAc = mAc ? (rAc/mAc*100) : 100;
      const cls = dAc>=100?'neg':'pos';
      const cumpriuMes = mMes ? (rMes >= mMes) : true;
      html += `<tr><td style="text-align:left">${m.nome}</td>
        <td>${mMes}</td><td>${rMes}</td>${monthCell(cumpriuMes)}
        <td class="col-divider">${mAc}</td><td>${rAc}</td><td><span class="${cls}">${dAc.toFixed(0)}%</span></td>
      </tr>`;
    });
    const tRMes=d.total_mes[mi], tMMes=d.total_meta_mes[mi], tRAc=d.total_acum[mi], tMAc=d.total_meta_acum[mi];
    const tDAc = tMAc? tRAc/tMAc*100:100;
    const tCumpriuMes = tMMes ? (tRMes >= tMMes) : true;
    html += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)"><td style="text-align:left">70º BPM</td>
      <td>${tMMes}</td><td>${tRMes}</td>${monthCell(tCumpriuMes)}
      <td class="col-divider">${tMAc}</td><td>${tRAc}</td><td><span class="${tDAc>=100?'neg':'pos'}">${tDAc.toFixed(0)}%</span></td>
    </tr>`;
    return html;
  }

  // ---------- Eficácia e Eficiência (produtividade extraída do RAT) ----------
  const ef = DATA.cavaloaco_eficacia;
  const efMesesLocais = ef ? ef.meses : mesesLocais;

  function efSum(arr, mi, acum) {
    return acum ? arr.slice(0, mi + 1).reduce((a, b) => a + b, 0) : arr[mi];
  }
  function efPct(num, den) { return den > 0 ? (num / den * 100) : 0; }

  function efKpis(mi) {
    const ops = ef.municipios.reduce((s, m) => s + efSum(m.num_ops, mi, true), 0);
    const motosFisc = ef.municipios.reduce((s, m) => s + efSum(m.motos_fisc, mi, true), 0);
    const motosAutu = ef.municipios.reduce((s, m) => s + efSum(m.motos_autu, mi, true), 0);
    const veicRetidos = ef.municipios.reduce((s, m) => s + efSum(m.veic_retidos, mi, true), 0);
    const inabilitados = ef.municipios.reduce((s, m) => s + efSum(m.inabilitados, mi, true), 0);
    const redsGerado = ef.municipios.reduce((s, m) => s + efSum(m.reds_gerado, mi, true), 0);
    const efetivoSum = ef.municipios.reduce((s, m) => s + efSum(m.efetivo_sum, mi, true), 0);
    const taxaAutuacao = efPct(motosAutu, motosFisc);
    const taxaReds = efPct(redsGerado, ops);
    const motosPorOp = ops > 0 ? (motosFisc / ops) : 0;
    const efetivoMedio = ops > 0 ? (efetivoSum / ops) : 0;

    let h = `<div class="kpi-grid">`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${motosFisc.toLocaleString('pt-BR')}</div><div class="lbl">Motos Fiscalizadas</div></div>`;
    h += `<div class="kpi-card kpi-green"><div class="val">${taxaAutuacao.toFixed(1)}%</div><div class="lbl">Taxa de Autuação (${motosAutu}/${motosFisc})</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${veicRetidos}</div><div class="lbl">Veículos Retidos por Infração</div></div>`;
    h += `<div class="kpi-card ${redsGerado > 0 ? 'kpi-green' : 'kpi-neutral'}"><div class="val">${redsGerado}</div><div class="lbl">REDS Gerados (${taxaReds.toFixed(1)}% das op.)</div></div>`;
    h += `</div>`;
    h += `<div class="kpi-grid">`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${efetivoMedio.toFixed(1)}</div><div class="lbl">Efetivo Médio/Operação</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${motosPorOp.toFixed(1)}</div><div class="lbl">Motos Fiscalizadas/Operação</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${inabilitados}</div><div class="lbl">Inabilitados Autuados</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${ops.toLocaleString('pt-BR')}</div><div class="lbl">Total de Operações (RAT)</div></div>`;
    h += `</div>`;
    return h;
  }

  function efRows(mi) {
    let h = '';
    ef.municipios.forEach(m => {
      const ops = efSum(m.num_ops, mi, true), motosFisc = efSum(m.motos_fisc, mi, true), motosAutu = efSum(m.motos_autu, mi, true);
      const veicFisc = efSum(m.veic_fisc, mi, true), veicRet = efSum(m.veic_retidos, mi, true), redsGer = efSum(m.reds_gerado, mi, true);
      const efetivo = efSum(m.efetivo_sum, mi, true);
      const taxa = efPct(motosAutu, motosFisc);
      const efetivoMedio = ops > 0 ? (efetivo / ops) : 0;
      const tempoMed = m.tempo_mediana_min[mi] || 0;
      h += `<tr><td style="text-align:left">${m.nome}</td>
        <td>${ops}</td><td>${motosFisc}</td><td>${motosAutu}</td><td>${taxa.toFixed(1)}%</td>
        <td class="col-divider">${veicFisc}</td><td>${veicRet}</td>
        <td class="col-divider">${redsGer}</td><td>${efetivoMedio.toFixed(1)}</td><td>${tempoMed}</td>
      </tr>`;
    });
    return h;
  }

  let natRows = '';
  (ef.naturezas_reds_geradas || []).slice(0, 12).forEach(n => {
    natRows += `<tr><td style="text-align:left"><code>${n.codigo}</code></td><td style="text-align:left">${n.descricao}</td><td>${n.qtd}</td></tr>`;
  });

  let html = `<div class="page-title">Operação Cavalo de Aço em ${mesesLocais[mi]} de 2026</div>`;
  html += `<div class="def-box">${DEFS.cavaloaco}</div>`;
  html += bannerAcompanhamentoDiario([{ label: 'Cavalo de Aço (Batalhão)', meta: d.total_meta_mes[MES_ATUAL_IDX], realizado: d.total_mes[MES_ATUAL_IDX], dataAtualizacao: dataAtualizacaoIndicador(d) }]);
  html += `<select class="month-select" id="cavaloacoMonthSel">`;
  mesesLocais.forEach((m,i) => html += `<option value="${i}" ${i===mi?'selected':''}>${m}</option>`);
  html += `</select>`;
  html += `<table class="data-table" id="cavaloacoTable"><thead><tr>
    <th style="text-align:left">Município</th><th>Meta Op. Mês</th><th>Op. Mês</th><th>Cumpriu Mês?</th>
    <th class="col-divider">Meta Op. Acum</th><th>Op. Acum</th><th>Desemp.</th>
  </tr></thead><tbody>${rows(mi)}</tbody></table>`;
  html += `<div class="updated">Fonte: export REDS (Natureza=Y01003 E Histórico contém "Cavalo de Aço" E Unidade Responsável=70 BPM), ${d.total_acum[d.total_acum.length-1]} operações jan-ago/2026 (filtro atualizado em 2026-08-11 — antes não exigia o Histórico, o que contava toda operação Y01003, não só as de Cavalo de Aço). Op. = nº de REDS; Motos Abordadas = soma do indicador "Qde de motocicletas fiscalizadas" de cada RAT (fonte separada, não tocada por essa mudança). Falta confirmar os códigos exatos dos componentes de recuperação de veículo/prisão/arma/drogas/clonagem pra fechar o indicador IDOCA completo (fórmula ainda pendente de validação).</div>`;

  if (ef) {
    html += `<div class="page-title" style="margin-top:34px;font-size:16px">Eficácia e Eficiência (Acumulado até ${mesesLocais[mi]})</div>`;
    html += `<div class="def-box">Extraído do campo <code>PRODUTIVIDADE</code> de cada RAT de Cavalo de Aço (indicadores lançados pela guarnição na hora de fechar o registro) e do campo <code>REDS_RELACIONADOS</code> (quando a fiscalização gera um REDS à parte — clonagem, drogas, arma, foragido etc.). <b>Eficácia</b> = o que a fiscalização efetivamente produz (autuações, retenções, REDS gerados). <b>Eficiência</b> = quanto recurso (efetivo, tempo) foi empregado pra produzir isso. Contagem de operações aqui vem do RAT (NOME_OPERACAO contém "CAVALO"), levemente diferente do nº oficial de operações (que vem do REDS com Histórico) — números próximos mas não idênticos, tratar como uma lente complementar, não substituta.</div>`;
    html += `<div id="cavaloacoEfKpis">${efKpis(mi)}</div>`;
    html += `<table class="data-table" id="cavaloacoEfTable"><thead><tr>
      <th style="text-align:left">Município</th><th>Op. (RAT)</th><th>Motos Fisc.</th><th>Motos Autu.</th><th>Taxa Autu.</th>
      <th class="col-divider">Veíc. Fisc.</th><th>Veíc. Retidos</th>
      <th class="col-divider">REDS Gerados</th><th>Efetivo Méd.</th><th>Tempo Med.(min)</th>
    </tr></thead><tbody>${efRows(mi)}</tbody></table>`;
    if (natRows) {
      html += `<div class="page-title" style="margin-top:24px;font-size:14px">Naturezas dos REDS Gerados a partir da Fiscalização (70º BPM, ano)</div>`;
      html += `<table class="data-table"><thead><tr><th style="text-align:left">Código</th><th style="text-align:left">Natureza</th><th>Qtde</th></tr></thead><tbody>${natRows}</tbody></table>`;
    }
    html += `<div class="updated">Tempo mediano exclui registros com OPR_TEMPO_TOTAL_MINUTOS &gt; 480 (RATs provavelmente esquecidos abertos — outlier de digitação, não representa a duração real da operação). ${ef.fonte}.</div>`;
  }

  document.getElementById('main').innerHTML = html;
  document.getElementById('cavaloacoMonthSel').addEventListener('change', (e) => {
    const mi2 = parseInt(e.target.value);
    document.querySelector('#cavaloacoTable tbody').innerHTML = rows(mi2);
    if (ef) {
      document.getElementById('cavaloacoEfKpis').innerHTML = efKpis(mi2);
      document.querySelector('#cavaloacoEfTable tbody').innerHTML = efRows(mi2);
    }
  });
}

function desColor(reds, prisoes) {
  const des = reds > 0 ? (prisoes / reds) * 100 : 100;
  if (des >= 50) return { bg: 'rgba(33,201,138,0.22)', fg: '#3fe0a5' };
  if (des >= 25) return { bg: 'rgba(240,190,50,0.22)', fg: '#e6b400' };
  return { bg: 'rgba(230,72,79,0.22)', fg: '#ff8a8f' };
}

// ===== Peças comuns das páginas de análise (padrão da Violência Doméstica): botões de cidade/período, ranking clicável,
// filtros com contagem + busca e tabela que vira cartão no celular =====
function pgUltimoMes(totalMes) {
  let i = Math.min(MES_ATUAL_IDX, totalMes.length - 1);
  while (i > 0 && !totalMes[i]) i--;
  return { iUlt: i, parcial: i === MES_ATUAL_IDX };
}
function pgCidade(municipiosData, ranking) {
  const f = normMun(getMunFiltro());
  let idx = f ? municipiosData.findIndex(m => normMun(m.nome) === f) : -1;
  const ausente = !!f && idx < 0; // cidade escolhida que não aparece nesta página (ex.: zero ocorrências no período)
  const semFiltro = !f;
  if (idx < 0) idx = ausente ? 0 : municipiosData.indexOf(ranking[0]);
  return { idx, semFiltro, ausente, filtro: f };
}
function pgPeriodoSalvo(chave, iUlt) {
  try { const s = localStorage.getItem(chave); if (s === 'acum' || (/^\d+$/.test(s || '') && parseInt(s) <= iUlt)) return s; } catch (e) {}
  return 'acum';
}
function pgPillsPeriodoHtml(id, rotuloAcum, meses, iUlt, parcial) {
  return `<div class="pills-vd" id="${id}" role="group" aria-label="Período"><button type="button" data-p="acum">${rotuloAcum}</button>` +
    meses.slice(0, iUlt + 1).map((m, i) => `<button type="button" data-p="${i}">${m}${i === iUlt && parcial ? ' (parcial)' : ''}</button>`).join('') + `</div>`;
}
function pgLigarPeriodo(id, chave, inicial, aoMudar) {

// Índices para cruzar as listas restritas (MV, CVPE) com Violência Doméstica e Reincidência de Endereço
function pgCrossIndices() {
  const vdReds = new Set(), vd = (DATA.violencia_domestica || {}).ocorrencias || {};
  Object.keys(vd).forEach(c => (vd[c] || []).forEach(x => { if (x.r) vdReds.add(x.r); }));
  const reincKeys = new Set(), re = (DATA.reincidencia || {}).enderecos || {};
  Object.keys(re).forEach(c => (re[c] || []).forEach(e => { const k = pgEndChave(c, e); if (k) reincKeys.add(k); }));
  return { vdReds, reincKeys };
}
const acentuaNat = (t) => String(t || '').replace(/Homicidio/g, 'Homicídio').replace(/Feminicidio/g, 'Feminicídio').replace(/Lesao/g, 'Lesão').replace(/Carcere/g, 'Cárcere').replace(/Extorsao/g, 'Extorsão');

const pgMk = (txt, titulo, cls) => `<span class="mk ${cls || ''}" title="${titulo}">${txt}</span>`;
const pgEndereco = (o) => `${o.b || ''}${o.l ? (' - ' + o.l) : ''}${o.nu && o.nu !== '0' ? (', ' + o.nu) : ''}`;

// Endereços com ocorrência de Violência Doméstica (cidade + logradouro + número): cruza Crimes Violentos e Reincidência com a VD.
// Exige logradouro; só casa quando o número também bate (ou os dois estão sem número) para não juntar ruas homônimas.
let _vdIndice = null, _vdIndiceRef = null;
function pgEndChave(nomeCidade, o) {
  const l = normMun(o.l); if (!l) return '';
  let nu = String(o.nu == null ? '' : o.nu).trim(); if (nu === '0') nu = '';
  return normMun(nomeCidade) + '|' + l + '|' + normMun(nu);
}
function vdNoEndereco(nomeCidade, o, ignorarReds) {
  const vd = (DATA.violencia_domestica || {}).ocorrencias;
  if (!vd) return 0;
  if (_vdIndiceRef !== vd) {
    _vdIndice = {};
    Object.keys(vd).forEach(cidade => (vd[cidade] || []).forEach(x => { const k = pgEndChave(cidade, x); if (k) (_vdIndice[k] = _vdIndice[k] || []).push(x.r); }));
    _vdIndiceRef = vd;
  }
  const k = pgEndChave(nomeCidade, o);
  return k ? (_vdIndice[k] || []).filter(r => !ignorarReds || r !== ignorarReds).length : 0;
}

  const casos = await ppvdBuscarCasosVD(lista.map(x => x.o.r).filter(Boolean));
  const novo = () => ({ v: 0, a: 0, z: 0, g: 0, semCaso: 0, atrasados: 0 });
  const porCidade = {}, total = novo();
  lista.forEach(({ mun, o }) => {
    const caso = o.r ? (casos[o.r] || null) : null, sem = ppvdSemaforoVD(caso);
    const cid = porCidade[mun] = porCidade[mun] || novo();
    [cid, total].forEach(c => {
      if (sem === 'vermelho') { c.v++; if (!caso) c.semCaso++; else if (ppvdVisitaAtrasadaVD(caso)) c.atrasados++; }
      else if (sem === 'amarelo') c.a++; else if (sem === 'azul') c.z++; else c.g++;
    });
  });
  return { lista, casos, porCidade, total };
}

  html += `<div class="kpi-card kpi-neutral"><div class="val">${fmtBr(taxaGeral, 1)}</div><div class="lbl">Taxa por 100 mil hab. (70º BPM)</div></div>`;
  html += `<div class="kpi-card ${homicGeral > 0 ? 'kpi-red' : 'kpi-green'}"><div class="val">${homicGeral}</div><div class="lbl">Homicídios/Feminicídios (causa VD)</div></div>`;
  html += `<div class="kpi-card ${tentGeral > 0 ? 'kpi-red' : 'kpi-green'}"><div class="val">${tentGeral}</div><div class="lbl">Tentativas (causa VD)</div>${subTent ? `<div class="sub">${subTent}</div>` : ''}</div>`;
  html += `<div class="kpi-card ${totalEnderecos > 0 ? 'kpi-red' : 'kpi-green'}"><div class="val">${totalEnderecos}</div><div class="lbl">Endereços com Reincidência</div></div>`;
  html += `</div>`;

  html += `<div class="page-title" style="margin-top:34px;font-size:16px">Ranking por Município (taxa por 100 mil habitantes)</div>`;
  const ranking = municipiosData.slice().sort((a, b) => b.taxa_100k - a.taxa_100k);
  const comSituacao = ppvdDadosRestritosLiberados();
  const munFiltroAtual = normMun(getMunFiltro());
  html += `<div class="vd-recorte">Clique numa cidade para ver os casos dela abaixo.${comSituacao ? ' As colunas de situação contam as ocorrências desde ' + (DATA.mv.meses || MESES)[HOME_VD_MES_INICIO - 1] + ' pelo semáforo dos casos no PPVD.' : ''}</div>`;
  html += `<div class="table-wrap"><table class="data-table" id="vdRanking"><thead><tr><th>Ranking</th><th style="text-align:left">Município</th><th>Pop.</th><th>Ocorrências (${d.periodo_dados})</th><th>Taxa/100k hab.</th><th>Endereços Reincid.</th>${comSituacao ? '<th title="Novos ou em atraso">✕ Novos/atraso</th><th title="Atendimento iniciado">! Iniciado</th><th title="Em acompanhamento">◆ Acomp.</th><th title="Estabilizados">✓ Estab.</th>' : ''}</tr></thead><tbody>`;
  const sitVazia = comSituacao ? '<td class="sit-cel z" data-s="v">·</td><td class="sit-cel z" data-s="a">·</td><td class="sit-cel z" data-s="z">·</td><td class="sit-cel z" data-s="g">·</td>' : '';

  html += `</tbody></table></div>`;

  html += `<div class="page-title" style="margin-top:34px;font-size:16px">Série Mensal — 70º BPM</div>`;
  html += `<table class="data-table"><thead><tr><th style="text-align:left">Mês</th><th>Ocorrências VD</th><th>Homicídios/Feminicídios (causa VD)</th><th>Tentativas (causa VD)</th></tr></thead><tbody>`;
  mesesLocais.slice(0, iUlt + 1).forEach((m, i) => {

  // cidade = botões do topo (filtro global) ou clique no ranking; sem filtro mostra a de maior taxa. Período em botões.

  const semFiltro = idxDefault < 0;

  let periodoAtual = 'acum';
  try { const salvo = localStorage.getItem('vdPeriodo'); if (salvo === 'acum' || (/^\d+$/.test(salvo || '') && parseInt(salvo) <= iUlt)) periodoAtual = salvo; } catch (e) {}
  html += `<div class="page-title" style="margin-top:34px;font-size:16px" id="vdTituloCidade">Casos de ${municipiosData[idxDefault].nome}</div>`;
  if (semFiltro) html += `<div class="vd-recorte">Mostrando a cidade de maior taxa. Escolha outra nos botões do topo ou clicando no ranking.</div>`;

  async function renderMuniPanel(muniIdx, periodo) {
    const m = municipiosData[muniIdx];
    const nome = m.nome;
    let total, taxaPeriodo;
    if (periodo === 'acum') {
      total = sum(m.vd_mes);
    } else {
      const mi = parseInt(periodo);
      total = m.vd_mes[mi] || 0;
    }
    taxaPeriodo = m.pop ? (total / m.pop * 100000) : 0;

    let h = `<div class="kpi-grid">`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${total}</div><div class="lbl">Ocorrências de Contexto VD</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${fmtBr(taxaPeriodo, 1)}</div><div class="lbl">Taxa por 100 mil hab.</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${fmtBr(m.pop, 0)}</div><div class="lbl">População</div></div>`;
    h += `<div class="kpi-card ${m.enderecos_reincidentes > 0 ? 'kpi-red' : 'kpi-green'}"><div class="val">${m.enderecos_reincidentes}</div><div class="lbl">Endereços Reincidentes</div></div>`;
    h += `</div>`;

    const listaAll = d.ocorrencias[nome] || [];
    const lista = (periodo === 'acum') ? listaAll.slice() : listaAll.filter(o => o.m === parseInt(periodo) + 1);
    const ordemGrav = { critica: 0, alta: 1, media: 2 };
    const dk = s => (s || '').split('/').reverse().join('');
    lista.sort((a, b) => (ordemGrav[a.g] - ordemGrav[b.g]) || dk(b.d).localeCompare(dk(a.d)));

    if (!ppvdDadosRestritosLiberados()) { h += ppvdAvisoRestrito(); document.getElementById('vdMuniPanel').innerHTML = h; return; }
    const redsDaLista = lista.map(o => o.r).filter(Boolean);
    const casosMap = await ppvdBuscarCasosVD(redsDaLista);
    h += enderecosReincidentesVdHtml(d, nome, mesesLocais);
    h += `<div class="updated" style="border:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center">Cor do caso:
      <span><span class="ppvd-badge ppvd-badge-critica">Vermelho</span> novo ou em atraso</span>
      <span><span class="ppvd-badge ppvd-badge-alta">Amarelo</span> atendimento iniciado</span>
      <span><span class="ppvd-badge ppvd-badge-azul">Azul</span> em acompanhamento (retornos, dentro do prazo)</span>
      <span><span class="ppvd-badge ppvd-badge-verde">Verde</span> estabilizado</span></div>`;
    // Recorte padrão (acumulado): casos do PPVD + ocorrências recentes. As ocorrências SEM caso anteriores a Setembro
    // ficam num histórico recolhido (o PPVD só existe desde Ago/Set).
    const casoDe = (o) => (o.r ? (casosMap[o.r] || null) : null);
    const antes = (o) => o.m < HOME_VD_MES_INICIO; // anterior ao PPVD: finalizado (verde), visitas sem registro no sistema
    const velhoSemCaso = (o) => antes(o) && !casoDe(o);
    const semDe = (o) => { if (velhoSemCaso(o)) return 'verde'; const c = casoDe(o); return c ? ppvdSemaforoVD(c) : 'sem'; };
    const principais = periodo === 'acum' ? lista.filter(o => !velhoSemCaso(o)) : lista;
    const historico = periodo === 'acum' ? lista.filter(velhoSemCaso) : [];
    // mais urgente primeiro: vermelho (novos/atrasados), amarelo, azul, verde; dentro de cada grupo, o mais antigo em aberto
    const ordemSem = { vermelho: 0, sem: 0, amarelo: 1, azul: 2, verde: 3 };
    const horasDe = (o) => { const x = auditoriaHorasDesde(o.d); return x === null ? 0 : Math.max(0, x); };
    principais.sort((a, b) => (ordemSem[semDe(a)] - ordemSem[semDe(b)]) || (horasDe(b) - horasDe(a)));
    const cabecalho = `<table class="data-table vd-casos"><thead><tr><th>Situação</th><th>REDS / Data</th><th>Natureza / Gravidade</th><th>Endereço</th><th>Ocorrência</th><th>Acompanhamento</th><th>Responsável</th><th title="Classificação GUT inicial → final">GUT</th><th class="acao">Ação</th></tr></thead><tbody>`;
    const mk = (txt, titulo, cls) => `<span class="mk ${cls || ''}" title="${titulo}">${txt}</span>`;
    const linhaCaso = (o) => {
      const end = `${o.b || ''}${o.l ? (' - ' + o.l) : ''}${o.nu && o.nu !== '0' ? (', ' + o.nu) : ''}`;
      const natLabel = o.vd_homic ? (o.n + ' ⚠') : o.n;
      window.ppvdOcorrenciaLookup = window.ppvdOcorrenciaLookup || {};
      if (o.r) {
        window.ppvdOcorrenciaLookup[o.r] = { reds_data: ppvdToIso(o.d), natureza: o.n, causa: o.c, municipio: nome, bairro: o.b, logradouro: o.l, numero: o.nu, fonar_feito: !!o.fonar_feito };
      }
      const caso = casoDe(o);
      const velho = velhoSemCaso(o);
      const sem = velho ? 'verde' : ppvdSemaforoVD(caso);
      const sugestao = !caso && !velho ? ppvdSugerirResponsavel(nome) : null;
      const respNome = caso ? (caso.militar_responsavel || '—') : (sugestao ? `<span class="sugerido" title="Sugestão do cadastro de militares — ainda não foi designado">${msgEsc(sugestao.nome)} (sugerido)</span>` : '—');
      const gutIni = caso && caso.gut_score ? caso.gut_score : null, gutFin = caso && caso.gut_final_score ? caso.gut_final_score : null;
      const gut = gutIni || gutFin ? `<span title="${caso.gravidade ? 'Inicial ' + caso.gravidade + '×' + caso.urgencia + '×' + caso.tendencia : ''}${gutFin ? ' · Final ' + caso.gut_final_gravidade + '×' + caso.gut_final_urgencia + '×' + caso.gut_final_tendencia : ''}">${gutIni || '—'}${gutFin ? ' → ' + gutFin : ''}</span>` : '—';
      const statusTxt = velho ? 'Finalizado' : (caso ? ppvdStatusLabelVD(caso.status) : 'Sem caso');
      const statusBadgeClass = sem === 'verde' ? 'ppvd-badge-verde' : (sem === 'azul' ? 'ppvd-badge-azul' : (sem === 'amarelo' ? 'ppvd-badge-alta' : 'ppvd-badge-critica'));
      const retornos = velho ? `<br><small>${PPVD_OBS_ANTERIOR}</small>` : (caso && caso.qtd_retornos > 0 ? `<br><small>${caso.qtd_retornos} retorno(s)</small>` : '');
      const horasBruto = sem === 'verde' ? null : auditoriaHorasDesde(o.d);
      const horas = horasBruto === null ? null : Math.max(0, horasBruto); // fato de hoje/futuro não fica negativo
      const abertoHa = horas === null ? '' : `<br><span class="aberto-ha ${sem === 'vermelho' && horas > 72 ? 'atraso' : ''}" title="Tempo desde o fato, enquanto o caso não está estabilizado">aberto há ${horas >= 24 ? (horas / 24).toFixed(1) + 'd' : horas.toFixed(0) + 'h'}</span>`;
      const ocorr = [o.ri ? mk('⚠ Reincid.', 'Endereço reincidente', 'risco') : '', o.a ? mk('Arma', 'Arma de fogo envolvida', 'risco') : '', o.p ? mk('Prisão', 'Houve prisão') : ''].join('') || '—';
      const acomp = [o.fonar_feito ? mk('FONAR ✓', 'FONAR preenchido', 'ok') : '', caso && caso.visita_autor_feita ? mk('Autor ✓', 'Visita ao autor feita', 'ok') : '', caso && caso.visita_vitima_feita ? mk('Vítima ✓', 'Visita à vítima feita', 'ok') : ''].join('') || '—';
      const podeAbrir = ppvdPerfil && (ppvdPerfil.is_admin || ppvdPerfil.pode_abrir_caso);
      let acaoBtn = '—';
      if (o.r && !velho) {
        if (!caso) acaoBtn = podeAbrir ? `<button class="ppvd-btn" onclick="ppvdAbrirCaso('${o.r}')">Abrir Caso ▸</button>` : `<span class="ppvd-badge ppvd-badge-semcaso">sem caso</span>`;
        else acaoBtn = `<button class="ppvd-btn" onclick="ppvdAbrirCaso('${o.r}')">Ver Caso ▸</button>`;
      }
      return `<tr class="vd-row-${sem}" data-sem="${caso || velho ? sem : 'sem'}" data-busca="${msgEsc((o.r || '') + ' ' + end + ' ' + (o.n || '')).toLowerCase()}"><td data-l="Situação"><span class="ppvd-badge ${statusBadgeClass}">${statusTxt}</span>${retornos}${abertoHa}</td><td data-l="REDS / Data">${o.r || '—'}<br><small>${o.d}</small></td><td data-l="Natureza / Gravidade">${natLabel}<br>${gravBadge(o.g)}${o.c ? `<br><small>${msgEsc(o.c)}</small>` : ''}</td><td data-l="Endereço" class="larga">${msgEsc(end) || '—'}</td><td data-l="Ocorrência">${ocorr}</td><td data-l="Acompanhamento">${acomp}</td><td data-l="Responsável">${respNome}</td><td data-l="GUT">${gut}</td><td class="acao">${acaoBtn}</td></tr>`;
    };
    const cont = { todos: principais.length, vermelho: 0, amarelo: 0, azul: 0, verde: 0, sem: 0 };
    principais.forEach(o => { const x = semDe(o); cont[x === 'vermelho' ? 'vermelho' : x]++; });
    if (periodo === 'acum') h += `<div class="vd-recorte">Contando a partir de ${(DATA.mv.meses || MESES)[HOME_VD_MES_INICIO - 1]} e os casos antigos ainda abertos no PPVD: ${principais.length} ocorrência(s)${historico.length ? ` · ${historico.length} anterior(es) ao PPVD, sem caso, ficam finalizadas (verde) no histórico abaixo` : ''}.</div>`;
    const chipF = (f, rot) => `<button type="button" data-f="${f}" class="${f === 'todos' ? 'on' : ''}">${rot} <b>${cont[f]}</b></button>`;
    h += `<div class="vd-filtros" id="vdFiltros">${chipF('todos', 'Todos')}${chipF('vermelho', '✕ Novos/atraso')}${chipF('amarelo', '! Iniciado')}${chipF('azul', '◆ Acompanhamento')}${chipF('verde', '✓ Estabilizado')}${chipF('sem', 'Sem caso')}<input type="search" id="vdBusca" placeholder="Buscar REDS, rua ou natureza" aria-label="Buscar na tabela"></div>`;
    h += `<div style="overflow-x:auto" id="vdTabelaBox">${cabecalho}`;
    h += principais.length ? principais.map(linhaCaso).join('') : `<tr><td colspan="9" style="text-align:center;color:var(--muted)">Nenhuma ocorrência de contexto VD no período selecionado.</td></tr>`;
    h += `</tbody></table></div>`;
    if (historico.length) h += `<details class="vd-historico" id="vdHistorico"><summary>Histórico anterior ao PPVD — ${historico.length} ocorrência(s) finalizadas (visitas feitas sem o registro no sistema)</summary><div class="vd-historico-corpo" style="overflow-x:auto"></div></details>`;
    document.getElementById('vdMuniPanel').innerHTML = h;
    const aplicarFiltro = () => {
      const f = (document.querySelector('#vdFiltros button.on') || {}).dataset ? document.querySelector('#vdFiltros button.on').dataset.f : 'todos';
      const q = (document.getElementById('vdBusca').value || '').trim().toLowerCase();
      document.querySelectorAll('#vdTabelaBox tbody tr[data-sem]').forEach(tr => { tr.hidden = !((f === 'todos' || tr.dataset.sem === f) && (!q || tr.dataset.busca.includes(q))); });
    };
    document.getElementById('vdFiltros').addEventListener('click', (e) => { const b = e.target.closest('button[data-f]'); if (!b) return; document.querySelectorAll('#vdFiltros button').forEach(x => x.classList.toggle('on', x === b)); aplicarFiltro(); });
    document.getElementById('vdBusca').addEventListener('input', aplicarFiltro);
    const det = document.getElementById('vdHistorico');
    if (det) det.addEventListener('toggle', () => { const c = det.querySelector('.vd-historico-corpo'); if (det.open && !c.dataset.pronto) { c.innerHTML = cabecalho + historico.map(linhaCaso).join('') + '</tbody></table>'; c.dataset.pronto = '1'; } });
  }

  const marcarPeriodo = () => document.querySelectorAll('#vdPeriodos button').forEach(b => b.classList.toggle('on', b.dataset.p === periodoAtual));
  marcarPeriodo();
  renderMuniPanel(idxDefault, periodoAtual);
  document.getElementById('vdPeriodos').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-p]'); if (!b) return;
    periodoAtual = b.dataset.p; try { localStorage.setItem('vdPeriodo', periodoAtual); } catch (er) {}
    marcarPeriodo(); renderMuniPanel(idxDefault, periodoAtual);
  });
  // ranking: clicar numa cidade filtra (mesmo filtro dos botões do topo) e reabre a página nela
  document.querySelectorAll('#vdRanking tr.rank-clic').forEach(tr => tr.addEventListener('click', () => { setMunFiltro(normMun(getMunFiltro()) === normMun(tr.dataset.mun) ? '' : tr.dataset.mun); goToPage('violencia_domestica'); }));
  // situação dos casos por cidade no ranking (só quem está logado e aprovado)
  if (comSituacao) vdSituacaoCasos().then(sit => {
    const tab = document.getElementById('vdRanking'); if (!tab) return;
    const poe = (tr, c) => ['v', 'a', 'z', 'g'].forEach(k => { const td = tr.querySelector(`td[data-s="${k}"]`); if (td) { td.textContent = c[k]; td.className = 'sit-cel ' + (c[k] ? (k === 'v' ? 'pv' : '') : 'z'); } });
    tab.querySelectorAll('tr.rank-clic').forEach(tr => poe(tr, sit.porCidade[MUNICIPIOS_CANONICAL.find(n => normMun(n) === normMun(tr.dataset.mun))] || { v: 0, a: 0, z: 0, g: 0 }));
    poe(document.getElementById('vdRankingTotal'), sit.total);
  });
}

// ===== Situação dos casos de Crimes Violentos e de Reincidência de Endereço (PPVD) =====
// Esses casos têm um fluxo curto (wizard GUT): novo -> em_acompanhamento -> encerrado/recusa. Cores (pedido de Eduardo, 2026-10-13):
// vermelho = sem caso ou novo, amarelo = em acompanhamento, verde = encerrado (inclui recusa). Como na VD, o que é anterior a
// Setembro/2026 e NÃO tem caso conta como finalizado (as visitas daquele período foram feitas sem registro no sistema); caso
// antigo que já existe no PPVD mantém a situação real.
const PPVD_DESDE_MS = new Date(2026, 8, 1).getTime();
function ppvdSemaforoOutros(caso) {
  if (!caso) return 'vermelho';
  if (caso.status === 'em_acompanhamento') return 'amarelo';
  if (caso.status === 'encerrado' || caso.status === 'recusa') return 'verde';
  return 'vermelho';
}
function ppvdStatusLabelOutros(status) {
  return { novo: 'Novo', em_acompanhamento: 'Em acompanhamento', encerrado: 'Encerrado', recusa: 'Recusa' }[status] || status || 'Sem caso';
}
const pgBadgeCls = (sem) => (sem === 'verde' ? 'ppvd-badge-verde' : (sem === 'azul' ? 'ppvd-badge-azul' : (sem === 'amarelo' ? 'ppvd-badge-alta' : 'ppvd-badge-critica')));
const cvAnterior = (o) => o.m < HOME_VD_MES_INICIO;
const reAnterior = (e) => e.dias_desde_ultimo != null && (Date.now() - e.dias_desde_ultimo * 86400000) < PPVD_DESDE_MS;
const reChave = (nome, e) => [nome, e.b || '', e.l || '', e.nu || ''].join('|');
async function ppvdBuscarCasosOutros(modalidade) {
  if (!ppvdSupa || !ppvdUser || !ppvdPerfil || !ppvdPerfil.aprovado) return {};
  const col = modalidade === 'reincidencia' ? 'endereco_key' : 'reds_numero';
  const { data, error } = await ppvdSupa.from('ppvd_casos').select('*').eq('modalidade', modalidade);
  const mapa = {};
  (!error && data ? data : []).forEach(c => { if (c[col]) mapa[c[col]] = c; });
  return mapa;
}
// contagem por cidade (vermelho/amarelo/verde) de Crimes Violentos e Reincidência, usada nos rankings e na Home
async function outrasSituacaoCasos() {
  const [cvCasos, reCasos] = await Promise.all([ppvdBuscarCasosOutros('crimes_violentos'), ppvdBuscarCasosOutros('reincidencia')]);
  const novo = () => ({ v: 0, a: 0, g: 0 });
  const conta = (alvo, sem) => { alvo[sem === 'vermelho' ? 'v' : (sem === 'amarelo' ? 'a' : 'g')]++; };
  const out = { cv: { porCidade: {}, total: novo(), casos: cvCasos }, re: { porCidade: {}, total: novo(), casos: reCasos } };
  const cvOc = (DATA.crimes_violentos || {}).ocorrencias || {};
  Object.keys(cvOc).forEach(nome => (cvOc[nome] || []).forEach(o => {
    const caso = o.r ? (cvCasos[o.r] || null) : null;
    const sem = !caso && cvAnterior(o) ? 'verde' : ppvdSemaforoOutros(caso);
    conta(out.cv.porCidade[nome] = out.cv.porCidade[nome] || novo(), sem); conta(out.cv.total, sem);
  }));
  const reEnd = (DATA.reincidencia || {}).enderecos || {};
  Object.keys(reEnd).forEach(nome => (reEnd[nome] || []).forEach(e => {
    const caso = reCasos[reChave(nome, e)] || null;
    const sem = !caso && reAnterior(e) ? 'verde' : ppvdSemaforoOutros(caso);
    conta(out.re.porCidade[nome] = out.re.porCidade[nome] || novo(), sem); conta(out.re.total, sem);
  }));
  return out;
}
function pgSitCelulasVazias() { return '<td class="sit-cel z" data-s="v">·</td><td class="sit-cel z" data-s="a">·</td><td class="sit-cel z" data-s="g">·</td>'; }
function pgSitPreencher(tabelaId, totalId, porCidade, total, canonicas) {

  tab.querySelectorAll('tr.rank-clic').forEach(tr => poe(tr, porCidade[tr.dataset.mun] || { v: 0, a: 0, g: 0 }));

}

    alvo.innerHTML = h;

  }

// invertido=true: pra rankings ordenados do PIOR pro melhor (ex: taxa de violência, onde
// posição 1 = maior índice = pior). Sem isso, posição 1 saía sempre verde, mesmo sendo o
// município com a maior taxa (achado por Eduardo em 2026-09-08, ranking de Violência
// Doméstica mostrando Itinga verde na posição 1 apesar de ter o maior índice).
function rankTextColor(corHsl) {
  // texto do número da posição: branco ou escuro, o que contrastar mais com o fundo hsl() do rankColor
  const m = /hsl\(([\d.]+),\s*([\d.]+)%,\s*([\d.]+)%\)/.exec(corHsl);
  if (!m) return '#fff';
  const h = +m[1], s = +m[2] / 100, l = +m[3] / 100;
  const a = s * Math.min(l, 1 - l);
  const f = (n) => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  const lin = (v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  const L = 0.2126 * lin(f(0)) + 0.7152 * lin(f(8)) + 0.0722 * lin(f(4));
  return (1.05 / (L + 0.05)) >= ((L + 0.05) / 0.0545) ? '#fff' : '#0b0f14';
}
function rankColor(idx, total, invertido = false) {
  const t = total > 1 ? idx / (total - 1) : 0;
  const tAjustado = invertido ? (1 - t) : t;
  const hue = 120 - 120 * tAjustado; // 120=verde ... 0=vermelho
  return `hsl(${hue}, 65%, 42%)`;
}
function fmtBr(n, dec) {
  return n.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function severityBadge(sev) {
  const map = {
    'CRÍTICO': '#c0392b',
    'RUIM': '#d2691e',
    'BAIXO': '#b8860b',
    'ATENÇÃO': '#c9a227',
  };
  const bg = map[sev] || '#666';
  const fg = (sev === 'CRÍTICO' || !map[sev]) ? '#fff' : '#0b0f14'; // fundos claros (laranja/ouro) pedem texto escuro
  return `<span style="background:${bg};color:${fg};font-weight:700;font-size:11px;letter-spacing:0.04em;padding:4px 10px;border-radius:3px;text-transform:uppercase;white-space:nowrap">${sev}</span>`;
}

function findMuniIdx(municipios, nome) {
  const nk = normKey(nome);
  for (let i = 0; i < municipios.length; i++) {
    if (normKey(municipios[i].nome) === nk) return i;
  }
  return -1;
}

// Detecta problemas de um município num dado mi (índice acumulado).
// Regras por categoria de indicador — cada categoria tem um "teto" de severidade:
//  - Resultado (MV/CVPe/CVPa/Furto, quanto menor melhor): CRÍTICO/RUIM, conforme % acima da meta acumulada
//  - Esforço/Operacional (Prisões de Furto, Armas): teto BAIXO
//  - Interação/Ranking importado (VCP/MRPP/RC/VTCV/VT) e IDOB: teto ATENÇÃO
function issuesForMunicipio(nome, mi) {
  const issues = [];
  const nk = normKey(nome);

  [['mv','MV'], ['cvpe','CVPE'], ['cvpa','CVPA'], ['furto','Furto Rural']].forEach(([key, label]) => {
    const d = DATA[key];
    if (!d) return;
    const idx = findMuniIdx(d.municipios, nome);
    if (idx < 0) return;
    const m = d.municipios[idx];
    const meta = m.meta_acum[mi], real = m.realizado_acum[mi];
    if (real <= 0) return;
    const p = pct(real, meta);
    if (p >= 50) {
      const sev = p >= 150 ? 'CRÍTICO' : 'RUIM';
      const sinal = p >= 0 ? '+' : '';
      issues.push({ indicador: `${label} (Resultado)`, severidade: sev, ordem: sev === 'CRÍTICO' ? 0 : 1,
        detalhe: `Meta ${meta} &rarr; Res ${real} (${sinal}${p.toFixed(0)}%)` });
    }
  });

  {
    const idx = findMuniIdx(DATA.esforco_furto.municipios, nome);
    if (idx >= 0) {
      const m = DATA.esforco_furto.municipios[idx];
      const reds = m.reds_acum[mi], prisoes = m.prisoes_acum[mi];
      if (reds > 0) {
        const des = prisoes / reds * 100;
        if (des < 25) {
          issues.push({ indicador: 'Prisões de autores de Furto', severidade: 'BAIXO', ordem: 2,
            detalhe: `${reds} REDS / ${prisoes} prisões = ${des.toFixed(1)}%` });
        }
      }
    }
  }

  {
    const arr = DATA.armas.municipios;
    const idx = findMuniIdx(arr, nome);
    if (idx >= 0) {
      const m = arr[idx];
      const meta = m.meta_acum[mi], real = m.realizado_acum[mi];
      const atingimento = meta ? (real / meta * 100) : (real > 0 ? 100 : 0);
      if (atingimento < 50) {
        const ranked = arr.map((x, i) => ({ i, v: x.realizado_acum[mi] })).sort((a, b) => b.v - a.v);
        const posicao = ranked.findIndex(x => x.i === idx) + 1;
        issues.push({ indicador: 'Apreensão de Armas', severidade: 'BAIXO', ordem: 2,
          detalhe: `Ranking ${posicao}º (${atingimento.toFixed(0)}%)` });
      }
    }
  }

  {
    const idx = findMuniIdx(DATA.idob.municipios, nome);
    if (idx >= 0) {
      const m = DATA.idob.municipios[idx];
      const mv = m.mv_acum[mi], cvpe = m.cvpe_acum[mi], cvpa = m.cvpa_acum[mi], qop = m.qop_acum[mi];
      const idobPct = qop ? ((qop - (mv + cvpe + cvpa) * 10) / qop * 100) : 0;
      if (mv > 0) {
        issues.push({ indicador: 'IDOB (Boemia)', severidade: 'ATENÇÃO', ordem: 3,
          detalhe: `${idobPct.toFixed(1)}% acumulado (${mv} MV registrada${mv > 1 ? 's' : ''})` });
      }
    }
  }

  return issues;
}

function renderAnaliseCiaBloco(ciaNome, mi) {
  const municipios = CIA_MAP[ciaNome];
  let allIssues = [];
  municipios.forEach(nome => {
    issuesForMunicipio(nome, mi).forEach(iss => allIssues.push(Object.assign({ municipio: nome }, iss)));
  });
  allIssues.sort((a, b) => a.ordem - b.ordem);

  let html = `<div style="margin-top:10px">`;
  html += `<div style="font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono)">Análise por Companhia</div>`;
  html += `<div style="font-size:24px;font-weight:800;margin:4px 0 16px">${ciaNome}</div>`;

  if (allIssues.length === 0) {
    html += `<div class="pending-box">Nenhum problema relevante identificado nesta companhia no período.</div>`;
  } else {
    html += `<div style="display:flex;flex-direction:column;border-radius:6px;overflow:hidden;border:1px solid var(--panel-border)">`;
    allIssues.forEach(iss => {
      html += `<div style="display:flex;align-items:center;gap:16px;background:var(--panel);padding:12px 16px;border-bottom:1px solid var(--panel-border)">
        <div style="width:200px;font-weight:600;flex-shrink:0">${iss.indicador}</div>
        <div style="width:150px;color:var(--muted);flex-shrink:0">${iss.municipio}</div>
        <div style="width:90px;flex-shrink:0">${severityBadge(iss.severidade)}</div>
        <div style="flex:1;color:var(--muted);font-size:12.5px">${iss.detalhe}</div>
      </div>`;
    });
    html += `</div>`;

    const porMuni = {};
    allIssues.forEach(iss => {
      (porMuni[iss.municipio] = porMuni[iss.municipio] || []).push(iss);
    });
    let pior = null, piorScore = -1;
    Object.keys(porMuni).forEach(m => {
      const score = porMuni[m].reduce((s, i) => s + (4 - i.ordem), 0);
      if (score > piorScore) { piorScore = score; pior = m; }
    });
    if (pior) {
      const lista = porMuni[pior];
      const principal = lista[0];
      const outros = lista.slice(1).map(i => i.indicador);
      let texto = `<b>${pior}</b> é o principal vetor de problemas da ${ciaNome} (${principal.indicador.toLowerCase()}: ${principal.detalhe})`;
      texto += outros.length ? ` e apresenta baixo desempenho também em ${outros.join(', ')}.` : `.`;
      html += `<div style="background:#12161c;border:1px solid var(--panel-border);border-radius:6px;padding:16px 20px;margin-top:16px">
        <div style="color:var(--amber);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Destaque Crítico</div>
        <div style="color:var(--text);font-size:13px;line-height:1.6">${texto}</div>
      </div>`;
    }
  }
  html += `</div>`;
  return html;
}

function gdoCarregarBiblioteca() {
  if (window.PptxGenJS) return Promise.resolve();
  return new Promise((ok, erro) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';
    s.onload = ok; s.onerror = () => erro(new Error('Não consegui baixar a biblioteca do PowerPoint (sem internet?).'));
    document.head.appendChild(s);
  });
}
async function gdoBrasaoBase64() {
  const ler = async (url) => {
    try {
      const blob = await (await fetch(url)).blob();
      return await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
    } catch (e) { return null; }
  };
  // pequeno nos slides de conteúdo (um por slide: mantém o arquivo leve), grande na capa e no encerramento
  return { peq: await ler('assets/gdo/brasao-pmmg-peq.png'), grande: await ler('assets/gdo/brasao-pmmg.png') };
}
const gdoNum = (v, c = 1) => Number(v).toFixed(c).replace('.', ',');
function gdoVar(real, meta) {
  if (!meta) return real > 0 ? '+∞' : '0,0%';
  const v = ((real - meta) / meta) * 100;
  return (v > 0 ? '+' : '') + gdoNum(v, 1) + '%';
}
function gdoCel(txt, o = {}) { return { text: String(txt), options: Object.assign({ align: 'center', valign: 'middle' }, o) }; }
function gdoSem(txt, cor, o = {}) { const c = GDO_COR[cor]; return gdoCel(txt, Object.assign({ fill: { color: c.f }, color: c.t, bold: true }, o)); }
const gdoCabec = (txt, o = {}) => gdoCel(txt, Object.assign({ fill: { color: '000000' }, color: 'FFFFFF', bold: true }, o));
const gdoEsq = (txt, o = {}) => gdoCel(txt, Object.assign({ align: 'left', bold: true, fill: { color: 'FFFFFF' }, color: '000000' }, o));
const gdoNor = (txt, o = {}) => gdoCel(txt, Object.assign({ fill: { color: 'FFFFFF' }, color: '000000' }, o));
function gdoStatusIdx(v) { return v >= 95 ? 'verde' : (v >= 85 ? 'amarelo' : 'vermelho'); }

function gdoSlide(pptx, brasao, titulo, opc = {}) {

}
function gdoTabela(s, linhas, colW, opc = {}) {
  const larg = colW.reduce((a, b) => a + b, 0);

    // 7) policiamento de proximidade (3 metas PPAG)
    s = gdoSlide(pptx, brasao.peq, 'Policiamento de Proximidade', { nota: 'Y15001 Patrulha Escolar/Drogas · Y07012 Violência Doméstica · Y07014 Zona Rural' });
    {
      const ys = [DATA.ppag.y15001, DATA.ppag.y07012, DATA.ppag.y07014];
      const cabs = [[gdoCabec('Município', { rowspan: 2, align: 'left' })], []];
      ['Y15001', 'Y07012', 'Y07014'].forEach(n => { cabs[0].push(gdoCabec(n, { colspan: 6 })); ['Meta mês', 'Res.', 'Des.', 'Meta acum.', 'Res.', 'Des.'].forEach(t => cabs[1].push(gdoCabec(t, { fontSize: 8 }))); });
      const cel = (r, m) => { const v = m ? r / m * 100 : 100; return gdoSem(Math.round(v) + '%', statusPiso(r, m), { fontSize: 9 }); };
      const mapa = (d) => { const o = {}; d.municipios.forEach(m => { o[normKey(m.nome)] = m; }); return o; };
      const maps = ys.map(mapa);
      const corpo = ys[0].municipios.map(m1 => {

        ys.forEach((d, i) => { const m = maps[i][normKey(m1.nome)];
          l.push(gdoNor(m.meta_mes[mi], { fontSize: 9 }), gdoNor(m.realizado_mes[mi], { fontSize: 9 }), cel(m.realizado_mes[mi], m.meta_mes[mi]),

      const t = [gdoEsq('70º BPM', { fill: { color: 'D9D9D9' }, fontSize: 9 })];
      ys.forEach(d => t.push(gdoNor(d.total_meta_mes[mi], { fontSize: 9, bold: true, fill: { color: 'D9D9D9' } }), gdoNor(d.total_mes[mi], { fontSize: 9, bold: true, fill: { color: 'D9D9D9' } }), cel(d.total_mes[mi], d.total_meta_mes[mi]),
        gdoNor(d.total_meta_acum[mi], { fontSize: 9, bold: true, fill: { color: 'D9D9D9' } }), gdoNor(d.total_acum[mi], { fontSize: 9, bold: true, fill: { color: 'D9D9D9' } }), cel(d.total_acum[mi], d.total_meta_acum[mi])));
      gdoTabela(s, cabs.concat(corpo, [t]), [1.9].concat(Array(18).fill(0.6)), { fontSize: 9, rowH: 0.3 });

    {
      const d = DATA.itvd; const idx = (t, v) => (t ? ((t - v * 2) / t) * 100 : 100);

      const add = (nome, tm, vm, ta, va, total) => { const o = total ? { fill: { color: 'D9D9D9' }, bold: true } : {};

    // 9) armas

    // 10) interação comunitária: dados do painel da CGA (fora deste painel) — espaço pros prints
