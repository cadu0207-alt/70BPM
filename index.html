function ppvdToIso(dmy) {
  if (!dmy) return null;
  const p = dmy.split('/');
  if (p.length !== 3) return null;
  return `${p[2]}-${p[1]}-${p[0]}`;
}
function ppvdFmtDT(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('pt-BR'); } catch (e) { return iso; }
}
function ppvdIniciais(nome) {
  if (!nome) return '';
  return nome.trim().split(/\s+/).map(p => p[0] ? p[0].toUpperCase() + '.' : '').join('');
}

async function ppvdInit() {
  if (!ppvdSupa) return;
  ppvdCheckVisitaPublica();
  const { data: { session } } = await ppvdSupa.auth.getSession();
  await ppvdOnSession(session);
  await ppvdCarregarMilitares();
  ppvdSupa.auth.onAuthStateChange(async (event, session) => {
    await ppvdOnSession(session);
    ppvdMilitaresCache = null;
    await ppvdCarregarMilitares();
  });
}

async function ppvdOnSession(session) {
  ppvdUser = session ? session.user : null;
  ppvdPerfil = null;
  if (ppvdUser) {
    const { data } = await ppvdSupa.from('perfis').select('*').eq('user_id', ppvdUser.id).maybeSingle();
    ppvdPerfil = data || null;
  }
  ppvdRenderAuthWidget();
  if (ppvdUser && !ppvdPerfil) {
    ppvdRenderCadastroForm();
  } else if (currentPageKey === 'violencia_domestica' && pages.violencia_domestica) {
    pages.violencia_domestica();
  } else if (currentPageKey === 'auditoria' && pages.auditoria) {
    pages.auditoria();
  }
}

function ppvdRenderAuthWidget() {
  const el = document.getElementById('ppvdAuthWidget');
  if (!el) return;
  if (!ppvdSupa) { el.innerHTML = ''; return; }
  if (!ppvdUser) {
    el.innerHTML = `<button class="ppvd-btn" onclick="ppvdSignIn()">Entrar (PPVD)</button>`;
  } else if (!ppvdPerfil) {
    el.innerHTML = `<span style="color:var(--amber)">Complete seu cadastro PPVD ↓</span>`;
  } else if (!ppvdPerfil.aprovado) {
    el.innerHTML = `<span style="color:var(--muted)">${ppvdPerfil.nome} &middot; aguardando aprovação</span> <button class="ppvd-btn" onclick="ppvdSignOut()">Sair</button>`;
  } else {
    el.innerHTML = `<span style="color:var(--text)">${ppvdPerfil.nome} (${ppvdPerfil.cargo})</span> ` +
      (ppvdPerfil.is_admin ? `<button class="ppvd-btn" onclick="ppvdOpenAprovacoes()">Aprovações PPVD</button> ` : '') +
      `<button class="ppvd-btn" onclick="ppvdOpenMilitares()">Militares Responsáveis</button> ` +
      `<button class="ppvd-btn" onclick="ppvdSignOut()">Sair</button>`;
  }
}

async function ppvdSignIn() {
  await ppvdSupa.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href.split('#')[0] } });
}
async function ppvdSignOut() {
  await ppvdSupa.auth.signOut();
}

async function ppvdSubmitPerfil(ev) {
  ev.preventDefault();
  const btn = ev.target;
  if (btn.disabled) return; // evita duplo clique/duplo envio
  const nome = document.getElementById('ppvdNome').value.trim();
  const cargo = document.getElementById('ppvdCargo').value;
  const cidade = document.getElementById('ppvdCidade').value.trim();
  if (!nome || !cargo || !cidade) { alert('Preencha todos os campos.'); return; }
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  const { error } = await ppvdSupa.from('perfis').insert({ user_id: ppvdUser.id, nome, cargo, cidade });
  // 23505 = cadastro já existia (ex: clique duplo) — não é erro de verdade, só segue
  if (error && error.code !== '23505') {
    alert('Erro ao salvar cadastro: ' + error.message);
    btn.disabled = false;
    btn.textContent = 'Enviar cadastro';
    return;
  }
  const { data } = await ppvdSupa.from('perfis').select('*').eq('user_id', ppvdUser.id).maybeSingle();
  ppvdPerfil = data;
  ppvdRenderAuthWidget();
  ppvdRenderAguardando();
}

function ppvdRenderCadastroForm() {
  let html = `<div class="page-title">Complete seu cadastro PPVD</div>`;
  html += `<div class="def-box">Pra acessar os casos de acompanhamento da Patrulha de Violência Doméstica, complete seu cadastro. Um administrador (P3) precisa aprovar seu acesso antes de você conseguir ver ou editar casos.</div>`;
  html += `<div class="ppvd-card">`;
  html += `<div class="ppvd-field"><label>Nome completo</label><input id="ppvdNome"></div>`;
  html += `<div class="ppvd-field"><label>Cargo</label><select id="ppvdCargo"><option value="">Selecione...</option>${PPVD_CARGOS.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>`;
  html += `<div class="ppvd-field"><label>Cidade</label><input id="ppvdCidade"></div>`;
  html += `<button class="ppvd-btn ppvd-btn-primary" onclick="ppvdSubmitPerfil(event)">Enviar cadastro</button>`;
  html += `</div>`;
  document.getElementById('main').innerHTML = html;
}

function ppvdRenderAguardando() {
  let html = `<div class="page-title">Cadastro enviado ✓</div>`;
  html += `<div class="def-box">Seu cadastro (<b>${ppvdPerfil ? ppvdPerfil.nome : ''}</b> — ${ppvdPerfil ? ppvdPerfil.cargo : ''}, ${ppvdPerfil ? ppvdPerfil.cidade : ''}) foi salvo. Um administrador (P3) precisa aprovar seu acesso antes de você conseguir ver ou editar casos PPVD — o resto do painel continua disponível normalmente enquanto isso.</div>`;
  document.getElementById('main').innerHTML = html;
}

function ppvdSemaforoVD(caso) {
  if (!caso) return 'vermelho';
  if (caso.status === 'estabilizada') return 'verde';
  if (caso.status === 'decisao_cmd') return 'amarelo';
  return 'vermelho'; // aberto, em_visita, retorno
}
function ppvdStatusLabelVD(status) {
  const map = { aberto: 'Aberto', em_visita: 'Em Visita', decisao_cmd: 'Decisão Cmd', retorno: 'Retorno', estabilizada: 'Estabilizada' };
  return map[status] || status || 'Sem caso';
}
async function ppvdBuscarCasosVD(redsList) {
  if (!ppvdSupa || !ppvdUser || !ppvdPerfil || !ppvdPerfil.aprovado || !redsList || redsList.length === 0) return {};
  const { data, error } = await ppvdSupa.from('ppvd_casos').select('*').eq('modalidade', 'violencia_domestica').in('reds_numero', redsList);
  const map = {};
  if (!error && data) data.forEach(c => { if (c.reds_numero) map[c.reds_numero] = c; });
  return map;
}
let ppvdMilitaresCache = null;
async function ppvdCarregarMilitares() {
  if (!ppvdSupa || !ppvdUser || !ppvdPerfil || !ppvdPerfil.aprovado) { ppvdMilitaresCache = []; return ppvdMilitaresCache; }
  const { data, error } = await ppvdSupa.from('militares_responsaveis').select('*').eq('ativo', true);
  ppvdMilitaresCache = (!error && data) ? data : [];
  return ppvdMilitaresCache;
}
function ppvdSugerirResponsavel(municipio) {
  if (!ppvdMilitaresCache || !municipio) return null;
  const alvo = normMun(municipio);
  return ppvdMilitaresCache.find(m => normMun(m.municipio) === alvo) || null;
}
function ppvdLinkVisitaPublica(token) {
  return window.location.href.split('#')[0] + '#visita=' + token;
}
function ppvdMontarMensagemWhatsApp(caso, token) {
  const link = ppvdLinkVisitaPublica(token);
  return `Olá! Ocorrência REDS ${caso.reds_numero || '—'}, ocorrida em ${caso.reds_data || '—'}, natureza ${caso.natureza || '—'}, município ${caso.municipio || ''}${caso.bairro ? (' - ' + caso.bairro) : ''}.

Favor realizar a leitura do fato e a visita ao autor e à vítima, no prazo preferencial de 24h (máximo 72h).

Após o término, acesse o link abaixo, anexe o BOS da visita ao autor e à vítima, e preencha o GUT novo:
${link}`;
}
async function ppvdAbrirBos(path) {
  if (!path) { alert('Nenhum arquivo anexado.'); return; }
  const { data, error } = await ppvdSupa.storage.from('ppvd-bos-visita').createSignedUrl(path, 3600);
  if (error || !data) { alert('Erro ao gerar link do arquivo: ' + (error ? error.message : '')); return; }
  window.open(data.signedUrl, '_blank');
}
function ppvdIniciais(nomeCompleto) {
  if (!nomeCompleto) return '—';
  return nomeCompleto.trim().split(/\s+/).map(p => p[0] ? (p[0].toUpperCase() + '.') : '').join('');
}

async function ppvdBuscarFonarCandidatos(casoId) {
  const el = document.getElementById('ppvdFonarQuery');
  const out = document.getElementById('ppvdFonarResultados');
  if (!el || !out) return;
  const q = el.value.trim();
  if (q.length < 2) { out.innerHTML = ''; return; }
  const { data, error } = await ppvdSupa.from('fonar_respostas').select('id,carimbo,nome_vitima')
    .is('vinculado_caso_id', null).ilike('nome_vitima', `%${q}%`).order('carimbo', { ascending: false }).limit(20);
  if (error) { out.innerHTML = `<div class="vd-check-no">Erro: ${error.message}</div>`; return; }
  if (!data || data.length === 0) { out.innerHTML = `<div style="color:var(--muted);font-size:12px">Nenhuma resposta FONAR não-vinculada encontrada com esse nome.</div>`; return; }
  out.innerHTML = data.map(r => `<div style="padding:6px 0;border-bottom:1px solid var(--border)">${ppvdIniciais(r.nome_vitima)} — ${ppvdFmtDT(r.carimbo)} <button class="ppvd-btn" onclick="ppvdVincularFonar('${casoId}','${r.id}')">🔗 Vincular a este caso</button></div>`).join('');
}

async function ppvdVincularFonar(casoId, fonarId) {
  if (!confirm('Vincular essa resposta do FONAR a este caso?')) return;
  const { data: resp, error: errBusca } = await ppvdSupa.from('fonar_respostas').select('*').eq('id', fonarId).single();
  if (errBusca || !resp) { alert('Erro ao buscar resposta FONAR: ' + (errBusca ? errBusca.message : '')); return; }
  const { error: errUpd1 } = await ppvdSupa.from('fonar_respostas').update({
    vinculado_caso_id: casoId, vinculado_em: new Date().toISOString(), vinculado_por: ppvdPerfil.nome
  }).eq('id', fonarId);
  if (errUpd1) { alert('Erro: ' + errUpd1.message); return; }
  const { data: caso, error: errUpd2 } = await ppvdSupa.from('ppvd_casos').update({
    fonar_feito: true,
    fonar_dados: { nome_vitima: resp.nome_vitima, carimbo: resp.carimbo, respostas: resp.respostas }
  }).eq('id', casoId).select().single();
  if (errUpd2) { alert('Erro: ' + errUpd2.message); return; }
  await ppvdRenderCaso(caso);
}

function ppvdOrientacao(g, u, t) {
  if (!g || !u || !t) return { texto: 'Classificação GUT pendente de preenchimento.', nivel: 'media', score: 0 };
  const score = g * u * t;
  if (score >= 125) return { texto: 'CRÍTICO — fazer visita em até 24h.', nivel: 'critica', score };
  if (score >= 50) return { texto: 'Seguir protocolo padrão de visitas.', nivel: 'alta', score };
  return { texto: 'Protocolo reduzido — visitas conforme rotina (mín. 4).', nivel: 'media', score };
}

async function ppvdAbrirCaso(redsNumero) {
  if (!ppvdSupa) { alert('Integração PPVD indisponível.'); return; }
  if (!ppvdUser) { alert('Faça login (botão "Entrar (PPVD)" no topo) pra abrir um caso.'); return; }
  if (!ppvdPerfil) { alert('Complete seu cadastro antes (aparece no topo da tela).'); return; }
  if (!ppvdPerfil.aprovado) { alert('Seu acesso ainda não foi aprovado pelo administrador PPVD.'); return; }

  const dadosBase = (window.ppvdOcorrenciaLookup || {})[redsNumero] || {};
  document.getElementById('main').innerHTML = `<div class="page-title">Carregando caso…</div>`;

  let { data: caso, error } = await ppvdSupa.from('ppvd_casos').select('*').eq('reds_numero', redsNumero).maybeSingle();
  if (error) { document.getElementById('main').innerHTML = `<div class="def-box">Erro ao consultar caso: ${error.message}</div>`; return; }
  if (!caso) {
    const insertObj = {
      reds_numero: redsNumero,
      reds_data: dadosBase.reds_data || null,
      natureza: dadosBase.natureza || null,
      causa: dadosBase.causa || null,
      municipio: dadosBase.municipio || null,
      bairro: dadosBase.bairro || null,
      logradouro: dadosBase.logradouro || null,
      numero: dadosBase.numero || null,
      fonar_feito: dadosBase.fonar_feito || false,
      status: 'aberto'
    };
    const { data: novo, error: errIns } = await ppvdSupa.from('ppvd_casos').insert(insertObj).select().single();
    if (errIns) { document.getElementById('main').innerHTML = `<div class="def-box">Erro ao criar caso: ${errIns.message}</div>`; return; }
    caso = novo;
  }
  await ppvdRenderCaso(caso);
}

async function ppvdRenderCaso(caso) {
  window.ppvdCasoAtual = caso;
  const { data: visitas } = await ppvdSupa.from('ppvd_visitas').select('*').eq('caso_id', caso.id).order('created_at', { ascending: false });
  const ehVD = (caso.modalidade || 'violencia_domestica') === 'violencia_domestica';
  const orient = ppvdOrientacao(caso.gravidade, caso.urgencia, caso.tendencia);
  const orientFinal = ppvdOrientacao(caso.gut_final_gravidade, caso.gut_final_urgencia, caso.gut_final_tendencia);
  const podeGerenciar = ehVD && ppvdPerfil && (ppvdPerfil.is_admin || ppvdPerfil.pode_abrir_caso);

  let html = `<div class="page-title">Caso PPVD — ${caso.municipio || ''}</div>`;
  html += `<button class="ppvd-btn" onclick="goToPage('${ppvdModalidadeVoltarPage(caso.modalidade)}')">← Voltar</button>`;

  html += `<div class="ppvd-card" style="margin-top:16px">`;
  html += `<b>REDS:</b> ${caso.reds_numero || '—'} &nbsp; <b>Data:</b> ${caso.reds_data || '—'} &nbsp; <b>Natureza:</b> ${caso.natureza || '—'} &nbsp; <b>Causa:</b> ${caso.causa || '—'}<br>`;
  html += `<b>Endereço:</b> ${caso.bairro || ''}${caso.logradouro ? (' - ' + caso.logradouro) : ''}${caso.numero && caso.numero !== '0' ? (', ' + caso.numero) : ''}<br><br>`;
  if (ehVD) {
    if (caso.fonar_feito && caso.fonar_dados) {
      const fd = caso.fonar_dados;

      html += `<b>FONAR:</b> <span class="vd-check-ok">✓ preenchido</span> — vítima ${ppvdIniciais(fd.nome_vitima)}, respondido em ${ppvdFmtDT(fd.carimbo)} `;
      html += `<details style="display:inline"><summary style="cursor:pointer;color:var(--accent)">ver respostas</summary><div style="margin-top:8px;font-size:12px;line-height:1.6">`;
      html += perguntas.map(k => `<div><b>${k}</b><br>${fd.respostas[k] || '—'}</div>`).join('<hr style="border-color:var(--border);margin:6px 0">');
      html += `</div></details><br>`;
    } else {
      html += `<b>FONAR:</b> <span class="vd-check-no">não localizado ainda</span><br>`;
      if (podeGerenciar) {
        html += `<div id="ppvdFonarBusca" style="margin-top:6px;max-width:520px">`;
        html += `<input id="ppvdFonarQuery" type="text" placeholder="Buscar resposta do FONAR pelo nome da vítima..." oninput="ppvdBuscarFonarCandidatos('${caso.id}')" style="width:100%;padding:6px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text)">`;
        html += `<div id="ppvdFonarResultados" style="margin-top:6px"></div>`;
        html += `</div>`;
      }
    }
    html += `<b>Status:</b> <select id="ppvdStatusSel">${['aberto', 'em_visita', 'decisao_cmd', 'retorno', 'estabilizada'].map(s => `<option value="${s}" ${s === caso.status ? 'selected' : ''}>${ppvdStatusLabelVD(s)}</option>`).join('')}</select> `;
  } else {
    html += `<b>Status:</b> <select id="ppvdStatusSel">${['novo', 'em_acompanhamento', 'recusa', 'encerrado'].map(s => `<option value="${s}" ${s === caso.status ? 'selected' : ''}>${s}</option>`).join('')}</select> `;
  }
  html += `<button class="ppvd-btn" onclick="ppvdSalvarStatus('${caso.id}')">Salvar status</button>`;
  if (podeGerenciar) {
    html += ` <button class="ppvd-btn" style="border-color:var(--alert);color:var(--alert)" onclick="ppvdReiniciarCaso('${caso.id}')">⟲ Reiniciar Caso</button>`;
  }
  html += `</div>`;

  html += `<div class="kpi-grid">`;
  html += `<div class="kpi-card ${orient.nivel === 'critica' ? 'kpi-red' : (orient.nivel === 'alta' ? 'kpi-neutral' : 'kpi-green')}"><div class="val">${orient.score || '—'}</div><div class="lbl">GUT Inicial (G×U×T)</div></div>`;
  html += `<div class="kpi-card ${orientFinal.nivel === 'critica' ? 'kpi-red' : (orientFinal.nivel === 'alta' ? 'kpi-neutral' : 'kpi-green')}"><div class="val">${caso.gut_final_score || '—'}</div><div class="lbl">GUT Final (última visita)</div></div>`;
  html += `</div>`;

  html += `<div class="ppvd-card"><b>Classificação GUT Inicial</b> <span style="color:var(--muted);font-size:11px">(preenchida pelo comandante ao abrir o caso, com base no REDS + FONAR)</span><br><br>`;

  html += `<div class="ppvd-field"><label>Urgência</label>${ppvdSelectGUT('ppvdU', 'urgencia', caso.urgencia)}</div>`;
  html += `<div class="ppvd-field"><label>Tendência</label>${ppvdSelectGUT('ppvdT', 'tendencia', caso.tendencia)}</div>`;
  html += `<button class="ppvd-btn ppvd-btn-primary" onclick="ppvdSalvarGUT('${caso.id}')">Salvar classificação</button>`;
  html += `</div>`;

  html += `<div class="ppvd-card"><b>Identificação (somente iniciais — sem nome completo, RG ou telefone)</b><br><br>`;
  html += `<div class="ppvd-field"><label>Iniciais da vítima</label><input id="ppvdVitNome" placeholder="Ex: M.A.S." value="${caso.vitima_nome || ''}"></div>`;
  html += `<div class="ppvd-field"><label>Iniciais do autor</label><input id="ppvdAutNome" placeholder="Ex: J.P.O." value="${caso.autor_nome || ''}"></div>`;
  html += `<div class="ppvd-field"><label>Tem mandado?</label><select id="ppvdMandado"><option value="false" ${!caso.tem_mandado ? 'selected' : ''}>Não</option><option value="true" ${caso.tem_mandado ? 'selected' : ''}>Sim</option></select></div>`;
  html += `<div class="ppvd-field"><label>Medida protetiva?</label><select id="ppvdMP"><option value="false" ${!caso.medida_protetiva ? 'selected' : ''}>Não</option><option value="true" ${caso.medida_protetiva ? 'selected' : ''}>Sim</option></select></div>`;
  html += `<div class="ppvd-field"><label>Pelotão responsável</label><input id="ppvdPelotao" value="${caso.pelotao || ''}"></div>`;
  html += `<div class="ppvd-field"><label>Destacamento responsável</label><input id="ppvdDestacamento" value="${caso.destacamento || ''}"></div>`;
  html += `<button class="ppvd-btn ppvd-btn-primary" onclick="ppvdSalvarDados('${caso.id}')">Salvar dados</button>`;
  html += `</div>`;

  const semVisitaPendente = !visitas || visitas.every(v => v.visita_realizada_em);

    const sugestao = ppvdSugerirResponsavel(caso.municipio);
    const ehRetorno = caso.status === 'decisao_cmd';
    html += `<div class="ppvd-card"><b>Despachar visita — ${ehRetorno ? 'Retorno' : 'Visita inicial'}</b><br><br>`;

    html += `<div class="ppvd-field"><label>WhatsApp (com DDD)</label><input id="ppvdRespWhats" value="${caso.militar_responsavel_whatsapp || (sugestao ? sugestao.whatsapp : '')}"></div>`;
    html += `<div style="color:var(--muted);font-size:11.5px;margin-bottom:10px">Ao despachar, abre o WhatsApp com a mensagem já pronta e o link da página de registro da visita. Dá pra trocar o nome/WhatsApp aqui sem alterar o cadastro fixo.</div>`;
    html += `<button class="ppvd-btn ppvd-btn-primary" onclick="ppvdDespacharVD('${caso.id}', ${ehRetorno})">Despachar${ehRetorno ? ' Retorno' : ''} (WhatsApp)</button>`;
    html += `</div>`;
  }

  const pendente = (visitas || []).find(v => v.despachado_em && !v.visita_realizada_em);
  if (pendente) {
    html += `<div class="ppvd-card" style="border-color:var(--amber)"><b>⏳ Visita pendente de resposta do militar</b> — despachada em ${ppvdFmtDT(pendente.despachado_em)} por ${pendente.despachado_por || '—'} pra ${pendente.guarnicao || '—'}<br>`;
    html += `<div style="color:var(--muted);font-size:11.5px;margin:8px 0">Link enviado: <code>${ppvdLinkVisitaPublica(pendente.token)}</code></div>`;
    html += `<details><summary style="cursor:pointer;color:var(--amber)">Registrar manualmente (se o militar não conseguiu usar o link)</summary><br>`;
    html += `<div class="ppvd-field"><label>Visita ao autor realizada?</label><select id="ppvdManAutorFeita"><option value="false">Não</option><option value="true">Sim</option></select></div>`;
    html += `<div class="ppvd-field"><label>Visita à vítima realizada?</label><select id="ppvdManVitimaFeita"><option value="false">Não</option><option value="true">Sim</option></select></div>`;
    html += `<div class="ppvd-field"><label>Situação encontrada</label><textarea id="ppvdSituacao"></textarea></div>`;
    html += `<div class="ppvd-field"><label>Vítima presente?</label><select id="ppvdVitPresente"><option value="true">Sim</option><option value="false">Não</option></select></div>`;
    html += `<div class="ppvd-field"><label>Autor presente?</label><select id="ppvdAutPresente"><option value="true">Sim</option><option value="false">Não</option></select></div>`;
    html += `<div class="ppvd-field"><label>Reclassificação — Gravidade</label>${ppvdSelectGUT('ppvdNovaG', 'gravidade', '')}</div>`;
    html += `<div class="ppvd-field"><label>Reclassificação — Urgência</label>${ppvdSelectGUT('ppvdNovaU', 'urgencia', '')}</div>`;
    html += `<div class="ppvd-field"><label>Reclassificação — Tendência</label>${ppvdSelectGUT('ppvdNovaT', 'tendencia', '')}</div>`;
    html += `<div class="ppvd-field"><label>Observações</label><textarea id="ppvdObsVisita"></textarea></div>`;
    html += `<button class="ppvd-btn ppvd-btn-primary" onclick="ppvdRegistrarResultado('${pendente.id}', '${caso.id}')">Registrar resultado da visita</button>`;
    html += `</details></div>`;
  }

  if (ehVD && caso.status === 'decisao_cmd') {
    const ultima = (visitas || []).find(v => v.visita_realizada_em);
    html += `<div class="ppvd-card" style="border-color:var(--amber)"><b>⚠ Decisão do Comandante</b><br><br>`;
    if (ultima) {
      html += `<b>BOS anexados:</b> `;
      html += ultima.bos_autor_url ? `<button class="ppvd-btn" onclick="ppvdAbrirBos('${ultima.bos_autor_url}')">Ver BOS autor</button> ` : 'sem BOS autor ';
      html += ultima.bos_vitima_url ? `<button class="ppvd-btn" onclick="ppvdAbrirBos('${ultima.bos_vitima_url}')">Ver BOS vítima</button>` : 'sem BOS vítima';
      html += `<br><br>`;
    }
    html += `<div style="color:var(--muted);font-size:12px;margin-bottom:10px">Leia o BOS e o GUT final acima e decida: estabilizar o caso ou despachar mais um retorno (card "Despachar visita — Retorno" acima).</div>`;
    html += `<button class="ppvd-btn ppvd-btn-primary" onclick="ppvdEstabilizarVD('${caso.id}')">✓ Marcar como Estabilizada</button>`;
    html += `</div>`;
  }

  html += `<div class="page-title" style="margin-top:24px;font-size:16px">Histórico de Visitas${caso.qtd_retornos ? (' — ' + caso.qtd_retornos + ' retorno(s)') : ''}</div>`;
  if (!visitas || visitas.length === 0) {
    html += `<div class="pending-box">Nenhuma visita registrada ainda.</div>`;
  } else {
    html += `<table class="data-table"><thead><tr><th style="text-align:left">Despachada em</th><th style="text-align:left">Militar</th><th style="text-align:left">Visita realizada em</th><th style="text-align:left">Situação</th><th>Reclassificação GUT</th><th>BOS</th>${podeGerenciar ? '<th>Ações</th>' : ''}</tr></thead><tbody>`;
    visitas.forEach(v => {
      const reclass = (v.nova_gravidade && v.nova_urgencia && v.nova_tendencia) ? `${v.nova_gravidade}×${v.nova_urgencia}×${v.nova_tendencia}=${v.nova_gravidade * v.nova_urgencia * v.nova_tendencia}` : '—';
      const bosLinks = [
        v.bos_autor_url ? `<button class="ppvd-btn" onclick="ppvdAbrirBos('${v.bos_autor_url}')">Autor</button>` : '',
        v.bos_vitima_url ? `<button class="ppvd-btn" onclick="ppvdAbrirBos('${v.bos_vitima_url}')">Vítima</button>` : '',
      ].filter(Boolean).join(' ') || '—';
      let acoes = '';
      if (podeGerenciar) {
        acoes = `<button class="ppvd-btn" style="border-color:var(--alert);color:var(--alert)" onclick="ppvdApagarVisita('${v.id}','${caso.id}')">🗑 Apagar</button>`;
        if (v.visita_realizada_em) {
          acoes += ` <button class="ppvd-btn" onclick="ppvdSolicitarNovoPreenchimento('${v.id}','${caso.id}')">↺ Solicitar novo preenchimento</button>`;
        }
      }
      html += `<tr><td style="text-align:left">${ppvdFmtDT(v.despachado_em)}</td><td style="text-align:left">${v.guarnicao || '—'}</td><td style="text-align:left">${ppvdFmtDT(v.visita_realizada_em)}</td><td style="text-align:left">${v.situacao_encontrada || '—'}</td><td>${reclass}</td><td>${bosLinks}</td>${podeGerenciar ? `<td>${acoes}</td>` : ''}</tr>`;
    });
    html += `</tbody></table>`;
  }

  document.getElementById('main').innerHTML = html;
}

async function ppvdRecalcularStatusCaso(casoId) {
  const { data: caso } = await ppvdSupa.from('ppvd_casos').select('*').eq('id', casoId).single();
  if (!caso || caso.status === 'estabilizada') { if (caso) await ppvdRenderCaso(caso); return; }
  const { data: visitas } = await ppvdSupa.from('ppvd_visitas').select('*').eq('caso_id', casoId).order('despachado_em', { ascending: false });
  let novoStatus;
  if (!visitas || visitas.length === 0) {
    novoStatus = 'aberto';
  } else {
    const pendente = visitas.find(v => !v.visita_realizada_em);
    novoStatus = pendente ? 'em_visita' : 'decisao_cmd';
  }
  const { data: casoAtualizado, error } = await ppvdSupa.from('ppvd_casos').update({ status: novoStatus }).eq('id', casoId).select().single();
  if (error) { alert('Erro: ' + error.message); return; }
  await ppvdRenderCaso(casoAtualizado);
}

async function ppvdApagarVisita(visitaId, casoId) {
  if (!confirm('Apagar este registro de visita? Essa ação não pode ser desfeita.')) return;
  const { error } = await ppvdSupa.from('ppvd_visitas').delete().eq('id', visitaId);
  if (error) { alert('Erro: ' + error.message); return; }
  await ppvdRecalcularStatusCaso(casoId);
}

async function ppvdSolicitarNovoPreenchimento(visitaId, casoId) {
  if (!confirm('Solicitar que o(a) militar preencha essa visita novamente? Os dados já enviados (situação, GUT, BOS) serão apagados e o link continuará valendo para um novo preenchimento.')) return;
  const upd = {
    visita_realizada_em: null,
    situacao_encontrada: null,
    vitima_presente: null,
    autor_presente: null,
    nova_gravidade: null,
    nova_urgencia: null,
    nova_tendencia: null,
    bos_autor_url: null,
    bos_vitima_url: null,
    observacoes: null,
  };
  const { error } = await ppvdSupa.from('ppvd_visitas').update(upd).eq('id', visitaId);
  if (error) { alert('Erro: ' + error.message); return; }
  const { error: err2 } = await ppvdSupa.from('ppvd_casos').update({ status: 'em_visita' }).eq('id', casoId);
  if (err2) { alert('Erro: ' + err2.message); return; }
  const { data: caso } = await ppvdSupa.from('ppvd_casos').select('*').eq('id', casoId).single();
  await ppvdRenderCaso(caso);
}

function ppvdNormalizarWhatsApp(v) {
  let d = (v || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.length <= 11 && !d.startsWith('55')) d = '55' + d;
  return d;
}
async function ppvdDespacharVD(casoId, isRetorno) {
  const nomeEl = document.getElementById('ppvdRespNome');
  const whatsEl = document.getElementById('ppvdRespWhats');
  const nome = nomeEl ? nomeEl.value.trim() : '';
  const whats = whatsEl ? ppvdNormalizarWhatsApp(whatsEl.value) : '';
  if (!nome || !whats) { alert('Preencha nome e WhatsApp do militar responsável.'); return; }
  const { data: visita, error } = await ppvdSupa.from('ppvd_visitas').insert({
    caso_id: casoId, despachado_por: ppvdPerfil.nome, despachado_em: new Date().toISOString(), guarnicao: nome
  }).select().single();
  if (error) { alert('Erro ao despachar: ' + error.message); return; }
  const upd = { status: 'em_visita', militar_responsavel: nome, militar_responsavel_whatsapp: whats };
  if (isRetorno) upd.qtd_retornos = (window.ppvdCasoAtual ? (window.ppvdCasoAtual.qtd_retornos || 0) + 1 : 1);
  const { data: caso, error: errUpd } = await ppvdSupa.from('ppvd_casos').update(upd).eq('id', casoId).select().single();
  if (errUpd) { alert('Erro: ' + errUpd.message); return; }
  const msg = ppvdMontarMensagemWhatsApp(caso, visita.token);
  window.open(`https://wa.me/${whats}?text=${encodeURIComponent(msg)}`, '_blank');
  await ppvdRenderCaso(caso);
}

async function ppvdRegistrarResultado(visitaId, casoId) {
  const upd = {
    visita_realizada_em: new Date().toISOString(),
    situacao_encontrada: document.getElementById('ppvdSituacao').value || null,
    vitima_presente: document.getElementById('ppvdVitPresente').value === 'true',
    autor_presente: document.getElementById('ppvdAutPresente').value === 'true',
    nova_gravidade: parseInt(document.getElementById('ppvdNovaG').value) || null,
    nova_urgencia: parseInt(document.getElementById('ppvdNovaU').value) || null,
    nova_tendencia: parseInt(document.getElementById('ppvdNovaT').value) || null,
    observacoes: document.getElementById('ppvdObsVisita').value || null,
  };
  const { error } = await ppvdSupa.from('ppvd_visitas').update(upd).eq('id', visitaId);
  if (error) { alert('Erro: ' + error.message); return; }
  const casoUpd = { status: 'decisao_cmd' };
  if (upd.nova_gravidade) casoUpd.gut_final_gravidade = upd.nova_gravidade;
  if (upd.nova_urgencia) casoUpd.gut_final_urgencia = upd.nova_urgencia;
  if (upd.nova_tendencia) casoUpd.gut_final_tendencia = upd.nova_tendencia;
  const autorFeitaEl = document.getElementById('ppvdManAutorFeita');
  const vitimaFeitaEl = document.getElementById('ppvdManVitimaFeita');
  if (autorFeitaEl && autorFeitaEl.value === 'true') casoUpd.visita_autor_feita = true;
  if (vitimaFeitaEl && vitimaFeitaEl.value === 'true') casoUpd.visita_vitima_feita = true;
  const { data: caso } = await ppvdSupa.from('ppvd_casos').update(casoUpd).eq('id', casoId).select().single();
  await ppvdRenderCaso(caso);
}

function ppvdCheckVisitaPublica() {

  if (m) ppvdRenderVisitaPublica(m[1]);
}

async function ppvdRenderVisitaPublica(token) {
  document.getElementById('main').innerHTML = `<div class="page-title">Carregando…</div>`;
  const { data, error } = await ppvdSupa.rpc('ppvd_consultar_visita', { p_token: token });
  const info = data && data[0];
  if (error || !info) { document.getElementById('main').innerHTML = `<div class="def-box">Link inválido ou expirado. Fale com quem despachou a visita.</div>`; return; }
  if (info.ja_respondida) { document.getElementById('main').innerHTML = `<div class="def-box">Essa visita já foi registrada. Obrigado.</div>`; return; }

  let html = `<div class="page-title">Registro de Visita — PPVD</div>`;
  html += `<div class="ppvd-card">`;
  html += `<b>REDS:</b> ${info.reds_numero || '—'} &nbsp; <b>Data do fato:</b> ${info.reds_data || '—'} &nbsp; <b>Natureza:</b> ${info.natureza || '—'}<br>`;
  html += `<b>Município/Bairro:</b> ${info.municipio || ''} — ${info.bairro || ''}<br>`;
  html += `<b>Militar responsável:</b> ${info.militar_responsavel || '—'}`;
  html += `</div>`;

  html += `<div class="ppvd-card"><b>Visitas realizadas</b><br><br>`;
  html += `<div class="ppvd-field"><label>Visita ao autor realizada?</label><select id="pvAutorFeita"><option value="true">Sim</option><option value="false">Não</option></select></div>`;
  html += `<div class="ppvd-field"><label>Visita à vítima realizada?</label><select id="pvVitimaFeita"><option value="true">Sim</option><option value="false">Não</option></select></div>`;
  html += `<div class="ppvd-field"><label>Vítima presente?</label><select id="pvVitPresente"><option value="true">Sim</option><option value="false">Não</option></select></div>`;
  html += `<div class="ppvd-field"><label>Autor presente?</label><select id="pvAutPresente"><option value="true">Sim</option><option value="false">Não</option></select></div>`;
  html += `<div class="ppvd-field"><label>Situação encontrada</label><textarea id="pvSituacao"></textarea></div>`;
  html += `</div>`;

  html += `<div class="ppvd-card"><b>Anexar BOS (PDF ou foto)</b><br><br>`;
  html += `<div class="ppvd-field"><label>BOS — visita ao autor</label><input type="file" id="pvBosAutor" accept=".pdf,image/*"></div>`;
  html += `<div class="ppvd-field"><label>BOS — visita à vítima</label><input type="file" id="pvBosVitima" accept=".pdf,image/*"></div>`;
  html += `</div>`;

  html += `<div class="ppvd-card"><b>Nova classificação GUT</b><br><br>`;
  html += `<div class="ppvd-field"><label>Gravidade</label>${ppvdSelectGUT('pvG', 'gravidade', '')}</div>`;
  html += `<div class="ppvd-field"><label>Urgência</label>${ppvdSelectGUT('pvU', 'urgencia', '')}</div>`;
  html += `<div class="ppvd-field"><label>Tendência</label>${ppvdSelectGUT('pvT', 'tendencia', '')}</div>`;
  html += `<div class="ppvd-field"><label>Observações</label><textarea id="pvObs"></textarea></div>`;
  html += `<button class="ppvd-btn ppvd-btn-primary" id="pvSubmitBtn" onclick="ppvdSubmeterVisitaPublica('${token}')">Enviar</button>`;
  html += `</div>`;

  document.getElementById('main').innerHTML = html;
}

async function ppvdUploadBos(token, inputId, tipo) {
  const inp = document.getElementById(inputId);
  if (!inp || !inp.files || !inp.files[0]) return null;
  const file = inp.files[0];
  const path = `${token}/${tipo}_${Date.now()}_${file.name}`;
  const { error } = await ppvdSupa.storage.from('ppvd-bos-visita').upload(path, file);
  if (error) { alert(`Erro ao enviar BOS (${tipo}): ` + error.message); return null; }
  return path;
}

async function ppvdSubmeterVisitaPublica(token) {
  const btn = document.getElementById('pvSubmitBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  const bosAutorPath = await ppvdUploadBos(token, 'pvBosAutor', 'autor');
  const bosVitimaPath = await ppvdUploadBos(token, 'pvBosVitima', 'vitima');
  const payload = {
    p_token: token,
    p_visita_autor: document.getElementById('pvAutorFeita').value === 'true',
    p_visita_vitima: document.getElementById('pvVitimaFeita').value === 'true',
    p_situacao: document.getElementById('pvSituacao').value || null,
    p_vitima_presente: document.getElementById('pvVitPresente').value === 'true',
    p_autor_presente: document.getElementById('pvAutPresente').value === 'true',
    p_gut_g: parseInt(document.getElementById('pvG').value) || null,
    p_gut_u: parseInt(document.getElementById('pvU').value) || null,
    p_gut_t: parseInt(document.getElementById('pvT').value) || null,
    p_bos_autor_url: bosAutorPath,
    p_bos_vitima_url: bosVitimaPath,
    p_observacoes: document.getElementById('pvObs').value || null,
  };
  const { error } = await ppvdSupa.rpc('ppvd_submeter_visita', payload);
  if (error) { alert('Erro ao enviar: ' + error.message); btn.disabled = false; btn.textContent = 'Enviar'; return; }
  document.getElementById('main').innerHTML = `<div class="page-title">Visita registrada ✓</div><div class="def-box">Obrigado. O comandante já pode ver o resultado e decidir os próximos passos.</div>`;
}

async function ppvdAprovar(userId) {
  const { error } = await ppvdSupa.from('perfis').update({ aprovado: true, aprovado_por: ppvdUser.id, aprovado_em: new Date().toISOString() }).eq('user_id', userId);
  if (error) { alert('Erro: ' + error.message); return; }
  ppvdOpenAprovacoes();
}

ppvdInit();

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('disabled')) { renderPending(btn.textContent.trim()); return; }
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    goToPage(btn.dataset.page);
  });
});

// Se o Chrome descartou a aba em segundo plano e recarregou, volta pra onde
// o usuário estava (sessionStorage sobrevive a esse reload, some só quando
// a aba/janela fecha de verdade) em vez de reiniciar sempre na Home.
let paginaRestaurada = 'home';
try {
  const salva = sessionStorage.getItem('paginaAtualPPVD');
  if (salva && pages[salva]) paginaRestaurada = salva;
} catch (e) {}
if (!(location.hash || '').startsWith('#visita=')) {
  goToPage(paginaRestaurada);
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.page === paginaRestaurada);
  });
} // se for link publico de visita (#visita=...), ppvdCheckVisitaPublica ja assumiu o #main — nao sobrescreve
</script>
