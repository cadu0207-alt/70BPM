    // 11) Cavalo de Aço (+ texto da meta, igual à apresentação anterior)
    s = gdoSlide(pptx, brasao.peq, 'Op. Cavalo de Aço');
    {
      const d = DATA.cavaloaco;
      const linhas = [['Município', 'Meta op. mês', 'Op. mês', 'Cumpriu mês?', 'Meta op. acum.', 'Op. acum.', 'Desemp.'].map((t, i) => gdoCabec(t, { align: i ? 'center' : 'left' }))];
      const add = (nome, mm, om, ma, oa, total) => {
        const o = total ? { fill: { color: 'D9D9D9' }, bold: true } : {};
        const v = ma ? oa / ma * 100 : 100;
        linhas.push([gdoEsq(nome, total ? { fill: { color: 'D9D9D9' } } : {}), gdoNor(mm, o), gdoNor(om, o), om >= mm ? gdoSem('CUMPRIU', 'verde') : gdoSem('NÃO CUMPRIU', 'vermelho'),
          gdoNor(ma, o), gdoNor(oa, o), gdoCel(Math.round(v) + '%', { fill: { color: total ? 'D9D9D9' : 'FFFFFF' }, color: v >= 100 ? '00803A' : 'C00000', bold: true })]);
      };
      d.municipios.forEach(m => add(m.nome, m.meta_mes[mi], m.realizado_mes[mi], m.meta_acum[mi], m.realizado_acum[mi], false));
      add('70º BPM', d.total_meta_mes[mi], d.total_mes[mi], d.total_meta_acum[mi], d.total_acum[mi], true);
      gdoTabela(s, linhas, [3.2, 1.5, 1.5, 1.9, 1.6, 1.5, 1.5], { rowH: 0.3 });
    }
    s.addText([
      { text: 'Meta semanal (mínima): 01 por Destacamento, 02 por Pelotão, 04 para Pelotão sede de Companhia. ', options: { bold: true } },
      { text: 'Registro obrigatório: CAD: Nome da Operação → CAVALO DE AÇO · Natureza Y01.003 · Alvo: Motocicleta. Obrigatório vincular o nº do REDS de prisão/apreensão para obtenção de toda a produtividade no RAT; coletar as placas e lançar no histórico do RAT, com a quantidade de motocicletas fiscalizadas no campo próprio.', options: {} }],
      { x: 0.3, y: 6.15, w: 12.73, h: 0.85, fontFace: 'Arial', fontSize: 10.5, color: GDO_ESCURO, valign: 'top' });

    // 12) Boemia: IDOB (Qtde Op + vítimas)
    s = gdoSlide(pptx, brasao.peq, 'Operação Boemia — IDOB', { nota: 'IDOB = (operações − vítimas×10) ÷ operações × 100' });
    {
      const d = DATA.idob;
      const idxB = (q, v) => (!q ? (v ? 0 : 100) : ((q - v * 10) / q) * 100);
      const cab1 = [gdoCabec('Município', { rowspan: 2, align: 'left' }), gdoCabec(nomeMes, { colspan: 5 }), gdoCabec('Acumulado', { colspan: 5 })];
      const cab2 = [];
      for (let i = 0; i < 2; i++) ['Qtde Op', 'MV', 'CVPE', 'CVPA', 'IDOB'].forEach(t => cab2.push(gdoCabec(t)));
      const corpo = [];
      const add = (nome, q1, a1, b1, c1, q2, a2, b2, c2, total) => {
        const o = total ? { fill: { color: 'D9D9D9' }, bold: true } : {};
        const i1 = idxB(q1, a1 + b1 + c1), i2 = idxB(q2, a2 + b2 + c2);
        corpo.push([gdoEsq(nome, total ? { fill: { color: 'D9D9D9' } } : {}), gdoNor(q1, o), gdoNor(a1, o), gdoNor(b1, o), gdoNor(c1, o), gdoSem(gdoNum(i1, 1), gdoStatusIdx(i1)),
          gdoNor(q2, o), gdoNor(a2, o), gdoNor(b2, o), gdoNor(c2, o), gdoSem(gdoNum(i2, 1), gdoStatusIdx(i2))]);
      };
      d.municipios.forEach(m => add(m.nome, m.qop_mes[mi], m.mv_mes[mi], m.cvpe_mes[mi], m.cvpa_mes[mi], m.qop_acum[mi], m.mv_acum[mi], m.cvpe_acum[mi], m.cvpa_acum[mi], false));
      add('70º BPM', d.total_qtdeop_mes[mi], d.total_mv_mes[mi], d.total_cvpe_mes[mi], d.total_cvpa_mes[mi], d.total_qtdeop_acum[mi], d.total_mv_acum[mi], d.total_cvpe_acum[mi], d.total_cvpa_acum[mi], true);
      gdoTabela(s, [cab1, cab2].concat(corpo), [2.8].concat(Array(10).fill(1.0)), { rowH: 0.31 });
    }

    // 13) Padrinhos da Escola e 14) Saque Seguro (Realizado/Meta/% vs meta/Saldo)
    [['padesc', 'Padrinhos da Escola'], ['saque_seguro', 'Op. Saque Seguro']].forEach(([k, nome]) => {
      s = gdoSlide(pptx, brasao.peq, nome, { nota: 'Polaridade: quanto maior, melhor.' });
      gdoTabela(s, gdoLinhasSaldo(DATA[k], mi), GDO_COLS_SALDO);
    });

    // 15) Rolezinho (Meta/Op. — verde cumpriu, vermelho não cumpriu)
    s = gdoSlide(pptx, brasao.peq, 'Operação Rolezinho', { nota: 'Verde = cumpriu a meta · vermelho = não cumpriu' });
    {
      const d = DATA.rolezinho;
      const linhas = [['Município', 'Meta mês', 'Op. mês', 'Meta acum.', 'Op. acum.'].map((t, i) => gdoCabec(t, { align: i ? 'center' : 'left' }))];
      const add = (nome, mm, om, ma, oa, total) => {

      };
      d.municipios.forEach(m => add(m.nome, m.meta_mes[mi], m.realizado_mes[mi], m.meta_acum[mi], m.realizado_acum[mi], false));
      add('70º BPM', d.total_meta_mes[mi], d.total_mes[mi], d.total_meta_acum[mi], d.total_acum[mi], true);
      gdoTabela(s, linhas, [3.6, 1.8, 1.8, 1.8, 1.8]);

    // 16) análise por Cia
    gdoSlidesCia(pptx, brasao.peq, mi, nomeMes);

    // 17) encerramento
    s = pptx.addSlide(); s.background = { color: GDO_BG };

    s.addText(GDO_COMANDANTE.join('\n'), { x: 0.5, y: 4.2, w: 12.3, h: 1, fontFace: 'Arial', fontSize: 20, color: GDO_OURO, bold: true, align: 'center' });

    msg('Gerando o arquivo…');
    await pptx.writeFile({ fileName: `Apresentação GDO ${nomeMes}_2026 - 70º BPM.pptx` });
    msg(`Pronto: "Apresentação GDO ${nomeMes}_2026 - 70º BPM.pptx" foi baixada.`);
  } catch (e) {
    console.error('Erro ao gerar a apresentação de GDO:', e);
    msg('Não foi possível gerar a apresentação: ' + e.message, true);
  }
}

function renderApresentacaoGdoPage() {
  const y1 = DATA.ppag.y15001, y2 = DATA.ppag.y07012, y3 = DATA.ppag.y07014;
  const mesesLocais = y1.meses || MESES.slice(0, y1.total_mes.length);
  let mi = Math.min(MES_ATUAL_IDX, mesesLocais.length - 1);

  function idxOf(municipios) {
    const map = {};
    municipios.forEach((m, i) => map[normKey(m.nome)] = i);
    return map;
  }

  function slide(mi) {
    const idx2 = idxOf(y2.municipios), idx3 = idxOf(y3.municipios);
    let rows = '';
    y1.municipios.forEach(m1 => {
      const m2 = y2.municipios[idx2[normKey(m1.nome)]];
      const m3 = y3.municipios[idx3[normKey(m1.nome)]];
      const bloco = (m) => {
        const meta = m.meta_mes[mi], res = m.realizado_mes[mi];
        const des = meta ? (res/meta*100) : (res>0?100:100);
        return `<td>${meta}</td><td>${res}</td>${pogCell(des)}`;
      };
      rows += `<tr style="background:rgba(90,180,220,0.18)">
        <td style="text-align:left;font-weight:700">${m1.nome}</td>
        ${bloco(m1)}${bloco(m2)}${bloco(m3)}
      </tr>`;
    });
    const totBloco = (d) => {
      const meta = d.total_meta_mes[mi], res = d.total_mes[mi];
      const des = meta ? (res/meta*100) : 100;
      return `<td>${meta}</td><td>${res}</td>${pogCell(des)}`;
    };
    rows += `<tr style="font-weight:700;background:rgba(255,255,255,0.1)">
      <td style="text-align:left">70º BPM</td>
      ${totBloco(y1)}${totBloco(y2)}${totBloco(y3)}
    </tr>`;
    return rows;
  }

  const mesesDeck = DATA.mv.meses || MESES;
  const miDeck = Math.max(0, Math.min(MES_ATUAL_IDX, DATA.mv.total_acum.length - 1) - 1); // GDO apresenta o último mês fechado
  let html = `<div class="page-title">Apresentação de GDO</div>`;
  html += `<div class="ppvd-card" id="gdoPronta" style="margin-bottom:22px;border-color:var(--amber)">
    <b style="color:var(--amber)">Apresentação pronta — PowerPoint do mês</b>
    <div style="margin:8px 0 12px;color:var(--muted);font-size:12.5px;line-height:1.55">Gera o arquivo .pptx já com as tabelas montadas (editáveis no PowerPoint) na ordem da apresentação anterior: MV, CVPE e CVPA (tabela, gráficos e detalhamento por natureza), prisões de furto, POG, proximidade, ITVD, armas, Cavalo de Aço, Boemia/IDOB, Padrinhos, Saque Seguro, Rolezinho e análise por Companhia. Os números são os do painel.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <select class="month-select" id="gdoMes" style="width:auto">${mesesDeck.slice(0, Math.min(MES_ATUAL_IDX, DATA.mv.total_acum.length - 1) + 1).map((m, i) => `<option value="${i}" ${i === miDeck ? 'selected' : ''}>Janeiro a ${m}/2026</option>`).join('')}</select>
      <button class="ppvd-btn ppvd-btn-primary" id="gdoGerar">⬇ Baixar PowerPoint (.pptx)</button>
      <span id="gdoStatus" style="font-size:12.5px;color:var(--muted)"></span>
    </div>
    <div style="margin-top:12px;font-size:12px;color:var(--muted);line-height:1.55"><b style="color:var(--text)">Continua manual:</b> prints do Painel de Interação Comunitária (CGA) e, se quiser, os prints oficiais do SiGOp com taxa por 100 mil, PLR e comparativo 2025 (não existem no painel). Atenção: se o detalhamento por natureza de MV/CVPE/CVPA estiver com período antigo, o próprio slide avisa.</div>
  </div>`;
  html += `<div class="page-title" style="color:var(--amber);font-size:20px">Policiamento de Proximidade | Dados de ${mesesLocais[mi]}</div>`;
  html += `<div class="def-box">Quadro-resumo de apresentação (estilo GDO) com as 3 metas do Policiamento de Proximidade: Y15001 (Patrulha Escolar/Prevenção às Drogas), Y07012 (Prevenção à Violência Doméstica), Y07014 (Ação/Operação em Zona Rural).</div>`;
  html += `<select class="month-select" id="apresGdoMonthSel">`;
  mesesLocais.forEach((m,i) => html += `<option value="${i}" ${i===mi?'selected':''}>${m}</option>`);
  html += `</select>`;
  html += `<table class="data-table" id="apresGdoTable"><thead><tr>
    <th style="text-align:left" rowspan="2">Município</th>
    <th colspan="3">Meta Y15001</th><th colspan="3">Meta Y07012</th><th colspan="3">Meta Y07014</th>
  </tr><tr>
    <th>Meta</th><th>Res.</th><th>Des.</th>
    <th>Meta</th><th>Res.</th><th>Des.</th>
    <th>Meta</th><th>Res.</th><th>Des.</th>
  </tr></thead><tbody>${slide(mi)}</tbody></table>`;
  html += `<div class="def-box" style="margin-top:16px;font-size:12.5px">
    Y15001 - Patrulha Escolar/Patrulha de Prevenção às Drogas;<br>
    Y07012 - Operação de Prevenção a Violência Doméstica;<br>
    Y07014 - Ação/Operação em Zonal Rural;
  </div>`;

  // Antes tinha "Julho" fixo no código (não avançava sozinho — achado por Eduardo em
  // 2026-09-04, mesma família do bug do selo "Atualizado até X"). Usa o mês atual real,
  // igual ao resto do painel.
  const mesesMv = DATA.mv.meses || MESES;
  const miAnalise = Math.min(MES_ATUAL_IDX, DATA.mv.total_acum.length - 1);

    <select class="month-select" id="ciaMonthSel" style="width:auto">
      ${mesesMv.slice(0, miAnalise + 1).map((m, i) => `<option value="${i}" ${i === miAnalise ? 'selected' : ''}>Acumulado até ${m}</option>`).join('')}
    </select>

  html += `<div class="nav-scroll" style="display:flex;gap:8px;margin-bottom:6px" id="ciaTabs">`;

  });
  document.getElementById('apresGdoMonthSel').addEventListener('change', (e) => {
    document.querySelector('#apresGdoTable tbody').innerHTML = slide(parseInt(e.target.value));
  });
  document.querySelectorAll('#ciaTabs .cia-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#ciaTabs .cia-tab').forEach(b => b.classList.remove('active'));

// Reúne, por município, o que está "em vermelho" a partir de Setembro/2026:
// - Violência Doméstica: casos com mais de 72h desde o fato e ainda não estabilizados
//   (sem visita registrada = "nenhuma informação/BO carregado"; status != estabilizada =
//   "sem solução final"). Reaproveita o mesmo semáforo (ppvdSemaforoVD) já usado na página
//   de Violência Doméstica, só que aqui somando o critério de prazo de 72h.
// - MV/CVPE/CVPa: contagem do mês corrente por município. Endereço por ocorrência ainda não
//   existe nesse nível de detalhe pra esses três indicadores (só existe agregado do batalhão
//   inteiro por tipo de local) — ver aviso na própria página.
function auditoriaHorasDesde(dataBr) {
  const iso = ppvdToIso(dataBr);
  if (!iso) return null;
  const dt = new Date(iso + 'T00:00:00');
  if (isNaN(dt.getTime())) return null;
  return (Date.now() - dt.getTime()) / 3600000;
}

  if (!dataIndicador) return null;

// Mesmos indicadores que já têm o banner "Acompanhamento diário" nas próprias páginas —
// aqui quebrado por município, pra pedido de Eduardo em 2026-09-03.
function auditoriaColetarMetasDiarias(nome, idxAtual) {
  const linhas = [];
  const add = (dataObj, label, higherIsBetter) => {
    const m = auditoriaAcharMunicipio(dataObj, nome);
    if (!m || !Array.isArray(m.meta_mes) || !Array.isArray(m.realizado_mes)) return;
    const i = Math.min(idxAtual, m.meta_mes.length - 1, m.realizado_mes.length - 1);
    if (i < 0) return;
    const meta = m.meta_mes[i], realizado = m.realizado_mes[i];
    const s = statusAcompanhamentoDiario(meta, realizado, higherIsBetter, true, dataAtualizacaoIndicador(dataObj));
    linhas.push({ label, meta, realizado, ...s });
  };
  add(DATA.pog, 'POG', true);
  if (DATA.ppag) {
    add(DATA.ppag.y15001, 'PPAG Y15001 (Escolar)', true);
    add(DATA.ppag.y07012, 'PPAG Y07012 (V. Doméstica)', true);
    add(DATA.ppag.y07014, 'PPAG Y07014 (Rural)', true);
  }
  add(DATA.boemia_meta, 'Boemia (meta de operações)', true);
  add(DATA.cavaloaco, 'Cavalo de Aço', true);
  add(DATA.rolezinho, 'Rolezinho', true);
  add(DATA.padesc, 'Padrinhos da Escola', true);
  add(DATA.saque_seguro, 'Saque Seguro', true);
  add(DATA.mv, 'MV (Mortes Violentas)', false);
  add(DATA.cvpe, 'CVPE', false);
  add(DATA.cvpa, 'CVPa', false);
  add(DATA.furto, 'Furto Rural', false);
  add(DATA.armas, 'Armas de Fogo', true);
  return linhas;
}

  MUNICIPIOS_CANONICAL.forEach(nome => {
    const chaveDados = Object.keys(vdData.ocorrencias).find(k => normMun(k) === normMun(nome));
    const lista = chaveDados ? vdData.ocorrencias[chaveDados] : [];
    ocorrenciasPorMunicipio[nome] = lista.filter(o => o.m >= MES_LIMITE);
  });
  const todosReds = Object.values(ocorrenciasPorMunicipio).flat().map(o => o.r).filter(Boolean);
  const casosMap = await ppvdBuscarCasosVD(todosReds);

  const diaHojeReal = new Date().getDate();
  window.auditoriaResumo = {};

  const cidadesAud = [];
  MUNICIPIOS_CANONICAL.forEach((nome, muniIdx) => {
    let htmlCidades = '';
    const lista = ocorrenciasPorMunicipio[nome];
    const flagged = lista.map(o => {
      const caso = o.r ? (casosMap[o.r] || null) : null;
      const sem = ppvdSemaforoVD(caso);
      const horas = auditoriaHorasDesde(o.d);
      const atrasado = horas !== null && horas > 72;
      return { o, caso, sem, horas, atrasado };
    }).filter(x => x.sem !== 'verde' && x.sem !== 'azul' && x.atrasado); // azul = acompanhado dentro do prazo, não é pendência

    const mMv = acharMunicipio(DATA.mv, nome);
    const mCvpe = acharMunicipio(DATA.cvpe, nome);
    const mCvpa = acharMunicipio(DATA.cvpa, nome);
    const qtdMv = mMv ? (mMv.realizado_mes[Math.min(idxAtual, mMv.realizado_mes.length - 1)] || 0) : 0;
    const qtdCvpe = mCvpe ? (mCvpe.realizado_mes[Math.min(idxAtual, mCvpe.realizado_mes.length - 1)] || 0) : 0;
    const qtdCvpa = mCvpa ? (mCvpa.realizado_mes[Math.min(idxAtual, mCvpa.realizado_mes.length - 1)] || 0) : 0;

    const metasDiariasCidade = coletarMetasDiarias(nome);
    const metasAtrasadasList = metasDiariasCidade.filter(m => m.atrasado);
    const totalVermelho = flagged.length + qtdMv + qtdCvpe + qtdCvpa + metasAtrasadasList.length;
    const badgeGeral = totalVermelho > 0
      ? `<span class="ppvd-badge ppvd-badge-critica">${totalVermelho} em vermelho</span>`
      : `<span class="ppvd-badge ppvd-badge-verde">0 em vermelho</span>`;

    // Guarda um resumo por município pra montar a mensagem do WhatsApp sem refazer as
    // consultas — o botão só lê daqui (pedido de Eduardo em 2026-09-04).
    window.auditoriaResumo[nome] = {
      flaggedCount: flagged.length,
      qtdMv, qtdCvpe, qtdCvpa,
      metasAtrasadasList: metasAtrasadasList.map(m => ({ label: m.label, meta: m.metaComparacao, realizado: m.realizado })),
      diaHoje: diaHojeReal,
      mesNomeAtual,
    };

    const temPendencia = totalVermelho > 0;
    window.auditoriaResumo[nome].totalVermelho = totalVermelho;

    htmlCidades += `<div id="audResp-${muniIdx}">${auditoriaRespHtml(nome, muniIdx, temPendencia)}</div>`;

    htmlCidades += `<details style="padding-top:2px" ${flagged.length ? 'open' : ''}>
      <summary style="cursor:pointer;padding:4px 0;font-weight:600">Violência Doméstica ${flagged.length ? `<span class="ppvd-badge ppvd-badge-critica">${flagged.length}</span>` : '<span class="ppvd-badge ppvd-badge-verde">0</span>'}</summary>`;
    if (flagged.length === 0) {
      htmlCidades += `<div class="def-box">Nenhum caso de VD fora do prazo de 72h/sem solução em ${nome} desde Setembro/2026.</div>`;
    } else {
      htmlCidades += `<div style="overflow-x:auto"><table class="data-table"><thead><tr><th style="text-align:left">Nº REDS</th><th style="text-align:left">Data do Fato</th><th>Em Aberto</th><th style="text-align:left">Bairro/Logradouro</th><th style="text-align:left">Responsável</th><th>Status</th><th style="text-align:left">Problema</th></tr></thead><tbody>`;
      flagged.sort((a, b) => b.horas - a.horas).forEach(({ o, caso, horas }) => {
        const end = `${o.b || ''}${o.l ? (' - ' + o.l) : ''}${o.nu && o.nu !== '0' ? (', ' + o.nu) : ''}`;
        const resp = caso ? (caso.militar_responsavel || '—') : '—';
        const statusTxt = ppvdStatusLabelVD(caso ? caso.status : null);
        const problema = !caso
          ? 'Nenhuma informação/BO carregado — caso nem foi aberto'
          : (!caso.status || caso.status === 'aberto' ? 'Sem visita registrada até agora' : 'Sem solução final (não estabilizado)');
        const diasTxt = horas >= 24 ? `${(horas / 24).toFixed(1)}d` : `${horas.toFixed(0)}h`;
        htmlCidades += `<tr class="vd-row-vermelho"><td style="text-align:left">${o.r || '—'}</td><td style="text-align:left">${o.d}</td><td>${diasTxt}</td><td style="text-align:left">${end}</td><td style="text-align:left">${resp}</td><td>${statusTxt}</td><td style="text-align:left">${problema}</td></tr>`;
      });
      htmlCidades += `</tbody></table></div>`;
    }
    htmlCidades += `</details>`;

    htmlCidades += auditoriaCriminaisCompacto(qtdMv, qtdCvpe, qtdCvpa, nome, mesNomeAtual);
    htmlCidades += auditoriaTopicoMetas(nome, metasDiariasCidade);

    const pill = (rot, q) => `<span class="ppvd-badge ${q > 0 ? 'ppvd-badge-critica' : 'ppvd-badge-verde'}">${rot} ${q}</span>`;
    cidadesAud.push({ nome, muniIdx, vd: flagged.length, mv: qtdMv, cvpe: qtdCvpe, cvpa: qtdCvpa, metas: metasAtrasadasList.length, total: totalVermelho,
      html: `<details class="aud-cidade" id="aud-c-${muniIdx}"><summary><span class="cn">${nome}</span>${badgeGeral}<span class="chips">${pill('VD', flagged.length)}${pill('MV', qtdMv)}${pill('CVPE', qtdCvpe)}${pill('CVPa', qtdCvpa)}${pill('Metas', metasAtrasadasList.length)}</span></summary><div class="aud-corpo">${htmlCidades}</div></details>` });
  });
  // piores primeiro; o resumo e o detalhe seguem a mesma ordem
  cidadesAud.sort((x, y) => (y.total - x.total) || x.nome.localeCompare(y.nome));
  window.auditoriaCidades = cidadesAud;

  const avisoMvCvpe = `<details class="aud-como"><summary>Sobre MV/CVPE/CVPa nesta auditoria</summary><div>
    Por enquanto só temos a contagem de ocorrências por município e mês — o endereço exato de cada ocorrência ainda não está estruturado por município no data.json (só existe um agregado do batalhão inteiro por tipo de local, sem separar por cidade). Assim que houver um export nesse nível de detalhe, esta seção passa a listar ocorrência por ocorrência, igual à de Violência Doméstica.
  </div></details>`;

  body.innerHTML = avisoMvCvpe + `<div id="audResumoBox">${auditoriaResumoHtml(cidadesAud)}</div>` +
    `<div class="aud-acoes"><button type="button" class="ppvd-btn" id="audAbrirTodas">Abrir todas as cidades</button><button type="button" class="ppvd-btn" id="audFecharTodas">Recolher todas</button><span style="color:var(--muted);font-size:12px">cidades em ordem de gravidade · clique numa linha do resumo para abrir o detalhe</span></div>` +
    cidadesAud.map(c => c.html).join('');
  body.addEventListener('click', (e) => {
    const b = e.target.closest('button.aud-linha[data-ir]'); if (!b) return;
    const d = document.getElementById(b.dataset.ir); if (!d) return; d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.getElementById('audAbrirTodas').addEventListener('click', () => body.querySelectorAll('details.aud-cidade').forEach(d => { d.open = true; }));
  document.getElementById('audFecharTodas').addEventListener('click', () => body.querySelectorAll('details.aud-cidade').forEach(d => { d.open = false; }));

}

// ============ Responsáveis da AUDITORIA (2026-10-13) ============
// Comandantes de pelotão, comandantes de destacamento e sargenteantes de cada cidade — pessoas diferentes do
// "militar responsável" pelos casos de Violência Doméstica. Antes a Auditoria gravava na mesma tabela da VD
// (militares_responsaveis) e um Salvar aqui trocava o responsável da VD; agora tem tabela própria
// (auditoria_responsaveis), com várias pessoas por cidade e a função de cada uma.
const AUDIT_FUNCOES = { cmt_destacamento: 'Cmt de Destacamento', cmt_pelotao: 'Cmt de Pelotão', sargenteante: 'Sargenteante' };
window.auditoriaResps = [];
async function auditoriaCarregarResponsaveis() {
  if (!ppvdSupa || !ppvdUser || !ppvdPerfil || !ppvdPerfil.aprovado) { window.auditoriaResps = []; return; }
  const { data, error } = await ppvdSupa.from('auditoria_responsaveis').select('*').eq('ativo', true).order('municipio').order('funcao');
  window.auditoriaResps = (!error && data) ? data : [];
}
function auditoriaRespDe(nomeMunicipio) {
  const ordem = Object.keys(AUDIT_FUNCOES);
  return (window.auditoriaResps || []).filter(r => normMun(r.municipio) === normMun(nomeMunicipio))
    .sort((a, b) => ordem.indexOf(a.funcao) - ordem.indexOf(b.funcao) || a.nome.localeCompare(b.nome));
}
function auditoriaFoneFmt(w) {
  const d = String(w || '').replace(/\D/g, '');
  return d.length >= 12 ? `+${d.slice(0, 2)} ${d.slice(2, 4)} ${d.slice(4, d.length - 4)}-${d.slice(-4)}` : d;
}
// sugestões a partir do cadastro ANTIGO (militares_responsaveis): o nome do município vinha bagunçado
// ("COMERCINHO", "CORONEL MURTA - MG"...) e não dá pra saber qual registro era da Auditoria — quem decide é o admin
function auditoriaSugestoes(nomeMunicipio) {
  const alvo = normMun(nomeMunicipio);
  const ja = new Set(auditoriaRespDe(nomeMunicipio).map(r => String(r.whatsapp)));
  const vistos = new Set();
  return (ppvdMilitaresCache || []).filter(m => {
    const mun = normMun(String(m.municipio || '').replace(/\s*-\s*MG\s*$/i, ''));
    const fone = ppvdNormalizarWhatsApp(m.whatsapp);
    if (mun !== alvo || !fone || ja.has(fone) || vistos.has(fone)) return false;
    vistos.add(fone); return true;
  });
}
// admin, operador da Auditoria (pode_editar_frase: Thomaz) e o comandante da própria cidade cadastram/editam os responsáveis (RLS do banco confere)
function auditoriaPodeGerir(nomeMunicipio) {
  return !!(ppvdPerfil && (ppvdPerfil.is_admin || ppvdPerfil.pode_editar_frase || normMun(ppvdPerfil.cidade) === normMun(nomeMunicipio)));
}
function auditoriaErroPermissao(error, nomeMunicipio) {
  return /row-level security|permission denied/i.test(error.message || '') ? 'Sem permissão para cadastrar responsáveis de ' + nomeMunicipio + '. Isso é do admin, do operador da Auditoria ou do comandante da própria cidade.' : error.message;
}
function auditoriaRespHtml(nome, muniIdx, temPendencia) {
  const lista = auditoriaRespDe(nome), sug = auditoriaPodeGerir(nome) ? auditoriaSugestoes(nome) : [];
  const podeGerir = auditoriaPodeGerir(nome);
  const ultimoDe = (r) => auditoriaLembretesDe(nome, r.id)[0];
  const ultimoHoje = (r) => { const u = ultimoDe(r); return !!u && auditoriaMesmoDia(u.created_at); };
  const ultimoTxt = (r) => { const u = ultimoDe(r); return u ? `lembrete ${auditoriaQuando(u.created_at)}${u.enviado_por_nome ? ' · ' + msgEsc(u.enviado_por_nome) : ''}` : 'nenhum lembrete enviado'; };
  const opcoes = Object.keys(AUDIT_FUNCOES).map(k => `<option value="${k}">${AUDIT_FUNCOES[k]}</option>`).join('');
  let h = `<div class="ppvd-card audit-resp" style="margin:0 0 14px;padding:12px 14px">
    <div class="hd">Responsáveis da Auditoria <small>comandantes de pelotão e de destacamento e sargenteantes — não é o responsável pelos casos de Violência Doméstica</small></div>`;
  if (!lista.length) h += `<div class="resp-vazio">Nenhum responsável cadastrado para ${nome}. Adicione abaixo.</div>`;
  lista.forEach(r => {
    h += `<div class="resp-linha"><span class="resp-func ${r.funcao}">${AUDIT_FUNCOES[r.funcao] || msgEsc(r.funcao)}</span><span class="nome">${msgEsc(r.nome)}</span><span class="fone">${auditoriaFoneFmt(r.whatsapp)}</span>
      <span class="ultimo ${ultimoHoje(r) ? 'hoje' : ''}">${ultimoTxt(r)}</span>
      <span class="acoes"><button class="ppvd-btn ${temPendencia ? 'ppvd-btn-primary' : ''}" ${temPendencia ? '' : 'disabled style="opacity:.45;cursor:not-allowed"'} title="${temPendencia ? 'Abrir o WhatsApp com o lembrete (fica registrado)' : 'Sem pendência agora'}" onclick="auditoriaEnviarLembrete('${r.id}')">${ultimoHoje(r) ? '↻ Reenviar' : '📱 Enviar lembrete'}</button>
      ${podeGerir ? `<button class="ppvd-btn" onclick="auditoriaRespEditar('${r.id}', ${muniIdx})">✏ Editar</button><button class="ppvd-btn" style="border-color:var(--alert);color:var(--alert-text)" onclick="auditoriaRespRemover('${r.id}', ${muniIdx})">Remover</button>` : ''}</span></div>`;
  });
  if (podeGerir) h += `<div class="resp-form"><input type="hidden" id="audId-${muniIdx}">
    <div class="ppvd-field" style="min-width:150px"><label>Função</label><select id="audFuncao-${muniIdx}">${opcoes}</select></div>
    <div class="ppvd-field" style="flex:1;min-width:170px"><label>Nome</label><input id="audNome-${muniIdx}" placeholder="Ex: Ten. Diego Silva" maxlength="120"></div>
    <div class="ppvd-field" style="flex:1;min-width:150px"><label>WhatsApp (com DDD)</label><input id="audWhats-${muniIdx}" placeholder="Ex: 33999999999"></div>
    <button class="ppvd-btn" onclick="auditoriaRespSalvar(${muniIdx})">💾 Salvar</button></div>`;
  else h += `<div class="resp-vazio">Só o admin, o operador da Auditoria ou o comandante de ${nome} cadastram os responsáveis desta cidade.</div>`;
  if (lista.length && temPendencia) h += `<div style="margin-top:8px"><button class="ppvd-btn" onclick="auditoriaCopiarLembrete('${nome}')" title="Copia o texto do lembrete pra colar num grupo do WhatsApp">📋 Copiar mensagem (grupo)</button></div>`;
  const hist = auditoriaLembretesDe(nome).slice(0, 8);
  if (hist.length) {
    h += `<details class="aud-hist"><summary>Histórico de lembretes (${auditoriaLembretesDe(nome).length} nos últimos 30 dias)</summary>` + hist.map(l =>
      `<div class="h"><b>${auditoriaQuando(l.created_at)}</b><span>${l.via === 'copia' ? 'mensagem copiada (grupo)' : 'para ' + msgEsc(l.responsavel_nome || '—') + (l.funcao && AUDIT_FUNCOES[l.funcao] ? ' (' + AUDIT_FUNCOES[l.funcao] + ')' : '')}</span><span>por ${msgEsc(l.enviado_por_nome || '—')}</span><span>${l.total_pendencias} pendência(s)</span></div>`).join('') + `</details>`;
  }
  if (sug.length) {
    h += `<details><summary>Sugestões do cadastro antigo de militares (${sug.length}) — escolha a função para usar na Auditoria</summary>`;
    sug.forEach((m, i) => {
      h += `<div class="resp-linha"><span class="nome">${msgEsc(m.nome)}</span><span class="fone">${auditoriaFoneFmt(ppvdNormalizarWhatsApp(m.whatsapp))}</span>
        <span class="acoes"><select id="audSugFuncao-${muniIdx}-${i}">${opcoes}</select><button class="ppvd-btn" onclick="auditoriaRespUsarSugestao(${muniIdx}, ${i})">Usar na Auditoria</button></span></div>`;
    });
    h += `</details>`;
  }
  return h + `</div>`;
}
function auditoriaRespRepintar(muniIdx) {
  const nome = MUNICIPIOS_CANONICAL[muniIdx], box = document.getElementById('audResp-' + muniIdx);
  if (box) box.innerHTML = auditoriaRespHtml(nome, muniIdx, !!((window.auditoriaResumo || {})[nome] || {}).totalVermelho);
}
async function auditoriaRespSalvar(muniIdx) {
  const nome = MUNICIPIOS_CANONICAL[muniIdx];
  const id = document.getElementById('audId-' + muniIdx).value;
  const funcao = document.getElementById('audFuncao-' + muniIdx).value;
  const nomePessoa = (document.getElementById('audNome-' + muniIdx).value || '').trim();
  const whats = ppvdNormalizarWhatsApp(document.getElementById('audWhats-' + muniIdx).value);
  if (nomePessoa.length < 2 || !/^[0-9]{12,13}$/.test(whats)) { alert('Preencha o nome e um WhatsApp válido (com DDD).'); return; }
  const q = id ? ppvdSupa.from('auditoria_responsaveis').update({ funcao, nome: nomePessoa, whatsapp: whats }).eq('id', id)
              : ppvdSupa.from('auditoria_responsaveis').insert({ municipio: nome, funcao, nome: nomePessoa, whatsapp: whats, ativo: true });
  const { error } = await q;
  if (error) { alert(/duplicate|unique/i.test(error.message) ? 'Essa pessoa já está cadastrada nessa função para ' + nome + '.' : 'Erro ao salvar: ' + auditoriaErroPermissao(error, nome)); return; }
  await auditoriaCarregarResponsaveis();
  auditoriaRespRepintar(muniIdx);
}
function auditoriaRespEditar(id, muniIdx) {
  const r = (window.auditoriaResps || []).find(x => x.id === id); if (!r) return;
  document.getElementById('audId-' + muniIdx).value = r.id;
  document.getElementById('audFuncao-' + muniIdx).value = r.funcao;
  document.getElementById('audNome-' + muniIdx).value = r.nome;
  document.getElementById('audWhats-' + muniIdx).value = r.whatsapp;
  document.getElementById('audNome-' + muniIdx).focus();
}
async function auditoriaRespRemover(id, muniIdx) {
  const r = (window.auditoriaResps || []).find(x => x.id === id);
  if (!r || !confirm('Remover ' + r.nome + ' (' + (AUDIT_FUNCOES[r.funcao] || r.funcao) + ') da Auditoria de ' + r.municipio + '? Isso não mexe no responsável dos casos de Violência Doméstica.')) return;
  const { error } = await ppvdSupa.from('auditoria_responsaveis').update({ ativo: false }).eq('id', id);
  if (error) { alert('Erro ao remover: ' + error.message); return; }
  await auditoriaCarregarResponsaveis();
  auditoriaRespRepintar(muniIdx);
}
async function auditoriaRespUsarSugestao(muniIdx, i) {
  const nome = MUNICIPIOS_CANONICAL[muniIdx], m = auditoriaSugestoes(nome)[i]; if (!m) return;
  const funcao = document.getElementById(`audSugFuncao-${muniIdx}-${i}`).value;
  const { error } = await ppvdSupa.from('auditoria_responsaveis').insert({ municipio: nome, funcao, nome: String(m.nome).trim(), whatsapp: ppvdNormalizarWhatsApp(m.whatsapp), ativo: true });
  if (error) { alert('Erro ao adicionar: ' + error.message); return; }
  await auditoriaCarregarResponsaveis();
  auditoriaRespRepintar(muniIdx);
}

// Frase pré-pronta do lembrete de WhatsApp. Desde 2026-10-13 fica no BANCO (tabela auditoria_config), igual para todos
// que enviam lembrete — antes era só no navegador do Thomaz (localStorage) e os outros usavam a frase padrão.
// Quem edita: admin ou quem tem `pode_editar_frase` (hoje o Thomaz). Marcadores: {saudacao}, {nomeMunicipio}, {diaHoje}, {linhas}.
const PPVD_TEMPLATE_LEMBRETE_KEY = 'ppvdTemplateLembreteAuditoria'; // só pra aproveitar a frase que já estava salva no navegador
window.auditoriaTemplateDb = null;
function ppvdTemplateLembretePadrao() {
  return `{saudacao}

Em auditoria do painel do 70º BPM, foram verificadas as seguintes pendências em {nomeMunicipio} (posição de hoje, dia {diaHoje}):

{linhas}

Favor regularizar assim que possível e, se já resolvido, atualizar no sistema. Qualquer dúvida, à disposição.`;
}
function ppvdObterTemplateLembrete() { return window.auditoriaTemplateDb || ppvdTemplateLembretePadrao(); }
function auditoriaPodeEditarFrase() { return !!(ppvdPerfil && (ppvdPerfil.is_admin || ppvdPerfil.pode_editar_frase)); }
async function auditoriaCarregarConfig() {
  if (!ppvdSupa || !ppvdUser || !ppvdPerfil || !ppvdPerfil.aprovado) { window.auditoriaTemplateDb = null; return; }
  const { data, error } = await ppvdSupa.from('auditoria_config').select('valor, atualizado_por, atualizado_em').eq('chave', 'template_lembrete').maybeSingle();
  window.auditoriaTemplateDb = (!error && data && data.valor) ? data.valor : null;
  window.auditoriaTemplateMeta = (!error && data) ? data : null;
}
function ppvdTemplateLembreteEditorHtml() {
  let atual = ppvdObterTemplateLembrete(), aviso = '';
  if (!window.auditoriaTemplateDb) {
    try { const antigo = localStorage.getItem(PPVD_TEMPLATE_LEMBRETE_KEY); if (antigo) { atual = antigo; aviso = ' (esta é a frase que estava salva só no seu navegador — clique em Salvar para valer para todos)'; } } catch (e) {}
  }
  const meta = window.auditoriaTemplateMeta;
  const quem = meta && meta.atualizado_por ? ` Última alteração: ${msgEsc(meta.atualizado_por)}${meta.atualizado_em ? ' em ' + ppvdFmtDT(meta.atualizado_em) : ''}.` : '';
  return `<div class="ppvd-card" style="margin-bottom:14px">
    <div style="font-weight:600;margin-bottom:6px">✏️ Frase pré-pronta do lembrete (vale para todos que enviam lembrete)</div>
    <div class="def-box" style="margin-bottom:8px">Use os marcadores <code>{saudacao}</code>, <code>{nomeMunicipio}</code>, <code>{diaHoje}</code> e <code>{linhas}</code> (a lista de pendências) onde quiser no texto. Fica salva no banco: o texto é o mesmo para todos.${quem}${aviso}</div>
    <textarea id="ppvdTemplateLembreteInput" rows="7" maxlength="4000" style="width:100%;font-family:inherit;font-size:14px;padding:8px;box-sizing:border-box">${msgEsc(atual)}</textarea>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="ppvd-btn" onclick="ppvdSalvarTemplateLembrete()">💾 Salvar frase</button>
      <button class="ppvd-btn" onclick="ppvdRestaurarTemplateLembrete()">↺ Restaurar padrão</button>
    </div>
  </div>`;
}
async function ppvdSalvarTemplateLembrete() {
  const el = document.getElementById('ppvdTemplateLembreteInput'); if (!el) return;
  const valor = el.value.trim();
  if (valor.length < 20) { alert('A frase está muito curta.'); return; }
  const { error } = await ppvdSupa.from('auditoria_config').upsert({ chave: 'template_lembrete', valor }, { onConflict: 'chave' });
  if (error) { alert('Erro ao salvar a frase: ' + error.message); return; }
  try { localStorage.removeItem(PPVD_TEMPLATE_LEMBRETE_KEY); } catch (e) {}
  await auditoriaCarregarConfig();
  const box = document.getElementById('audTemplateBox'); if (box) box.innerHTML = ppvdTemplateLembreteEditorHtml();
  alert('Frase salva. Vale para todos a partir do próximo lembrete.');
}
async function ppvdRestaurarTemplateLembrete() {
  if (!confirm('Voltar para a frase padrão (para todos)?')) return;
  const { error } = await ppvdSupa.from('auditoria_config').delete().eq('chave', 'template_lembrete');
  if (error) { alert('Erro ao restaurar: ' + error.message); return; }
  try { localStorage.removeItem(PPVD_TEMPLATE_LEMBRETE_KEY); } catch (e) {}
  await auditoriaCarregarConfig();
  const box = document.getElementById('audTemplateBox'); if (box) box.innerHTML = ppvdTemplateLembreteEditorHtml();
}

// ---- registro dos lembretes enviados (auditoria_lembretes) ----
window.auditoriaLembretes = [];
async function auditoriaCarregarLembretes() {
  if (!ppvdSupa || !ppvdUser || !ppvdPerfil || !ppvdPerfil.aprovado) { window.auditoriaLembretes = []; return; }
  const desde = new Date(Date.now() - 30 * 86400000).toISOString();
  const { data, error } = await ppvdSupa.from('auditoria_lembretes').select('*').gte('created_at', desde).order('created_at', { ascending: false }).limit(600);
  window.auditoriaLembretes = (!error && data) ? data : [];
}
function auditoriaMesmoDia(iso) { const d = new Date(iso), h = new Date(); return d.getFullYear() === h.getFullYear() && d.getMonth() === h.getMonth() && d.getDate() === h.getDate(); }
function auditoriaQuando(iso) {
  const d = new Date(iso), hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (auditoriaMesmoDia(iso)) return 'hoje ' + hm;
  const dias = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(iso).setHours(0, 0, 0, 0)) / 86400000);
  return dias === 1 ? 'ontem ' + hm : `há ${dias} dias (${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')})`;
}
function auditoriaLembretesDe(nomeMunicipio, respId) {
  return (window.auditoriaLembretes || []).filter(l => normMun(l.municipio) === normMun(nomeMunicipio) && (respId == null || l.responsavel_id === respId));
}
async function auditoriaRegistrarLembrete(nomeMunicipio, resp, via, msg) {
  const resumo = (window.auditoriaResumo || {})[nomeMunicipio] || {};
  const linha = { municipio: nomeMunicipio, responsavel_id: resp ? resp.id : null, responsavel_nome: resp ? resp.nome : null, funcao: resp ? resp.funcao : null, via, total_pendencias: resumo.totalVermelho || 0, resumo: msg ? String(msg).slice(0, 3900) : null };
  const { error } = await ppvdSupa.from('auditoria_lembretes').insert(linha);
  if (error) { console.error('Registro do lembrete:', error); alert('O lembrete foi aberto, mas não consegui registrar o envio: ' + error.message); return; }
  await auditoriaCarregarLembretes();
  const idx = MUNICIPIOS_CANONICAL.indexOf(nomeMunicipio);
  if (idx >= 0) auditoriaRespRepintar(idx);
  auditoriaResumoRepintar();
}

function ppvdMontarLembreteAuditoria(nomeMunicipio, resp) {
  const resumo = (window.auditoriaResumo || {})[nomeMunicipio];
  if (!resumo) return null;

  const linhas = [];
  resumo.metasAtrasadasList.forEach(m => {
    linhas.push(`• ${m.label}: até o dia ${resumo.diaHoje} deveria haver ${m.meta}, há ${m.realizado}`);
  });
  if (resumo.qtdMv > 0) linhas.push(`• MV (Mortes Violentas): ${resumo.qtdMv} ocorrência(s) em ${resumo.mesNomeAtual} a verificar`);
  if (resumo.qtdCvpe > 0) linhas.push(`• CVPE: ${resumo.qtdCvpe} ocorrência(s) em ${resumo.mesNomeAtual} a verificar`);
  if (resumo.qtdCvpa > 0) linhas.push(`• CVPa: ${resumo.qtdCvpa} ocorrência(s) em ${resumo.mesNomeAtual} a verificar`);
  if (resumo.flaggedCount > 0) linhas.push(`• Violência Doméstica: ${resumo.flaggedCount} caso(s) com mais de 72h sem solução final`);
  if (linhas.length === 0) return null;

  const saudacao = resp && resp.nome ? `Bom dia, ${resp.nome}${resp.funcao && AUDIT_FUNCOES[resp.funcao] ? ' (' + AUDIT_FUNCOES[resp.funcao] + ')' : ''}!` : 'Bom dia!';
  return ppvdObterTemplateLembrete()
    .replace(/\{saudacao\}/g, saudacao)
    .replace(/\{nomeMunicipio\}/g, nomeMunicipio)
    .replace(/\{diaHoje\}/g, resumo.diaHoje)
    .replace(/\{linhas\}/g, linhas.join('\n'));
}
function auditoriaEnviarLembrete(id) {
  const resp = (window.auditoriaResps || []).find(r => r.id === id);
  if (!resp || !resp.whatsapp) { alert('Responsável sem WhatsApp cadastrado.'); return; }
  const msg = ppvdMontarLembreteAuditoria(resp.municipio, resp);
  if (!msg) { alert('Nenhuma pendência encontrada pra ' + resp.municipio + ' agora.'); return; }
  const hoje = auditoriaLembretesDe(resp.municipio, resp.id).find(l => auditoriaMesmoDia(l.created_at));
  if (hoje && !confirm(`Já foi enviado um lembrete a ${resp.nome} ${auditoriaQuando(hoje.created_at)}${hoje.enviado_por_nome ? ' (por ' + hoje.enviado_por_nome + ')' : ''}. Enviar de novo?`)) return;
  window.open(`https://wa.me/${resp.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
  auditoriaRegistrarLembrete(resp.municipio, resp, 'whatsapp', msg);
}
async function auditoriaCopiarLembrete(nomeMunicipio) {
  const msg = ppvdMontarLembreteAuditoria(nomeMunicipio, null);
  if (!msg) { alert('Nenhuma pendência encontrada pra ' + nomeMunicipio + ' agora.'); return; }
  try { await navigator.clipboard.writeText(msg); alert('Mensagem copiada. É só colar no grupo do WhatsApp.'); }
  catch (e) { prompt('Copie a mensagem abaixo (Ctrl+C):', msg); }
  auditoriaRegistrarLembrete(nomeMunicipio, null, 'copia', msg);
}

// Detalhamento por natureza: acumulado ou um mês (o arquivo de dados já traz por_mes), zeros em cinza e subtotal por companhia
function detalhadoTabelaHtml(d, colunas, mi) {
  const val = (m, k) => (mi === 'acum' ? (m[k] || 0) : (((m.por_mes || {})[k] || [])[mi] || 0));
  const cel = (v, c) => (v === 0 ? `<td class="z0">·</td>` : (c.highlight ? `<td style="background:rgba(230,72,79,0.22);color:#ff8a8f;font-weight:600">${v}</td>` : `<td>${v}</td>`));
  const tot = (m) => colunas.reduce((a, c) => a + val(m, c.key), 0);
  let html = `<div style="overflow-x:auto"><table class="data-table"><thead><tr>
    <th style="text-align:left">Fração</th><th style="text-align:left">Município</th>
    ${colunas.map(c => `<th${c.highlight ? ' style="background:rgba(230,72,79,0.28);color:var(--text)"' : ''}>${c.label}</th>`).join('')}
    <th>Total</th>
  </tr></thead><tbody>`;
  const geral = colunas.map(() => 0); let geralTot = 0;
  d.cias.forEach(cia => {
    const sub = colunas.map(() => 0);
    cia.municipios.forEach((m, i) => {
      html += `<tr>`;
      if (i === 0) html += `<td rowspan="${cia.municipios.length + 1}" style="text-align:left;font-weight:700;vertical-align:middle">${cia.nome}</td>`;
      html += `<td style="text-align:left">${m.nome}</td>`;
      colunas.forEach((c, j) => { const v = val(m, c.key); sub[j] += v; geral[j] += v; html += cel(v, c); });
      const t = tot(m); geralTot += t;
      html += t === 0 ? `<td class="z0">·</td></tr>` : `<td style="font-weight:700">${t}</td></tr>`;
    });
    html += `<tr class="cia-sub"><td style="text-align:left">Subtotal ${cia.nome}</td>${sub.map(v => `<td>${v}</td>`).join('')}<td>${sub.reduce((a, b) => a + b, 0)}</td></tr>`;
  });
  html += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)"><td colspan="2" style="text-align:left">TOTAL</td>${geral.map((v, j) => (colunas[j].highlight ? `<td style="background:rgba(230,72,79,0.28);color:#ff8a8f">${v}</td>` : `<td>${v}</td>`)).join('')}<td>${geralTot}</td></tr>`;
  return html + `</tbody></table></div>`;
}
function detalhadoPorNaturezaHtml(d, titulo, colunas, defHtml, fonteHtml, meses) {
  let html = `<div class="chart-box ind-sec" style="min-width:0"><h3>${titulo}</h3>`;
  html += `<details class="aud-como"><summary>Como ler este detalhamento</summary><div><b>${d.periodo}</b><br>${defHtml}</div></details>`;
  html += `<div class="pills-vd" id="detPeriodos" role="group" aria-label="Período do detalhamento"><button type="button" data-p="acum" class="on">Acumulado</button>${(meses || []).map((m, i) => `<button type="button" data-p="${i}">${m}</button>`).join('')}</div>`;
  html += `<div id="detTabela">${detalhadoTabelaHtml(d, colunas, 'acum')}</div>`;
  html += `<div class="updated">${fonteHtml}</div>`;
  html += `</div>`;
  return html;
}
function ligarDetalhado(d, colunas) {
  const box = document.getElementById('detPeriodos'); if (!box || !d) return;
  box.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-p]'); if (!b) return;
    box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('detTabela').innerHTML = detalhadoTabelaHtml(d, colunas, b.dataset.p === 'acum' ? 'acum' : parseInt(b.dataset.p));
  });
}

// ---------- Filtro de município persistente (topbar) ----------
// Pedido por Eduardo em 2026-08-13: comandante de fração não deveria ter que reselecionar
// o próprio município toda vez que muda de página. Guarda a escolha no localStorage e,
// nas páginas com tabela por município, destaca a linha correspondente.
const MUNICIPIOS_CANONICAL = ['Araçuaí','Itaobim','Pedra Azul','Medina','Itinga','Águas Vermelhas','Divisa Alegre','Coronel Murta','Padre Paraíso','Ponto dos Volantes','Cachoeira de Pajeú','Virgem da Lapa','Comercinho'];
function normMun(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim(); }
function getMunFiltro() { return localStorage.getItem('mun70bpm_filtro') || ''; }
function setMunFiltro(nome) {
  if (nome) localStorage.setItem('mun70bpm_filtro', nome);
  else localStorage.removeItem('mun70bpm_filtro');
  const sel = document.getElementById('munFiltroGlobal');
  if (sel && sel.value !== (nome || '')) sel.value = nome || '';
  if (typeof pintarPilulasMun === 'function') pintarPilulasMun();
}
function highlightMunRows() {
  const alvo = getMunFiltro();
  const rows = document.querySelectorAll('#main .data-table tbody tr');
  rows.forEach(tr => tr.classList.remove('mun-highlight-row'));
  if (!alvo) return;
  const alvoNorm = normMun(alvo);
  rows.forEach(tr => {
    const firstCell = tr.querySelector('td');
    if (firstCell && normMun(firstCell.textContent) === alvoNorm) tr.classList.add('mun-highlight-row');
  });
}
// Estado da tela que sobrevive ao navegador descartar/recarregar a aba (Eduardo, 2026-10-09: ao voltar de
// outra aba — WhatsApp, SiGOp, BOS — a página reiniciava e saía do lugar). A página e o caso aberto já eram
// lembrados; faltava o resto: filtros/seletores (mês, período), o que foi digitado e ainda não salvo no caso,
// e a posição da rolagem. Guarda por "contexto" (página ou caso) no localStorage e reaplica quando o conteúdo
// reaparece. Só restaura (a) na carga da página e (b) ao voltar de um caso para a lista de onde ele saiu;
// navegar pelo menu sempre começa limpo. Rascunho vale por 24h e é apagado ao salvar o caso.
const estadoUI = (function () {
  const CHAVE = 'estadoUI70bpm', VALIDADE_MS = 24 * 3600 * 1000, MAX_CTX = 8;
  const main = () => document.getElementById('main');
  let ctx = null, primeira = true, voltarPara = null, observer = null, parar = null;
  let ultimaInteracao = 0;
  const ler = () => { try { return JSON.parse(localStorage.getItem(CHAVE) || '{}') || {}; } catch (e) { return {}; } };
  const gravar = (todos) => {
    try {
      const chaves = Object.keys(todos).sort((a, b) => (todos[b].ts || 0) - (todos[a].ts || 0));
      chaves.slice(MAX_CTX).forEach(k => delete todos[k]);
      localStorage.setItem(CHAVE, JSON.stringify(todos));
    } catch (e) {}
  };
  const atual = (todos) => { if (!todos[ctx]) todos[ctx] = { sel: {}, scroll: 0, ts: 0 }; return todos[ctx]; };
  const guardavel = (el) => el && el.id && (el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' ||
    (el.tagName === 'INPUT' && !['password', 'file', 'hidden', 'button', 'submit'].includes(el.type)));
  const valorDe = (el) => (el.type === 'checkbox' || el.type === 'radio') ? String(el.checked) : el.value;

  function aoMexer(e) {
    if (!ctx || !guardavel(e.target) || !main().contains(e.target)) return;
    const todos = ler(), est = atual(todos);
    est.sel[e.target.id] = valorDe(e.target); est.ts = Date.now(); gravar(todos);
  }
  function aoRolar() {
    if (!ctx || Date.now() - ultimaInteracao > 3000) return; // só rolagem feita pela pessoa (render troca o conteúdo e zera a rolagem)
    const todos = ler(), est = atual(todos);
    est.scroll = Math.round(main().scrollTop); est.ts = Date.now(); gravar(todos);
  }
  function marcarInteracao() { ultimaInteracao = Date.now(); if (parar) parar(); }
  function iniciarEscutas() {
    const m = main(); if (!m) return;
    m.addEventListener('input', aoMexer, true); m.addEventListener('change', aoMexer, true);
    m.addEventListener('scroll', aoRolar, { passive: true });
    ['wheel', 'touchstart', 'touchmove', 'keydown', 'mousedown'].forEach(ev => m.addEventListener(ev, () => { ultimaInteracao = Date.now(); }, { passive: true, capture: true }));
    ['wheel', 'touchmove', 'keydown'].forEach(ev => m.addEventListener(ev, () => { if (parar) parar(); }, { passive: true, capture: true }));
  }

  function restaurar(alvo) {
    const est = ler()[alvo];
    if (!est || Date.now() - (est.ts || 0) > VALIDADE_MS) return;
    const aplicados = new WeakSet(); // por elemento: se a página for re-renderizada (ex.: dados restritos chegaram), reaplica
    const tentar = () => {
      if (ctx !== alvo) return;
      const m = main();
      Object.keys(est.sel || {}).forEach(id => {
        const el = document.getElementById(id);
        if (!el || !m.contains(el) || aplicados.has(el)) return;
        aplicados.add(el);
        const v = est.sel[id];
        if (el.type === 'checkbox' || el.type === 'radio') { if (String(el.checked) !== v) { el.checked = v === 'true'; el.dispatchEvent(new Event('change', { bubbles: true })); } return; }
        if (el.value !== v) {
          el.value = v;
          if (el.tagName === 'SELECT' && el.value !== v) return; // opção não existe mais
          el.dispatchEvent(new Event(el.tagName === 'SELECT' ? 'change' : 'input', { bubbles: true }));
        }
      });
      if (est.scroll > 0 && m.scrollTop < est.scroll - 2 && m.scrollHeight - m.clientHeight >= est.scroll - 2) m.scrollTop = est.scroll;
    };
    if (observer) observer.disconnect();
    observer = new MutationObserver(tentar);
    observer.observe(main(), { childList: true, subtree: true });
    const timer = setTimeout(() => parar && parar(), 20000);
    parar = () => { clearTimeout(timer); if (observer) observer.disconnect(); observer = null; parar = null; };
    tentar();
  }

  return {
    iniciar: iniciarEscutas,
    set voltarPara(p) { voltarPara = p; },
    // contexto = página ('pag:<chave>') ou caso ('caso:<REDS>'); restaurar=true reaplica o que foi salvo
    entrar(novo, restaurarAgora) {
      if (parar) parar();
      ctx = novo;
      const todos = ler();
      if (!restaurarAgora) { delete todos[ctx]; gravar(todos); } else restaurar(ctx);
    },
    // true na carga da página e quando se volta (Voltar) pra página de onde um caso foi aberto
    deveRestaurarPagina(chave) {
      const r = primeira || chave === voltarPara;
      primeira = false; voltarPara = null;
      return r;
    },
    // caso salvo/re-renderizado: o que estava digitado já foi gravado, descarta o rascunho
    limparCampos() { if (!ctx) return; const todos = ler(); if (todos[ctx]) { todos[ctx].sel = {}; gravar(todos); } },
  };
})();
estadoUI.iniciar();

let currentPageKey = 'home';
function goToPage(key) {
  currentPageKey = key;
  estadoUI.entrar('pag:' + key, estadoUI.deveRestaurarPagina(key));
  try {
    // localStorage (não sessionStorage) desde 2026-10-01: Eduardo relatou que o problema de
    // perder a página ao trocar de aba continuava mesmo depois da correção de 09/2026 — em
    // mobile (principalmente Safari/iOS), o sistema pode descartar a aba em segundo plano e
    // limpar o sessionStorage junto, não só recarregar a página. localStorage sobrevive a isso.
    localStorage.setItem('paginaAtualPPVD', key);
    localStorage.removeItem('ppvdCasoAbertoReds'); // navegar pelo menu = saída deliberada de um caso aberto
  } catch (e) {}
  try {
    pages[key]();
  } catch (e) {
    console.error('Erro ao renderizar página "' + key + '":', e);
  } finally {
    try { menuAtivo(key); pintarPilulasMun(); } catch (e) { console.error(e); }
    requestAnimationFrame(highlightMunRows);
  }
}
function initMunFiltroGlobal() {
  const sel = document.getElementById('munFiltroGlobal');
  if (!sel) return;
  sel.innerHTML = '<option value="">Todos os municípios</option>' +
    MUNICIPIOS_CANONICAL.map(m => `<option value="${m}">${m}</option>`).join('');

// Sugestao automatica de GUT a partir de dados ja disponiveis no REDS/caso, para pre-marcar a
// opcao mais provavel no wizard - o militar sempre pode corrigir, nunca fica travado no valor
// sugerido. Eduardo pediu (2026-08-20): "quero o que voce tiver para auxiliar o militar" - nas
// 3 dimensoes, nao so Urgencia (a mais facil de calcular objetivamente a partir de datas/contagens).
function ppvdSugerirGUT(modalidade, dados) {
  const g = { gravidade: null, urgencia: null, tendencia: null };
  if (modalidade === 'crimes_violentos') {
    if (dados.arma_fogo) g.gravidade = 5;
    else if (dados.tentativa_homicidio) g.gravidade = 4;
    if (dados.autor_identificado === false && dados.dias_desde_reds != null && dados.dias_desde_reds < 1) g.urgencia = 5;
    else if (dados.autor_identificado === false) g.urgencia = 4;
    else if (dados.autor_preso) g.urgencia = 2;
    else if (dados.dias_desde_reds != null && dados.dias_desde_reds <= 7) g.urgencia = 3;
    if (dados.qtd_crimes_violentos_vitima != null && dados.qtd_crimes_violentos_vitima > 1) g.tendencia = 5;
    else if (dados.endereco_reincidente) g.tendencia = 4;
  } else if (modalidade === 'reincidencia') {
    if (dados.arma_fogo) g.gravidade = 5;
    else if (dados.naturezas_distintas != null && dados.naturezas_distintas >= 2) g.gravidade = 3;
    if (dados.qtd_chamados_60d != null && dados.qtd_chamados_60d >= 3 && dados.dias_desde_ultimo_chamado != null && dados.dias_desde_ultimo_chamado < 7) g.urgencia = 5;
    else if (dados.intervalo_dias_entre_chamados != null) {
      if (dados.intervalo_dias_entre_chamados <= 15) g.urgencia = 4;
      else if (dados.intervalo_dias_entre_chamados <= 35) g.urgencia = 3;
      else g.urgencia = 2;
    }
    if (dados.visita_anterior_sem_efeito) g.tendencia = 5;
  }
  return g; // valores null = sem sugestao automatica confiavel; militar escolhe do zero
}

let ppvdWizard = null;

function ppvdCriteriosPara(modalidade) {
  if (modalidade === 'crimes_violentos') return PPVD_CRITERIOS_GUT_CRIMES_VIOLENTOS;
  if (modalidade === 'reincidencia') return PPVD_CRITERIOS_GUT_REINCIDENCIA;
  return PPVD_CRITERIOS_GUT;
}
function ppvdModalidadeLabel(modalidade) {
  if (modalidade === 'crimes_violentos') return 'Crimes Violentos';
  if (modalidade === 'reincidencia') return 'Preditiva por Reincidência de Endereço';
  return 'Violência Doméstica';
}
function ppvdModalidadeVoltarPage(modalidade) {
  if (modalidade === 'crimes_violentos') return 'crimes_violentos';
  if (modalidade === 'reincidencia') return 'reincidencia';
  return 'violencia_domestica';
}
function ppvdDiasDesde(dmy) {
  if (!dmy) return null;
  const p = dmy.split('/');
  if (p.length !== 3) return null;
  const dt = new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
  const diff = Math.floor((Date.now() - dt.getTime()) / 86400000);
  return diff >= 0 ? diff : null;
}

async function ppvdAbrirCasoModalidade(modalidade, chave, dadosBase, dadosOrigem) {
  if (!ppvdSupa) { alert('Integração PPVD indisponível.'); return; }
  if (!ppvdUser) { alert('Faça login (botão "Entrar (PPVD)" no topo) pra abrir um caso.'); return; }
  if (!ppvdPerfil) { alert('Complete seu cadastro antes (aparece no topo da tela).'); return; }
  if (!ppvdPerfil.aprovado) { alert('Seu acesso ainda não foi aprovado pelo administrador PPVD.'); return; }

  document.getElementById('main').innerHTML = `<div class="page-title">Carregando caso…</div>`;

  const isEndereco = modalidade === 'reincidencia';
  const filtroCol = isEndereco ? 'endereco_key' : 'reds_numero';

  let { data: caso, error } = await ppvdSupa.from('ppvd_casos').select('*').eq(filtroCol, chave).eq('modalidade', modalidade).maybeSingle();
  if (error) { document.getElementById('main').innerHTML = `<div class="def-box">Erro ao consultar caso: ${error.message}</div>`; return; }
  if (!caso) {
    const insertObj = {
      modalidade,
      reds_numero: isEndereco ? null : chave,
      endereco_key: isEndereco ? chave : null,
      reds_relacionados: dadosBase.reds_relacionados || null,
      reds_data: dadosBase.reds_data || null,
      natureza: dadosBase.natureza || null,
      causa: dadosBase.causa || null,
      municipio: dadosBase.municipio || null,
      bairro: dadosBase.bairro || null,
      logradouro: dadosBase.logradouro || null,
      numero: dadosBase.numero || null,
      dados_origem: dadosOrigem || null,
      status: 'novo',
    };
    const { data: novo, error: errIns } = await ppvdSupa.from('ppvd_casos').insert(insertObj).select().single();
    if (errIns) { document.getElementById('main').innerHTML = `<div class="def-box">Erro ao criar caso: ${errIns.message}</div>`; return; }
    caso = novo;
  }

  ppvdWizard = {
    modalidade, casoId: caso.id, step: 0,
    valores: { gravidade: caso.gravidade || null, urgencia: caso.urgencia || null, tendencia: caso.tendencia || null },
    militar_responsavel: caso.militar_responsavel || '',
    caso,
  };
  if (ppvdWizard.valores.gravidade && ppvdWizard.valores.urgencia && ppvdWizard.valores.tendencia) {
    ppvdWizard.step = 3;
  }
  ppvdRenderWizard();
}

function ppvdRenderWizard() {
  const w = ppvdWizard;
  const criterios = ppvdCriteriosPara(w.modalidade);
  const sugestoes = ppvdSugerirGUT(w.modalidade, w.caso.dados_origem || {});
  const dims = ['gravidade', 'urgencia', 'tendencia'];
  const dimLabels = { gravidade: 'Gravidade', urgencia: 'Urgência', tendencia: 'Tendência' };

  let html = `<div class="page-title">Novo Caso — ${ppvdModalidadeLabel(w.modalidade)}</div>`;
  html += `<button class="ppvd-btn" onclick="goToPage('${ppvdModalidadeVoltarPage(w.modalidade)}')">← Voltar</button>`;

  html += `<div class="ppvd-card" style="margin-top:16px">`;
  html += `<b>${w.caso.reds_numero ? ('REDS: ' + w.caso.reds_numero) : 'Endereço reincidente'}</b> &nbsp;`;
  if (w.caso.reds_data) html += `<b>Data:</b> ${w.caso.reds_data} &nbsp;`;
  if (w.caso.natureza) html += `<b>Natureza:</b> ${w.caso.natureza} &nbsp;`;
  html += `<br><b>Endereço:</b> ${w.caso.bairro || ''}${w.caso.logradouro ? (' - ' + w.caso.logradouro) : ''}${w.caso.numero && w.caso.numero !== '0' ? (', ' + w.caso.numero) : ''}`;
  if (w.caso.reds_relacionados) html += `<br><b>REDS relacionados:</b> ${w.caso.reds_relacionados}`;
  html += `</div>`;

  if (w.step < 3) {
    const dim = dims[w.step];
    const opts = criterios[dim];
    const sugestao = sugestoes[dim];
    html += `<div class="page-title" style="margin-top:24px;font-size:16px">Pergunta ${w.step + 1} de 3 — ${dimLabels[dim]}</div>`;
    if (sugestao) {
      html += `<div class="def-box" style="border-color:var(--amber)">💡 Sugestão automática com base nos dados do REDS: <b>nível ${sugestao}</b> — confira e escolha a opção que melhor descreve a situação (pode ser diferente da sugestão).</div>`;
    }
    html += `<div class="ppvd-card">`;
    opts.forEach(o => {
      const marcado = w.valores[dim] === o.v;
      const destacar = sugestao === o.v;
      html += `<button class="ppvd-btn ${marcado ? 'ppvd-btn-primary' : ''}" style="display:block;width:100%;text-align:left;margin-bottom:8px;white-space:normal;${destacar ? 'border-color:var(--amber)' : ''}" onclick="ppvdWizardResponder('${dim}', ${o.v})"><b>${o.v}</b> — ${o.d}${destacar ? ' 💡' : ''}</button>`;
    });
    html += `</div>`;
    if (w.step > 0) html += `<button class="ppvd-btn" onclick="ppvdWizardVoltarPergunta()">← Pergunta anterior</button>`;
  } else {
    const g = w.valores.gravidade, u = w.valores.urgencia, t = w.valores.tendencia;
    const score = (g || 0) * (u || 0) * (t || 0);
    const orient = ppvdOrientacao(g, u, t);
    html += `<div class="page-title" style="margin-top:24px;font-size:16px">Revisão e finalização</div>`;
    html += `<div class="kpi-grid">`;
    html += `<div class="kpi-card ${orient.nivel === 'critica' ? 'kpi-red' : (orient.nivel === 'alta' ? 'kpi-neutral' : 'kpi-green')}"><div class="val">${score || '—'}</div><div class="lbl">Score GUT (G×U×T)</div></div>`;
    html += `<div class="kpi-card kpi-neutral"><div class="val" style="font-size:14px">${orient.texto}</div><div class="lbl">Orientação Automática</div></div>`;
    html += `</div>`;
    html += `<div class="ppvd-card">`;
    dims.forEach(dim => {
      const v = w.valores[dim];
      const opt = criterios[dim].find(o => o.v === v);
      html += `<div style="margin-bottom:10px"><b>${dimLabels[dim]}: ${v}</b> — ${opt ? opt.d : ''} <button class="ppvd-btn" onclick="ppvdWizardEditarPergunta('${dim}')" style="margin-left:8px">Corrigir</button></div>`;
    });
    html += `</div>`;
    html += `<div class="ppvd-card"><b>Identificação</b> <span style="color:var(--muted);font-size:12px">(opcional — só o primeiro nome, sem sobrenome, RG ou telefone)</span><br><br>`;
    html += `<div class="ppvd-field"><label>Primeiro nome da vítima</label><input id="ppvdWizVit" placeholder="Ex: Maria" value="${msgEsc(w.caso.vitima_nome)}"></div>`;
    html += `<div class="ppvd-field"><label>Primeiro nome do autor</label><input id="ppvdWizAut" placeholder="Ex: João" value="${msgEsc(w.caso.autor_nome)}"></div>`;
    html += `</div>`;
    html += `<div class="ppvd-card"><b>Militar Responsável pela visita</b><br><br>`;
    html += `<div class="ppvd-field"><input id="ppvdMilitarResp" placeholder="Nome/graduação de quem fez a visita" value="${w.militar_responsavel || ''}"></div>`;
    html += `</div>`;
    html += `<div class="ppvd-card"><b>Anexar BOS (imagem ou PDF)</b><br><br>`;
    html += `<div class="ppvd-field"><input type="file" id="ppvdBosFile" accept="image/*,application/pdf"></div>`;
    if (w.caso.bos_url) html += `<div style="margin-top:6px;color:var(--muted)">Este caso já tem um BOS anexado. Enviar um novo arquivo substitui.</div>`;
    html += `</div>`;
    html += `<button class="ppvd-btn ppvd-btn-primary" onclick="ppvdWizardSalvar()">Salvar caso</button>`;
  }

  document.getElementById('main').innerHTML = html;
}

function ppvdWizardResponder(dim, valor) {
  ppvdWizard.valores[dim] = valor;
  ppvdWizard.step += 1;
  ppvdRenderWizard();
}
function ppvdWizardVoltarPergunta() {
  ppvdWizard.step = Math.max(0, ppvdWizard.step - 1);
  ppvdRenderWizard();
}
function ppvdWizardEditarPergunta(dim) {
  const dims = ['gravidade', 'urgencia', 'tendencia'];
  ppvdWizard.step = dims.indexOf(dim);
  ppvdRenderWizard();
}

async function ppvdWizardSalvar() {
  const w = ppvdWizard;
  w.militar_responsavel = document.getElementById('ppvdMilitarResp').value || '';
  const fileInput = document.getElementById('ppvdBosFile');
  const file = fileInput && fileInput.files && fileInput.files[0];

  let bosUrl = w.caso.bos_url || null;
  if (file) {
    const path = `${w.modalidade}/${w.casoId}/${Date.now()}_${file.name}`;
    const { error: upErr } = await ppvdSupa.storage.from('ppvd-bos').upload(path, file, { upsert: true });
    if (upErr) { alert('Erro ao enviar BOS: ' + upErr.message); return; }
    bosUrl = path;
  }

  const upd = {
    gravidade: w.valores.gravidade, urgencia: w.valores.urgencia, tendencia: w.valores.tendencia,
    militar_responsavel: w.militar_responsavel || null,
    bos_url: bosUrl,
    status: 'em_acompanhamento',
  };
  const wv = document.getElementById('ppvdWizVit'), wa = document.getElementById('ppvdWizAut');
  if (wv) upd.vitima_nome = ppvdPrimeiroNome(wv.value) || null;
  if (wa) upd.autor_nome = ppvdPrimeiroNome(wa.value) || null;
  const { error } = await ppvdSupa.from('ppvd_casos').update(upd).eq('id', w.casoId);
  if (error) { alert('Erro ao salvar: ' + error.message); return; }
  alert('Caso salvo com sucesso.');
  goToPage(ppvdModalidadeVoltarPage(w.modalidade));
}

function ppvdToIso(dmy) {
  if (!dmy) return null;
  const p = dmy.split('/');
  if (p.length !== 3) return null;
  return `${p[2]}-${p[1]}-${p[0]}`;
}
function ppvdFmtDT(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('pt-BR'); } catch (e) { return iso; }
}
function ppvdIniciais(nome) {
  if (!nome) return '';
  return nome.trim().split(/\s+/).map(p => p[0] ? p[0].toUpperCase() + '.' : '').join('');
}

// Se a aba recarregou de verdade (navegador descartou em segundo plano por memória, ou F5)
// enquanto um caso estava aberto, reabre ele sozinho em vez de devolver a lista/Home — só
// tenta uma vez, na primeira resolução de sessão da aba (achado por Eduardo em 2026-09-08).
// ppvdCasoAbertoRedsNaCarga é lido no fim do script, ANTES do goToPage() de restauração —
// porque o próprio goToPage() apaga 'ppvdCasoAbertoReds' do localStorage a cada chamada (é
// assim que ele detecta "navegação deliberada = saiu do caso"). Sem isso, a restauração
// apagava a própria pista que ia usar um instante depois — bug achado por Eduardo em
// 2026-10-01 (o caso nunca reabria sozinho, sempre caía na lista/Home).
let ppvdCaseRestoreTentado = false;
let ppvdCasoAbertoRedsNaCarga = null;
async function ppvdTentarRestaurarCaso() {
  if (ppvdCaseRestoreTentado) return false;
  ppvdCaseRestoreTentado = true;
  const redsAberto = ppvdCasoAbertoRedsNaCarga;
  if (redsAberto && ppvdUser && ppvdPerfil && ppvdPerfil.aprovado) {
    window.ppvdRestaurando = true; // reaplica rascunho e rolagem do caso (estadoUI)
    try { await ppvdAbrirCaso(redsAberto); } finally { window.ppvdRestaurando = false; }
    return true;
  }
  return false;
}

async function ppvdOnSession(session, event) {
  // TOKEN_REFRESHED dispara toda vez que a aba volta a ficar visível (o Supabase reconfere o
  // token pra manter a sessão válida) — não é login nem logout de verdade. Sem esse filtro,
  // voltar de outra aba (ex.: ir ler o REDS/BO e voltar) re-renderizava a página de Violência
  // Doméstica/Auditoria do zero, derrubando quem estava com um caso aberto no meio do
  // preenchimento do GUT. Achado por Eduardo em 2026-09-08. Só re-renderiza quando algo
  // realmente mudou: login, logout, troca de usuário, ou aprovação de cadastro.
  // 2026-10-09 (Eduardo: "abro outra aba, volto e a página dá refresh e perde o lugar", mesmo depois da
  // correção de 09/09): o supabase-js v2 dispara SIGNED_IN (não só TOKEN_REFRESHED) quando a aba volta a
  // ficar visível, e o filtro só cobria TOKEN_REFRESHED — então a tela era refeita (caso aberto virava lista).
  // Além disso, sem rede por um instante ao voltar, a consulta do perfil falhava, o perfil virava null e o
  // painel mostrava o formulário de cadastro. Agora: qualquer evento com a MESMA sessão não refaz a tela, e
  // falha de rede ao buscar o perfil mantém o estado anterior.
  const userIdAntes = ppvdUser ? ppvdUser.id : null;
  const aprovadoAntes = ppvdPerfil ? ppvdPerfil.aprovado : null;
  const novoUser = session ? session.user : null;
  let novoPerfil = null;
  if (novoUser) {
    const { data, error } = await ppvdSupa.from('perfis').select('*').eq('user_id', novoUser.id).maybeSingle();
    if (error && ppvdPerfil && userIdAntes === novoUser.id) return false; // sem rede ao voltar pra aba: mantém tudo como está
    novoPerfil = data || null;
  }
  ppvdUser = novoUser;
  ppvdPerfil = novoPerfil;
  ppvdRenderAuthWidget();
  const restritoAntes = ppvdRestritoCarregado;
  if (ppvdUser && ppvdPerfil && ppvdPerfil.aprovado) { await ppvdCarregarDadosRestritos(); notifSincronizar(); }
  else ppvdLimparDadosRestritos();
  const restritoMudou = restritoAntes !== ppvdRestritoCarregado;
  const casoRestaurado = await ppvdTentarRestaurarCaso();
  const identidadeIgual = userIdAntes === (ppvdUser ? ppvdUser.id : null);
  const aprovacaoIgual = aprovadoAntes === (ppvdPerfil ? ppvdPerfil.aprovado : null);
  if (event && event !== 'SIGNED_OUT' && identidadeIgual && aprovacaoIgual && !restritoMudou) return false; // SIGNED_IN/TOKEN_REFRESHED/INITIAL_SESSION ao voltar pra aba
  // Se acabou de restaurar um caso aberto (aba descartada/recarregada), não sobrescreve com a
  // lista de novo — achado por Eduardo em 2026-09-09, o caso restaurado acima estava sendo
  // apagado na mesma passada por este mesmo bloco de re-render.
  if (casoRestaurado) return;
  if (ppvdUser && !ppvdPerfil) {
    ppvdRenderCadastroForm();
  } else if (PPVD_PAGINAS_RESTRITAS.includes(currentPageKey) && pages[currentPageKey]) {
    pages[currentPageKey]();
  } else if (currentPageKey === 'home') {
    homeVdCarregar();
  }
}

// Semáforo dos casos de Violência Doméstica (azul incluído a pedido de Eduardo em 2026-10-09):
//   vermelho = caso novo (sem caso/aberto) ou em atraso
//   amarelo  = atendimento iniciado (1ª visita despachada ou já feita, aguardando decisão do comandante)
//   azul     = não estabilizado, mas o comandante decidiu continuar com visitas de retorno: dentro do prazo e
//              sendo acompanhado.
//   verde    = estabilizado
// Atraso: visita despachada (1ª ou retorno) sem resposta há mais de 72h (prazo máximo da mensagem de
// despacho) volta a vermelho; `_pendenteDesde` vem de ppvdBuscarCasosVD.
const PPVD_PRAZO_RETORNO_HORAS = 72;
// O PPVD só passou a valer em Setembro/2026: ocorrência anterior SEM caso conta como finalizada (verde), com a ressalva de
// que as visitas daquele período foram feitas sem registro no sistema. Caso anterior que já existe no PPVD e segue aberto
// continua aberto, com a situação real, para cada responsável resolver (decisão de Eduardo em 2026-10-13).
const PPVD_OBS_ANTERIOR = 'anterior ao PPVD — visitas feitas sem o registro no sistema';
function ppvdEmAcompanhamentoVD(caso) {
  return !!caso && caso.status !== 'estabilizada' && ((caso.qtd_retornos || 0) >= 1 || caso.status === 'retorno' || caso.status === 'em_acompanhamento');
}
function ppvdVisitaAtrasadaVD(caso) {
  return !!(caso && caso._pendenteDesde && (Date.now() - new Date(caso._pendenteDesde).getTime()) / 3600000 > PPVD_PRAZO_RETORNO_HORAS);
}
function ppvdSemaforoVD(caso) {
  if (!caso) return 'vermelho';
  if (caso.status === 'estabilizada') return 'verde';
  if (ppvdEmAcompanhamentoVD(caso)) return ppvdVisitaAtrasadaVD(caso) ? 'vermelho' : 'azul';
  if (caso.status === 'em_visita') return ppvdVisitaAtrasadaVD(caso) ? 'vermelho' : 'amarelo';
  if (caso.status === 'decisao_cmd') return 'amarelo';
  return 'vermelho'; // sem caso, aberto/novo, outros
}
function ppvdStatusLabelVD(status) {
  const map = { aberto: 'Aberto', novo: 'Novo', em_visita: 'Em Visita', decisao_cmd: 'Decisão Cmd', retorno: 'Retorno', em_acompanhamento: 'Em acompanhamento', estabilizada: 'Estabilizada', encerrado: 'Encerrado' };
  return map[status] || status || 'Sem caso';
}
async function ppvdBuscarCasosVD(redsList) {
  if (!ppvdSupa || !ppvdUser || !ppvdPerfil || !ppvdPerfil.aprovado || !redsList || redsList.length === 0) return {};
  const { data, error } = await ppvdSupa.from('ppvd_casos').select('*').eq('modalidade', 'violencia_domestica').in('reds_numero', redsList);
  const map = {};
  if (!error && data) data.forEach(c => { if (c.reds_numero) map[c.reds_numero] = c; });
  // Visita despachada e ainda sem resposta: precisa da data do despacho pra saber se estourou o prazo (vira vermelho)
  const porId = {};
  Object.values(map).forEach(c => { if (c.status === 'em_visita') porId[c.id] = c; });
  if (Object.keys(porId).length) {
    const { data: pend } = await ppvdSupa.from('ppvd_visitas').select('caso_id, despachado_em').in('caso_id', Object.keys(porId)).is('visita_realizada_em', null);
    (pend || []).forEach(v => {
      const c = porId[v.caso_id];
      if (c && v.despachado_em && (!c._pendenteDesde || v.despachado_em < c._pendenteDesde)) c._pendenteDesde = v.despachado_em;
    });
  }
  return map;
}
let ppvdMilitaresCache = null;
async function ppvdCarregarMilitares() {
  if (!ppvdSupa || !ppvdUser || !ppvdPerfil || !ppvdPerfil.aprovado) { ppvdMilitaresCache = []; return ppvdMilitaresCache; }
  const { data, error } = await ppvdSupa.from('militares_responsaveis').select('*').eq('ativo', true);
  ppvdMilitaresCache = (!error && data) ? data : [];
  return ppvdMilitaresCache;
}
// O cadastro antigo tem o município escrito de vários jeitos ("COMERCINHO", "CORONEL MURTA - MG") e duplicados: casa ignorando
// caixa/acento/" - MG" e, havendo mais de um, escolhe sempre o MAIS ANTIGO (antes era "o primeiro que aparecesse", variava)
function ppvdSugerirResponsavel(municipio) {
  if (!ppvdMilitaresCache || !municipio) return null;
  const limpa = (t) => normMun(String(t || '').replace(/\s*-\s*MG\s*$/i, ''));
  const alvo = limpa(municipio);
  const todos = ppvdMilitaresCache.filter(m => limpa(m.municipio) === alvo);
  todos.sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
  return todos[0] || null;
}

  const n = String(txt || '').trim().split(' ')[0] || '';
  return /^[A-Za-zÀ-ÿ]+$/.test(n) ? n.charAt(0).toUpperCase() + n.slice(1).toLowerCase() : n;

Favor realizar a leitura do fato e a visita ao autor${pAut} e à vítima${pVit}, no prazo preferencial de 24h (máximo 72h).

Após o término, acesse o link abaixo, anexe o BOS da visita ao autor${pAut} e à vítima${pVit}, e preencha o GUT novo:
${link}`;
}
