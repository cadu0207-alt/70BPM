<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>70º BPM &middot; Painel de Indicadores Operacionais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #070c14;
    --bg-1: #0b1420;
    --bg-2: #101c2c;
    --panel: #0e1b2b;
    --panel-border: #1e3348;
    --line: #16283c;
    --amber: #e8a83c;
    --amber-dim: #8a6a2c;
    --signal: #21c98a;
    --signal-dim: #14624a;
    --alert: #e6484f;
    --alert-dim: #6e2226;
    --caution: #d4c22a;
    --text: #eaf1f8;
    --muted: #7891a8;
    --muted-dim: #4d6478;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --display: 'Rajdhani', var(--sans);
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--panel-border) var(--bg-0); }
  body {
    margin:0; font-family: var(--sans);
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 34px),
      radial-gradient(ellipse 1200px 700px at 15% -10%, #14263a 0%, transparent 60%),
      linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-0) 100%);
    color: var(--text); display:flex; min-height:100vh;
    font-variant-numeric: tabular-nums;
  }
  ::selection { background: var(--amber); color:#1a1200; }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    width: 216px; background: linear-gradient(180deg,#081019,#060b12);
    border-right: 1px solid var(--panel-border);
    padding: 0; flex-shrink:0; display:flex; flex-direction:column;
    position: sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand {
    padding: 22px 18px 16px; border-bottom: 1px solid var(--panel-border);
  }
  .brand .unit { font-family: var(--display); font-size:20px; font-weight:700; letter-spacing:0.06em; color:var(--text); line-height:1.1; }
  .brand .sub { font-family: var(--mono); font-size:9.5px; letter-spacing:0.14em; color:var(--amber); text-transform:uppercase; margin-top:6px; }
  .nav-scroll { padding: 14px 10px 20px; flex:1; }
  .nav-group { margin-bottom: 18px; }
  .nav-group-label {
    font-family: var(--mono); font-size:10px; letter-spacing:0.16em; text-transform:uppercase;
    color: var(--muted-dim); padding: 0 8px 6px; display:flex; align-items:center; gap:6px;
  }
  .nav-group-label::before { content:''; width:5px; height:5px; background:var(--muted-dim); flex-shrink:0; }
  .nav-btn {
    display:flex; align-items:center; gap:9px; width:100%;
    background: transparent; color: var(--muted); border:none; border-left:2px solid transparent;
    padding: 8px 10px; font-weight:500; cursor:pointer; text-align:left;
    font-size: 12.5px; font-family:var(--sans); letter-spacing:0.01em;
    border-radius: 0 3px 3px 0; margin-bottom:1px; transition: all .12s ease;
  }
  .nav-btn::before { content:''; width:6px; height:6px; border-radius:1px; background:var(--muted-dim); flex-shrink:0; transition: all .12s ease; }
  .nav-btn:hover:not(.disabled) { background: rgba(232,168,60,0.06); color: var(--text); }
  .nav-btn.active { background: rgba(232,168,60,0.1); color: var(--amber); border-left-color: var(--amber); font-weight:600; }
  .nav-btn.active::before { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .nav-btn.disabled { opacity: 0.42; cursor: not-allowed; }
  .nav-btn.disabled::before { background: var(--alert-dim); }

  /* ---------- TOPBAR + CONTENT ---------- */
  .app-col { flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; }
  .topbar {
    display:flex; justify-content:space-between; align-items:center;
    padding: 12px 30px; border-bottom: 1px solid var(--panel-border);
    background: rgba(7,12,20,0.6); flex-shrink:0;
  }
  .topbar-title { font-family: var(--mono); font-size:11px; letter-spacing:0.1em; color:var(--muted); text-transform:uppercase; }
  .topbar-title b { color:var(--text); font-weight:600; }
  .topbar-status { display:flex; align-items:center; gap:16px; font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:0.06em; }
  .topbar-status .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--signal); box-shadow:0 0 8px var(--signal); margin-right:6px; }
  .mun-filtro-wrap { display:flex; align-items:center; gap:5px; color:var(--amber); }
  .mun-filtro-select {
    background: var(--bg-2); color:var(--text); border:1px solid var(--panel-border); border-radius:3px;
    font-family:var(--mono); font-size:10.5px; padding:4px 6px; letter-spacing:0.03em; cursor:pointer;
  }
  .mun-highlight-row td { background: rgba(232,168,60,0.14) !important; box-shadow: inset 3px 0 0 var(--amber); }
  .main { flex:1; padding: 26px 34px 50px; overflow:auto; }

  /* ---------- PAGE HEADER ---------- */
  .page-title {
    font-family: var(--display); font-size: 25px; font-weight:700; letter-spacing:0.02em;
    color: var(--text); margin: 0 0 4px; padding:0; border:none; display:block;
    text-transform: uppercase;
  }
  .page-title::before { content:'// '; color: var(--amber); }
  .updated {
    font-size:11.5px; color: var(--muted); margin-bottom:22px; font-family: var(--mono);
    padding-bottom:16px; border-bottom: 1px solid var(--line); letter-spacing:0.01em;
  }
  .fresh-badge {
    display:inline-flex; align-items:center; gap:6px; font-family: var(--mono); font-size:10.5px;
    letter-spacing:0.04em; padding:4px 10px; border-radius:3px; margin: 2px 0 14px; text-transform:uppercase;
  }
  .fresh-badge::before { content:''; width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .fresh-ok { background: rgba(33,201,138,0.1); color: var(--signal); border:1px solid var(--signal-dim); }
  .fresh-ok::before { background: var(--signal); box-shadow:0 0 6px var(--signal); }
  .fresh-warn { background: rgba(212,194,42,0.1); color: var(--caution); border:1px solid #6b6318; }
  .fresh-warn::before { background: var(--caution); }
  .fresh-stale { background: rgba(230,72,79,0.1); color: var(--alert); border:1px solid var(--alert-dim); }
  .fresh-stale::before { background: var(--alert); }
  .fresh-snapshot { background: rgba(120,145,168,0.1); color: var(--muted); border:1px solid var(--muted-dim); }
  .fresh-snapshot::before { background: var(--muted); }

  /* ---------- KPI CARDS ---------- */
  .kpi-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom: 20px; }
  .kpi-card {
    position:relative; border-radius: 3px; padding: 18px 18px 16px; text-align:left; color:white;
    background: var(--panel); border:1px solid var(--panel-border); border-left-width:3px;
    overflow:hidden;
  }
  .kpi-card::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(135deg, rgba(255,255,255,0.035), transparent 55%);
  }
  .kpi-card .val { font-family: var(--mono); font-size: 28px; font-weight:600; letter-spacing:-0.01em; }
  .kpi-card .lbl { font-family: var(--mono); font-size: 10px; margin-top:6px; opacity:0.85; text-transform:uppercase; letter-spacing:0.09em; }
  .kpi-red { border-left-color: var(--alert); }
  .kpi-red .val { color: var(--alert); }
  .kpi-green { border-left-color: var(--signal); }
  .kpi-green .val { color: var(--signal); }
  .kpi-neutral { border-left-color: var(--muted); }
  .kpi-neutral .val { color: var(--text); }

  /* ---------- CONTROLS ---------- */
  select.month-select {
    background: var(--panel); color:var(--text); border:1px solid var(--panel-border); padding:8px 14px;
    border-radius:3px; margin-bottom:18px; font-size:12.5px; font-family:var(--mono); letter-spacing:0.03em;
    appearance:none; cursor:pointer;
  }
  select.month-select:focus { outline:1px solid var(--amber); }

  /* ---------- TABLES ---------- */
  .table-wrap { border:1px solid var(--panel-border); border-radius:4px; overflow:hidden; margin-bottom:26px; }
  table.data-table { width:100%; border-collapse: collapse; font-size: 12.5px; font-family:var(--sans); margin-bottom:0; background:var(--panel); }
  table.data-table th {
    background: #142236; color: var(--muted); padding:9px 8px; text-align:center;
    font-family: var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.07em; font-weight:500;
    border-bottom: 1px solid var(--panel-border);
  }
  table.data-table td { padding:7px 8px; text-align:center; border-bottom:1px solid rgba(234,241,248,0.10); font-family:var(--mono); font-size:12.5px; }
  table.data-table tbody tr:last-child td { border-bottom:none; }
  table.data-table tr:nth-child(even) td { background: rgba(255,255,255,0.015); }
  table.data-table tr:hover td { background: rgba(232,168,60,0.045); }
  table.data-table th.col-divider, table.data-table td.col-divider { border-left: 2px solid rgba(234,241,248,0.22); }
  .pos { color: var(--alert); font-weight:600; }
  .neg { color: var(--signal); font-weight:600; }

  /* ---------- CHARTS ---------- */
  .charts-row { display:flex; gap:16px; flex-wrap:wrap; }
  .chart-box { background:var(--panel); border:1px solid var(--panel-border); border-radius:4px; padding:16px 18px; flex:1; min-width:380px; }
  .chart-box h3 {
    margin:0 0 14px; font-size:10.5px; color:var(--muted); font-family:var(--mono);
    text-transform:uppercase; letter-spacing:0.09em; font-weight:500;
    padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  canvas { max-width:100%; }

  .def-box {
    background: var(--panel); border:1px solid var(--panel-border); border-left: 3px solid var(--amber);
    border-radius:4px; padding:14px 18px; margin-bottom:22px; font-size:12.5px; color:var(--muted); line-height:1.65;
  }
  .def-box b { color: var(--text); font-family:var(--mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; }
  .def-box .formula { font-family:var(--mono); color:var(--text); font-size:12px; display:block; margin:8px 0; }
  .def-box .polarity { color: var(--signal); font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; }
  .def-box code { color: var(--amber); font-family:var(--mono); }

  .btn-sigop {
    display:inline-flex; align-items:center; gap:9px;
    background: var(--amber); color:#151005; text-decoration:none;
    font-family:var(--mono); font-weight:700; font-size:12.5px; letter-spacing:0.04em;
    padding:11px 20px; border-radius:4px; margin-bottom:22px;
    box-shadow: 0 0 0 1px rgba(232,168,60,0.5), 0 4px 14px rgba(232,168,60,0.25);
    transition: all .12s ease;
  }
  .btn-sigop:hover { background:#f4bb54; box-shadow: 0 0 0 1px rgba(232,168,60,0.7), 0 6px 18px rgba(232,168,60,0.4); transform: translateY(-1px); }
  .btn-sigop .arrow { font-size:14px; }

  .pending-box {
    background:var(--panel); border:1px dashed var(--panel-border); border-radius:4px; padding:44px; text-align:center; color:var(--muted);
    font-size:14px; margin-top:30px; font-family:var(--mono); letter-spacing:0.02em;
  }

  .ppvd-btn {
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    background: var(--panel); color:var(--text); border:1px solid var(--panel-border); border-radius:4px;
    padding:8px 14px; font-family:var(--mono); font-size:12px; font-weight:600;
  }
  .ppvd-btn:hover { border-color:var(--amber); color:var(--amber); }
  .ppvd-btn-primary { background:var(--amber); color:#151005; border-color:var(--amber); font-weight:700; }
  .ppvd-btn-primary:hover { background:#f4bb54; }
  .ppvd-field { margin-bottom:14px; }
  .ppvd-field label { display:block; font-family:var(--mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .ppvd-field input, .ppvd-field select, .ppvd-field textarea {
    width:100%; max-width:420px; background:var(--bg-1); border:1px solid var(--panel-border); border-radius:4px;
    color:var(--text); padding:9px 11px; font-family:var(--sans); font-size:13.5px;
  }
  .ppvd-field textarea { max-width:640px; min-height:70px; }
  .ppvd-badge { display:inline-block; padding:3px 9px; border-radius:3px; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.03em; }
  .ppvd-badge-critica { background:rgba(224,80,80,0.18); color:#ff8080; border:1px solid rgba(224,80,80,0.4); }
  .ppvd-badge-alta { background:rgba(232,168,60,0.18); color:var(--amber); border:1px solid rgba(232,168,60,0.4); }
  .ppvd-badge-media { background:rgba(120,140,160,0.18); color:var(--muted); border:1px solid var(--panel-border); }
  .ppvd-badge-semcaso { background:transparent; color:var(--muted-dim); border:1px dashed var(--panel-border); }
  .ppvd-badge-verde { background:rgba(33,201,138,0.16); color:var(--signal); border:1px solid var(--signal-dim); }
  .vd-row-vermelho td { background: rgba(230,72,79,0.08) !important; }
  .vd-row-amarelo td { background: rgba(232,168,60,0.10) !important; }
  .vd-row-verde td { background: rgba(33,201,138,0.07) !important; }
  .vd-check-ok { color: var(--signal); font-weight:700; }
  .vd-check-no { color: var(--muted-dim); }
  .ppvd-card { background:var(--panel); border:1px solid var(--panel-border); border-radius:6px; padding:20px 22px; margin-bottom:18px; }

  .ap-cta {
    display:flex; align-items:center; gap:16px; cursor:pointer; user-select:none;
    background: rgba(232,168,60,0.07); border:1.5px solid var(--amber); border-radius:6px;
    padding:16px 22px; margin-bottom:22px; transition: all .12s ease;
  }
  .ap-cta:hover { background: rgba(232,168,60,0.14); box-shadow: 0 4px 14px rgba(232,168,60,0.2); transform: translateY(-1px); }
  .ap-cta .ap-cta-icon { font-size:26px; flex-shrink:0; }
  .ap-cta .ap-cta-title { font-weight:700; color:var(--amber); font-size:14.5px; letter-spacing:0.02em; }
  .ap-cta .ap-cta-sub { color:var(--muted); font-size:12px; margin-top:3px; }
  .ap-cta .ap-cta-arrow { margin-left:auto; font-size:20px; color:var(--amber); flex-shrink:0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>

<script>
const DATA = JSON.parse((() => { const xhr = new XMLHttpRequest(); xhr.open('GET', 'data.json', false); xhr.send(null); if (xhr.status !== 200 && xhr.status !== 0) throw new Error('Falha ao carregar data.json: HTTP ' + xhr.status); return xhr.responseText; })());
const MESES = DATA.mv.meses;
// Mês "atual" real (0-based, Jan=0), calculado no momento da geração do painel (não no load do
// navegador, pra ficar estável até a próxima publicação). Usado como teto padrão de exibição —
// desde a migração de 03/09/2026 as metas de todos os indicadores já vão até dezembro, mas o
// "realizado" só existe até o mês corrente; sem esse teto, as páginas abririam por padrão
// mostrando o acumulado do ANO INTEIRO (meta de dezembro) em vez do acumulado até hoje.
const MES_ATUAL_IDX = 8;

// ---------- Selo "Atualizado até" (calculado em tempo de render, direto do DATA — nunca fica desatualizado sozinho) ----------
// Compara o último mês disponível de um indicador com o mês mais avançado que existe em QUALQUER indicador do painel.
function ultimoMesGlobal() {
  let best = -1;
  for (const k of Object.keys(DATA)) {
    const d = DATA[k];
    if (d && Array.isArray(d.meses) && d.meses.length) {
      best = Math.max(best, MESES.indexOf(d.meses[d.meses.length - 1]));
    }
  }
  return best >= 0 ? best : MESES.length - 1;
}
// Capado por MES_ATUAL_IDX: sem isso, indicadores com meta pré-cadastrada até dezembro (migração
// de 03/09/2026) fariam esse "mais recente" saltar pra dezembro e todo o resto do painel passaria
// a se comparar contra dezembro, mostrando badge de atraso falso em tudo que só chega até o mês real.
const MES_MAIS_RECENTE_IDX = Math.min(ultimoMesGlobal(), MES_ATUAL_IDX);

function freshBadge(ultimoMes, opts = {}) {
  const idx = MESES.indexOf(ultimoMes);
  const atraso = MES_MAIS_RECENTE_IDX - idx;
  let cls = 'fresh-ok', texto = `Atualizado até ${ultimoMes}`;
  if (opts.snapshot) {
    cls = 'fresh-snapshot';
    texto = `Snapshot único — ${ultimoMes}`;
  } else if (atraso >= 2) {
    cls = 'fresh-stale';
    texto = `Atualizado até ${ultimoMes} — ${atraso} meses atrás do painel`;
  } else if (atraso === 1) {
    cls = 'fresh-warn';
    texto = `Atualizado até ${ultimoMes} — 1 mês atrás do painel`;
  }
  return `<div class="fresh-badge ${cls}">${texto}</div>`;
}

// ---------- Acompanhamento diário de metas mensais (pedido de Eduardo em 2026-09-03) ----------
// Metas de Operações são fixas por mês inteiro; sem isso, olhar o realizado no meio do mês
// contra a meta cheia sempre parece "atrasado" até o último dia. Mostra quanto já deveria ter
// sido feito até ontem, proporcional aos dias corridos do mês corrente (data real do navegador,
// não depende de atualizar MES_ATUAL_IDX à mão).
function diasCorridosAteOntem() {
  const hoje = new Date();
  const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
  const diasDecorridos = Math.max(0, hoje.getDate() - 1);
  return { diasNoMes, diaHoje: hoje.getDate(), diasDecorridos };
}
function metaMensalAjustada(metaMesCheia) {
  const { diasNoMes, diasDecorridos } = diasCorridosAteOntem();
  return diasNoMes ? (metaMesCheia * diasDecorridos / diasNoMes) : 0;
}
function bannerAcompanhamentoDiario(itens) {
  // itens: [{ label, meta, realizado, higherIsBetter=true }]
  const { diaHoje, diasNoMes, diasDecorridos } = diasCorridosAteOntem();
  let linhas = '';
  itens.forEach(it => {
    const higherIsBetter = it.higherIsBetter !== false;
    const metaAjustada = metaMensalAjustada(it.meta || 0);
    const diff = higherIsBetter ? ((it.realizado || 0) - metaAjustada) : (metaAjustada - (it.realizado || 0));
    const cls = diff >= 0 ? 'neg' : 'pos'; // neg=verde(bom), pos=vermelho(ruim) — mesma convenção já usada no painel
    const statusTxt = higherIsBetter
      ? (diff >= 0 ? 'em dia' : 'abaixo do esperado pro dia de hoje')
      : (diff >= 0 ? 'dentro do teto esperado até hoje' : 'já passou do teto esperado pro dia de hoje');
    const rotuloMeta = higherIsBetter ? 'meta ajustada até ontem' : 'teto ajustado até ontem';
    linhas += `<div>${it.label}: ${rotuloMeta} <b>${metaAjustada.toFixed(1)}</b> (de ${it.meta}/mês) &middot; realizado até agora <b>${it.realizado}</b> &middot; <span class="${cls}">${statusTxt}</span></div>`;
  });
  return `<div class="def-box" style="border-color:var(--amber);margin-bottom:14px">
    <b>📅 Acompanhamento diário</b> — hoje é dia ${diaHoje} de ${diasNoMes} do mês corrente (proporção já fechada: ${diasDecorridos}/${diasNoMes} dias).
    ${linhas}
    <span style="color:var(--muted);font-size:11px">Vale só pro mês em andamento — meses fechados no seletor abaixo continuam comparando com a meta cheia normalmente.</span>
  </div>`;
}

function kpiCard(label, val, isGoodWhenNegative=true) {
  let cls = 'kpi-neutral';
  if (typeof val === 'number') {
    cls = (val <= 0) === isGoodWhenNegative ? 'kpi-green' : 'kpi-red';
  }
  const display = typeof val === 'number' ? (val>0?'+':'') + val.toFixed(1) + '%' : val;
  return `<div class="kpi-card ${cls}"><div class="val">${display}</div><div class="lbl">${label}</div></div>`;
}

function normKey(s) {
  return (s||'').toString().toUpperCase()
    .normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]', 'g'), '');
}

const MUNICIPIOS_CANON = ['Águas Vermelhas','Araçuaí','Cachoeira de Pajeú','Comercinho','Coronel Murta',
  'Divisa Alegre','Itaobim','Itinga','Medina','Padre Paraíso','Pedra Azul','Ponto dos Volantes','Virgem da Lapa'];

function semaforoCell(cor, texto) {
  const map = {
    verde: {bg:'rgba(33,201,138,0.25)', fg:'#21c98a'},
    amarelo: {bg:'rgba(212,194,42,0.25)', fg:'#d4c22a'},
    vermelho: {bg:'rgba(230,72,79,0.25)', fg:'#e6484f'},
  };
  const c = map[cor];
  return `<td style="background:${c.bg};color:${c.fg};font-weight:600;text-align:center">${texto}</td>`;
}

// Indicadores "teto" (quanto menor o realizado, melhor) — tolerância de 20% acima da meta = amarelo
function statusTeto(realizado, meta) {
  if (!meta) return realizado > 0 ? 'vermelho' : 'verde';
  const v = ((realizado - meta) / meta) * 100;
  if (v <= 0) return 'verde';
  if (v <= 20) return 'amarelo';
  return 'vermelho';
}
// Indicadores "piso" (quanto maior o realizado, melhor) — abaixo de 80% da meta = vermelho
function statusPiso(realizado, meta) {
  if (!meta) return 'verde';
  const v = (realizado / meta) * 100;
  if (v >= 100) return 'verde';
  if (v >= 80) return 'amarelo';
  return 'vermelho';
}
// POG usa banda específica (meta = 100%, 95-105 verde, 90-95/105-110 amarelo, resto vermelho)
function statusPog(v) {
  if (v >= 95 && v <= 105) return 'verde';
  if ((v >= 90 && v < 95) || (v > 105 && v <= 110)) return 'amarelo';
  return 'vermelho';
}
// Índices de qualidade (IDOB/ITVD): >=95 verde, >=85 amarelo, resto vermelho
function statusQualidade(v) {
  if (v >= 95) return 'verde';
  if (v >= 85) return 'amarelo';
  return 'vermelho';
}

// Pontuação do ranking geral (Home)
function statusToPoints(status) { return status === 'verde' ? 2 : (status === 'amarelo' ? 1 : 0); }

// IMV/CVPe/CVPa: cumpriu = 3 pontos base; cada -10% de redução além da meta = +1; cada +10% fora da meta = -1
function scoreTeto(realizado, meta) {
  const v = meta ? ((realizado - meta) / meta) * 100 : (realizado > 0 ? 100 : 0);
  if (v <= 0) return 3 + Math.floor(-v / 10);
  return -Math.floor(v / 10);
}

function drawBarChart(canvasId, labels, values, color) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.clientWidth * 2;
  const H = canvas.height = 260 * 2;
  ctx.scale(1,1);
  ctx.clearRect(0,0,W,H);
  const max = Math.max(...values, 1);
  const n = labels.length;
  const barW = Math.min(56, (W - 40) / n * 0.58);
  const gap = (W-40) / n;
  ctx.font = '600 19px "IBM Plex Mono", monospace';
  values.forEach((v, i) => {
    const barH = (v / max) * (H - 80);
    const x = 20 + i*gap + (gap-barW)/2;
    const y = H - 60 - barH;
    const grad = ctx.createLinearGradient(0, y, 0, H-60);
    grad.addColorStop(0, color);
    grad.addColorStop(1, color + '55');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, barW, barH);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, barW, barH);
    ctx.fillStyle = '#eaf1f8';
    ctx.textAlign = 'center';
    ctx.fillText(v, x + barW/2, y - 8);
    ctx.save();
    ctx.translate(x + barW/2, H - 40);
    ctx.rotate(-Math.PI/8);
    ctx.font = '13px "IBM Plex Mono", monospace';
    ctx.fillStyle = '#7891a8';
    ctx.textAlign = 'right';
    const lbl = (labels[i]||'').toString().slice(0, 22);
    ctx.fillText(lbl, 0, 0);
    ctx.restore();
  });
}

function renderIndicatorPage(key, title, localKey, faixaKey, higherIsBetter=false, showDailyBanner=false) {
  const d = DATA[key];
  const mesesLocais = d.meses || MESES.slice(0, d.total_mes.length);
  let monthIdx = Math.min(MES_ATUAL_IDX, mesesLocais.length - 1); // mês mais recente disponível pra esse indicador, capado no mês atual real
  const showCharts = !!(localKey && faixaKey && DATA[localKey] && DATA[faixaKey]);

  function fmtPctPolarity(v) {
    const good = higherIsBetter ? v >= 0 : v <= 0;
    const cls = good ? 'neg' : 'pos'; // 'neg' = verde, 'pos' = vermelho (ver fmtPct/kpiCard)
    const sign = v > 0 ? '+' : '';
    return `<span class="${cls}">${sign}${v.toFixed(1)}%</span>`;
  }

  function table(mi) {
    let rows = '';
    d.municipios.forEach(m => {
      const realMes = m.realizado_mes[mi];
      const metaMes = m.meta_mes[mi];
      const realAcum = m.realizado_acum[mi];
      const metaAcum = m.meta_acum[mi];
      const pctAcum = pct(realAcum, metaAcum);
      const saldo = metaAcum - realAcum;
      rows += `<tr>
        <td style="text-align:left">${m.nome}</td>
        <td>${realMes}</td>
        <td>${metaMes}</td>
        <td class="col-divider">${realAcum}</td>
        <td>${metaAcum}</td>
        <td>${fmtPctPolarity(pctAcum)}</td>
        <td>${saldo}</td>
      </tr>`;
    });
    const totRealAcum = d.total_acum[mi], totMetaAcum = d.total_meta_acum[mi];
    const totPct = pct(totRealAcum, totMetaAcum);
    rows += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)">
        <td style="text-align:left">TOTAL</td>
        <td>${d.total_mes[mi]}</td>
        <td>${d.total_meta_mes[mi]}</td>
        <td class="col-divider">${totRealAcum}</td>
        <td>${totMetaAcum}</td>
        <td>${fmtPctPolarity(totPct)}</td>
        <td>${totMetaAcum-totRealAcum}</td>
      </tr>`;
    return rows;
  }

  let html = `<div class="page-title">${title}</div>`;
  html += freshBadge(mesesLocais[monthIdx]);
  html += sigopButton(key);
  if (DEFS[key]) html += `<div class="def-box">${DEFS[key]}</div>`;
  if (showDailyBanner) {
    html += bannerAcompanhamentoDiario([{ label: title, meta: d.total_meta_mes[MES_ATUAL_IDX], realizado: d.total_mes[MES_ATUAL_IDX], higherIsBetter }]);
  }
  html += `<select class="month-select" id="monthSel">`;
  mesesLocais.forEach((m,i) => html += `<option value="${i}" ${i===monthIdx?'selected':''}>${m}</option>`);
  html += `</select>`;
  html += `<table class="data-table" id="dataTable"><thead><tr>
    <th style="text-align:left">Município</th><th>Realizado Mês</th><th>Meta Mês</th>
    <th class="col-divider">Realizado Acum</th><th>Meta Acum</th><th>% vs Meta (Acum)</th><th>Saldo</th>
  </tr></thead><tbody>${table(monthIdx)}</tbody></table>`;
  if (showCharts) {
    const labelLocal = key === 'furto' ? 'Causa' : 'Local Imediato';
    const labelFaixa = key === 'furto' ? 'Logradouro' : 'Faixa Horária';
    html += `<div class="charts-row">
      <div class="chart-box"><h3>${labelLocal}</h3><canvas id="chartLocal" style="width:100%;height:260px"></canvas></div>
      <div class="chart-box"><h3>${labelFaixa}</h3><canvas id="chartFaixa" style="width:100%;height:260px"></canvas></div>
    </div>`;
  }
  const detCfg = DETALHADO_CONFIG[key];
  if (detCfg && DATA[detCfg.dataKey]) {
    html += detalhadoPorNaturezaHtml(DATA[detCfg.dataKey], detCfg.titulo, detCfg.colunas, detCfg.defHtml, detCfg.fonteHtml);
  }
  document.getElementById('main').innerHTML = html;

  document.getElementById('monthSel').addEventListener('change', (e) => {
    document.querySelector('#dataTable tbody').innerHTML = table(parseInt(e.target.value));
  });

  if (showCharts) {
    const localData = DATA[localKey].slice(0, 10);
    const faixaData = DATA[faixaKey].slice(0, 10);
    drawBarChart('chartLocal', localData.map(x=>x[0]), localData.map(x=>x[1]), '#e8a83c');
    drawBarChart('chartFaixa', faixaData.map(x=>x[0]), faixaData.map(x=>x[1]), '#21c98a');
  }
}

function pogBandColor(v) {
  // Meta = 100%. Faixa 95-105 = verde, 90-95/105-110 = amarelo, fora disso = vermelho.
  if (v >= 95 && v <= 105) return { bg: 'rgba(33,201,138,0.22)', fg: '#21c98a' };
  if ((v >= 90 && v < 95) || (v > 105 && v <= 110)) return { bg: 'rgba(212,194,42,0.22)', fg: '#d4c22a' };
  return { bg: 'rgba(230,72,79,0.22)', fg: '#e6484f' };
}
function pogCell(v) {
  const c = pogBandColor(v);
  return `<td style="background:${c.bg};color:${c.fg};font-weight:600">${v.toFixed(2)}%</td>`;
}

      </tr>`;

    let miBm = Math.min(MES_ATUAL_IDX, bmMesesLocais.length - 1);
    html += `<div class="page-title" style="margin-top:28px;font-size:1.1em">Meta de Operações Boemia do Batalhão</div>`;
    html += `<div class="def-box">Métrica DIFERENTE do IDOB acima (que mede qualidade/vítimas em %). Aqui é contagem simples de operações Boemia realizadas × meta fixa por tipo de fração, mesma régua já usada em Cavalo de Aço/Visibilidade: <b>1 operação/mês por Destacamento, 2/mês por sede de Pelotão, 3/mês por sede de Companhia</b> (recorrente todo mês, não meta anual). Meta total do 70º BPM: 23 operações/mês. Fonte do "Realizado": mesmo dado de Qtde de Operações Boemia usado no IDOB (export da pasta entrada/IDOB/, filtro NOME_OPERACAO contém "BOEMIA").</div>`;
    html += bannerAcompanhamentoDiario([{ label: 'Operações Boemia (Batalhão)', meta: bm.total_meta_mes[MES_ATUAL_IDX], realizado: bm.total_mes[MES_ATUAL_IDX] }]);
    html += `<select class="month-select" id="boemiaMetaMonthSel">`;
    bmMesesLocais.forEach((m,i) => html += `<option value="${i}" ${i===miBm?'selected':''}>${m}</option>`);
    html += `</select>`;
    html += `<table class="data-table" id="boemiaMetaTable"><thead><tr>
      <th style="text-align:left" rowspan="2">Município</th>
      <th colspan="3">${bmMesesLocais[miBm]}</th><th colspan="3">Acumulado</th>
    </tr><tr>
      <th>Meta</th><th>Realizado</th><th>Status</th>
      <th>Meta</th><th>Realizado</th><th>% Cumprido</th>
    </tr></thead><tbody>${bmRows(miBm)}</tbody></table>`;
    html += `<div class="updated">Meta recorrente mensal por fração (não é meta anual dividida). Cia-sede: Araçuaí, Itaobim, Pedra Azul (3/mês). Pelotão-sede: Itinga, Medina, Padre Paraíso, Divisa Alegre (2/mês). Destacamento: Coronel Murta, Virgem da Lapa, Ponto dos Volantes, Comercinho, Cachoeira de Pajeú, Águas Vermelhas (1/mês). Definida por Eduardo em 2026-08-27.</div>`;

  document.getElementById('main').innerHTML = html;
  document.getElementById('idobMonthSel').addEventListener('change', (e) => {
    document.querySelector('#idobTable tbody').innerHTML = rows(parseInt(e.target.value));

  if (bm) {

    if (bmSel) bmSel.addEventListener('change', (e) => {
      document.querySelector('#boemiaMetaTable tbody').innerHTML = bmRows(parseInt(e.target.value));
    });
  }
}

function renderITVDPage() {
  const d = DATA.itvd;
  const mesesLocais = d.meses || MESES.slice(0, d.total_trafico_mes.length);
  let mi = Math.min(MES_ATUAL_IDX, mesesLocais.length - 1);

  function calcItvd(t, v) {
    if (!t) return 100;
    return ((t - v*2) / t) * 100;
  }

  function rows(mi) {
    let html = '';
    const list = d.municipios.map(m => ({
      nome: m.nome,
      tMes: m.trafico_mes[mi], vMes: m.vit_mes[mi], iMes: calcItvd(m.trafico_mes[mi], m.vit_mes[mi]),
      tAcum: m.trafico_acum[mi], vAcum: m.vit_acum[mi], iAcum: calcItvd(m.trafico_acum[mi], m.vit_acum[mi]),
    }));
    const cell = (v) => `<td style="background:${idobColor(v)};color:${idobTextColor(v)};font-weight:600">${v.toFixed(1)}</td>`;
    list.forEach(x => {
      html += `<tr><td style="text-align:left">${x.nome}</td>
        <td>${x.tMes}</td><td>${x.vMes}</td>${cell(x.iMes)}
        <td class="col-divider">${x.tAcum}</td><td>${x.vAcum}</td>${cell(x.iAcum)}
      </tr>`;
    });
    const tTMes=d.total_trafico_mes[mi], tVMes=d.total_vit_mes[mi], tTAcum=d.total_trafico_acum[mi], tVAcum=d.total_vit_acum[mi];
    html += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)"><td style="text-align:left">70º BPM</td>
      <td>${tTMes}</td><td>${tVMes}</td>${cell(calcItvd(tTMes,tVMes))}
      <td class="col-divider">${tTAcum}</td><td>${tVAcum}</td>${cell(calcItvd(tTAcum,tVAcum))}
    </tr>`;
    return html;
  }

  let html = `<div class="page-title">Indicador de Combate ao Tráfico e Violência Relacionada às Drogas (ITVD) em ${mesesLocais[mi]} de 2026</div>`;
  html += `<div class="def-box"><span class="formula">ITVD = [Total de REDS Tráfico e Uso &minus; (REDS de MV + CVPe + CVPa) &times; 2] &divide; Total de REDS Tráfico e Uso &times; 100</span><span class="polarity">Polaridade: quanto maior (%), melhor &mdash; valores positivos indicam impacto preventivo, negativos mostram que houve mais crimes, exigindo ajuste no esforço policial. Sem REDS de Tráfico/Uso no período = 100% (sem problema a resolver, positivo).</span></div>`;
  html += `<select class="month-select" id="itvdMonthSel">`;
  mesesLocais.forEach((m,i) => html += `<option value="${i}" ${i===mi?'selected':''}>${m}</option>`);
  html += `</select>`;
  html += `<table class="data-table" id="itvdTable"><thead><tr>
    <th style="text-align:left">Município</th><th>REDS Tráfico/Uso (Mês)</th><th>Vítimas MV+CVPe+CVPa (Mês)</th><th>ITVD (Mês)</th>
    <th class="col-divider">REDS Tráfico/Uso (Acum)</th><th>Vítimas (Acum)</th><th>ITVD (Acum)</th>
  </tr></thead><tbody>${rows(mi)}</tbody></table>`;
  html += `<div class="updated">Fonte: export REDS geral (7.965 registros), naturezas I04033 (tráfico), I04028 (uso) e I99000, cruzado com as vítimas de MV/CVPE/CVPA de toda a cidade (não restrito a local específico).</div>`;
  document.getElementById('main').innerHTML = html;
  document.getElementById('itvdMonthSel').addEventListener('change', (e) => {
    document.querySelector('#itvdTable tbody').innerHTML = rows(parseInt(e.target.value));
  });
}

function renderCavaloAcoPage() {
  const d = DATA.cavaloaco;
  const mesesLocais = d.meses || MESES.slice(0, d.total_mes.length);
  let mi = Math.min(MES_ATUAL_IDX, mesesLocais.length - 1);

  function monthCell(cumpriu) {
    return cumpriu
      ? `<td style="background:rgba(33,201,138,0.22);color:#21c98a;font-weight:600">CUMPRIU</td>`
      : `<td style="background:rgba(230,72,79,0.22);color:#e6484f;font-weight:600">NÃO CUMPRIU</td>`;
  }

  function rows(mi) {
    let html = '';
    d.municipios.forEach(m => {
      const rMes=m.realizado_mes[mi], mMes=m.meta_mes[mi], rAc=m.realizado_acum[mi], mAc=m.meta_acum[mi];
      const dAc = mAc ? (rAc/mAc*100) : 100;
      const cls = dAc>=100?'neg':'pos';
      const cumpriuMes = mMes ? (rMes >= mMes) : true;
      html += `<tr><td style="text-align:left">${m.nome}</td>
        <td>${mMes}</td><td>${rMes}</td>${monthCell(cumpriuMes)}
        <td class="col-divider">${mAc}</td><td>${rAc}</td><td><span class="${cls}">${dAc.toFixed(0)}%</span></td>
      </tr>`;
    });
    const tRMes=d.total_mes[mi], tMMes=d.total_meta_mes[mi], tRAc=d.total_acum[mi], tMAc=d.total_meta_acum[mi];
    const tDAc = tMAc? tRAc/tMAc*100:100;
    const tCumpriuMes = tMMes ? (tRMes >= tMMes) : true;
    html += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)"><td style="text-align:left">70º BPM</td>
      <td>${tMMes}</td><td>${tRMes}</td>${monthCell(tCumpriuMes)}
      <td class="col-divider">${tMAc}</td><td>${tRAc}</td><td><span class="${tDAc>=100?'neg':'pos'}">${tDAc.toFixed(0)}%</span></td>
    </tr>`;
    return html;
  }

  // ---------- Eficácia e Eficiência (produtividade extraída do RAT) ----------
  const ef = DATA.cavaloaco_eficacia;
  const efMesesLocais = ef ? ef.meses : mesesLocais;

  function efSum(arr, mi, acum) {
    return acum ? arr.slice(0, mi + 1).reduce((a, b) => a + b, 0) : arr[mi];
  }
  function efPct(num, den) { return den > 0 ? (num / den * 100) : 0; }

  function efKpis(mi) {
    const ops = ef.municipios.reduce((s, m) => s + efSum(m.num_ops, mi, true), 0);
    const motosFisc = ef.municipios.reduce((s, m) => s + efSum(m.motos_fisc, mi, true), 0);
    const motosAutu = ef.municipios.reduce((s, m) => s + efSum(m.motos_autu, mi, true), 0);
    const veicRetidos = ef.municipios.reduce((s, m) => s + efSum(m.veic_retidos, mi, true), 0);
    const inabilitados = ef.municipios.reduce((s, m) => s + efSum(m.inabilitados, mi, true), 0);
    const redsGerado = ef.municipios.reduce((s, m) => s + efSum(m.reds_gerado, mi, true), 0);
    const efetivoSum = ef.municipios.reduce((s, m) => s + efSum(m.efetivo_sum, mi, true), 0);
    const taxaAutuacao = efPct(motosAutu, motosFisc);
    const taxaReds = efPct(redsGerado, ops);
    const motosPorOp = ops > 0 ? (motosFisc / ops) : 0;
    const efetivoMedio = ops > 0 ? (efetivoSum / ops) : 0;

    let h = `<div class="kpi-grid">`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${motosFisc.toLocaleString('pt-BR')}</div><div class="lbl">Motos Fiscalizadas</div></div>`;
    h += `<div class="kpi-card kpi-green"><div class="val">${taxaAutuacao.toFixed(1)}%</div><div class="lbl">Taxa de Autuação (${motosAutu}/${motosFisc})</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${veicRetidos}</div><div class="lbl">Veículos Retidos por Infração</div></div>`;
    h += `<div class="kpi-card ${redsGerado > 0 ? 'kpi-green' : 'kpi-neutral'}"><div class="val">${redsGerado}</div><div class="lbl">REDS Gerados (${taxaReds.toFixed(1)}% das op.)</div></div>`;
    h += `</div>`;
    h += `<div class="kpi-grid">`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${efetivoMedio.toFixed(1)}</div><div class="lbl">Efetivo Médio/Operação</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${motosPorOp.toFixed(1)}</div><div class="lbl">Motos Fiscalizadas/Operação</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${inabilitados}</div><div class="lbl">Inabilitados Autuados</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${ops.toLocaleString('pt-BR')}</div><div class="lbl">Total de Operações (RAT)</div></div>`;
    h += `</div>`;
    return h;
  }

  function efRows(mi) {
    let h = '';
    ef.municipios.forEach(m => {
      const ops = efSum(m.num_ops, mi, true), motosFisc = efSum(m.motos_fisc, mi, true), motosAutu = efSum(m.motos_autu, mi, true);
      const veicFisc = efSum(m.veic_fisc, mi, true), veicRet = efSum(m.veic_retidos, mi, true), redsGer = efSum(m.reds_gerado, mi, true);
      const efetivo = efSum(m.efetivo_sum, mi, true);
      const taxa = efPct(motosAutu, motosFisc);
      const efetivoMedio = ops > 0 ? (efetivo / ops) : 0;
      const tempoMed = m.tempo_mediana_min[mi] || 0;
      h += `<tr><td style="text-align:left">${m.nome}</td>
        <td>${ops}</td><td>${motosFisc}</td><td>${motosAutu}</td><td>${taxa.toFixed(1)}%</td>
        <td class="col-divider">${veicFisc}</td><td>${veicRet}</td>
        <td class="col-divider">${redsGer}</td><td>${efetivoMedio.toFixed(1)}</td><td>${tempoMed}</td>
      </tr>`;
    });
    return h;
  }

  let natRows = '';
  (ef.naturezas_reds_geradas || []).slice(0, 12).forEach(n => {
    natRows += `<tr><td style="text-align:left"><code>${n.codigo}</code></td><td style="text-align:left">${n.descricao}</td><td>${n.qtd}</td></tr>`;
  });

  let html = `<div class="page-title">Operação Cavalo de Aço em ${mesesLocais[mi]} de 2026</div>`;
  html += `<div class="def-box">${DEFS.cavaloaco}</div>`;
  html += bannerAcompanhamentoDiario([{ label: 'Cavalo de Aço (Batalhão)', meta: d.total_meta_mes[MES_ATUAL_IDX], realizado: d.total_mes[MES_ATUAL_IDX] }]);
  html += `<select class="month-select" id="cavaloacoMonthSel">`;
  mesesLocais.forEach((m,i) => html += `<option value="${i}" ${i===mi?'selected':''}>${m}</option>`);
  html += `</select>`;
  html += `<table class="data-table" id="cavaloacoTable"><thead><tr>
    <th style="text-align:left">Município</th><th>Meta Op. Mês</th><th>Op. Mês</th><th>Cumpriu Mês?</th>
    <th class="col-divider">Meta Op. Acum</th><th>Op. Acum</th><th>Desemp.</th>
  </tr></thead><tbody>${rows(mi)}</tbody></table>`;
  html += `<div class="updated">Fonte: export REDS (Natureza=Y01003 E Histórico contém "Cavalo de Aço" E Unidade Responsável=70 BPM), ${d.total_acum[d.total_acum.length-1]} operações jan-ago/2026 (filtro atualizado em 2026-08-11 — antes não exigia o Histórico, o que contava toda operação Y01003, não só as de Cavalo de Aço). Op. = nº de REDS; Motos Abordadas = soma do indicador "Qde de motocicletas fiscalizadas" de cada RAT (fonte separada, não tocada por essa mudança). Falta confirmar os códigos exatos dos componentes de recuperação de veículo/prisão/arma/drogas/clonagem pra fechar o indicador IDOCA completo (fórmula ainda pendente de validação).</div>`;

  if (ef) {
    html += `<div class="page-title" style="margin-top:34px;font-size:16px">Eficácia e Eficiência (Acumulado até ${mesesLocais[mi]})</div>`;
    html += `<div class="def-box">Extraído do campo <code>PRODUTIVIDADE</code> de cada RAT de Cavalo de Aço (indicadores lançados pela guarnição na hora de fechar o registro) e do campo <code>REDS_RELACIONADOS</code> (quando a fiscalização gera um REDS à parte — clonagem, drogas, arma, foragido etc.). <b>Eficácia</b> = o que a fiscalização efetivamente produz (autuações, retenções, REDS gerados). <b>Eficiência</b> = quanto recurso (efetivo, tempo) foi empregado pra produzir isso. Contagem de operações aqui vem do RAT (NOME_OPERACAO contém "CAVALO"), levemente diferente do nº oficial de operações (que vem do REDS com Histórico) — números próximos mas não idênticos, tratar como uma lente complementar, não substituta.</div>`;
    html += `<div id="cavaloacoEfKpis">${efKpis(mi)}</div>`;
    html += `<table class="data-table" id="cavaloacoEfTable"><thead><tr>
      <th style="text-align:left">Município</th><th>Op. (RAT)</th><th>Motos Fisc.</th><th>Motos Autu.</th><th>Taxa Autu.</th>
      <th class="col-divider">Veíc. Fisc.</th><th>Veíc. Retidos</th>
      <th class="col-divider">REDS Gerados</th><th>Efetivo Méd.</th><th>Tempo Med.(min)</th>
    </tr></thead><tbody>${efRows(mi)}</tbody></table>`;
    if (natRows) {
      html += `<div class="page-title" style="margin-top:24px;font-size:14px">Naturezas dos REDS Gerados a partir da Fiscalização (70º BPM, ano)</div>`;
      html += `<table class="data-table"><thead><tr><th style="text-align:left">Código</th><th style="text-align:left">Natureza</th><th>Qtde</th></tr></thead><tbody>${natRows}</tbody></table>`;
    }
    html += `<div class="updated">Tempo mediano exclui registros com OPR_TEMPO_TOTAL_MINUTOS &gt; 480 (RATs provavelmente esquecidos abertos — outlier de digitação, não representa a duração real da operação). ${ef.fonte}.</div>`;
  }

  document.getElementById('main').innerHTML = html;
  document.getElementById('cavaloacoMonthSel').addEventListener('change', (e) => {
    const mi2 = parseInt(e.target.value);
    document.querySelector('#cavaloacoTable tbody').innerHTML = rows(mi2);
    if (ef) {
      document.getElementById('cavaloacoEfKpis').innerHTML = efKpis(mi2);
      document.querySelector('#cavaloacoEfTable tbody').innerHTML = efRows(mi2);
    }
  });
}

function desColor(reds, prisoes) {
  const des = reds > 0 ? (prisoes / reds) * 100 : 100;
  if (des >= 50) return { bg: 'rgba(33,201,138,0.22)', fg: '#21c98a' };
  if (des >= 25) return { bg: 'rgba(240,190,50,0.22)', fg: '#e6b400' };
  return { bg: 'rgba(230,72,79,0.22)', fg: '#e6484f' };
}

function gravBadge(g) {
  const map = {
    critica: { bg: '#c0392b', label: 'CRÍTICA' },
    alta: { bg: '#d2691e', label: 'ALTA' },
    media: { bg: '#b8860b', label: 'MÉDIA' },

function rankColor(idx, total) {
  const t = total > 1 ? idx / (total - 1) : 0;
  const hue = 120 - 120 * t; // 120=verde ... 0=vermelho
  return `hsl(${hue}, 65%, 42%)`;
}
function fmtBr(n, dec) {
  return n.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function severityBadge(sev) {
  const map = {
    'CRÍTICO': '#c0392b',
    'RUIM': '#d2691e',
    'BAIXO': '#b8860b',
    'ATENÇÃO': '#c9a227',
  };
  const bg = map[sev] || '#666';
  return `<span style="background:${bg};color:#fff;font-weight:700;font-size:10px;letter-spacing:0.04em;padding:4px 10px;border-radius:3px;text-transform:uppercase;white-space:nowrap">${sev}</span>`;
}

function findMuniIdx(municipios, nome) {
  const nk = normKey(nome);
  for (let i = 0; i < municipios.length; i++) {
    if (normKey(municipios[i].nome) === nk) return i;
  }
  return -1;
}

// Detecta problemas de um município num dado mi (índice acumulado).
// Regras por categoria de indicador — cada categoria tem um "teto" de severidade:
//  - Resultado (MV/CVPe/CVPa/Furto, quanto menor melhor): CRÍTICO/RUIM, conforme % acima da meta acumulada
//  - Esforço/Operacional (Prisões de Furto, Armas): teto BAIXO
//  - Interação/Ranking importado (VCP/MRPP/RC/VTCV/VT) e IDOB: teto ATENÇÃO
function issuesForMunicipio(nome, mi) {
  const issues = [];
  const nk = normKey(nome);

  [['mv','MV'], ['cvpe','CVPE'], ['cvpa','CVPA'], ['furto','Furto Rural']].forEach(([key, label]) => {
    const d = DATA[key];
    if (!d) return;
    const idx = findMuniIdx(d.municipios, nome);
    if (idx < 0) return;
    const m = d.municipios[idx];
    const meta = m.meta_acum[mi], real = m.realizado_acum[mi];
    if (real <= 0) return;
    const p = pct(real, meta);
    if (p >= 50) {
      const sev = p >= 150 ? 'CRÍTICO' : 'RUIM';
      const sinal = p >= 0 ? '+' : '';
      issues.push({ indicador: `${label} (Resultado)`, severidade: sev, ordem: sev === 'CRÍTICO' ? 0 : 1,
        detalhe: `Meta ${meta} &rarr; Res ${real} (${sinal}${p.toFixed(0)}%)` });
    }
  });

  {
    const idx = findMuniIdx(DATA.esforco_furto.municipios, nome);
    if (idx >= 0) {
      const m = DATA.esforco_furto.municipios[idx];
      const reds = m.reds_acum[mi], prisoes = m.prisoes_acum[mi];
      if (reds > 0) {
        const des = prisoes / reds * 100;
        if (des < 25) {
          issues.push({ indicador: 'Prisões de autores de Furto', severidade: 'BAIXO', ordem: 2,
            detalhe: `${reds} REDS / ${prisoes} prisões = ${des.toFixed(1)}%` });
        }
      }
    }
  }

  {
    const arr = DATA.armas.municipios;
    const idx = findMuniIdx(arr, nome);
    if (idx >= 0) {
      const m = arr[idx];
      const meta = m.meta_acum[mi], real = m.realizado_acum[mi];
      const atingimento = meta ? (real / meta * 100) : (real > 0 ? 100 : 0);
      if (atingimento < 50) {
        const ranked = arr.map((x, i) => ({ i, v: x.realizado_acum[mi] })).sort((a, b) => b.v - a.v);
        const posicao = ranked.findIndex(x => x.i === idx) + 1;
        issues.push({ indicador: 'Apreensão de Armas', severidade: 'BAIXO', ordem: 2,
          detalhe: `Ranking ${posicao}º (${atingimento.toFixed(0)}%)` });
      }
    }
  }

  [['vcp','VCP (Interação)'], ['mrpp','MRPP'], ['rc','RC (Reuniões)'], ['vtcv','VTCV'], ['vt','VT (Furto)']].forEach(([key, label]) => {
    const d = DATA[key];
    if (!d || !d.rows) return;
    const n = d.rows.length;
    const posicao = d.rows.findIndex(r => normKey(r.nome) === nk) + 1;
    if (posicao > 0 && posicao > n - 4) {
      const detalhe = posicao === n ? 'Ranking (última posição)' : `Ranking ${posicao}º/${n}`;
      issues.push({ indicador: label, severidade: 'ATENÇÃO', ordem: 3, detalhe });
    }
  });

  {
    const idx = findMuniIdx(DATA.idob.municipios, nome);
    if (idx >= 0) {
      const m = DATA.idob.municipios[idx];
      const mv = m.mv_acum[mi], cvpe = m.cvpe_acum[mi], cvpa = m.cvpa_acum[mi], qop = m.qop_acum[mi];
      const idobPct = qop ? ((qop - (mv + cvpe + cvpa) * 10) / qop * 100) : 0;
      if (mv > 0) {
        issues.push({ indicador: 'IDOB (Boemia)', severidade: 'ATENÇÃO', ordem: 3,
          detalhe: `${idobPct.toFixed(1)}% acumulado (${mv} MV registrada${mv > 1 ? 's' : ''})` });
      }
    }
  }

  return issues;
}

function renderAnaliseCiaBloco(ciaNome, mi) {
  const municipios = CIA_MAP[ciaNome];
  let allIssues = [];
  municipios.forEach(nome => {
    issuesForMunicipio(nome, mi).forEach(iss => allIssues.push(Object.assign({ municipio: nome }, iss)));
  });
  allIssues.sort((a, b) => a.ordem - b.ordem);

  let html = `<div style="margin-top:10px">`;
  html += `<div style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono)">Análise por Companhia</div>`;
  html += `<div style="font-size:24px;font-weight:800;margin:4px 0 16px">${ciaNome}</div>`;

  if (allIssues.length === 0) {
    html += `<div class="pending-box">Nenhum problema relevante identificado nesta companhia no período.</div>`;
  } else {
    html += `<div style="display:flex;flex-direction:column;border-radius:6px;overflow:hidden;border:1px solid var(--panel-border)">`;
    allIssues.forEach(iss => {
      html += `<div style="display:flex;align-items:center;gap:16px;background:var(--panel);padding:12px 16px;border-bottom:1px solid var(--panel-border)">
        <div style="width:200px;font-weight:600;flex-shrink:0">${iss.indicador}</div>
        <div style="width:150px;color:var(--muted);flex-shrink:0">${iss.municipio}</div>
        <div style="width:90px;flex-shrink:0">${severityBadge(iss.severidade)}</div>
        <div style="flex:1;color:var(--muted);font-size:12.5px">${iss.detalhe}</div>
      </div>`;
    });
    html += `</div>`;

    const porMuni = {};
    allIssues.forEach(iss => {
      (porMuni[iss.municipio] = porMuni[iss.municipio] || []).push(iss);
    });
    let pior = null, piorScore = -1;
    Object.keys(porMuni).forEach(m => {
      const score = porMuni[m].reduce((s, i) => s + (4 - i.ordem), 0);
      if (score > piorScore) { piorScore = score; pior = m; }
    });
    if (pior) {
      const lista = porMuni[pior];
      const principal = lista[0];
      const outros = lista.slice(1).map(i => i.indicador);
      let texto = `<b>${pior}</b> é o principal vetor de problemas da ${ciaNome} (${principal.indicador.toLowerCase()}: ${principal.detalhe})`;
      texto += outros.length ? ` e apresenta baixo desempenho também em ${outros.join(', ')}.` : `.`;
      html += `<div style="background:#12161c;border:1px solid var(--panel-border);border-radius:6px;padding:16px 20px;margin-top:16px">
        <div style="color:var(--amber);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Destaque Crítico</div>
        <div style="color:var(--text);font-size:13px;line-height:1.6">${texto}</div>
      </div>`;
    }
  }
  html += `</div>`;
  return html;
}

function renderApresentacaoGdoPage() {
  const y1 = DATA.ppag.y15001, y2 = DATA.ppag.y07012, y3 = DATA.ppag.y07014;
  const mesesLocais = y1.meses || MESES.slice(0, y1.total_mes.length);
  let mi = Math.min(MES_ATUAL_IDX, mesesLocais.length - 1);

  function idxOf(municipios) {
    const map = {};
    municipios.forEach((m, i) => map[normKey(m.nome)] = i);
    return map;
  }

  function slide(mi) {
    const idx2 = idxOf(y2.municipios), idx3 = idxOf(y3.municipios);
    let rows = '';
    y1.municipios.forEach(m1 => {
      const m2 = y2.municipios[idx2[normKey(m1.nome)]];
      const m3 = y3.municipios[idx3[normKey(m1.nome)]];
      const bloco = (m) => {
        const meta = m.meta_mes[mi], res = m.realizado_mes[mi];
        const des = meta ? (res/meta*100) : (res>0?100:100);
        return `<td>${meta}</td><td>${res}</td>${pogCell(des)}`;
      };
      rows += `<tr style="background:rgba(90,180,220,0.18)">
        <td style="text-align:left;font-weight:700">${m1.nome}</td>
        ${bloco(m1)}${bloco(m2)}${bloco(m3)}
      </tr>`;
    });
    const totBloco = (d) => {
      const meta = d.total_meta_mes[mi], res = d.total_mes[mi];
      const des = meta ? (res/meta*100) : 100;
      return `<td>${meta}</td><td>${res}</td>${pogCell(des)}`;
    };
    rows += `<tr style="font-weight:700;background:rgba(255,255,255,0.1)">
      <td style="text-align:left">70º BPM</td>
      ${totBloco(y1)}${totBloco(y2)}${totBloco(y3)}
    </tr>`;
    return rows;
  }

  let html = `<div class="page-title" style="color:var(--amber)">Policiamento de Proximidade | Dados de ${mesesLocais[mi]}</div>`;
  html += `<div class="def-box">Quadro-resumo de apresentação (estilo GDO) com as 3 metas do Policiamento de Proximidade: Y15001 (Patrulha Escolar/Prevenção às Drogas), Y07012 (Prevenção à Violência Doméstica), Y07014 (Ação/Operação em Zona Rural).</div>`;
  html += `<select class="month-select" id="apresGdoMonthSel">`;
  mesesLocais.forEach((m,i) => html += `<option value="${i}" ${i===mi?'selected':''}>${m}</option>`);
  html += `</select>`;
  html += `<table class="data-table" id="apresGdoTable"><thead><tr>
    <th style="text-align:left" rowspan="2">Município</th>
    <th colspan="3">Meta Y15001</th><th colspan="3">Meta Y07012</th><th colspan="3">Meta Y07014</th>
  </tr><tr>
    <th>Meta</th><th>Res.</th><th>Des.</th>
    <th>Meta</th><th>Res.</th><th>Des.</th>
    <th>Meta</th><th>Res.</th><th>Des.</th>
  </tr></thead><tbody>${slide(mi)}</tbody></table>`;
  html += `<div class="def-box" style="margin-top:16px;font-size:11.5px">
    Y15001 - Patrulha Escolar/Patrulha de Prevenção às Drogas;<br>
    Y07012 - Operação de Prevenção a Violência Doméstica;<br>
    Y07014 - Ação/Operação em Zonal Rural;
  </div>`;

  const mesesMv = DATA.mv.meses || MESES;
  let miAnalise = mesesMv.indexOf('Julho');
  if (miAnalise < 0) miAnalise = Math.min(MES_ATUAL_IDX, DATA.mv.total_acum.length - 1);
  const cias = Object.keys(CIA_MAP);
  let ciaAtiva = cias[0];

  html += `<div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:10px">GDO Jan-${mesesMv[miAnalise]}/2026</div>`;
  html += `<div class="nav-scroll" style="display:flex;gap:8px;margin-bottom:6px" id="ciaTabs">`;
  cias.forEach((c, i) => {
    html += `<button class="nav-btn cia-tab${i===0?' active':''}" data-cia="${c}" style="width:auto;padding:8px 18px">${c}</button>`;
  });
  html += `</div>`;
  html += `<div id="ciaBlocoContainer">${renderAnaliseCiaBloco(ciaAtiva, miAnalise)}</div>`;
  html += `</div>`;

  document.getElementById('main').innerHTML = html;
  document.getElementById('apresGdoMonthSel').addEventListener('change', (e) => {
    document.querySelector('#apresGdoTable tbody').innerHTML = slide(parseInt(e.target.value));

      btn.classList.add('active');
      document.getElementById('ciaBlocoContainer').innerHTML = renderAnaliseCiaBloco(btn.dataset.cia, miAnalise);
    });
  });

// ============ Painel de Auditoria (pedido de Eduardo em 2026-09-03) ============
// Reúne, por município, o que está "em vermelho" a partir de Setembro/2026:
// - Violência Doméstica: casos com mais de 72h desde o fato e ainda não estabilizados
//   (sem visita registrada = "nenhuma informação/BO carregado"; status != estabilizada =
//   "sem solução final"). Reaproveita o mesmo semáforo (ppvdSemaforoVD) já usado na página
//   de Violência Doméstica, só que aqui somando o critério de prazo de 72h.
// - MV/CVPE/CVPa: contagem do mês corrente por município. Endereço por ocorrência ainda não
//   existe nesse nível de detalhe pra esses três indicadores (só existe agregado do batalhão
//   inteiro por tipo de local) — ver aviso na própria página.
function auditoriaHorasDesde(dataBr) {
  const iso = ppvdToIso(dataBr);
  if (!iso) return null;
  const dt = new Date(iso + 'T00:00:00');
  if (isNaN(dt.getTime())) return null;
  return (Date.now() - dt.getTime()) / 3600000;
}

function auditoriaTopicoCriminal(label, qtd, nomeMunicipio, mesNome) {
  const badge = qtd > 0 ? `<span class="ppvd-badge ppvd-badge-critica">${qtd}</span>` : `<span class="ppvd-badge ppvd-badge-verde">0</span>`;
  let h = `<details style="margin-top:10px;border-top:1px solid var(--panel-border);padding-top:6px" ${qtd > 0 ? 'open' : ''}>
    <summary style="cursor:pointer;padding:4px 0;font-weight:600">${label} ${badge}</summary>`;
  if (qtd > 0) {
    h += `<div class="def-box" style="border-color:var(--alert)">${qtd} ocorrência(s) de ${label} em ${nomeMunicipio} em ${mesNome}/2026. Endereço por ocorrência ainda não disponível nesta auditoria (ver aviso no topo da página) — consulte a página do indicador ${label} ou o SiGOp pra detalhar.</div>`;
  } else {
    h += `<div class="def-box">Nenhuma ocorrência de ${label} em ${nomeMunicipio} em ${mesNome}/2026.</div>`;
  }
  h += `</details>`;
  return h;
}

async function renderAuditoriaPage() {
  let html = `<div class="page-title">Painel de Auditoria</div>`;
  html += `<div class="def-box"><b>Uso interno — exige login PPVD aprovado</b><br>
    Reúne, cidade por cidade, o que está "em vermelho" a partir de Setembro/2026: casos de Violência Doméstica fora do prazo de 72h e sem solução final, e ocorrências de MV/CVPE/CVPa do mês corrente. Clique em cada tópico pra abrir os detalhes.</div>`;

  if (!ppvdSupa) {
    html += `<div class="def-box" style="border-color:var(--alert)">Auditoria de Violência Doméstica exige conexão com o Supabase (PPVD), indisponível neste carregamento.</div>`;
    document.getElementById('main').innerHTML = html;
    return;
  }
  if (!ppvdUser) {
    html += `<div class="def-box" style="border-color:var(--alert)">Entre com sua conta PPVD (botão "Entrar (PPVD)" no topo da página) pra ver o painel de auditoria.</div>`;
    document.getElementById('main').innerHTML = html;
    return;
  }
  if (!ppvdPerfil) {
    html += `<div class="def-box" style="border-color:var(--amber)">Complete seu cadastro PPVD (formulário no topo) pra liberar o acesso à auditoria.</div>`;
    document.getElementById('main').innerHTML = html;
    return;
  }
  if (!ppvdPerfil.aprovado) {
    html += `<div class="def-box" style="border-color:var(--amber)">Seu cadastro PPVD ainda não foi aprovado pelo administrador. Assim que for aprovado, a auditoria fica disponível.</div>`;
    document.getElementById('main').innerHTML = html;
    return;
  }

  const MES_LIMITE = 9; // a partir de Setembro/2026
  const idxAtual = Math.min(MES_ATUAL_IDX, DATA.mv.meses.length - 1);
  const mesNomeAtual = DATA.mv.meses[idxAtual];

  html += `<div id="auditoriaBody"></div>`;
  document.getElementById('main').innerHTML = html;
  const body = document.getElementById('auditoriaBody');
  body.innerHTML = `<div class="def-box">Carregando casos de Violência Doméstica…</div>`;

  function acharMunicipio(dataIndicador, nomeCanonico) {
    const alvo = normMun(nomeCanonico);
    return (dataIndicador.municipios || []).find(m => normMun(m.nome) === alvo) || null;
  }

  const vdData = DATA.violencia_domestica;
  const ocorrenciasPorMunicipio = {};
  MUNICIPIOS_CANONICAL.forEach(nome => {
    const chaveDados = Object.keys(vdData.ocorrencias).find(k => normMun(k) === normMun(nome));
    const lista = chaveDados ? vdData.ocorrencias[chaveDados] : [];
    ocorrenciasPorMunicipio[nome] = lista.filter(o => o.m >= MES_LIMITE);
  });
  const todosReds = Object.values(ocorrenciasPorMunicipio).flat().map(o => o.r).filter(Boolean);
  const casosMap = await ppvdBuscarCasosVD(todosReds);

  let htmlCidades = '';
  MUNICIPIOS_CANONICAL.forEach(nome => {
    const lista = ocorrenciasPorMunicipio[nome];
    const flagged = lista.map(o => {
      const caso = o.r ? (casosMap[o.r] || null) : null;
      const sem = ppvdSemaforoVD(caso);
      const horas = auditoriaHorasDesde(o.d);
      const atrasado = horas !== null && horas > 72;
      return { o, caso, sem, horas, atrasado };
    }).filter(x => x.sem !== 'verde' && x.atrasado);

    const mMv = acharMunicipio(DATA.mv, nome);
    const mCvpe = acharMunicipio(DATA.cvpe, nome);
    const mCvpa = acharMunicipio(DATA.cvpa, nome);
    const qtdMv = mMv ? (mMv.realizado_mes[Math.min(idxAtual, mMv.realizado_mes.length - 1)] || 0) : 0;
    const qtdCvpe = mCvpe ? (mCvpe.realizado_mes[Math.min(idxAtual, mCvpe.realizado_mes.length - 1)] || 0) : 0;
    const qtdCvpa = mCvpa ? (mCvpa.realizado_mes[Math.min(idxAtual, mCvpa.realizado_mes.length - 1)] || 0) : 0;

    const totalVermelho = flagged.length + qtdMv + qtdCvpe + qtdCvpa;
    const badgeGeral = totalVermelho > 0
      ? `<span class="ppvd-badge ppvd-badge-critica">${totalVermelho} em vermelho</span>`
      : `<span class="ppvd-badge ppvd-badge-verde">0 em vermelho</span>`;

    htmlCidades += `<div class="chart-box" style="margin-bottom:14px;min-width:0">
      <h3 style="display:flex;justify-content:space-between;align-items:center;gap:10px">${nome} ${badgeGeral}</h3>`;

    htmlCidades += `<details style="padding-top:2px" ${flagged.length ? 'open' : ''}>
      <summary style="cursor:pointer;padding:4px 0;font-weight:600">Violência Doméstica ${flagged.length ? `<span class="ppvd-badge ppvd-badge-critica">${flagged.length}</span>` : '<span class="ppvd-badge ppvd-badge-verde">0</span>'}</summary>`;
    if (flagged.length === 0) {
      htmlCidades += `<div class="def-box">Nenhum caso de VD fora do prazo de 72h/sem solução em ${nome} desde Setembro/2026.</div>`;
    } else {
      htmlCidades += `<div style="overflow-x:auto"><table class="data-table"><thead><tr><th style="text-align:left">Nº REDS</th><th style="text-align:left">Data do Fato</th><th>Em Aberto</th><th style="text-align:left">Bairro/Logradouro</th><th style="text-align:left">Responsável</th><th>Status</th><th style="text-align:left">Problema</th></tr></thead><tbody>`;
      flagged.sort((a, b) => b.horas - a.horas).forEach(({ o, caso, horas }) => {
        const end = `${o.b || ''}${o.l ? (' - ' + o.l) : ''}${o.nu && o.nu !== '0' ? (', ' + o.nu) : ''}`;
        const resp = caso ? (caso.militar_responsavel || '—') : '—';
        const statusTxt = ppvdStatusLabelVD(caso ? caso.status : null);
        const problema = !caso
          ? 'Nenhuma informação/BO carregado — caso nem foi aberto'
          : (!caso.status || caso.status === 'aberto' ? 'Sem visita registrada até agora' : 'Sem solução final (não estabilizado)');
        const diasTxt = horas >= 24 ? `${(horas / 24).toFixed(1)}d` : `${horas.toFixed(0)}h`;
        htmlCidades += `<tr class="vd-row-vermelho"><td style="text-align:left">${o.r || '—'}</td><td style="text-align:left">${o.d}</td><td>${diasTxt}</td><td style="text-align:left">${end}</td><td style="text-align:left">${resp}</td><td>${statusTxt}</td><td style="text-align:left">${problema}</td></tr>`;
      });
      htmlCidades += `</tbody></table></div>`;
    }
    htmlCidades += `</details>`;

    htmlCidades += auditoriaTopicoCriminal('MV (Mortes Violentas)', qtdMv, nome, mesNomeAtual);
    htmlCidades += auditoriaTopicoCriminal('CVPE', qtdCvpe, nome, mesNomeAtual);
    htmlCidades += auditoriaTopicoCriminal('CVPa', qtdCvpa, nome, mesNomeAtual);

    htmlCidades += `</div>`;
  });

  const avisoMvCvpe = `<div class="def-box" style="border-color:var(--amber)">
    <b>Sobre MV/CVPE/CVPa nesta auditoria</b><br>
    Por enquanto só temos a contagem de ocorrências por município e mês (abaixo) — o endereço exato de cada ocorrência ainda não está estruturado por município no data.json (só existe um agregado do batalhão inteiro por tipo de local, sem separar por cidade). Assim que houver um export nesse nível de detalhe, esta seção passa a listar ocorrência por ocorrência, igual à de Violência Doméstica.
  </div>`;

  body.innerHTML = avisoMvCvpe + htmlCidades;
}

function detalhadoPorNaturezaHtml(d, titulo, colunas, defHtml, fonteHtml) {
  let html = `<div class="chart-box" style="margin-top:20px;min-width:0"><h3>${titulo}</h3>`;
  html += `<div class="def-box"><b>${d.periodo}</b><br>${defHtml}</div>`;
  html += `<table class="data-table"><thead><tr>
    <th style="text-align:left">Fração</th><th style="text-align:left">Município</th>

    <th>Total Absoluto</th>
  </tr></thead><tbody>`;
  d.cias.forEach(cia => {
    cia.municipios.forEach((m, i) => {
      html += `<tr>`;
      if (i === 0) html += `<td rowspan="${cia.municipios.length}" style="text-align:left;font-weight:700;vertical-align:middle">${cia.nome}</td>`;
      html += `<td style="text-align:left">${m.nome}</td>`;
      colunas.forEach(c => {
        html += c.highlight
          ? `<td style="background:rgba(230,72,79,0.22);color:#e6484f;font-weight:600">${m[c.key]}</td>`
          : `<td>${m[c.key]}</td>`;
      });
      html += `<td style="font-weight:700">${m.total}</td></tr>`;
    });
  });
  const t = d.total;
  html += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)"><td colspan="2" style="text-align:left">TOTAL</td>`;
  colunas.forEach(c => {

      ? `<td style="background:rgba(230,72,79,0.28);color:#e6484f">${t[c.key]}</td>`
      : `<td>${t[c.key]}</td>`;
  });
  html += `<td>${t.total}</td></tr>`;
  html += `</tbody></table>`;
  html += `<div class="updated">${fonteHtml}</div>`;
  html += `</div>`;
  return html;
}

// Pedido por Eduardo em 2026-08-13: comandante de fração não deveria ter que reselecionar
// o próprio município toda vez que muda de página. Guarda a escolha no localStorage e,

const MUNICIPIOS_CANONICAL = ['Araçuaí','Itaobim','Pedra Azul','Medina','Itinga','Águas Vermelhas','Divisa Alegre','Coronel Murta','Padre Paraíso','Ponto dos Volantes','Cachoeira de Pajeú','Virgem da Lapa','Comercinho'];
function normMun(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim(); }
function getMunFiltro() { return localStorage.getItem('mun70bpm_filtro') || ''; }
function setMunFiltro(nome) {
  if (nome) localStorage.setItem('mun70bpm_filtro', nome);
  else localStorage.removeItem('mun70bpm_filtro');
  const sel = document.getElementById('munFiltroGlobal');
  if (sel && sel.value !== (nome || '')) sel.value = nome || '';
}
function highlightMunRows() {
  const alvo = getMunFiltro();
  const rows = document.querySelectorAll('#main .data-table tbody tr');
  rows.forEach(tr => tr.classList.remove('mun-highlight-row'));
  if (!alvo) return;
  const alvoNorm = normMun(alvo);
  rows.forEach(tr => {
    const firstCell = tr.querySelector('td');
    if (firstCell && normMun(firstCell.textContent) === alvoNorm) tr.classList.add('mun-highlight-row');
  });
}
let currentPageKey = 'home';
function goToPage(key) {
  currentPageKey = key;
  try { sessionStorage.setItem('paginaAtualPPVD', key); } catch (e) {}
  try {
    pages[key]();
  } catch (e) {
    console.error('Erro ao renderizar página "' + key + '":', e);
  } finally {
    requestAnimationFrame(highlightMunRows);
  }
}
function initMunFiltroGlobal() {
  const sel = document.getElementById('munFiltroGlobal');
  if (!sel) return;
  sel.innerHTML = '<option value="">Todos os municípios</option>' +
    MUNICIPIOS_CANONICAL.map(m => `<option value="${m}">${m}</option>`).join('');
  const salvo = getMunFiltro();
  if (salvo) sel.value = salvo;
  sel.addEventListener('change', () => {
    setMunFiltro(sel.value);
    goToPage(currentPageKey);
  });
}
initMunFiltroGlobal();

// Sugestao automatica de GUT a partir de dados ja disponiveis no REDS/caso, para pre-marcar a
// opcao mais provavel no wizard - o militar sempre pode corrigir, nunca fica travado no valor
// sugerido. Eduardo pediu (2026-08-20): "quero o que voce tiver para auxiliar o militar" - nas
// 3 dimensoes, nao so Urgencia (a mais facil de calcular objetivamente a partir de datas/contagens).
function ppvdSugerirGUT(modalidade, dados) {
  const g = { gravidade: null, urgencia: null, tendencia: null };
  if (modalidade === 'crimes_violentos') {
    if (dados.arma_fogo) g.gravidade = 5;
    else if (dados.tentativa_homicidio) g.gravidade = 4;
    if (dados.autor_identificado === false && dados.dias_desde_reds != null && dados.dias_desde_reds < 1) g.urgencia = 5;
    else if (dados.autor_identificado === false) g.urgencia = 4;
    else if (dados.autor_preso) g.urgencia = 2;
    else if (dados.dias_desde_reds != null && dados.dias_desde_reds <= 7) g.urgencia = 3;
    if (dados.qtd_crimes_violentos_vitima != null && dados.qtd_crimes_violentos_vitima > 1) g.tendencia = 5;
    else if (dados.endereco_reincidente) g.tendencia = 4;
  } else if (modalidade === 'reincidencia') {
    if (dados.arma_fogo) g.gravidade = 5;
    else if (dados.naturezas_distintas != null && dados.naturezas_distintas >= 2) g.gravidade = 3;
    if (dados.qtd_chamados_60d != null && dados.qtd_chamados_60d >= 3 && dados.dias_desde_ultimo_chamado != null && dados.dias_desde_ultimo_chamado < 7) g.urgencia = 5;
    else if (dados.intervalo_dias_entre_chamados != null) {
      if (dados.intervalo_dias_entre_chamados <= 15) g.urgencia = 4;
      else if (dados.intervalo_dias_entre_chamados <= 35) g.urgencia = 3;
      else g.urgencia = 2;
    }
    if (dados.visita_anterior_sem_efeito) g.tendencia = 5;
  }
  return g; // valores null = sem sugestao automatica confiavel; militar escolhe do zero
}

function ppvdCriteriosPara(modalidade) {
  if (modalidade === 'crimes_violentos') return PPVD_CRITERIOS_GUT_CRIMES_VIOLENTOS;
  if (modalidade === 'reincidencia') return PPVD_CRITERIOS_GUT_REINCIDENCIA;
  return PPVD_CRITERIOS_GUT;
}
function ppvdModalidadeLabel(modalidade) {
  if (modalidade === 'crimes_violentos') return 'Crimes Violentos';
  if (modalidade === 'reincidencia') return 'Preditiva por Reincidência de Endereço';
  return 'Violência Doméstica';
}
function ppvdModalidadeVoltarPage(modalidade) {
  if (modalidade === 'crimes_violentos') return 'crimes_violentos';
  if (modalidade === 'reincidencia') return 'reincidencia';
  return 'violencia_domestica';
}
function ppvdDiasDesde(dmy) {
  if (!dmy) return null;
  const p = dmy.split('/');
  if (p.length !== 3) return null;
  const dt = new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
  const diff = Math.floor((Date.now() - dt.getTime()) / 86400000);
  return diff >= 0 ? diff : null;
}

async function ppvdAbrirCasoModalidade(modalidade, chave, dadosBase, dadosOrigem) {
  if (!ppvdSupa) { alert('Integração PPVD indisponível.'); return; }
  if (!ppvdUser) { alert('Faça login (botão "Entrar (PPVD)" no topo) pra abrir um caso.'); return; }
  if (!ppvdPerfil) { alert('Complete seu cadastro antes (aparece no topo da tela).'); return; }
  if (!ppvdPerfil.aprovado) { alert('Seu acesso ainda não foi aprovado pelo administrador PPVD.'); return; }

  document.getElementById('main').innerHTML = `<div class="page-title">Carregando caso…</div>`;

  const isEndereco = modalidade === 'reincidencia';
  const filtroCol = isEndereco ? 'endereco_key' : 'reds_numero';

  let { data: caso, error } = await ppvdSupa.from('ppvd_casos').select('*').eq(filtroCol, chave).eq('modalidade', modalidade).maybeSingle();
  if (error) { document.getElementById('main').innerHTML = `<div class="def-box">Erro ao consultar caso: ${error.message}</div>`; return; }
  if (!caso) {
    const insertObj = {
      modalidade,
      reds_numero: isEndereco ? null : chave,
      endereco_key: isEndereco ? chave : null,
      reds_relacionados: dadosBase.reds_relacionados || null,
      reds_data: dadosBase.reds_data || null,
      natureza: dadosBase.natureza || null,
      causa: dadosBase.causa || null,
      municipio: dadosBase.municipio || null,
      bairro: dadosBase.bairro || null,
      logradouro: dadosBase.logradouro || null,
      numero: dadosBase.numero || null,
      dados_origem: dadosOrigem || null,
      status: 'novo',
    };
    const { data: novo, error: errIns } = await ppvdSupa.from('ppvd_casos').insert(insertObj).select().single();
    if (errIns) { document.getElementById('main').innerHTML = `<div class="def-box">Erro ao criar caso: ${errIns.message}</div>`; return; }
    caso = novo;
  }

  ppvdWizard = {
    modalidade, casoId: caso.id, step: 0,
    valores: { gravidade: caso.gravidade || null, urgencia: caso.urgencia || null, tendencia: caso.tendencia || null },
    militar_responsavel: caso.militar_responsavel || '',
    caso,
  };
  if (ppvdWizard.valores.gravidade && ppvdWizard.valores.urgencia && ppvdWizard.valores.tendencia) {
    ppvdWizard.step = 3;
  }
  ppvdRenderWizard();
}

function ppvdRenderWizard() {
  const w = ppvdWizard;
  const criterios = ppvdCriteriosPara(w.modalidade);
  const sugestoes = ppvdSugerirGUT(w.modalidade, w.caso.dados_origem || {});
  const dims = ['gravidade', 'urgencia', 'tendencia'];
  const dimLabels = { gravidade: 'Gravidade', urgencia: 'Urgência', tendencia: 'Tendência' };

  let html = `<div class="page-title">Novo Caso — ${ppvdModalidadeLabel(w.modalidade)}</div>`;
  html += `<button class="ppvd-btn" onclick="goToPage('${ppvdModalidadeVoltarPage(w.modalidade)}')">← Voltar</button>`;

  html += `<div class="ppvd-card" style="margin-top:16px">`;
  html += `<b>${w.caso.reds_numero ? ('REDS: ' + w.caso.reds_numero) : 'Endereço reincidente'}</b> &nbsp;`;
  if (w.caso.reds_data) html += `<b>Data:</b> ${w.caso.reds_data} &nbsp;`;
  if (w.caso.natureza) html += `<b>Natureza:</b> ${w.caso.natureza} &nbsp;`;
  html += `<br><b>Endereço:</b> ${w.caso.bairro || ''}${w.caso.logradouro ? (' - ' + w.caso.logradouro) : ''}${w.caso.numero && w.caso.numero !== '0' ? (', ' + w.caso.numero) : ''}`;
  if (w.caso.reds_relacionados) html += `<br><b>REDS relacionados:</b> ${w.caso.reds_relacionados}`;
  html += `</div>`;

  if (w.step < 3) {
    const dim = dims[w.step];
    const opts = criterios[dim];
    const sugestao = sugestoes[dim];
    html += `<div class="page-title" style="margin-top:24px;font-size:16px">Pergunta ${w.step + 1} de 3 — ${dimLabels[dim]}</div>`;
    if (sugestao) {
      html += `<div class="def-box" style="border-color:var(--amber)">💡 Sugestão automática com base nos dados do REDS: <b>nível ${sugestao}</b> — confira e escolha a opção que melhor descreve a situação (pode ser diferente da sugestão).</div>`;
    }
    html += `<div class="ppvd-card">`;
    opts.forEach(o => {
      const marcado = w.valores[dim] === o.v;
      const destacar = sugestao === o.v;
      html += `<button class="ppvd-btn ${marcado ? 'ppvd-btn-primary' : ''}" style="display:block;width:100%;text-align:left;margin-bottom:8px;white-space:normal;${destacar ? 'border-color:var(--amber)' : ''}" onclick="ppvdWizardResponder('${dim}', ${o.v})"><b>${o.v}</b> — ${o.d}${destacar ? ' 💡' : ''}</button>`;
    });
    html += `</div>`;
    if (w.step > 0) html += `<button class="ppvd-btn" onclick="ppvdWizardVoltarPergunta()">← Pergunta anterior</button>`;
  } else {
    const g = w.valores.gravidade, u = w.valores.urgencia, t = w.valores.tendencia;
    const score = (g || 0) * (u || 0) * (t || 0);
    const orient = ppvdOrientacao(g, u, t);
    html += `<div class="page-title" style="margin-top:24px;font-size:16px">Revisão e finalização</div>`;
    html += `<div class="kpi-grid">`;
    html += `<div class="kpi-card ${orient.nivel === 'critica' ? 'kpi-red' : (orient.nivel === 'alta' ? 'kpi-neutral' : 'kpi-green')}"><div class="val">${score || '—'}</div><div class="lbl">Score GUT (G×U×T)</div></div>`;
    html += `<div class="kpi-card kpi-neutral"><div class="val" style="font-size:14px">${orient.texto}</div><div class="lbl">Orientação Automática</div></div>`;
    html += `</div>`;
    html += `<div class="ppvd-card">`;
    dims.forEach(dim => {
      const v = w.valores[dim];
      const opt = criterios[dim].find(o => o.v === v);
      html += `<div style="margin-bottom:10px"><b>${dimLabels[dim]}: ${v}</b> — ${opt ? opt.d : ''} <button class="ppvd-btn" onclick="ppvdWizardEditarPergunta('${dim}')" style="margin-left:8px">Corrigir</button></div>`;
    });
    html += `</div>`;
    html += `<div class="ppvd-card"><b>Militar Responsável pela visita</b><br><br>`;
    html += `<div class="ppvd-field"><input id="ppvdMilitarResp" placeholder="Nome/graduação de quem fez a visita" value="${w.militar_responsavel || ''}"></div>`;
    html += `</div>`;
    html += `<div class="ppvd-card"><b>Anexar BOS (imagem ou PDF)</b><br><br>`;
    html += `<div class="ppvd-field"><input type="file" id="ppvdBosFile" accept="image/*,application/pdf"></div>`;
    if (w.caso.bos_url) html += `<div style="margin-top:6px;color:var(--muted)">Este caso já tem um BOS anexado. Enviar um novo arquivo substitui.</div>`;
    html += `</div>`;
    html += `<button class="ppvd-btn ppvd-btn-primary" onclick="ppvdWizardSalvar()">Salvar caso</button>`;
  }

  document.getElementById('main').innerHTML = html;
}

function ppvdWizardResponder(dim, valor) {
  ppvdWizard.valores[dim] = valor;
  ppvdWizard.step += 1;
  ppvdRenderWizard();
}
function ppvdWizardVoltarPergunta() {
  ppvdWizard.step = Math.max(0, ppvdWizard.step - 1);
  ppvdRenderWizard();
}
function ppvdWizardEditarPergunta(dim) {
  const dims = ['gravidade', 'urgencia', 'tendencia'];
  ppvdWizard.step = dims.indexOf(dim);
  ppvdRenderWizard();
}

async function ppvdWizardSalvar() {
  const w = ppvdWizard;
  w.militar_responsavel = document.getElementById('ppvdMilitarResp').value || '';
  const fileInput = document.getElementById('ppvdBosFile');
  const file = fileInput && fileInput.files && fileInput.files[0];

  let bosUrl = w.caso.bos_url || null;
  if (file) {
    const path = `${w.modalidade}/${w.casoId}/${Date.now()}_${file.name}`;
    const { error: upErr } = await ppvdSupa.storage.from('ppvd-bos').upload(path, file, { upsert: true });
    if (upErr) { alert('Erro ao enviar BOS: ' + upErr.message); return; }
    bosUrl = path;
  }

  const upd = {
    gravidade: w.valores.gravidade, urgencia: w.valores.urgencia, tendencia: w.valores.tendencia,
    militar_responsavel: w.militar_responsavel || null,
    bos_url: bosUrl,
    status: 'em_acompanhamento',
  };
  const { error } = await ppvdSupa.from('ppvd_casos').update(upd).eq('id', w.casoId);
  if (error) { alert('Erro ao salvar: ' + error.message); return; }
  alert('Caso salvo com sucesso.');
  goToPage(ppvdModalidadeVoltarPage(w.modalidade));
}

function ppvdAbrirCasoCV(redsNumero) {
  const dadosBase = (window.ppvdCVLookup || {})[redsNumero];
  if (!dadosBase) { alert('Dados da ocorrência não encontrados.'); return; }
  ppvdAbrirCasoModalidade('crimes_violentos', redsNumero, dadosBase, dadosBase._origem);
}
function ppvdAbrirCasoReinc(lookupId) {
  const dadosBase = (window.ppvdReincLookup || {})[lookupId];
  if (!dadosBase) { alert('Dados do endereço não encontrados.'); return; }
  ppvdAbrirCasoModalidade('reincidencia', dadosBase.endereco_key, dadosBase, dadosBase._origem);
