<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>70º BPM &middot; Painel de Indicadores Operacionais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #070c14;
    --bg-1: #0b1420;
    --bg-2: #101c2c;
    --panel: #0e1b2b;
    --panel-border: #1e3348;
    --line: #16283c;
    --amber: #e8a83c;
    --amber-dim: #8a6a2c;
    --signal: #21c98a;
    --signal-dim: #14624a;
    --alert: #e6484f;
    --alert-dim: #6e2226;
    --alert-text: #ff6b70;
    --caution: #d4c22a;
    --text: #eaf1f8;
    --muted: #7891a8;
    --muted-dim: #6a8196;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --display: 'Rajdhani', var(--sans);
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--panel-border) var(--bg-0); }
  body {
    margin:0; font-family: var(--sans);
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 34px),
      radial-gradient(ellipse 1200px 700px at 15% -10%, #14263a 0%, transparent 60%),
      linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-0) 100%);
    color: var(--text); display:flex; min-height:100vh;
    font-variant-numeric: tabular-nums;
  }
  ::selection { background: var(--amber); color:#1a1200; }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    width: 244px; background: linear-gradient(180deg,#081019,#060b12);
    border-right: 1px solid var(--panel-border);
    padding: 0; flex-shrink:0; display:flex; flex-direction:column;
    position: sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand {
    padding: 22px 18px 16px; border-bottom: 1px solid var(--panel-border);
  }
  .brand .unit { font-family: var(--display); font-size:20px; font-weight:700; letter-spacing:0.06em; color:var(--text); line-height:1.1; }
  .brand .sub { font-family: var(--mono); font-size:11px; letter-spacing:0.14em; color:var(--amber); text-transform:uppercase; margin-top:6px; }
  .menu-busca { margin:12px 12px 4px; position:relative; }
  .menu-busca span { position:absolute; left:11px; top:8px; color:var(--muted); font-size:13px; }
  .menu-busca input { width:100%; background:var(--bg-2); border:1px solid var(--panel-border); border-radius:8px; color:var(--text); padding:9px 12px 9px 33px; font-size:13px; font-family:var(--sans); }
  .menu-busca input:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
  .nav-scroll { padding: 6px 10px 20px; flex:1; }
  .nav-group { margin-bottom: 4px; }
  .nav-group-label {
    width:100%; background:transparent; border:0; cursor:pointer; text-align:left; border-radius:8px;
    font-family: var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color: var(--muted-dim); padding: 9px 8px; display:flex; align-items:center; gap:8px;
  }
  .nav-group-label:hover { background: var(--bg-2); color: var(--muted); }
  .nav-group-label .nt { flex:0 1 auto; }
  .nav-group-label .chev { margin-left:auto; transition: transform .15s ease; font-size:15px; }
  .nav-group.aberto .nav-group-label .chev { transform: rotate(90deg); }
  .nav-group:not(.aberto) .nav-group-itens { display:none; }
  body.menu-buscando .nav-group .nav-group-itens { display:block; }
  body.menu-buscando .nav-group-label .chev { display:none; }
  .nav-btn {
    display:flex; align-items:center; gap:10px; width:100%;
    background: transparent; color: #b6c6d6; border:1px solid transparent;
    padding: 9px 10px; font-weight:500; cursor:pointer; text-align:left;
    font-size: 13.5px; font-family:var(--sans); letter-spacing:0.01em;
    border-radius: 9px; margin:2px 0; transition: all .12s ease;
  }
  .nav-btn::before { content:''; width:6px; height:6px; border-radius:1px; background:var(--muted-dim); flex-shrink:0; transition: all .12s ease; }
  .nav-btn.com-ic::before { display:none; }
  .nav-btn .ic, .nav-group-label .ic { width:22px; text-align:center; font-size:15px; flex-shrink:0; }
  .nav-btn .nt { flex:1; min-width:0; }
  .nav-btn:hover:not(.disabled) { background: var(--bg-2); color: var(--text); }
  .nav-btn.active { background: rgba(232,168,60,0.12); color: var(--text); border-color: rgba(232,168,60,0.45); font-weight:600; }
  .nav-btn.disabled { opacity: 0.45; cursor: not-allowed; }
  .bd { margin-left:auto; min-width:22px; text-align:center; border-radius:11px; padding:1px 7px; font-size:12px; font-weight:700; font-family:var(--mono); flex-shrink:0; border:1px solid transparent; }
  .bd[hidden], .nav-btn[hidden], .nav-group[hidden] { display:none; }
  .bd.r { background:rgba(230,72,79,.2); color:var(--alert-text); border-color:rgba(230,72,79,.5); }
  .bd.a { background:rgba(212,194,42,.18); color:var(--caution); border-color:rgba(212,194,42,.5); }
  .bd.g { background:rgba(33,201,138,.15); color:var(--signal); border-color:rgba(33,201,138,.45); }
  .bd.msg { background:var(--alert); color:#fff; }
  .nav-group-label .gbd { margin-left:6px; }
  .nav-group-label .chev { margin-left:auto; }
  /* filtro por município em botões (o <select> original segue escondido: é ele que guarda o valor) */
  .mun-strip { display:flex; gap:6px; padding:8px 18px; overflow-x:auto; border-bottom:1px solid var(--panel-border); background:rgba(7,12,20,0.5); flex-shrink:0; scrollbar-width:thin; -webkit-overflow-scrolling:touch; }
  .pill-mun { flex:0 0 auto; background:var(--bg-2); border:1px solid var(--panel-border); color:#b6c6d6; border-radius:999px; padding:5px 13px; font-size:12px; cursor:pointer; font-family:var(--sans); }
  .pill-mun:hover { border-color:var(--muted-dim); color:var(--text); }
  .pill-mun.on { background:rgba(232,168,60,.15); border-color:var(--amber); color:var(--amber); font-weight:600; }
  .pill-mun:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
  /* painel "Atenção agora" da Home */
  .atencao { background:var(--panel); border:1px solid rgba(230,72,79,.4); border-left:4px solid var(--alert); border-radius:10px; padding:14px 16px; margin-bottom:20px; }
  .atencao.ok { border-color:rgba(33,201,138,.4); border-left-color:var(--signal); }
  .atencao .hd { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .atencao .hd b { font-size:15px; }
  .atencao .hd span { color:var(--muted); font-size:12px; }
  .atencao .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .atencao .chip { display:flex; align-items:center; gap:8px; border-radius:9px; padding:8px 11px; cursor:pointer; border:1px solid; font-size:13px; background:var(--bg-2); color:var(--text); font-family:var(--sans); text-align:left; }
  .atencao .chip.r { border-color:rgba(230,72,79,.55); }
  .atencao .chip.a { border-color:rgba(212,194,42,.55); }
  .atencao .chip:hover { background:#15283d; }
  .atencao .chip .g { font-weight:800; font-size:12px; }
  .atencao .chip.r .g { color:var(--alert-text); }
  .atencao .chip.a .g { color:var(--caution); }
  .atencao .chip small { color:var(--muted); font-size:11px; }
  .atencao .mais { color:var(--muted); font-size:12px; margin-top:8px; }
  /* barra de abas e folha de itens (só no celular) */
  .tabbar, .folha { display:none; }
  .folha-box .grupo-nome { color:var(--muted-dim); font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin:8px 4px 6px; }
  .folha-box .grade { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-bottom:10px; }
  .folha-box .nav-btn { border:1px solid var(--panel-border); background:var(--bg-2); padding:12px 10px; margin:0; }

  /* ---------- TOPBAR + CONTENT ---------- */
  .app-col { flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; }
  .topbar {
    display:flex; justify-content:space-between; align-items:center;
    padding: 12px 30px; border-bottom: 1px solid var(--panel-border);
    background: rgba(7,12,20,0.6); flex-shrink:0;
  }
  .topbar-title { font-family: var(--mono); font-size:12px; letter-spacing:0.1em; color:var(--muted); text-transform:uppercase; }
  .topbar-title b { color:var(--text); font-weight:600; }
  .topbar-status { display:flex; align-items:center; gap:16px; font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:0.06em; }
  .topbar-status .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--signal); box-shadow:0 0 8px var(--signal); margin-right:6px; }
  .status-dados { cursor:help; }
  .status-dados.dados-aviso { color:var(--caution); }
  .status-dados.dados-aviso .dot { background:var(--caution); box-shadow:0 0 8px var(--caution); }
  .status-dados.dados-velho { color:var(--alert-text); font-weight:600; }
  .status-dados.dados-velho .dot { background:var(--alert); box-shadow:0 0 8px var(--alert); }
  .mun-filtro-wrap { display:none; } /* o <select> segue no DOM (guarda o valor); a escolha é feita pelos botões de .mun-strip */
  .mun-filtro-select {
    background: var(--bg-2); color:var(--text); border:1px solid var(--panel-border); border-radius:3px;
    font-family:var(--mono); font-size:11.5px; padding:4px 6px; letter-spacing:0.03em; cursor:pointer;
  }
  .mun-highlight-row td { background: rgba(232,168,60,0.14) !important; box-shadow: inset 3px 0 0 var(--amber); }
  .main { flex:1; padding: 26px 34px 50px; overflow:auto; }

  /* ---------- PAGE HEADER ---------- */
  .page-title {
    font-family: var(--display); font-size: 25px; font-weight:700; letter-spacing:0.02em;
    color: var(--text); margin: 0 0 4px; padding:0; border:none; display:block;
    text-transform: uppercase;
  }
  .page-title::before { content:'// '; color: var(--amber); }
  .updated {
    font-size:12.5px; color: var(--muted); margin-bottom:22px; font-family: var(--mono);
    padding-bottom:16px; border-bottom: 1px solid var(--line); letter-spacing:0.01em;
  }
  .fresh-badge {
    display:inline-flex; align-items:center; gap:6px; font-family: var(--mono); font-size:11.5px;
    letter-spacing:0.04em; padding:4px 10px; border-radius:3px; margin: 2px 0 14px; text-transform:uppercase;
  }
  .fresh-badge::before { content:''; width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .fresh-ok { background: rgba(33,201,138,0.1); color: var(--signal); border:1px solid var(--signal-dim); }
  .fresh-ok::before { background: var(--signal); box-shadow:0 0 6px var(--signal); }
  .fresh-warn { background: rgba(212,194,42,0.1); color: var(--caution); border:1px solid #6b6318; }
  .fresh-warn::before { background: var(--caution); }
  .fresh-stale { background: rgba(230,72,79,0.1); color: var(--alert-text); border:1px solid var(--alert-dim); }
  .fresh-stale::before { background: var(--alert); }
  .fresh-snapshot { background: rgba(120,145,168,0.1); color: var(--muted); border:1px solid var(--muted-dim); }
  .fresh-snapshot::before { background: var(--muted); }

  /* ---------- KPI CARDS ---------- */
  .kpi-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom: 20px; }
  .kpi-grid-home { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi-card {
    position:relative; border-radius: 3px; padding: 18px 18px 16px; text-align:left; color:white;
    background: var(--panel); border:1px solid var(--panel-border); border-left-width:3px;
    overflow:hidden;
  }
  .kpi-card::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(135deg, rgba(255,255,255,0.035), transparent 55%);
  }
  .kpi-card .val { font-family: var(--mono); font-size: 28px; font-weight:600; letter-spacing:-0.01em; }
  .kpi-card .lbl { font-family: var(--mono); font-size: 11px; margin-top:6px; opacity:0.85; text-transform:uppercase; letter-spacing:0.09em; }
  .kpi-red { border-left-color: var(--alert); }
  .kpi-red .val { color: var(--alert-text); }
  .kpi-green { border-left-color: var(--signal); }
  .kpi-green .val { color: var(--signal); }
  .kpi-neutral { border-left-color: var(--muted); }
  .kpi-amber { border-left-color: var(--caution); }
  .kpi-amber .val { color: var(--caution); }
  .kpi-card .sub { font-family: var(--sans); font-size: 11.5px; margin-top:6px; color: var(--muted); line-height:1.35; }
  .kpi-amber .lbl::before { content:'!'; content:'!' / ''; font-size:.85em; font-weight:700; margin-right:4px; }
  table.matriz-home th { padding:8px 3px; font-size:11px; letter-spacing:0.03em; }
  table.matriz-home td { padding:6px 3px; font-size:11px; }
  table.matriz-home td::before { margin-right:1px; }
  @media (min-width: 901px) and (max-width: 1600px) { .main { padding-left:24px; padding-right:24px; } }
  .dica-rolagem { display:none; font-family:var(--mono); font-size:11px; color:var(--muted); text-align:right; margin:6px 2px 0; }
  .dica-rolagem.on { display:block; }
  /* Home, onda 2 (2026-10-13) */
  .home-linha { display:grid; grid-template-columns: minmax(0, 1.9fr) minmax(300px, 1fr); gap:18px; align-items:start; margin-bottom:20px; }
  .home-linha .kpi-grid { margin-bottom:0; }
  .home-linha .rank-lateral .chart-box { margin-top:0; min-width:0; }
  @media (max-width: 1180px) { .home-linha { grid-template-columns: 1fr; } }
  .kpi-card .spark { display:block; width:100%; height:26px; margin-top:8px; overflow:visible; }
  .spark .sp-real { fill:none; stroke:currentColor; stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .spark .sp-meta { fill:none; stroke:var(--muted); stroke-width:1.5; stroke-dasharray:4 3; vector-effect:non-scaling-stroke; }
  .kpi-green .spark { color:var(--signal); } .kpi-red .spark { color:var(--alert-text); } .kpi-amber .spark { color:var(--caution); } .kpi-neutral .spark { color:var(--text); }
  .atn-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap:10px; }
  .atn-cidade { background:var(--bg-2); border:1px solid var(--panel-border); border-left:3px solid var(--caution); border-radius:8px; padding:10px 12px; }
  .atn-cidade.r { border-left-color:var(--alert); }
  .atn-cidade[hidden] { display:none; }
  .atn-nome { width:100%; display:flex; align-items:center; gap:8px; background:transparent; border:0; color:var(--text); font-weight:700; font-size:14px; padding:0 0 6px; cursor:pointer; text-align:left; font-family:var(--sans); }
  .atn-nome:hover { color:var(--amber); }
  .atn-nome .cont { margin-left:auto; font-family:var(--mono); font-size:11.5px; font-weight:600; }
  .atn-nome .cont .rv { color:var(--alert-text); } .atn-nome .cont .am { color:var(--caution); }
  .atn-cidade ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px; }
  .atn-item { width:100%; display:flex; align-items:baseline; gap:7px; background:transparent; border:0; border-radius:5px; padding:3px 4px; cursor:pointer; color:var(--text); font-size:12.5px; text-align:left; font-family:var(--sans); }
  .atn-item:hover { background:#15283d; }
  .atn-item .g { font-weight:800; font-size:12px; flex-shrink:0; }
  .atn-item.r .g { color:var(--alert-text); } .atn-item.a .g { color:var(--caution); }
  .atn-item small { color:var(--muted); font-size:11px; margin-left:auto; text-align:right; }
  .atn-mais-itens { color:var(--muted); font-size:11.5px; padding:2px 4px; }
  .atn-mais { margin-top:10px; background:transparent; border:1px solid var(--panel-border); color:var(--muted); border-radius:999px; padding:6px 14px; font-size:12px; cursor:pointer; font-family:var(--sans); }
  .atn-mais:hover { color:var(--text); border-color:var(--muted-dim); }
  .abas { display:flex; gap:6px; margin:0 0 10px; }
  .aba { background:var(--bg-2); border:1px solid var(--panel-border); color:#b6c6d6; border-radius:8px 8px 0 0; padding:8px 16px; font-size:13px; cursor:pointer; font-family:var(--sans); }
  .aba.on { background:rgba(232,168,60,.14); border-color:var(--amber); color:var(--amber); font-weight:600; }
  .aba:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
  .periodo-quadro { font-family:var(--mono); font-size:11.5px; color:var(--muted); margin:0 0 8px; }
  [data-painel][hidden] { display:none; }
  table.matriz-home td.cel-clic { cursor:pointer; }
  table.matriz-home td.cel-clic:hover { outline:1px solid var(--amber); outline-offset:-1px; }
  table.matriz-home th[data-pg] { cursor:pointer; }
  table.matriz-home th[data-pg]:hover { color:var(--amber); text-decoration:underline; }
  table.matriz-home tbody td:first-child { cursor:pointer; }
  .rank-lateral .rank-row > div:nth-child(2) { width:118px !important; font-size:12.5px; }
  .rank-lateral .rank-row { padding:3px 0 !important; cursor:pointer; }
  .audit-resp .hd { font-weight:600; margin-bottom:2px; }
  .audit-resp .hd small { color:var(--muted); font-weight:400; font-size:11.5px; display:block; margin-top:2px; }
  .resp-linha { display:flex; gap:8px 12px; align-items:center; flex-wrap:wrap; padding:7px 0; border-bottom:1px solid var(--line); }
  .resp-func { font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--panel-border); background:var(--bg-2); color:var(--text); white-space:nowrap; }
  .resp-func.cmt_destacamento { border-color:rgba(232,168,60,.6); color:var(--amber); }
  .resp-func.cmt_pelotao { border-color:rgba(91,155,213,.6); color:#8ec5ff; }
  .resp-func.sargenteante { border-color:rgba(33,201,138,.6); color:var(--signal); }
  .resp-linha .nome { font-weight:600; }
  .resp-linha .fone { color:var(--muted); font-family:var(--mono); font-size:12px; }
  /* Auditoria, etapa 2 (2026-10-13): resumo por cidade no topo + detalhe recolhido */
  .aud-resumo { background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; overflow:hidden; margin-bottom:14px; }
  .aud-linha { display:grid; grid-template-columns: minmax(140px,1.6fr) repeat(5, minmax(44px,.5fr)) 66px minmax(100px,.9fr) minmax(120px,1fr); gap:6px; align-items:center; width:100%; padding:8px 12px; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--text); text-align:left; font-family:var(--sans); font-size:13px; }
  button.aud-linha { cursor:pointer; }
  button.aud-linha:hover { background:#15283d; }
  .aud-linha.cab { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); background:#142236; }
  .aud-linha.tot { font-weight:700; background:rgba(255,255,255,.05); border-bottom:0; }
  .aud-linha .c { font-weight:600; } .aud-linha .num { text-align:center; font-family:var(--mono); }
  .aud-linha .num.z { color:var(--muted-dim); font-weight:400; } .aud-linha .num.p { color:var(--alert-text); font-weight:700; }
  .aud-linha .tt { text-align:center; } .aud-linha .tt .ppvd-badge { font-size:12px; }
  .aud-linha .rf { display:inline-block; width:20px; text-align:center; font-family:var(--mono); font-size:11px; border-radius:4px; border:1px solid var(--panel-border); color:var(--muted-dim); margin-right:3px; }
  .aud-linha .rf.on { color:var(--text); border-color:var(--signal); background:rgba(33,201,138,.12); }
  .aud-linha .semresp { color:var(--caution); font-size:12px; }
  .aud-acoes { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; align-items:center; }
  details.aud-cidade { background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; margin-bottom:10px; }
  details.aud-cidade > summary { cursor:pointer; padding:11px 14px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; list-style:none; }
  details.aud-cidade > summary::-webkit-details-marker { display:none; }
  details.aud-cidade > summary::before { content:'›'; font-size:18px; color:var(--muted); transition:transform .15s; }
  details.aud-cidade[open] > summary::before { transform:rotate(90deg); }
  details.aud-cidade > summary .cn { font-weight:700; font-size:15px; }
  details.aud-cidade > summary .chips { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; font-size:12px; }

<script>
const __dataXhr = new XMLHttpRequest();
__dataXhr.open('GET', 'data.json', false);
__dataXhr.send(null);
if (__dataXhr.status !== 200 && __dataXhr.status !== 0) throw new Error('Falha ao carregar data.json: HTTP ' + __dataXhr.status);
const DATA = JSON.parse(__dataXhr.responseText);
// "Dados atualizados em" — antes era um "Gerado em" digitado à mão no HTML (achado por
// Eduardo em 2026-09-08: ficava parado desde a última vez que alguém lembrou de editar).
// Agora lê o header Last-Modified da própria resposta HTTP de data.json — reflete quando
// o arquivo de dados foi salvo de verdade, não quando o HTML foi gerado (que hoje quase
// nunca muda, quem muda toda hora é o data.json).
(() => {
  const el = document.getElementById('dadosAtualizadosEm');
  if (!el) return;
  const lm = __dataXhr.getResponseHeader('Last-Modified');
  if (!lm) { el.textContent = 'Dados atualizados em — (servidor não informou)'; return; }
  const d = new Date(lm);
  const pad = n => String(n).padStart(2, '0');
  el.textContent = `Dados atualizados em ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
})();
// Indicador real de atualização (substitui o texto fixo "Base local sincronizada", que dizia
// "sincronizado" mesmo com dado parado — achado na análise geral de 2026-10-09). Conta DIAS
// ÚTEIS desde a última gravação do data.json (header Last-Modified; se o servidor não informar,
// usa a maior data `atualizado_em` dos indicadores): até 1 dia útil = verde, 2 = amarelo,
// 3 ou mais = vermelho. Fim de semana não conta (a rotina roda em dia útil). O tooltip mostra
// o indicador com `atualizado_em` mais antigo.
(() => {
  const box = document.getElementById('statusDados'), txt = document.getElementById('statusDadosTxt');
  if (!box || !txt) return;
  const NOMES = { mv:'MV', cvpe:'CVPe', cvpa:'CVPa', furto:'Furto Rural', armas:'Armas', pog:'POG', cavaloaco:'Cavalo de Aço', rolezinho:'Rolezinho', padesc:'Padrinhos da Escola', saque_seguro:'Saque Seguro', idob:'IDOB', itvd:'ITVD', esforco_furto:'Prisões de Furto', violencia_domestica:'Violência Doméstica', crimes_violentos:'Crimes Violentos', reincidencia:'Reincidência', cavaloaco_eficacia:'Cavalo de Aço (eficácia)', analise_preditiva:'Análise Preditiva', boemia_meta:'Meta Boemia' };
  const datas = [];
  Object.keys(DATA).forEach(k => {
    const v = DATA[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      if (typeof v.atualizado_em === 'string') datas.push([NOMES[k] || k, v.atualizado_em]);
      if (k === 'ppag') Object.keys(v).forEach(s => { if (v[s] && typeof v[s].atualizado_em === 'string') datas.push(['PPAG ' + s.toUpperCase(), v[s].atualizado_em]); });
    }
  });
  const paraDia = (s) => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
  const lm = __dataXhr.getResponseHeader('Last-Modified');
  let ultima = lm ? new Date(lm) : null;
  if (!ultima || isNaN(ultima.getTime())) {
    ultima = datas.length ? new Date(Math.max(...datas.map(x => paraDia(x[1]).getTime()))) : null;
  }
  if (!ultima) { txt.textContent = 'Data dos dados indisponível'; box.className = 'status-dados dados-aviso'; return; }
  const diaUltima = new Date(ultima.getFullYear(), ultima.getMonth(), ultima.getDate());
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  let uteis = 0;
  for (let d = new Date(diaUltima.getTime() + 86400000); d <= hoje; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
    if (d.getDay() !== 0 && d.getDay() !== 6) uteis++;
  }
  const fmt = (dt) => String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0');
  let classe = '', rotulo;
  if (uteis <= 1) { rotulo = 'Dados em dia'; }
  else if (uteis === 2) { classe = ' dados-aviso'; rotulo = 'Dados há 2 dias úteis'; }
  else { classe = ' dados-velho'; rotulo = 'Dados desatualizados · ' + uteis + ' dias úteis'; }
  txt.textContent = rotulo;
  box.className = 'status-dados' + classe;
  let dica = 'Arquivo de dados gravado em ' + fmt(ultima) + ' (' + uteis + ' dia(s) útil(eis) atrás). Verde: até 1 dia útil · Amarelo: 2 · Vermelho: 3 ou mais.';
  if (datas.length) {
    const velho = datas.slice().sort((a, b) => a[1].localeCompare(b[1]))[0];
    dica += '\nIndicador com data mais antiga: ' + velho[0] + ' (' + fmt(paraDia(velho[1])) + ').';
  }

})();
const MESES = DATA.mv.meses;
// Mês "atual" real (0-based, Jan=0). Calculado a partir da data do navegador — antes era um
// número fixo (8) que precisava ser trocado à mão todo mês; achado por Eduardo em 2026-09-08
// junto com o pedido de automatizar tudo que dependia de mês "atual" hardcoded. Usado como teto
// padrão de exibição — as metas de todos os indicadores já vão até dezembro, mas o "realizado"
// só existe até o mês corrente; sem esse teto, as páginas abririam mostrando o acumulado do ANO
// INTEIRO (meta de dezembro) em vez do acumulado até hoje.
const MES_ATUAL_IDX = new Date().getMonth();

// ---------- Selo "Atualizado até" (calculado em tempo de render, direto do DATA — nunca fica desatualizado sozinho) ----------
// Compara o último mês disponível de um indicador com o mês mais avançado que existe em QUALQUER indicador do painel.
function ultimoMesGlobal() {
  let best = -1;
  for (const k of Object.keys(DATA)) {
    const d = DATA[k];
    if (d && Array.isArray(d.meses) && d.meses.length) {
      best = Math.max(best, MESES.indexOf(d.meses[d.meses.length - 1]));
    }
  }
  return best >= 0 ? best : MESES.length - 1;
}
// Capado por MES_ATUAL_IDX: sem isso, indicadores com meta pré-cadastrada até dezembro (migração
// de 03/09/2026) fariam esse "mais recente" saltar pra dezembro e todo o resto do painel passaria
// a se comparar contra dezembro, mostrando badge de atraso falso em tudo que só chega até o mês real.
const MES_MAIS_RECENTE_IDX = Math.min(ultimoMesGlobal(), MES_ATUAL_IDX);

// Confere se o indicador tem QUALQUER lançamento != 0 em algum município naquele mês — sem
// isso o freshBadge só olhava o tamanho do array de meses (quase sempre pré-cadastrado até
// Dezembro) e dizia "Atualizado até Setembro" mesmo quando setembro ainda estava zerado em
// tudo, só porque ninguém tinha rodado aquele export ainda. Achado por Eduardo em 2026-09-04.
function indicadorSemDadoNoMes(d, monthIdx) {
  if (!d || !Array.isArray(d.municipios)) return false;
  return d.municipios.every(m => !Array.isArray(m.realizado_mes) || !m.realizado_mes[monthIdx]);
}
function freshBadge(ultimoMes, opts = {}) {
  const idx = MESES.indexOf(ultimoMes);
  const atraso = MES_MAIS_RECENTE_IDX - idx;
  let cls = 'fresh-ok', texto = `Atualizado até ${ultimoMes}`;
  if (opts.snapshot) {
    cls = 'fresh-snapshot';
    texto = `Snapshot único — ${ultimoMes}`;
  } else if (atraso >= 2) {
    cls = 'fresh-stale';
    texto = `Atualizado até ${ultimoMes} — ${atraso} meses atrás do painel`;
  } else if (atraso === 1) {
    cls = 'fresh-warn';
    texto = `Atualizado até ${ultimoMes} — 1 mês atrás do painel`;
  } else if (opts.semDadoReal) {
    cls = 'fresh-warn';
    texto = `${ultimoMes} cadastrado, mas nenhum município tem lançamento ainda — confira se a rodada de atualização já passou por aqui (pode ser só início de mês)`;
  }
  return `<div class="fresh-badge ${cls}">${texto}</div>`;
}

// ---------- Acompanhamento diário de metas mensais (pedido de Eduardo em 2026-09-03) ----------
// Metas de Operações são fixas por mês inteiro; sem isso, olhar o realizado no meio do mês
// contra a meta cheia sempre parece "atrasado" até o último dia. Mostra quanto já deveria ter
// sido feito até ontem, proporcional aos dias corridos do mês corrente.
//
// 2026-09-08 (pedido de Eduardo): a ponderação não pode assumir que TODO indicador foi
// atualizado hoje — se um indicador só foi recalculado há 5 dias, cobrar meta "até ontem" (do
// dia real de hoje) é injusto, porque os últimos 5 dias nem chegaram a ser lançados ainda. Cada
// indicador agora carrega seu próprio "atualizado_em" (YYYY-MM-DD) no data.json, e a ponderação
// usa ESSA data como referência — não mais sempre "hoje". Sem esse campo (indicador ainda não
// migrado), cai de volta pro comportamento antigo (assume hoje) e avisa isso na tela.
function dataAtualizacaoIndicador(d) {
  if (!d || !d.atualizado_em) return null;
  const dt = new Date(d.atualizado_em + 'T00:00:00');
  return isNaN(dt.getTime()) ? null : dt;
}
function diasCorridosAteOntem(dataAtualizacao) {
  const agora = new Date();
  const diasNoMes = new Date(agora.getFullYear(), MES_ATUAL_IDX + 1, 0).getDate();
  let diaRef, semRegistro = false;
  if (dataAtualizacao instanceof Date && !isNaN(dataAtualizacao.getTime())) {
    const mesmoMes = dataAtualizacao.getFullYear() === agora.getFullYear() && dataAtualizacao.getMonth() === MES_ATUAL_IDX;
    if (mesmoMes) {
      diaRef = dataAtualizacao.getDate();
    } else if (dataAtualizacao.getFullYear() < agora.getFullYear() || dataAtualizacao.getMonth() < MES_ATUAL_IDX) {
      diaRef = 0; // atualizado antes do mês corrente começar — nenhum dia deste mês foi capturado ainda
    } else {
      diaRef = agora.getDate(); // data futura (não deveria acontecer) — cai pro comportamento padrão
    }
  } else {
    diaRef = agora.getDate();

  }
  const diasDecorridos = Math.max(0, diaRef - 1);
  return { diasNoMes, diaRef, diasDecorridos, semRegistro };
}
function metaMensalAjustada(metaMesCheia, dataAtualizacao) {
  const { diasNoMes, diasDecorridos } = diasCorridosAteOntem(dataAtualizacao);
  return diasNoMes ? (metaMesCheia * diasDecorridos / diasNoMes) : 0;
}
// Núcleo do cálculo (usado pelo banner das páginas de indicador E pela aba de Auditoria por
// município, pra garantir que os dois lugares mostrem exatamente o mesmo número).
function statusAcompanhamentoDiario(meta, realizado, higherIsBetter = true, arredondarMeta = false, dataAtualizacao = null) {
  const ref = diasCorridosAteOntem(dataAtualizacao);
  const metaAjustada = metaMensalAjustada(meta || 0, dataAtualizacao);
  // Na Auditoria (arredondarMeta=true), pedido de Eduardo em 2026-09-04: não marcar "abaixo do
  // esperado"/"passou do teto" por causa de fração de unidade — só quando a meta ajustada
  // completar um número inteiro. Meta (quanto maior melhor) arredonda pra baixo (mais
  // tolerante: só exige o que já "fechou"); teto (quanto menor melhor) arredonda pra cima
  // (também mais tolerante: só considera excedido quando passa de uma unidade inteira).
  const metaComparacao = arredondarMeta
    ? (higherIsBetter ? Math.floor(metaAjustada) : Math.ceil(metaAjustada))
    : metaAjustada;
  const diff = higherIsBetter ? ((realizado || 0) - metaComparacao) : (metaComparacao - (realizado || 0));
  const atrasado = diff < 0;
  const cls = atrasado ? 'pos' : 'neg'; // neg=verde(bom), pos=vermelho(ruim) — mesma convenção já usada no painel
  const statusTxt = higherIsBetter
    ? (atrasado ? 'abaixo do esperado pro dia de hoje' : 'em dia')
    : (atrasado ? 'já passou do teto esperado pro dia de hoje' : 'dentro do teto esperado até hoje');
  const rotuloMeta = higherIsBetter ? 'meta ajustada' : 'teto ajustado';
  return { metaAjustada, metaComparacao, diff, atrasado, cls, statusTxt, rotuloMeta, diaRef: ref.diaRef, semRegistro: ref.semRegistro };
}
function bannerAcompanhamentoDiario(itens) {
  // itens: [{ label, meta, realizado, higherIsBetter=true, dataAtualizacao=null }]
  let linhas = '';

    const higherIsBetter = it.higherIsBetter !== false;
    const s = statusAcompanhamentoDiario(it.meta, it.realizado, higherIsBetter, false, it.dataAtualizacao);
    const refTxt = s.semRegistro
      ? `<span style="color:var(--amber)">sem data de atualização registrada — assumindo hoje</span>`
      : (s.diaRef === 0 ? `<span style="color:var(--amber)">nenhum lançamento neste mês ainda</span>` : `atualizado até o dia ${s.diaRef}`);
    linhas += `<div>${it.label}: ${s.rotuloMeta} (${refTxt}) <b>${s.metaAjustada.toFixed(1)}</b> (de ${it.meta}/mês) &middot; realizado até agora <b>${it.realizado}</b> &middot; <span class="${s.cls}">${s.statusTxt}</span></div>`;
  });
  return `<div class="def-box" style="border-color:var(--amber);margin-bottom:14px">
    <b>📅 Acompanhamento diário</b> — cada indicador é ponderado pela sua própria data de atualização, não por "hoje" fixo.
    ${linhas}
    <span style="color:var(--muted);font-size:12px">Vale só pro mês em andamento — meses fechados no seletor abaixo continuam comparando com a meta cheia normalmente.</span>
  </div>`;
}

function kpiCard(label, val, isGoodWhenNegative=true, extra='') {
  let cls = 'kpi-neutral';
  if (typeof val === 'number') {
    cls = (val <= 0) === isGoodWhenNegative ? 'kpi-green' : 'kpi-red';
  }
  const display = typeof val === 'number' ? (val>0?'+':'') + val.toFixed(1) + '%' : val;
  return `<div class="kpi-card ${cls}"><div class="val">${display}</div><div class="lbl">${label}</div>${extra}</div>`;
}
// mini-gráfico do cartão: linha cheia = realizado do ano mês a mês, tracejada = meta (mesma escala)
function sparkSvg(real, meta, titulo) {
  const n = real.length; if (n < 2) return '';
  const max = Math.max(1, ...real, ...(meta || []));
  const X = (i) => (i / (n - 1)) * 96 + 2, Y = (v) => 24 - (v / max) * 21;
  const pts = (a) => a.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none" role="img" aria-label="${titulo}"><title>${titulo}</title>` +
    (meta ? `<polyline class="sp-meta" points="${pts(meta)}"/>` : '') + `<polyline class="sp-real" points="${pts(real)}"/></svg>`;
}
function subSpark(d, mi, textoSub) {
  return `<div class="sub">${textoSub}</div>` + sparkSvg(d.total_acum.slice(0, mi + 1), d.total_meta_acum.slice(0, mi + 1), 'Acumulado do ano mês a mês (linha cheia) e meta (tracejada)');
}

// ---- Home (onda 1 da revisão de 2026-10-13) ----
// Cartão de meta de PISO (POG, Padrinhos, Saque, Armas) pela meta PROPORCIONAL aos dias já fechados — a mesma regra
// do quadro de cumprimento. Antes o cartão comparava com a meta do mês cheio e ficava vermelho (POG 94%) enquanto o
// quadro mostrava verde (101%) no mês em andamento.
function kpiPisoEf(label, d, mi, tipo) {
  const pseudo = { realizado_mes: d.total_mes, meta_mes: d.total_meta_mes, realizado_acum: d.total_acum, meta_acum: d.total_meta_acum };
  const f = fatorMesEmAndamento(d, mi);
  const real = d.total_acum[mi], metaCheia = d.total_meta_acum[mi];
  const metaEf = metaPisoEfetiva(pseudo, '_acum', mi, f, tipo !== 'pog');
  const v = metaEf ? real / metaEf * 100 : 100;
  const st = tipo === 'pog' ? statusPog(v) : statusPiso(real, metaEf);
  const cls = st === 'verde' ? 'kpi-green' : (st === 'amarelo' ? 'kpi-amber' : 'kpi-red');
  const sub = f < 1 ? `${Math.round(v)}% da meta proporcional aos dias fechados · mês cheio: ${metaCheia}` : `${Math.round(v)}% da meta`;
  const tip = f < 1 ? `Cor calculada com a meta proporcional aos dias já fechados (${Math.round(metaEf)} de ${metaCheia} no período)` : '';
  const spark = sparkSvg(d.total_acum.slice(0, mi + 1), d.total_meta_acum.slice(0, mi + 1), 'Acumulado do ano mês a mês (linha cheia) e meta do mês cheio (tracejada)');
  return `<div class="kpi-card ${cls}" title="${tip}"><div class="val">${real}/${Math.round(metaEf)}</div><div class="lbl">${label}</div><div class="sub">${sub}</div>${spark}</div>`;
}

function normKey(s) {
  return (s||'').toString().toUpperCase()
    .normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]', 'g'), '');
}

const MUNICIPIOS_CANON = ['Águas Vermelhas','Araçuaí','Cachoeira de Pajeú','Comercinho','Coronel Murta',
  'Divisa Alegre','Itaobim','Itinga','Medina','Padre Paraíso','Pedra Azul','Ponto dos Volantes','Virgem da Lapa'];

function semaforoCell(cor, texto, titulo) {
  const map = {
    verde: {bg:'rgba(33,201,138,0.25)', fg:'#3fe0a5'},
    amarelo: {bg:'rgba(212,194,42,0.25)', fg:'#d4c22a'},
    vermelho: {bg:'rgba(230,72,79,0.25)', fg:'#ff8a8f'},
  };
  const c = map[cor];
  const tt = titulo ? ` title="${titulo}"` : '';
  return `<td${tt} style="background:${c.bg};color:${c.fg};font-weight:600;text-align:center">${texto}</td>`;
}

// Indicadores "teto" (quanto menor o realizado, melhor) — tolerância de 20% acima da meta = amarelo
function statusTeto(realizado, meta) {
  if (!meta) return realizado > 0 ? 'vermelho' : 'verde';
  const v = ((realizado - meta) / meta) * 100;
  if (v <= 0) return 'verde';
  if (v <= 20) return 'amarelo';
  return 'vermelho';
}
// Indicadores "piso" (quanto maior o realizado, melhor) — abaixo de 80% da meta = vermelho
function statusPiso(realizado, meta) {
  if (!meta) return 'verde';
  const v = (realizado / meta) * 100;
  if (v >= 100) return 'verde';
  if (v >= 80) return 'amarelo';
  return 'vermelho';
}
// Mês em andamento: o quadro da Home comparava o realizado de poucos dias com a meta do MÊS
// CHEIO (ex.: dia 6, Padrinhos 5/72 = vermelho) — achado por Eduardo em 2026-10-06. Passa a
// proporcionalizar a meta de indicadores de PISO pelos dias já fechados do próprio indicador
// (mesma regra da Auditoria: diasCorridosAteOntem + data de atualização de cada um, meta
// arredondada pra baixo). Mês fechado = fator 1 (meta cheia). Indicadores de TETO
// (IMV/CVPe/CVPa/Furto) seguem comparando com o teto do mês cheio: estourar o teto mensal
// é sempre ruim, então não gera falso vermelho.
function fatorMesEmAndamento(dataObj, mi) {
  if (mi !== MES_ATUAL_IDX) return 1;
  const r = diasCorridosAteOntem(dataAtualizacaoIndicador(dataObj));
  return r.diasNoMes ? (r.diasDecorridos / r.diasNoMes) : 1;
}
function metaPisoEfetiva(m, sufixo, mi, fator, arredondar = true) {
  const meta = m['meta' + sufixo][mi] - m.meta_mes[mi] * (1 - fator);
  return arredondar ? Math.floor(meta + 1e-9) : meta;
}
function statusPisoEf(m, dataObj, sufixo, mi) {
  const f = fatorMesEmAndamento(dataObj, mi);
  return statusPiso(m['realizado' + sufixo][mi], metaPisoEfetiva(m, sufixo, mi, f));
}
function celulaPisoEf(m, dataObj, sufixo, mi) {
  const f = fatorMesEmAndamento(dataObj, mi);
  const real = m['realizado' + sufixo][mi], meta = m['meta' + sufixo][mi];
  const mEf = metaPisoEfetiva(m, sufixo, mi, f);
  const tip = f < 1 ? `Cor calculada com a meta proporcional aos dias já fechados: ${mEf} (de ${meta} no período)` : '';
  return semaforoCell(statusPiso(real, mEf), real + '/' + meta, tip);
}
// IDOB sem nenhuma operação Boemia e sem vítima = nada a avaliar (100%, igual ao ITVD sem
// ocorrência) em vez de 0% vermelho — achado por Eduardo em 2026-10-06. Com vítima e sem
// operação segue 0%.
function calcIdobIndice(qop, vit) {
  if (!qop) return vit ? 0 : 100;
  return ((qop - vit * 10) / qop) * 100;
}

// POG usa banda específica (meta = 100%, 95-105 verde, 90-95/105-110 amarelo, resto vermelho)
function statusPog(v) {
  if (v >= 95 && v <= 105) return 'verde';
  if ((v >= 90 && v < 95) || (v > 105 && v <= 110)) return 'amarelo';
  return 'vermelho';
}
// Índices de qualidade (IDOB/ITVD): >=95 verde, >=85 amarelo, resto vermelho
function statusQualidade(v) {
  if (v >= 95) return 'verde';
  if (v >= 85) return 'amarelo';
  return 'vermelho';
}

// Pontuação do ranking geral (Home)
function statusToPoints(status) { return status === 'verde' ? 2 : (status === 'amarelo' ? 1 : 0); }

// IMV/CVPe/CVPa: cumpriu = 3 pontos base; cada -10% de redução além da meta = +1; cada +10% fora da meta = -1
function scoreTeto(realizado, meta) {
  const v = meta ? ((realizado - meta) / meta) * 100 : (realizado > 0 ? 100 : 0);
  if (v <= 0) return 3 + Math.floor(-v / 10);
  return -Math.floor(v / 10);
}

    t += semaforoCell(statusPog(pogVt), pogVt.toFixed(0) + '%');
    t += piso(DATA.ppag.y15001, miY1) + piso(DATA.ppag.y07012, miY2) + piso(DATA.ppag.y07014, miY3);
    t += piso(DATA.cavaloaco, miCav) + piso(DATA.rolezinho, miRolez) + piso(DATA.padesc, miPadesc) + piso(DATA.saque_seguro, miSaque);
    const idobT = calcIdobLocal(DATA.idob['total_qtdeop_' + sfx][miIdob], DATA.idob['total_mv_' + sfx][miIdob] + DATA.idob['total_cvpe_' + sfx][miIdob] + DATA.idob['total_cvpa_' + sfx][miIdob]);
    t += semaforoCell(statusQualidade(idobT), idobT.toFixed(0) + '%');
    const itvdT = calcItvdLocal(DATA.itvd['total_trafico_' + sfx][miItvd], DATA.itvd['total_vit_' + sfx][miItvd]);
    t += semaforoCell(statusQualidade(itvdT), itvdT.toFixed(0) + '%') + `</tr>`;
    rows += t;
  }

  const tituloPeriodo = modo === 'acum' ? `Acumulado Jan-${MESES[miMv]} (IMV-Furto) / Jan-${MESES[miPog]} (demais)` : `${MESES[miMv]} (IMV-Furto) / ${MESES[miPog]} (demais)`;
  let html = `<div class="table-wrap" style="margin-bottom:0">

}

function drawBarChart(canvasId, labels, values, color) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.clientWidth * 2;
  const H = canvas.height = 260 * 2;
  ctx.scale(1,1);
  ctx.clearRect(0,0,W,H);
  const max = Math.max(...values, 1);
  const n = labels.length;
  const barW = Math.min(56, (W - 40) / n * 0.58);
  const gap = (W-40) / n;
  ctx.font = '600 19px "IBM Plex Mono", monospace';
  values.forEach((v, i) => {
    const barH = (v / max) * (H - 80);
    const x = 20 + i*gap + (gap-barW)/2;
    const y = H - 60 - barH;
    const grad = ctx.createLinearGradient(0, y, 0, H-60);
    grad.addColorStop(0, color);
    grad.addColorStop(1, color + '55');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, barW, barH);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, barW, barH);
    ctx.fillStyle = '#eaf1f8';
    ctx.textAlign = 'center';
    ctx.fillText(v, x + barW/2, y - 8);
    ctx.save();
    ctx.translate(x + barW/2, H - 40);
    ctx.rotate(-Math.PI/8);
    ctx.font = '13px "IBM Plex Mono", monospace';
    ctx.fillStyle = '#7891a8';
    ctx.textAlign = 'right';
    const lbl = (labels[i]||'').toString().slice(0, 22);
    ctx.fillText(lbl, 0, 0);
    ctx.restore();
  });
}

function renderIndicatorPage(key, title, localKey, faixaKey, higherIsBetter=false, showDailyBanner=false) {
  const d = DATA[key];
  const mesesLocais = d.meses || MESES.slice(0, d.total_mes.length);
  let monthIdx = Math.min(MES_ATUAL_IDX, mesesLocais.length - 1); // mês mais recente disponível pra esse indicador, capado no mês atual real
  const showCharts = !!(localKey && faixaKey && DATA[localKey] && DATA[faixaKey]);

  function fmtPctPolarity(v) {
    const good = higherIsBetter ? v >= 0 : v <= 0;
    const cls = good ? 'neg' : 'pos'; // 'neg' = verde, 'pos' = vermelho (ver fmtPct/kpiCard)
    const sign = v > 0 ? '+' : '';
    return `<span class="${cls}">${sign}${v.toFixed(1)}%</span>`;
  }
  // Saldo: quanto falta (ruim) ou quanto passou (bom) da meta/teto acumulado. Corrigido em
  // 2026-09-04 (achado por Eduardo em Saque Seguro) — antes calculava sempre meta-real, o que
  // só faz sentido pra indicador de teto (mv/cvpe/cvpa/furto: positivo = folga antes de
  // estourar). Pra indicador de meta (armas/padesc/saque_seguro), isso invertia o sinal —
  // exceder a meta aparecia como saldo negativo sem cor, dando a entender que estava atrasado.
  function fmtSaldo(realAcum, metaAcum) {
    const saldo = higherIsBetter ? (realAcum - metaAcum) : (metaAcum - realAcum);
    const cls = saldo >= 0 ? 'neg' : 'pos'; // 'neg' = verde, 'pos' = vermelho (mesma convenção do painel)
    const sign = saldo > 0 ? '+' : '';
    return `<span class="${cls}">${sign}${saldo}</span>`;
  }

  function table(mi) {
    let rows = '';
    d.municipios.forEach(m => {
      const realMes = m.realizado_mes[mi];
      const metaMes = m.meta_mes[mi];
      const realAcum = m.realizado_acum[mi];
      const metaAcum = m.meta_acum[mi];
      const pctAcum = pct(realAcum, metaAcum);
      rows += `<tr>
        <td style="text-align:left">${m.nome}</td>
        <td>${realMes}</td>
        <td>${metaMes}</td>
        <td class="col-divider">${realAcum}</td>
        <td>${metaAcum}</td>
        <td>${fmtPctPolarity(pctAcum)}</td>
        <td>${fmtSaldo(realAcum, metaAcum)}</td>
      </tr>`;
    });
    const totRealAcum = d.total_acum[mi], totMetaAcum = d.total_meta_acum[mi];
    const totPct = pct(totRealAcum, totMetaAcum);
    rows += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)">
        <td style="text-align:left">TOTAL</td>
        <td>${d.total_mes[mi]}</td>
        <td>${d.total_meta_mes[mi]}</td>
        <td class="col-divider">${totRealAcum}</td>
        <td>${totMetaAcum}</td>
        <td>${fmtPctPolarity(totPct)}</td>
        <td>${fmtSaldo(totRealAcum, totMetaAcum)}</td>
      </tr>`;
    return rows;
  }

  let html = `<div class="page-title">${title}</div>`;
  html += freshBadge(mesesLocais[monthIdx], { semDadoReal: indicadorSemDadoNoMes(d, monthIdx) });
  html += sigopButton(key);
  if (DEFS[key]) html += `<div class="def-box">${DEFS[key]}</div>`;
  if (showDailyBanner) {
    html += bannerAcompanhamentoDiario([{ label: title, meta: d.total_meta_mes[MES_ATUAL_IDX], realizado: d.total_mes[MES_ATUAL_IDX], higherIsBetter, dataAtualizacao: dataAtualizacaoIndicador(d) }]);
  }
  html += `<select class="month-select" id="monthSel">`;
  mesesLocais.forEach((m,i) => html += `<option value="${i}" ${i===monthIdx?'selected':''}>${m}</option>`);
  html += `</select>`;
  html += `<table class="data-table" id="dataTable"><thead><tr>
    <th style="text-align:left">Município</th><th>Realizado Mês</th><th>Meta Mês</th>
    <th class="col-divider">Realizado Acum</th><th>Meta Acum</th><th>% vs Meta (Acum)</th><th>Saldo</th>
  </tr></thead><tbody>${table(monthIdx)}</tbody></table>`;
  if (showCharts) {
    const labelLocal = key === 'furto' ? 'Causa' : 'Local Imediato';
    const labelFaixa = key === 'furto' ? 'Logradouro' : 'Faixa Horária';
    html += `<div class="charts-row">
      <div class="chart-box"><h3>${labelLocal}</h3><canvas id="chartLocal" style="width:100%;height:260px"></canvas></div>
      <div class="chart-box"><h3>${labelFaixa}</h3><canvas id="chartFaixa" style="width:100%;height:260px"></canvas></div>
    </div>`;
  }
  const detCfg = DETALHADO_CONFIG[key];
  if (detCfg && DATA[detCfg.dataKey]) {
    html += detalhadoPorNaturezaHtml(DATA[detCfg.dataKey], detCfg.titulo, detCfg.colunas.concat(((DATA[detCfg.dataKey].total || {}).outros || 0) > 0 ? [{ key: 'outros', label: 'Outros (fora das naturezas ao lado)' }] : []), detCfg.defHtml, detCfg.fonteHtml);
  }
  document.getElementById('main').innerHTML = html;

  document.getElementById('monthSel').addEventListener('change', (e) => {
    document.querySelector('#dataTable tbody').innerHTML = table(parseInt(e.target.value));
  });

  if (showCharts) {
    const localData = DATA[localKey].slice(0, 10);
    const faixaData = DATA[faixaKey].slice(0, 10);
    drawBarChart('chartLocal', localData.map(x=>x[0]), localData.map(x=>x[1]), '#e8a83c');
    drawBarChart('chartFaixa', faixaData.map(x=>x[0]), faixaData.map(x=>x[1]), '#21c98a');
  }
}

function pogBandColor(v) {
  // Meta = 100%. Faixa 95-105 = verde, 90-95/105-110 = amarelo, fora disso = vermelho.
  if (v >= 95 && v <= 105) return { bg: 'rgba(33,201,138,0.22)', fg: '#3fe0a5' };
  if ((v >= 90 && v < 95) || (v > 105 && v <= 110)) return { bg: 'rgba(212,194,42,0.22)', fg: '#d4c22a' };
  return { bg: 'rgba(230,72,79,0.22)', fg: '#ff8a8f' };
}

  return `<td style="background:${c.bg};color:${c.fg};font-weight:600">${v.toFixed(2)}%</td>`;
}
// Saldo do POG: realizado - meta (positivo = já passou da meta = bom). Direção já estava

}

  html += `<div class="updated">IDOB = [Qtde de Operações Boemia − (MV+CVPe+CVPa com vítima em bar/boate como local do fato) × 10] ÷ Qtde de Operações × 100 — índice único, calculado com a soma dos 3 tipos de vítima de uma vez (não um IDOB separado por tipo). As colunas MV/CVPe/CVPa acima mostram a contagem bruta de cada tipo, só pra apoiar a leitura de onde vem a variação do índice. Quanto maior, melhor. Fonte: export específico da pasta IDOB (não mais o RAT geral, que superestimava por capturar operações fora de escopo), cruzado com o REDS geral pelo local do fato.</div>`;

      document.querySelector('#boemiaMetaTable tbody').innerHTML = bmRows(parseInt(e.target.value));
    });
  }
}

function renderITVDPage() {
  const d = DATA.itvd;
  const mesesLocais = d.meses || MESES.slice(0, d.total_trafico_mes.length);
  let mi = Math.min(MES_ATUAL_IDX, mesesLocais.length - 1);

  function calcItvd(t, v) {
    if (!t) return 100;
    return ((t - v*2) / t) * 100;
  }

  function rows(mi) {
    let html = '';
    const list = d.municipios.map(m => ({
      nome: m.nome,
      tMes: m.trafico_mes[mi], vMes: m.vit_mes[mi], iMes: calcItvd(m.trafico_mes[mi], m.vit_mes[mi]),
      tAcum: m.trafico_acum[mi], vAcum: m.vit_acum[mi], iAcum: calcItvd(m.trafico_acum[mi], m.vit_acum[mi]),
    }));
    const cell = (v) => `<td style="background:${idobColor(v)};color:${idobTextColor(v)};font-weight:600">${v.toFixed(1)}</td>`;
    list.forEach(x => {
      html += `<tr><td style="text-align:left">${x.nome}</td>
        <td>${x.tMes}</td><td>${x.vMes}</td>${cell(x.iMes)}
        <td class="col-divider">${x.tAcum}</td><td>${x.vAcum}</td>${cell(x.iAcum)}
      </tr>`;
    });
    const tTMes=d.total_trafico_mes[mi], tVMes=d.total_vit_mes[mi], tTAcum=d.total_trafico_acum[mi], tVAcum=d.total_vit_acum[mi];
    html += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)"><td style="text-align:left">70º BPM</td>
      <td>${tTMes}</td><td>${tVMes}</td>${cell(calcItvd(tTMes,tVMes))}
      <td class="col-divider">${tTAcum}</td><td>${tVAcum}</td>${cell(calcItvd(tTAcum,tVAcum))}
    </tr>`;
    return html;
  }

  let html = `<div class="page-title">Indicador de Combate ao Tráfico e Violência Relacionada às Drogas (ITVD) em ${mesesLocais[mi]} de 2026</div>`;
  html += `<div class="def-box"><span class="formula">ITVD = [Total de REDS Tráfico e Uso &minus; (REDS de MV + CVPe + CVPa) &times; 2] &divide; Total de REDS Tráfico e Uso &times; 100</span><span class="polarity">Polaridade: quanto maior (%), melhor &mdash; valores positivos indicam impacto preventivo, negativos mostram que houve mais crimes, exigindo ajuste no esforço policial. Sem REDS de Tráfico/Uso no período = 100% (sem problema a resolver, positivo).</span></div>`;
  html += `<select class="month-select" id="itvdMonthSel">`;
  mesesLocais.forEach((m,i) => html += `<option value="${i}" ${i===mi?'selected':''}>${m}</option>`);
  html += `</select>`;
  html += `<table class="data-table" id="itvdTable"><thead><tr>
    <th style="text-align:left">Município</th><th>REDS Tráfico/Uso (Mês)</th><th>Vítimas MV+CVPe+CVPa (Mês)</th><th>ITVD (Mês)</th>
    <th class="col-divider">REDS Tráfico/Uso (Acum)</th><th>Vítimas (Acum)</th><th>ITVD (Acum)</th>
  </tr></thead><tbody>${rows(mi)}</tbody></table>`;
  html += `<div class="updated">Fonte: export REDS geral (7.965 registros), naturezas I04033 (tráfico), I04028 (uso) e I99000, cruzado com as vítimas de MV/CVPE/CVPA de toda a cidade (não restrito a local específico).</div>`;
  document.getElementById('main').innerHTML = html;
  document.getElementById('itvdMonthSel').addEventListener('change', (e) => {
    document.querySelector('#itvdTable tbody').innerHTML = rows(parseInt(e.target.value));
  });
}

function renderCavaloAcoPage() {
  const d = DATA.cavaloaco;
  const mesesLocais = d.meses || MESES.slice(0, d.total_mes.length);
  let mi = Math.min(MES_ATUAL_IDX, mesesLocais.length - 1);

  function monthCell(cumpriu) {
    return cumpriu
      ? `<td style="background:rgba(33,201,138,0.22);color:#3fe0a5;font-weight:600">CUMPRIU</td>`
      : `<td style="background:rgba(230,72,79,0.22);color:#ff8a8f;font-weight:600">NÃO CUMPRIU</td>`;
  }

  function rows(mi) {
    let html = '';
    d.municipios.forEach(m => {
      const rMes=m.realizado_mes[mi], mMes=m.meta_mes[mi], rAc=m.realizado_acum[mi], mAc=m.meta_acum[mi];
      const dAc = mAc ? (rAc/mAc*100) : 100;
      const cls = dAc>=100?'neg':'pos';
      const cumpriuMes = mMes ? (rMes >= mMes) : true;
      html += `<tr><td style="text-align:left">${m.nome}</td>
        <td>${mMes}</td><td>${rMes}</td>${monthCell(cumpriuMes)}
        <td class="col-divider">${mAc}</td><td>${rAc}</td><td><span class="${cls}">${dAc.toFixed(0)}%</span></td>
      </tr>`;
    });
    const tRMes=d.total_mes[mi], tMMes=d.total_meta_mes[mi], tRAc=d.total_acum[mi], tMAc=d.total_meta_acum[mi];
    const tDAc = tMAc? tRAc/tMAc*100:100;
    const tCumpriuMes = tMMes ? (tRMes >= tMMes) : true;
    html += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)"><td style="text-align:left">70º BPM</td>
      <td>${tMMes}</td><td>${tRMes}</td>${monthCell(tCumpriuMes)}
      <td class="col-divider">${tMAc}</td><td>${tRAc}</td><td><span class="${tDAc>=100?'neg':'pos'}">${tDAc.toFixed(0)}%</span></td>
    </tr>`;
    return html;
  }

  // ---------- Eficácia e Eficiência (produtividade extraída do RAT) ----------
  const ef = DATA.cavaloaco_eficacia;
  const efMesesLocais = ef ? ef.meses : mesesLocais;

  function efSum(arr, mi, acum) {
    return acum ? arr.slice(0, mi + 1).reduce((a, b) => a + b, 0) : arr[mi];
  }
  function efPct(num, den) { return den > 0 ? (num / den * 100) : 0; }

  function efKpis(mi) {
    const ops = ef.municipios.reduce((s, m) => s + efSum(m.num_ops, mi, true), 0);
    const motosFisc = ef.municipios.reduce((s, m) => s + efSum(m.motos_fisc, mi, true), 0);
    const motosAutu = ef.municipios.reduce((s, m) => s + efSum(m.motos_autu, mi, true), 0);
    const veicRetidos = ef.municipios.reduce((s, m) => s + efSum(m.veic_retidos, mi, true), 0);
    const inabilitados = ef.municipios.reduce((s, m) => s + efSum(m.inabilitados, mi, true), 0);
    const redsGerado = ef.municipios.reduce((s, m) => s + efSum(m.reds_gerado, mi, true), 0);
    const efetivoSum = ef.municipios.reduce((s, m) => s + efSum(m.efetivo_sum, mi, true), 0);
    const taxaAutuacao = efPct(motosAutu, motosFisc);
    const taxaReds = efPct(redsGerado, ops);
    const motosPorOp = ops > 0 ? (motosFisc / ops) : 0;
    const efetivoMedio = ops > 0 ? (efetivoSum / ops) : 0;

    let h = `<div class="kpi-grid">`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${motosFisc.toLocaleString('pt-BR')}</div><div class="lbl">Motos Fiscalizadas</div></div>`;
    h += `<div class="kpi-card kpi-green"><div class="val">${taxaAutuacao.toFixed(1)}%</div><div class="lbl">Taxa de Autuação (${motosAutu}/${motosFisc})</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${veicRetidos}</div><div class="lbl">Veículos Retidos por Infração</div></div>`;
    h += `<div class="kpi-card ${redsGerado > 0 ? 'kpi-green' : 'kpi-neutral'}"><div class="val">${redsGerado}</div><div class="lbl">REDS Gerados (${taxaReds.toFixed(1)}% das op.)</div></div>`;
    h += `</div>`;
    h += `<div class="kpi-grid">`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${efetivoMedio.toFixed(1)}</div><div class="lbl">Efetivo Médio/Operação</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${motosPorOp.toFixed(1)}</div><div class="lbl">Motos Fiscalizadas/Operação</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${inabilitados}</div><div class="lbl">Inabilitados Autuados</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${ops.toLocaleString('pt-BR')}</div><div class="lbl">Total de Operações (RAT)</div></div>`;
    h += `</div>`;
    return h;
  }

  function efRows(mi) {
    let h = '';
    ef.municipios.forEach(m => {
      const ops = efSum(m.num_ops, mi, true), motosFisc = efSum(m.motos_fisc, mi, true), motosAutu = efSum(m.motos_autu, mi, true);
      const veicFisc = efSum(m.veic_fisc, mi, true), veicRet = efSum(m.veic_retidos, mi, true), redsGer = efSum(m.reds_gerado, mi, true);
      const efetivo = efSum(m.efetivo_sum, mi, true);
      const taxa = efPct(motosAutu, motosFisc);
      const efetivoMedio = ops > 0 ? (efetivo / ops) : 0;
      const tempoMed = m.tempo_mediana_min[mi] || 0;
      h += `<tr><td style="text-align:left">${m.nome}</td>
        <td>${ops}</td><td>${motosFisc}</td><td>${motosAutu}</td><td>${taxa.toFixed(1)}%</td>
        <td class="col-divider">${veicFisc}</td><td>${veicRet}</td>
        <td class="col-divider">${redsGer}</td><td>${efetivoMedio.toFixed(1)}</td><td>${tempoMed}</td>
      </tr>`;
    });
    return h;
  }

  let natRows = '';
  (ef.naturezas_reds_geradas || []).slice(0, 12).forEach(n => {
    natRows += `<tr><td style="text-align:left"><code>${n.codigo}</code></td><td style="text-align:left">${n.descricao}</td><td>${n.qtd}</td></tr>`;
  });

  let html = `<div class="page-title">Operação Cavalo de Aço em ${mesesLocais[mi]} de 2026</div>`;
  html += `<div class="def-box">${DEFS.cavaloaco}</div>`;
  html += bannerAcompanhamentoDiario([{ label: 'Cavalo de Aço (Batalhão)', meta: d.total_meta_mes[MES_ATUAL_IDX], realizado: d.total_mes[MES_ATUAL_IDX], dataAtualizacao: dataAtualizacaoIndicador(d) }]);
  html += `<select class="month-select" id="cavaloacoMonthSel">`;
  mesesLocais.forEach((m,i) => html += `<option value="${i}" ${i===mi?'selected':''}>${m}</option>`);
  html += `</select>`;
  html += `<table class="data-table" id="cavaloacoTable"><thead><tr>
    <th style="text-align:left">Município</th><th>Meta Op. Mês</th><th>Op. Mês</th><th>Cumpriu Mês?</th>
    <th class="col-divider">Meta Op. Acum</th><th>Op. Acum</th><th>Desemp.</th>
  </tr></thead><tbody>${rows(mi)}</tbody></table>`;
  html += `<div class="updated">Fonte: export REDS (Natureza=Y01003 E Histórico contém "Cavalo de Aço" E Unidade Responsável=70 BPM), ${d.total_acum[d.total_acum.length-1]} operações jan-ago/2026 (filtro atualizado em 2026-08-11 — antes não exigia o Histórico, o que contava toda operação Y01003, não só as de Cavalo de Aço). Op. = nº de REDS; Motos Abordadas = soma do indicador "Qde de motocicletas fiscalizadas" de cada RAT (fonte separada, não tocada por essa mudança). Falta confirmar os códigos exatos dos componentes de recuperação de veículo/prisão/arma/drogas/clonagem pra fechar o indicador IDOCA completo (fórmula ainda pendente de validação).</div>`;

  if (ef) {
    html += `<div class="page-title" style="margin-top:34px;font-size:16px">Eficácia e Eficiência (Acumulado até ${mesesLocais[mi]})</div>`;
    html += `<div class="def-box">Extraído do campo <code>PRODUTIVIDADE</code> de cada RAT de Cavalo de Aço (indicadores lançados pela guarnição na hora de fechar o registro) e do campo <code>REDS_RELACIONADOS</code> (quando a fiscalização gera um REDS à parte — clonagem, drogas, arma, foragido etc.). <b>Eficácia</b> = o que a fiscalização efetivamente produz (autuações, retenções, REDS gerados). <b>Eficiência</b> = quanto recurso (efetivo, tempo) foi empregado pra produzir isso. Contagem de operações aqui vem do RAT (NOME_OPERACAO contém "CAVALO"), levemente diferente do nº oficial de operações (que vem do REDS com Histórico) — números próximos mas não idênticos, tratar como uma lente complementar, não substituta.</div>`;
    html += `<div id="cavaloacoEfKpis">${efKpis(mi)}</div>`;
    html += `<table class="data-table" id="cavaloacoEfTable"><thead><tr>
      <th style="text-align:left">Município</th><th>Op. (RAT)</th><th>Motos Fisc.</th><th>Motos Autu.</th><th>Taxa Autu.</th>
      <th class="col-divider">Veíc. Fisc.</th><th>Veíc. Retidos</th>
      <th class="col-divider">REDS Gerados</th><th>Efetivo Méd.</th><th>Tempo Med.(min)</th>
    </tr></thead><tbody>${efRows(mi)}</tbody></table>`;
    if (natRows) {
      html += `<div class="page-title" style="margin-top:24px;font-size:14px">Naturezas dos REDS Gerados a partir da Fiscalização (70º BPM, ano)</div>`;
      html += `<table class="data-table"><thead><tr><th style="text-align:left">Código</th><th style="text-align:left">Natureza</th><th>Qtde</th></tr></thead><tbody>${natRows}</tbody></table>`;
    }
    html += `<div class="updated">Tempo mediano exclui registros com OPR_TEMPO_TOTAL_MINUTOS &gt; 480 (RATs provavelmente esquecidos abertos — outlier de digitação, não representa a duração real da operação). ${ef.fonte}.</div>`;
  }

  document.getElementById('main').innerHTML = html;
  document.getElementById('cavaloacoMonthSel').addEventListener('change', (e) => {
    const mi2 = parseInt(e.target.value);
    document.querySelector('#cavaloacoTable tbody').innerHTML = rows(mi2);
    if (ef) {
      document.getElementById('cavaloacoEfKpis').innerHTML = efKpis(mi2);
      document.querySelector('#cavaloacoEfTable tbody').innerHTML = efRows(mi2);
    }
  });
}

function renderRolezinhoPage() {

  html += bannerAcompanhamentoDiario([{ label: 'Rolezinho (Batalhão)', meta: d.total_meta_mes[MES_ATUAL_IDX], realizado: d.total_mes[MES_ATUAL_IDX], dataAtualizacao: dataAtualizacaoIndicador(d) }]);

function desColor(reds, prisoes) {
  const des = reds > 0 ? (prisoes / reds) * 100 : 100;
  if (des >= 50) return { bg: 'rgba(33,201,138,0.22)', fg: '#3fe0a5' };
  if (des >= 25) return { bg: 'rgba(240,190,50,0.22)', fg: '#e6b400' };
  return { bg: 'rgba(230,72,79,0.22)', fg: '#ff8a8f' };
}

function gravBadge(g) {
  const map = {
    critica: { bg: '#c0392b', fg: '#fff', label: 'CRÍTICA' },
    alta: { bg: '#d2691e', fg: '#0b0f14', label: 'ALTA' },
    media: { bg: '#b8860b', fg: '#0b0f14', label: 'MÉDIA' },
  };
  const c = map[g] || { bg: '#666', fg: '#fff', label: (g || '').toUpperCase() };
  return `<span style="background:${c.bg};color:${c.fg};font-weight:700;font-size:11px;letter-spacing:0.04em;padding:4px 10px;border-radius:3px;text-transform:uppercase;white-space:nowrap">${c.label}</span>`;
}

// Situação dos casos de VD por cidade (ocorrências desde Setembro cruzadas com os casos do PPVD pelo semáforo
// vermelho/amarelo/azul/verde). Usada no ranking desta página e no cartão da Home.
async function vdSituacaoCasos() {
  const vd = DATA.violencia_domestica, lista = [];
  MUNICIPIOS_CANONICAL.forEach(nome => {
    const k = Object.keys(vd.ocorrencias || {}).find(x => normMun(x) === normMun(nome));
    (k ? vd.ocorrencias[k] : []).filter(o => o.m >= HOME_VD_MES_INICIO).forEach(o => lista.push({ mun: nome, o }));
  });
  const casos = await ppvdBuscarCasosVD(lista.map(x => x.o.r).filter(Boolean));
  const novo = () => ({ v: 0, a: 0, z: 0, g: 0, semCaso: 0, atrasados: 0 });
  const porCidade = {}, total = novo();
  lista.forEach(({ mun, o }) => {
    const caso = o.r ? (casos[o.r] || null) : null, sem = ppvdSemaforoVD(caso);
    const cid = porCidade[mun] = porCidade[mun] || novo();
    [cid, total].forEach(c => {
      if (sem === 'vermelho') { c.v++; if (!caso) c.semCaso++; else if (ppvdVisitaAtrasadaVD(caso)) c.atrasados++; }
      else if (sem === 'amarelo') c.a++; else if (sem === 'azul') c.z++; else c.g++;
    });
  });
  return { lista, casos, porCidade, total };
}

  const homicGeral = sum(d.panorama.homic_mes);
  const tentGeral = sum(d.panorama.tent_hom_mes || []);
  const popTotal = municipiosData.reduce((s, m) => s + (m.pop || 0), 0);
  const taxaGeral = popTotal ? (totalGeral / popTotal * 100000) : 0;
  const totalEnderecos = municipiosData.reduce((s, m) => s + (m.enderecos_reincidentes || 0), 0); // contagem pública (por município)

  // último mês com ocorrência (o mês corrente é parcial) — a série e o comparativo só vão até ele; meses futuros não aparecem
  let iUlt = Math.min(MES_ATUAL_IDX, d.panorama.total_mes.length - 1);
  while (iUlt > 0 && !d.panorama.total_mes[iUlt]) iUlt--;

  html += `<div class="kpi-card ${totalEnderecos > 0 ? 'kpi-red' : 'kpi-green'}"><div class="val">${totalEnderecos}</div><div class="lbl">Endereços com Reincidência</div></div>`;
  html += `</div>`;

  html += `<div class="page-title" style="margin-top:34px;font-size:16px">Ranking por Município (taxa por 100 mil habitantes)</div>`;
  const ranking = municipiosData.slice().sort((a, b) => b.taxa_100k - a.taxa_100k);

  const munFiltroAtual = normMun(getMunFiltro());
  html += `<div class="vd-recorte">Clique numa cidade para ver os casos dela abaixo.${comSituacao ? ' As colunas de situação contam as ocorrências desde ' + (DATA.mv.meses || MESES)[HOME_VD_MES_INICIO - 1] + ' pelo semáforo dos casos no PPVD.' : ''}</div>`;
  html += `<div class="table-wrap"><table class="data-table" id="vdRanking"><thead><tr><th>Ranking</th><th style="text-align:left">Município</th><th>Pop.</th><th>Ocorrências (${d.periodo_dados})</th><th>Taxa/100k hab.</th><th>Endereços Reincid.</th>${comSituacao ? '<th title="Novos ou em atraso">✕ Novos/atraso</th><th title="Atendimento iniciado">! Iniciado</th><th title="Em acompanhamento">◆ Acomp.</th><th title="Estabilizados">✓ Estab.</th>' : ''}</tr></thead><tbody>`;
  const sitVazia = comSituacao ? '<td class="sit-cel z" data-s="v">·</td><td class="sit-cel z" data-s="a">·</td><td class="sit-cel z" data-s="z">·</td><td class="sit-cel z" data-s="g">·</td>' : '';
  ranking.forEach((m, i) => {
    const c = rankColor(i, ranking.length, true);
    html += `<tr class="rank-clic${normMun(m.nome) === munFiltroAtual ? ' sel' : ''}" data-mun="${m.nome}" title="Ver os casos de ${m.nome}"><td style="background:${c};color:${rankTextColor(c)};font-weight:700">${i + 1}</td><td style="text-align:left">${m.nome}</td><td>${fmtBr(m.pop, 0)}</td><td>${m.total_periodo}</td><td>${fmtBr(m.taxa_100k, 1)}</td><td>${m.enderecos_reincidentes > 0 ? '⚠ ' + m.enderecos_reincidentes : '—'}</td>${sitVazia}</tr>`;
  });
  html += `<tr style="font-weight:700;background:rgba(255,255,255,0.08)" id="vdRankingTotal"><td></td><td style="text-align:left">70º BPM</td><td>${fmtBr(popTotal, 0)}</td><td>${totalGeral}</td><td>${fmtBr(taxaGeral, 1)}</td><td>${totalEnderecos}</td>${sitVazia}</tr>`;
  html += `</tbody></table></div>`;

  html += `<div class="page-title" style="margin-top:34px;font-size:16px">Série Mensal — 70º BPM</div>`;
  html += `<table class="data-table"><thead><tr><th style="text-align:left">Mês</th><th>Ocorrências VD</th><th>Homicídios/Feminicídios (causa VD)</th><th>Tentativas (causa VD)</th></tr></thead><tbody>`;
  mesesLocais.slice(0, iUlt + 1).forEach((m, i) => {
    html += `<tr><td style="text-align:left">${m}${i === iUlt && parcial ? ' (parcial)' : ''}</td><td>${d.panorama.total_mes[i]}</td><td>${d.panorama.homic_mes[i]}</td><td>${(d.panorama.tent_hom_mes || [])[i] || 0}</td></tr>`;
  });
  html += `</tbody></table>`;

  // cidade = botões do topo (filtro global) ou clique no ranking; sem filtro mostra a de maior taxa. Período em botões.
  let idxDefault = munFiltroAtual ? municipiosData.findIndex(m => normMun(m.nome) === munFiltroAtual) : -1;
  const semFiltro = idxDefault < 0;
  if (semFiltro) idxDefault = municipiosData.indexOf(ranking[0]);
  let periodoAtual = 'acum';
  try { const salvo = localStorage.getItem('vdPeriodo'); if (salvo === 'acum' || (/^\d+$/.test(salvo || '') && parseInt(salvo) <= iUlt)) periodoAtual = salvo; } catch (e) {}
  html += `<div class="page-title" style="margin-top:34px;font-size:16px" id="vdTituloCidade">Casos de ${municipiosData[idxDefault].nome}</div>`;
  if (semFiltro) html += `<div class="vd-recorte">Mostrando a cidade de maior taxa. Escolha outra nos botões do topo ou clicando no ranking.</div>`;
  html += `<div class="pills-vd" id="vdPeriodos" role="group" aria-label="Período">` +
    `<button type="button" data-p="acum">Acumulado (${d.periodo_dados})</button>` + mesesLocais.slice(0, iUlt + 1).map((m, i) => `<button type="button" data-p="${i}">${m}${i === iUlt && parcial ? ' (parcial)' : ''}</button>`).join('') + `</div>`;
  html += `<div id="vdMuniPanel"></div>`;

  document.getElementById('main').innerHTML = html;

  async function renderMuniPanel(muniIdx, periodo) {
    const m = municipiosData[muniIdx];
    const nome = m.nome;
    let total, taxaPeriodo;
    if (periodo === 'acum') {
      total = sum(m.vd_mes);
    } else {
      const mi = parseInt(periodo);
      total = m.vd_mes[mi] || 0;
    }
    taxaPeriodo = m.pop ? (total / m.pop * 100000) : 0;

    let h = `<div class="kpi-grid">`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${total}</div><div class="lbl">Ocorrências de Contexto VD</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${fmtBr(taxaPeriodo, 1)}</div><div class="lbl">Taxa por 100 mil hab.</div></div>`;
    h += `<div class="kpi-card kpi-neutral"><div class="val">${fmtBr(m.pop, 0)}</div><div class="lbl">População</div></div>`;
    h += `<div class="kpi-card ${m.enderecos_reincidentes > 0 ? 'kpi-red' : 'kpi-green'}"><div class="val">${m.enderecos_reincidentes}</div><div class="lbl">Endereços Reincidentes</div></div>`;
    h += `</div>`;

    const listaAll = d.ocorrencias[nome] || [];
    const lista = (periodo === 'acum') ? listaAll.slice() : listaAll.filter(o => o.m === parseInt(periodo) + 1);
    const ordemGrav = { critica: 0, alta: 1, media: 2 };
    const dk = s => (s || '').split('/').reverse().join('');
    lista.sort((a, b) => (ordemGrav[a.g] - ordemGrav[b.g]) || dk(b.d).localeCompare(dk(a.d)));

    if (!ppvdDadosRestritosLiberados()) { h += ppvdAvisoRestrito(); document.getElementById('vdMuniPanel').innerHTML = h; return; }
    const redsDaLista = lista.map(o => o.r).filter(Boolean);
    const casosMap = await ppvdBuscarCasosVD(redsDaLista);
    h += enderecosReincidentesVdHtml(d, nome, mesesLocais);
    h += `<div class="updated" style="border:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center">Cor do caso:
      <span><span class="ppvd-badge ppvd-badge-critica">Vermelho</span> novo ou em atraso</span>
      <span><span class="ppvd-badge ppvd-badge-alta">Amarelo</span> atendimento iniciado</span>
      <span><span class="ppvd-badge ppvd-badge-azul">Azul</span> em acompanhamento (retornos, dentro do prazo)</span>
      <span><span class="ppvd-badge ppvd-badge-verde">Verde</span> estabilizado</span></div>`;
    // Recorte padrão (acumulado): casos do PPVD + ocorrências recentes. As ocorrências SEM caso anteriores a Setembro
    // ficam num histórico recolhido (o PPVD só existe desde Ago/Set).
    const casoDe = (o) => (o.r ? (casosMap[o.r] || null) : null);
    const antes = (o) => o.m < HOME_VD_MES_INICIO; // anterior ao PPVD: finalizado (verde), visitas sem registro no sistema
    const velhoSemCaso = (o) => antes(o) && !casoDe(o);
    const semDe = (o) => { if (velhoSemCaso(o)) return 'verde'; const c = casoDe(o); return c ? ppvdSemaforoVD(c) : 'sem'; };
    const principais = periodo === 'acum' ? lista.filter(o => !velhoSemCaso(o)) : lista;
    const historico = periodo === 'acum' ? lista.filter(velhoSemCaso) : [];
    // mais urgente primeiro: vermelho (novos/atrasados), amarelo, azul, verde; dentro de cada grupo, o mais antigo em aberto
    const ordemSem = { vermelho: 0, sem: 0, amarelo: 1, azul: 2, verde: 3 };
    const horasDe = (o) => { const x = auditoriaHorasDesde(o.d); return x === null ? 0 : Math.max(0, x); };
    principais.sort((a, b) => (ordemSem[semDe(a)] - ordemSem[semDe(b)]) || (horasDe(b) - horasDe(a)));
    const cabecalho = `<table class="data-table vd-casos"><thead><tr><th>Situação</th><th>REDS / Data</th><th>Natureza / Gravidade</th><th>Endereço</th><th>Ocorrência</th><th>Acompanhamento</th><th>Responsável</th><th title="Classificação GUT inicial → final">GUT</th><th class="acao">Ação</th></tr></thead><tbody>`;
    const mk = (txt, titulo, cls) => `<span class="mk ${cls || ''}" title="${titulo}">${txt}</span>`;
    const linhaCaso = (o) => {
      const end = `${o.b || ''}${o.l ? (' - ' + o.l) : ''}${o.nu && o.nu !== '0' ? (', ' + o.nu) : ''}`;
      const natLabel = o.vd_homic ? (o.n + ' ⚠') : o.n;
      window.ppvdOcorrenciaLookup = window.ppvdOcorrenciaLookup || {};
      if (o.r) {
        window.ppvdOcorrenciaLookup[o.r] = { reds_data: ppvdToIso(o.d), natureza: o.n, causa: o.c, municipio: nome, bairro: o.b, logradouro: o.l, numero: o.nu, fonar_feito: !!o.fonar_feito };
      }
      const caso = casoDe(o);
      const velho = velhoSemCaso(o);
      const sem = velho ? 'verde' : ppvdSemaforoVD(caso);
      const sugestao = !caso && !velho ? ppvdSugerirResponsavel(nome) : null;
      const respNome = caso ? (caso.militar_responsavel || '—') : (sugestao ? `<span class="sugerido" title="Sugestão do cadastro de militares — ainda não foi designado">${msgEsc(sugestao.nome)} (sugerido)</span>` : '—');
      const gutIni = caso && caso.gut_score ? caso.gut_score : null, gutFin = caso && caso.gut_final_score ? caso.gut_final_score : null;
      const gut = gutIni || gutFin ? `<span title="${caso.gravidade ? 'Inicial ' + caso.gravidade + '×' + caso.urgencia + '×' + caso.tendencia : ''}${gutFin ? ' · Final ' + caso.gut_final_gravidade + '×' + caso.gut_final_urgencia + '×' + caso.gut_final_tendencia : ''}">${gutIni || '—'}${gutFin ? ' → ' + gutFin : ''}</span>` : '—';
      const statusTxt = velho ? 'Finalizado' : (caso ? ppvdStatusLabelVD(caso.status) : 'Sem caso');
      const statusBadgeClass = sem === 'verde' ? 'ppvd-badge-verde' : (sem === 'azul' ? 'ppvd-badge-azul' : (sem === 'amarelo' ? 'ppvd-badge-alta' : 'ppvd-badge-critica'));
      const retornos = velho ? `<br><small>${PPVD_OBS_ANTERIOR}</small>` : (caso && caso.qtd_retornos > 0 ? `<br><small>${caso.qtd_retornos} retorno(s)</small>` : '');
      const horasBruto = sem === 'verde' ? null : auditoriaHorasDesde(o.d);
      const horas = horasBruto === null ? null : Math.max(0, horasBruto); // fato de hoje/futuro não fica negativo
      const abertoHa = horas === null ? '' : `<br><span class="aberto-ha ${sem === 'vermelho' && horas > 72 ? 'atraso' : ''}" title="Tempo desde o fato, enquanto o caso não está estabilizado">aberto há ${horas >= 24 ? (horas / 24).toFixed(1) + 'd' : horas.toFixed(0) + 'h'}</span>`;
      const ocorr = [o.ri ? mk('⚠ Reincid.', 'Endereço reincidente', 'risco') : '', o.a ? mk('Arma', 'Arma de fogo envolvida', 'risco') : '', o.p ? mk('Prisão', 'Houve prisão') : ''].join('') || '—';
      const acomp = [o.fonar_feito ? mk('FONAR ✓', 'FONAR preenchido', 'ok') : '', caso && caso.visita_autor_feita ? mk('Autor ✓', 'Visita ao autor feita', 'ok') : '', caso && caso.visita_vitima_feita ? mk('Vítima ✓', 'Visita à vítima feita', 'ok') : ''].join('') || '—';
      const podeAbrir = ppvdPerfil && (ppvdPerfil.is_admin || ppvdPerfil.pode_abrir_caso);
      let acaoBtn = '—';
      if (o.r && !velho) {
        if (!caso) acaoBtn = podeAbrir ? `<button class="ppvd-btn" onclick="ppvdAbrirCaso('${o.r}')">Abrir Caso ▸</button>` : `<span class="ppvd-badge ppvd-badge-semcaso">sem caso</span>`;
        else acaoBtn = `<button class="ppvd-btn" onclick="ppvdAbrirCaso('${o.r}')">Ver Caso ▸</button>`;
      }
      return `<tr class="vd-row-${sem}" data-sem="${caso || velho ? sem : 'sem'}" data-busca="${msgEsc((o.r || '') + ' ' + end + ' ' + (o.n || '')).toLowerCase()}"><td data-l="Situação"><span class="ppvd-badge ${statusBadgeClass}">${statusTxt}</span>${retornos}${abertoHa}</td><td data-l="REDS / Data">${o.r || '—'}<br><small>${o.d}</small></td><td data-l="Natureza / Gravidade">${natLabel}<br>${gravBadge(o.g)}${o.c ? `<br><small>${msgEsc(o.c)}</small>` : ''}</td><td data-l="Endereço">${msgEsc(end) || '—'}</td><td data-l="Ocorrência">${ocorr}</td><td data-l="Acompanhamento">${acomp}</td><td data-l="Responsável">${respNome}</td><td data-l="GUT">${gut}</td><td class="acao">${acaoBtn}</td></tr>`;
    };
    const cont = { todos: principais.length, vermelho: 0, amarelo: 0, azul: 0, verde: 0, sem: 0 };
    principais.forEach(o => { const x = semDe(o); cont[x === 'vermelho' ? 'vermelho' : x]++; });
    if (periodo === 'acum') h += `<div class="vd-recorte">Contando a partir de ${(DATA.mv.meses || MESES)[HOME_VD_MES_INICIO - 1]} e os casos antigos ainda abertos no PPVD: ${principais.length} ocorrência(s)${historico.length ? ` · ${historico.length} anterior(es) ao PPVD, sem caso, ficam finalizadas (verde) no histórico abaixo` : ''}.</div>`;
    const chipF = (f, rot) => `<button type="button" data-f="${f}" class="${f === 'todos' ? 'on' : ''}">${rot} <b>${cont[f]}</b></button>`;
    h += `<div class="vd-filtros" id="vdFiltros">${chipF('todos', 'Todos')}${chipF('vermelho', '✕ Novos/atraso')}${chipF('amarelo', '! Iniciado')}${chipF('azul', '◆ Acompanhamento')}${chipF('verde', '✓ Estabilizado')}${chipF('sem', 'Sem caso')}<input type="search" id="vdBusca" placeholder="Buscar REDS, rua ou natureza" aria-label="Buscar na tabela"></div>`;
    h += `<div style="overflow-x:auto" id="vdTabelaBox">${cabecalho}`;
    h += principais.length ? principais.map(linhaCaso).join('') : `<tr><td colspan="9" style="text-align:center;color:var(--muted)">Nenhuma ocorrência de contexto VD no período selecionado.</td></tr>`;
    h += `</tbody></table></div>`;
    if (historico.length) h += `<details class="vd-historico" id="vdHistorico"><summary>Histórico anterior ao PPVD — ${historico.length} ocorrência(s) finalizadas (visitas feitas sem o registro no sistema)</summary><div class="vd-historico-corpo" style="overflow-x:auto"></div></details>`;
    document.getElementById('vdMuniPanel').innerHTML = h;
    const aplicarFiltro = () => {
      const f = (document.querySelector('#vdFiltros button.on') || {}).dataset ? document.querySelector('#vdFiltros button.on').dataset.f : 'todos';
      const q = (document.getElementById('vdBusca').value || '').trim().toLowerCase();
      document.querySelectorAll('#vdTabelaBox tbody tr[data-sem]').forEach(tr => { tr.hidden = !((f === 'todos' || tr.dataset.sem === f) && (!q || tr.dataset.busca.includes(q))); });
    };
    document.getElementById('vdFiltros').addEventListener('click', (e) => { const b = e.target.closest('button[data-f]'); if (!b) return; document.querySelectorAll('#vdFiltros button').forEach(x => x.classList.toggle('on', x === b)); aplicarFiltro(); });
    document.getElementById('vdBusca').addEventListener('input', aplicarFiltro);
    const det = document.getElementById('vdHistorico');
    if (det) det.addEventListener('toggle', () => { const c = det.querySelector('.vd-historico-corpo'); if (det.open && !c.dataset.pronto) { c.innerHTML = cabecalho + historico.map(linhaCaso).join('') + '</tbody></table>'; c.dataset.pronto = '1'; } });
  }

  const marcarPeriodo = () => document.querySelectorAll('#vdPeriodos button').forEach(b => b.classList.toggle('on', b.dataset.p === periodoAtual));
  marcarPeriodo();
  renderMuniPanel(idxDefault, periodoAtual);
  document.getElementById('vdPeriodos').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-p]'); if (!b) return;
    periodoAtual = b.dataset.p; try { localStorage.setItem('vdPeriodo', periodoAtual); } catch (er) {}
    marcarPeriodo(); renderMuniPanel(idxDefault, periodoAtual);
  });
  // ranking: clicar numa cidade filtra (mesmo filtro dos botões do topo) e reabre a página nela
  document.querySelectorAll('#vdRanking tr.rank-clic').forEach(tr => tr.addEventListener('click', () => { setMunFiltro(normMun(getMunFiltro()) === normMun(tr.dataset.mun) ? '' : tr.dataset.mun); goToPage('violencia_domestica'); }));
  // situação dos casos por cidade no ranking (só quem está logado e aprovado)
  if (comSituacao) vdSituacaoCasos().then(sit => {
    const tab = document.getElementById('vdRanking'); if (!tab) return;
    const poe = (tr, c) => ['v', 'a', 'z', 'g'].forEach(k => { const td = tr.querySelector(`td[data-s="${k}"]`); if (td) { td.textContent = c[k]; td.className = 'sit-cel ' + (c[k] ? (k === 'v' ? 'pv' : '') : 'z'); } });
    tab.querySelectorAll('tr.rank-clic').forEach(tr => poe(tr, sit.porCidade[MUNICIPIOS_CANONICAL.find(n => normMun(n) === normMun(tr.dataset.mun))] || { v: 0, a: 0, z: 0, g: 0 }));
    poe(document.getElementById('vdRankingTotal'), sit.total);
  });
}
