// Semáforo dos casos de Violência Doméstica (azul incluído a pedido de Eduardo em 2026-10-09):
//   vermelho = caso novo (sem caso/aberto) ou em atraso
//   amarelo  = atendimento iniciado (1ª visita despachada ou já feita, aguardando decisão do comandante)
//   azul     = não estabilizado, mas o comandante decidiu continuar com visitas de retorno: dentro do prazo e
//              sendo acompanhado.
//   verde    = estabilizado
// Atraso: visita despachada (1ª ou retorno) sem resposta há mais de 72h (prazo máximo da mensagem de
// despacho) volta a vermelho; `_pendenteDesde` vem de ppvdBuscarCasosVD.
const PPVD_PRAZO_RETORNO_HORAS = 72;
// O PPVD só passou a valer em Setembro/2026: ocorrência anterior SEM caso conta como finalizada (verde), com a ressalva de
// que as visitas daquele período foram feitas sem registro no sistema. Caso anterior que já existe no PPVD e segue aberto
// continua aberto, com a situação real, para cada responsável resolver (decisão de Eduardo em 2026-10-13).
const PPVD_OBS_ANTERIOR = 'anterior ao PPVD — visitas feitas sem o registro no sistema';
function ppvdEmAcompanhamentoVD(caso) {
  return !!caso && caso.status !== 'estabilizada' && ((caso.qtd_retornos || 0) >= 1 || caso.status === 'retorno' || caso.status === 'em_acompanhamento');
}
function ppvdVisitaAtrasadaVD(caso) {
  return !!(caso && caso._pendenteDesde && (Date.now() - new Date(caso._pendenteDesde).getTime()) / 3600000 > PPVD_PRAZO_RETORNO_HORAS);
}
function ppvdSemaforoVD(caso) {
  if (!caso) return 'vermelho';
  if (caso.status === 'estabilizada') return 'verde';
  if (ppvdEmAcompanhamentoVD(caso)) return ppvdVisitaAtrasadaVD(caso) ? 'vermelho' : 'azul';
  if (caso.status === 'em_visita') return ppvdVisitaAtrasadaVD(caso) ? 'vermelho' : 'amarelo';
  if (caso.status === 'decisao_cmd') return 'amarelo';
  return 'vermelho'; // sem caso, aberto/novo, outros
}
function ppvdStatusLabelVD(status) {
  const map = { aberto: 'Aberto', novo: 'Novo', em_visita: 'Em Visita', decisao_cmd: 'Decisão Cmd', retorno: 'Retorno', em_acompanhamento: 'Em acompanhamento', estabilizada: 'Estabilizada', encerrado: 'Encerrado' };
  return map[status] || status || 'Sem caso';
}
async function ppvdBuscarCasosVD(redsList) {
  if (!ppvdSupa || !ppvdUser || !ppvdPerfil || !ppvdPerfil.aprovado || !redsList || redsList.length === 0) return {};
  const { data, error } = await ppvdSupa.from('ppvd_casos').select('*').eq('modalidade', 'violencia_domestica').in('reds_numero', redsList);
  const map = {};
  if (!error && data) data.forEach(c => { if (c.reds_numero) map[c.reds_numero] = c; });
  // Visita despachada e ainda sem resposta: precisa da data do despacho pra saber se estourou o prazo (vira vermelho)
  const porId = {};
  Object.values(map).forEach(c => { if (c.status === 'em_visita') porId[c.id] = c; });
  if (Object.keys(porId).length) {
    const { data: pend } = await ppvdSupa.from('ppvd_visitas').select('caso_id, despachado_em').in('caso_id', Object.keys(porId)).is('visita_realizada_em', null);
    (pend || []).forEach(v => {
      const c = porId[v.caso_id];
      if (c && v.despachado_em && (!c._pendenteDesde || v.despachado_em < c._pendenteDesde)) c._pendenteDesde = v.despachado_em;
    });
  }
  return map;
}
let ppvdMilitaresCache = null;
async function ppvdCarregarMilitares() {
  if (!ppvdSupa || !ppvdUser || !ppvdPerfil || !ppvdPerfil.aprovado) { ppvdMilitaresCache = []; return ppvdMilitaresCache; }
  const { data, error } = await ppvdSupa.from('militares_responsaveis').select('*').eq('ativo', true);
  ppvdMilitaresCache = (!error && data) ? data : [];
  return ppvdMilitaresCache;
}
// O cadastro antigo tem o município escrito de vários jeitos ("COMERCINHO", "CORONEL MURTA - MG") e duplicados: casa ignorando
// caixa/acento/" - MG" e, havendo mais de um, escolhe sempre o MAIS ANTIGO (antes era "o primeiro que aparecesse", variava)
function ppvdSugerirResponsavel(municipio) {
  if (!ppvdMilitaresCache || !municipio) return null;
  const limpa = (t) => normMun(String(t || '').replace(/\s*-\s*MG\s*$/i, ''));
  const alvo = limpa(municipio);
  const todos = ppvdMilitaresCache.filter(m => limpa(m.municipio) === alvo);
  todos.sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
  return todos[0] || null;
}
function ppvdLinkVisitaPublica(token) {

function ppvdMontarMensagemWhatsApp(caso, token) {

Favor realizar a leitura do fato e a visita ao autor e à vítima, no prazo preferencial de 24h (máximo 72h).

Após o término, acesse o link abaixo, anexe o BOS da visita ao autor e à vítima, e preencha o GUT novo:
${link}`;
}

async function ppvdVincularFonar(casoId, fonarId) {
  if (!confirm('Vincular essa resposta do FONAR a este caso?')) return;
  const { data: resp, error: errBusca } = await ppvdSupa.from('fonar_respostas').select('*').eq('id', fonarId).single();
  if (errBusca || !resp) { alert('Erro ao buscar resposta FONAR: ' + (errBusca ? errBusca.message : '')); return; }
  const { error: errUpd1 } = await ppvdSupa.from('fonar_respostas').update({
    vinculado_caso_id: casoId, vinculado_em: new Date().toISOString(), vinculado_por: ppvdPerfil.nome
  }).eq('id', fonarId);
  if (errUpd1) { alert('Erro: ' + errUpd1.message); return; }
  const { data: caso, error: errUpd2 } = await ppvdSupa.from('ppvd_casos').update({
    fonar_feito: true,
    fonar_dados: { nome_vitima: resp.nome_vitima, carimbo: resp.carimbo, respostas: resp.respostas }
  }).eq('id', casoId).select().single();
  if (errUpd2) { alert('Erro: ' + errUpd2.message); return; }
  await ppvdRenderCaso(caso);
}

function ppvdOrientacao(g, u, t) {
  if (!g || !u || !t) return { texto: 'Classificação GUT pendente de preenchimento.', nivel: 'media', score: 0 };
  const score = g * u * t;
  if (score >= 125) return { texto: 'CRÍTICO — fazer visita em até 24h.', nivel: 'critica', score };
  if (score >= 50) return { texto: 'Seguir protocolo padrão de visitas.', nivel: 'alta', score };
  return { texto: 'Protocolo reduzido — visitas conforme rotina (mín. 4).', nivel: 'media', score };
}

async function ppvdAbrirCaso(redsNumero) {
  if (!ppvdSupa) { alert('Integração PPVD indisponível.'); return; }
  if (!ppvdUser) { alert('Faça login (botão "Entrar (PPVD)" no topo) pra abrir um caso.'); return; }
  if (!ppvdPerfil) { alert('Complete seu cadastro antes (aparece no topo da tela).'); return; }
  if (!ppvdPerfil.aprovado) { alert('Seu acesso ainda não foi aprovado pelo administrador PPVD.'); return; }

  const dadosBase = (window.ppvdOcorrenciaLookup || {})[redsNumero] || {};
  estadoUI.voltarPara = currentPageKey; // Voltar devolve a lista como estava (período, rolagem)
  estadoUI.entrar('caso:' + redsNumero, window.ppvdRestaurando === true);
  document.getElementById('main').innerHTML = `<div class="page-title">Carregando caso…</div>`;
  // Lembra qual caso está aberto — se a aba recarregar (navegador descartando em segundo
  // plano, por memória) enquanto o comandante estava com o caso aberto, reabre sozinho em vez
  // de devolver a lista/Home. Achado por Eduardo em 2026-09-08. localStorage (não
  // sessionStorage) desde 2026-10-01 — ver comentário em goToPage().
  try { localStorage.setItem('ppvdCasoAbertoReds', redsNumero); } catch (e) {}

  let { data: caso, error } = await ppvdSupa.from('ppvd_casos').select('*').eq('reds_numero', redsNumero).maybeSingle();
  if (error) { document.getElementById('main').innerHTML = `<div class="def-box">Erro ao consultar caso: ${error.message}</div>`; return; }
  if (!caso) {
    const insertObj = {
      reds_numero: redsNumero,
      reds_data: dadosBase.reds_data || null,
      natureza: dadosBase.natureza || null,
      causa: dadosBase.causa || null,
      municipio: dadosBase.municipio || null,
      bairro: dadosBase.bairro || null,
      logradouro: dadosBase.logradouro || null,
      numero: dadosBase.numero || null,
      fonar_feito: dadosBase.fonar_feito || false,
      status: 'aberto'
    };
    const { data: novo, error: errIns } = await ppvdSupa.from('ppvd_casos').insert(insertObj).select().single();
    if (errIns) { document.getElementById('main').innerHTML = `<div class="def-box">Erro ao criar caso: ${errIns.message}</div>`; return; }
    caso = novo;
  }
  await ppvdRenderCaso(caso);
}

// O que falta fazer num caso de VD, quem precisa fazer e até quando (prazo máximo de 72h da visita despachada).
function ppvdProximaAcaoVD(caso, visitas) {
  const lista = visitas || [];
  const pend = lista.find(v => v.despachado_em && !v.visita_realizada_em);
  const ultima = lista.find(v => v.visita_realizada_em);
  const horas = (iso) => (iso ? Math.max(0, (Date.now() - new Date(iso).getTime()) / 3600000) : null);
  const fmtH = (h) => (h >= 48 ? (h / 24).toFixed(1).replace('.', ',') + ' dias' : Math.round(h) + 'h');
  const retorno = (caso.qtd_retornos || 0) >= 1;
  const gutOk = !!(caso.gravidade && caso.urgencia && caso.tendencia);
  if (caso.status === 'estabilizada') {
    return { cor: 'g', rotulo: 'Situação do caso', titulo: 'Caso estabilizado', detalhe: caso.estabilizado_em ? 'Estabilizado em ' + ppvdFmtDT(caso.estabilizado_em) + (caso.estabilizado_por ? ' por ' + caso.estabilizado_por : '') + '.' : 'Nenhuma ação pendente.' };
  }
  if (pend) {
    const resta = PPVD_PRAZO_RETORNO_HORAS - horas(pend.despachado_em);
    const limite = new Date(new Date(pend.despachado_em).getTime() + PPVD_PRAZO_RETORNO_HORAS * 3600000);
    const atraso = resta < 0;
    return {
      cor: atraso ? 'v' : (retorno ? 'z' : 'a'), rotulo: atraso ? 'Em atraso' : 'No prazo', atraso,
      titulo: 'Aguardando ' + (pend.guarnicao || 'o militar') + ' registrar ' + (retorno ? 'o retorno' : 'a visita'),
      detalhe: atraso ? 'O prazo máximo de ' + PPVD_PRAZO_RETORNO_HORAS + 'h venceu em ' + ppvdFmtDT(limite) + ' (atrasada há ' + fmtH(-resta) + '). Cobre o militar pelo WhatsApp.' : 'Despachada em ' + ppvdFmtDT(pend.despachado_em) + '. Prazo máximo até ' + ppvdFmtDT(limite) + ' (faltam ' + fmtH(resta) + ').'
    };
  }
  if (caso.status === 'decisao_cmd') {
    const h = ultima ? horas(ultima.visita_realizada_em) : null;
    return { cor: retorno ? 'z' : 'a', rotulo: 'Decisão do comandante', titulo: 'Decida: estabilizar o caso ou despachar um retorno', detalhe: (h !== null ? 'Visita registrada há ' + fmtH(h) + '. ' : '') + 'Leia o BOS e o GUT final antes de decidir.' };
  }
  const hf = caso.reds_data ? horas(caso.reds_data) : null;
  return {
    cor: 'v', rotulo: 'Caso novo',
    titulo: gutOk ? 'Despache a ' + (retorno ? 'visita de retorno' : '1ª visita') : 'Classifique o caso (GUT) e despache a 1ª visita',
    detalhe: (hf !== null ? 'Fato há ' + fmtH(hf) + '. ' : '') + 'Prazo preferencial de 24h para a visita (máximo de ' + PPVD_PRAZO_RETORNO_HORAS + 'h).' + (ppvdOrientacao(caso.gravidade, caso.urgencia, caso.tendencia).nivel === 'critica' ? ' GUT crítico: visita em até 24h.' : '')
  };
}

// Etapas do fluxo do caso de VD (o retorno repete as etapas 2–4 até o comandante estabilizar).
function ppvdPassosVD(caso, visitas) {
  const lista = visitas || [];
  const pend = lista.some(v => v.despachado_em && !v.visita_realizada_em);
  let atual;
  if (caso.status === 'estabilizada') atual = 5;
  else if (pend) atual = 2;
  else if (caso.status === 'decisao_cmd') atual = 3;
  else atual = 1;
  const nomes = ['Caso aberto', 'Visita despachada', 'Visita registrada pelo militar', 'Decisão do comandante', 'Estabilizado'];
  return `<ol class="caso-passos" aria-label="Etapas do caso">` + nomes.map((n, i) => `<li class="${i < atual ? 'ok' : (i === atual ? 'atual' : '')}" data-n="${i + 1}"${i === atual ? ' aria-current="step"' : ''}>${n}${i === 3 && (caso.qtd_retornos || 0) ? '<br><small>' + caso.qtd_retornos + ' retorno(s) feito(s)</small>' : ''}</li>`).join('') + `</ol>`;
}

async function ppvdRenderCaso(caso) {
  if (!window.ppvdRestaurando) estadoUI.limparCampos(); // re-render depois de salvar: rascunho já virou dado
  window.ppvdCasoAtual = caso;
  const { data: visitas } = await ppvdSupa.from('ppvd_visitas').select('*').eq('caso_id', caso.id).order('created_at', { ascending: false });
  const ehVD = (caso.modalidade || 'violencia_domestica') === 'violencia_domestica';
  const orient = ppvdOrientacao(caso.gravidade, caso.urgencia, caso.tendencia);
  const orientFinal = ppvdOrientacao(caso.gut_final_gravidade, caso.gut_final_urgencia, caso.gut_final_tendencia);
  const podeGerenciar = ehVD && ppvdPerfil && (ppvdPerfil.is_admin || ppvdPerfil.pode_abrir_caso);
  const prox = ehVD ? ppvdProximaAcaoVD(caso, visitas) : null;
  const gutOk = !!(caso.gravidade && caso.urgencia && caso.tendencia);

  let html = `<div class="page-title">Caso PPVD — ${caso.municipio || ''}</div>`;
  html += `<button class="ppvd-btn" onclick="goToPage('${ppvdModalidadeVoltarPage(caso.modalidade)}')">← Voltar</button>`;

  if (ehVD) {
    // 1) o que fazer agora e em que etapa o caso está
    html += `<div class="caso-prox ${prox.cor}" id="casoProxAcao"><div class="rot">Próxima ação${prox.rotulo ? ' · ' + prox.rotulo : ''}</div><div class="tit">${prox.titulo}</div><div class="det${prox.atraso ? ' atraso' : ''}">${prox.detalhe}</div></div>`;
    html += ppvdPassosVD(caso, visitas);
  }

  // 2) a ação em si vem logo abaixo (despachar / aguardar / decidir) — antes dos dados
  let acoes = '';
  const semVisitaPendente = !visitas || visitas.every(v => v.visita_realizada_em);
  if (ehVD && semVisitaPendente && caso.status !== 'estabilizada') {
    const sugestao = ppvdSugerirResponsavel(caso.municipio);
    const ehRetorno = caso.status === 'decisao_cmd';
    acoes += `<div class="ppvd-card" id="casoAcaoDespachar"><b>Despachar visita — ${ehRetorno ? 'Retorno' : 'Visita inicial'}</b><br><br>`;
    acoes += `<div class="ppvd-field"><label>Militar responsável (nome)</label><input id="ppvdRespNome" value="${msgEsc(caso.militar_responsavel || (sugestao ? sugestao.nome : ''))}"></div>`;
    acoes += `<div class="ppvd-field"><label>WhatsApp (com DDD)</label><input id="ppvdRespWhats" value="${msgEsc(caso.militar_responsavel_whatsapp || (sugestao ? sugestao.whatsapp : ''))}"></div>`;
    acoes += `<div style="color:var(--muted);font-size:12.5px;margin-bottom:10px">Ao despachar, abre o WhatsApp com a mensagem já pronta e o link da página de registro da visita (prazo preferencial de 24h, máximo de ${PPVD_PRAZO_RETORNO_HORAS}h). Dá pra trocar o nome/WhatsApp aqui sem alterar o cadastro fixo.</div>`;
    acoes += `<button class="ppvd-btn ppvd-btn-primary" onclick="ppvdDespacharVD('${caso.id}', ${ehRetorno})">Despachar${ehRetorno ? ' Retorno' : ''} (WhatsApp)</button>`;
    acoes += `</div>`;
  }

  const pendente = (visitas || []).find(v => v.despachado_em && !v.visita_realizada_em);
  if (pendente) {
    acoes += `<div class="ppvd-card" style="border-color:var(--amber)" id="casoAcaoPendente"><b>⏳ Visita pendente de resposta do militar</b> — despachada em ${ppvdFmtDT(pendente.despachado_em)} por ${pendente.despachado_por || '—'} pra ${pendente.guarnicao || '—'}<br>`;
    acoes += `<div style="color:var(--muted);font-size:12.5px;margin:8px 0">Link enviado: <code>${ppvdLinkVisitaPublica(pendente.token)}</code></div>`;
    acoes += `<details><summary style="cursor:pointer;color:var(--amber)">Registrar manualmente (se o militar não conseguiu usar o link)</summary><br>`;
    acoes += `<div class="ppvd-field"><label>Visita ao autor realizada?</label><select id="ppvdManAutorFeita"><option value="false">Não</option><option value="true">Sim</option></select></div>`;
    acoes += `<div class="ppvd-field"><label>Visita à vítima realizada?</label><select id="ppvdManVitimaFeita"><option value="false">Não</option><option value="true">Sim</option></select></div>`;
    acoes += `<div class="ppvd-field"><label>Situação encontrada</label><textarea id="ppvdSituacao"></textarea></div>`;
    acoes += `<div class="ppvd-field"><label>Vítima presente?</label><select id="ppvdVitPresente"><option value="true">Sim</option><option value="false">Não</option></select></div>`;
    acoes += `<div class="ppvd-field"><label>Autor presente?</label><select id="ppvdAutPresente"><option value="true">Sim</option><option value="false">Não</option></select></div>`;
    acoes += `<div class="ppvd-field"><label>Reclassificação — Gravidade</label>${ppvdSelectGUT('ppvdNovaG', 'gravidade', '')}</div>`;
    acoes += `<div class="ppvd-field"><label>Reclassificação — Urgência</label>${ppvdSelectGUT('ppvdNovaU', 'urgencia', '')}</div>`;
    acoes += `<div class="ppvd-field"><label>Reclassificação — Tendência</label>${ppvdSelectGUT('ppvdNovaT', 'tendencia', '')}</div>`;
    acoes += `<div class="ppvd-field"><label>Observações</label><textarea id="ppvdObsVisita"></textarea></div>`;
    acoes += `<button class="ppvd-btn ppvd-btn-primary" onclick="ppvdRegistrarResultado('${pendente.id}', '${caso.id}')">Registrar resultado da visita</button>`;
    acoes += `</details></div>`;
  }

  if (ehVD && caso.status === 'decisao_cmd') {
    const ultima = (visitas || []).find(v => v.visita_realizada_em);
    acoes += `<div class="ppvd-card" style="border-color:var(--amber)" id="casoAcaoDecisao"><b>⚠ Decisão do Comandante</b><br><br>`;
    if (ultima) {
      acoes += `<b>BOS anexados:</b> `;
      acoes += ultima.bos_autor_url ? `<button class="ppvd-btn" onclick="ppvdAbrirBos('${ultima.bos_autor_url}')">Ver BOS autor</button> ` : 'sem BOS autor ';
      acoes += ultima.bos_vitima_url ? `<button class="ppvd-btn" onclick="ppvdAbrirBos('${ultima.bos_vitima_url}')">Ver BOS vítima</button>` : 'sem BOS vítima';
      acoes += `<br><br>`;
    }
    acoes += `<div style="color:var(--muted);font-size:12px;margin-bottom:10px">Leia o BOS e o GUT final e decida: estabilizar o caso ou despachar mais um retorno (cartão "Despachar visita — Retorno" acima).</div>`;
    acoes += `<button class="ppvd-btn ppvd-btn-primary" onclick="ppvdEstabilizarVD('${caso.id}')">✓ Marcar como Estabilizada</button>`;
    acoes += `</div>`;
  }

  // 3) dados do fato (REDS, endereço, FONAR) e GUT dos dois momentos
  let fato = `<div class="ppvd-card"><div class="caso-resumo"><b>REDS:</b> ${caso.reds_numero || '—'} &nbsp; <b>Data:</b> ${caso.reds_data || '—'} &nbsp; <b>Natureza:</b> ${caso.natureza || '—'} &nbsp; <b>Causa:</b> ${caso.causa || '—'}<br>`;
  fato += `<b>Endereço:</b> ${caso.bairro || ''}${caso.logradouro ? (' - ' + caso.logradouro) : ''}${caso.numero && caso.numero !== '0' ? (', ' + caso.numero) : ''}`;
  if (ehVD) {
    fato += `<br>`;
    if (caso.fonar_feito && caso.fonar_dados) {
      const fd = caso.fonar_dados;
      const perguntas = Object.keys(fd.respostas || {}).filter(k => !/e-?mail/i.test(k));
      fato += `<b>FONAR:</b> <span class="vd-check-ok">✓ preenchido</span> — vítima ${ppvdIniciais(fd.nome_vitima)}, respondido em ${ppvdFmtDT(fd.carimbo)} `;
      fato += `<details style="display:inline"><summary style="cursor:pointer;color:var(--accent)">ver respostas</summary><div style="margin-top:8px;font-size:12px;line-height:1.6">`;
      fato += perguntas.map(k => `<div><b>${k}</b><br>${fd.respostas[k] || '—'}</div>`).join('<hr style="border-color:var(--border);margin:6px 0">');
      fato += `</div></details>`;
    } else {
      fato += `<b>FONAR:</b> <span class="vd-check-no">não localizado ainda</span>`;
      if (podeGerenciar) {
        fato += `<div id="ppvdFonarBusca" style="margin-top:6px;max-width:520px">`;
        fato += `<input id="ppvdFonarQuery" type="text" placeholder="Buscar resposta do FONAR pelo nome da vítima..." oninput="ppvdBuscarFonarCandidatos('${caso.id}')" style="width:100%;padding:6px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text)">`;
        fato += `<div id="ppvdFonarResultados" style="margin-top:6px"></div>`;
        fato += `</div>`;
      }
    }
  }
  fato += `</div>`;
  if (ehVD) {
    fato += `<div class="kpi-grid" style="margin-top:12px">`;
    fato += `<div class="kpi-card ${orient.nivel === 'critica' ? 'kpi-red' : (orient.nivel === 'alta' ? 'kpi-neutral' : 'kpi-green')}"><div class="val">${orient.score || '—'}</div><div class="lbl">GUT Inicial (G×U×T)</div></div>`;
    fato += `<div class="kpi-card ${orientFinal.nivel === 'critica' ? 'kpi-red' : (orientFinal.nivel === 'alta' ? 'kpi-neutral' : 'kpi-green')}"><div class="val">${caso.gut_final_score || '—'}</div><div class="lbl">GUT Final (última visita)</div></div>`;
    fato += `</div>`;
  }
  fato += `</div>`;

  // Status (manual) — corrige o que o fluxo automático não pegou; recolhido pra não competir com a próxima ação
  const statusOpts = ehVD ? ['aberto', 'em_visita', 'decisao_cmd', 'retorno', 'estabilizada'] : ['novo', 'em_acompanhamento', 'recusa', 'encerrado'];
  let statusBloco = `<div class="ppvd-field" style="max-width:340px"><label>Status do caso</label><select id="ppvdStatusSel">${statusOpts.map(s => `<option value="${s}" ${s === caso.status ? 'selected' : ''}>${ehVD ? ppvdStatusLabelVD(s) : s}</option>`).join('')}</select></div>`;
  statusBloco += `<button class="ppvd-btn" onclick="ppvdSalvarStatus('${caso.id}')">Salvar status</button>`;
  if (podeGerenciar) {
    statusBloco += ppvdPerfil.is_admin
      ? ` <button class="ppvd-btn" style="border-color:var(--alert);color:var(--alert)" onclick="ppvdReiniciarCaso('${caso.id}')">⟲ Reiniciar Caso</button>`
      : ` <button class="ppvd-btn" style="border-color:var(--alert);color:var(--alert)" onclick="ppvdSolicitarAoAdmin('reiniciar_caso','${caso.id}',null)">⟲ Solicitar reinício ao admin</button>`;
  }

  // 4) classificação + identificação num cartão só, com UM botão de salvar. Abre sozinho quando falta classificar.
  const resumoDados = [gutOk ? 'GUT ' + orient.score : 'GUT pendente', caso.vitima_nome ? 'vítima ' + msgEsc(caso.vitima_nome) : '', caso.autor_nome ? 'autor ' + msgEsc(caso.autor_nome) : '', caso.medida_protetiva ? 'medida protetiva' : '', caso.tem_mandado ? 'mandado' : ''].filter(Boolean).join(' · ');
  let dados = `<details class="ppvd-card caso-dados" id="casoDados" ${gutOk ? '' : 'open'}><summary>Classificação e identificação <small>${resumoDados}</small></summary><br>`;
  dados += `<b>Classificação GUT inicial</b> <span style="color:var(--muted);font-size:12px">(feita pelo comandante ao abrir o caso, com base no REDS + FONAR)</span><br><br>`;
  dados += `<div class="ppvd-field"><label>Gravidade</label>${ppvdSelectGUT('ppvdG', 'gravidade', caso.gravidade)}</div>`;
  dados += `<div class="ppvd-field"><label>Urgência</label>${ppvdSelectGUT('ppvdU', 'urgencia', caso.urgencia)}</div>`;
  dados += `<div class="ppvd-field"><label>Tendência</label>${ppvdSelectGUT('ppvdT', 'tendencia', caso.tendencia)}</div>`;
  dados += `<b>Identificação</b> <span style="color:var(--muted);font-size:12px">(somente iniciais — sem nome completo, RG ou telefone)</span><br><br>`;
  dados += `<div class="ppvd-field"><label>Iniciais da vítima</label><input id="ppvdVitNome" placeholder="Ex: M.A.S." value="${msgEsc(caso.vitima_nome)}"></div>`;
  dados += `<div class="ppvd-field"><label>Iniciais do autor</label><input id="ppvdAutNome" placeholder="Ex: J.P.O." value="${msgEsc(caso.autor_nome)}"></div>`;
  dados += `<div class="ppvd-field"><label>Tem mandado?</label><select id="ppvdMandado"><option value="false" ${!caso.tem_mandado ? 'selected' : ''}>Não</option><option value="true" ${caso.tem_mandado ? 'selected' : ''}>Sim</option></select></div>`;
  dados += `<div class="ppvd-field"><label>Medida protetiva?</label><select id="ppvdMP"><option value="false" ${!caso.medida_protetiva ? 'selected' : ''}>Não</option><option value="true" ${caso.medida_protetiva ? 'selected' : ''}>Sim</option></select></div>`;
  dados += `<div class="ppvd-field"><label>Pelotão responsável</label><input id="ppvdPelotao" value="${msgEsc(caso.pelotao)}"></div>`;
  dados += `<div class="ppvd-field"><label>Destacamento responsável</label><input id="ppvdDestacamento" value="${msgEsc(caso.destacamento)}"></div>`;
  dados += `<button class="ppvd-btn ppvd-btn-primary" id="ppvdSalvarCasoBtn" onclick="ppvdSalvarCaso('${caso.id}')">Salvar classificação e dados</button>`;
  dados += `</details>`;

  // Caso novo sem classificação: classificar vem antes de despachar. Nos demais, a ação vem antes dos dados.
  html += !gutOk && ehVD && caso.status !== 'estabilizada' ? dados + acoes : acoes + dados;
  html += fato;
  html += `<details class="ppvd-card caso-dados"><summary>Status e correções <small>${ehVD ? ppvdStatusLabelVD(caso.status) : caso.status}</small></summary><br>${statusBloco}</details>`;

  html += `<div class="page-title" style="margin-top:24px;font-size:16px">Histórico de Visitas${caso.qtd_retornos ? (' — ' + caso.qtd_retornos + ' retorno(s)') : ''}</div>`;
  if (!visitas || visitas.length === 0) {
    html += `<div class="pending-box">Nenhuma visita registrada ainda.</div>`;
  } else {
    html += `<div style="overflow-x:auto"><table class="data-table"><thead><tr><th style="text-align:left">Despachada em</th><th style="text-align:left">Militar</th><th style="text-align:left">Visita realizada em</th><th style="text-align:left">Situação</th><th>Reclassificação GUT</th><th>BOS</th>${podeGerenciar ? '<th>Ações</th>' : ''}</tr></thead><tbody>`;
    visitas.forEach(v => {
      const reclass = (v.nova_gravidade && v.nova_urgencia && v.nova_tendencia) ? `${v.nova_gravidade}×${v.nova_urgencia}×${v.nova_tendencia}=${v.nova_gravidade * v.nova_urgencia * v.nova_tendencia}` : '—';
      const bosLinks = [
        v.bos_autor_url ? `<button class="ppvd-btn" onclick="ppvdAbrirBos('${v.bos_autor_url}')">Autor</button>` : '',
        v.bos_vitima_url ? `<button class="ppvd-btn" onclick="ppvdAbrirBos('${v.bos_vitima_url}')">Vítima</button>` : '',
      ].filter(Boolean).join(' ') || '—';
      let acoesV = '';
      if (podeGerenciar) {
        acoesV = ppvdPerfil.is_admin
          ? `<button class="ppvd-btn" style="border-color:var(--alert);color:var(--alert)" onclick="ppvdApagarVisita('${v.id}','${caso.id}')">🗑 Apagar</button>`
          : `<button class="ppvd-btn" style="border-color:var(--alert);color:var(--alert)" onclick="ppvdSolicitarAoAdmin('apagar_visita','${caso.id}','${v.id}')">🗑 Solicitar exclusão ao admin</button>`;
        if (v.visita_realizada_em) {
          acoesV += ` <button class="ppvd-btn" onclick="ppvdSolicitarNovoPreenchimento('${v.id}','${caso.id}')">↺ Solicitar novo preenchimento</button>`;
        }
      }
      html += `<tr><td style="text-align:left">${ppvdFmtDT(v.despachado_em)}</td><td style="text-align:left">${v.guarnicao || '—'}</td><td style="text-align:left">${ppvdFmtDT(v.visita_realizada_em)}</td><td style="text-align:left">${v.situacao_encontrada || '—'}</td><td>${reclass}</td><td>${bosLinks}</td>${podeGerenciar ? `<td>${acoesV}</td>` : ''}</tr>`;
    });
    html += `</tbody></table></div>`;
  }

  document.getElementById('main').innerHTML = html;
}

async function ppvdRecalcularStatusCaso(casoId) {
  const { data: caso } = await ppvdSupa.from('ppvd_casos').select('*').eq('id', casoId).single();
  if (!caso || caso.status === 'estabilizada') { if (caso) await ppvdRenderCaso(caso); return; }
  const { data: visitas } = await ppvdSupa.from('ppvd_visitas').select('*').eq('caso_id', casoId).order('despachado_em', { ascending: false });
  let novoStatus;
  if (!visitas || visitas.length === 0) {
    novoStatus = 'aberto';
  } else {
    const pendente = visitas.find(v => !v.visita_realizada_em);
    novoStatus = pendente ? 'em_visita' : 'decisao_cmd';
  }
  const { data: casoAtualizado, error } = await ppvdSupa.from('ppvd_casos').update({ status: novoStatus }).eq('id', casoId).select().single();
  if (error) { alert('Erro: ' + error.message); return; }
  await ppvdRenderCaso(casoAtualizado);
}

// ============ Mensagens ao admin (pedido de Eduardo em 2026-10-09) ============
// Dúvidas, sugestões e solicitações dos usuários aprovados para o admin geral (tabela `mensagens`, RLS: o autor
// vê as suas, o admin vê todas). Também é por aqui que os demais usuários pedem ao admin pra apagar uma visita ou
// reiniciar um caso — só o admin geral tem permissão de apagar (policies "admin apaga visitas/casos").
const MSG_TIPOS = { duvida: 'Dúvida', sugestao: 'Sugestão', solicitacao: 'Solicitação', apagar_visita: 'Pedido: apagar visita', reiniciar_caso: 'Pedido: reiniciar caso' };
const MSG_STATUS = { aberta: 'Aberta', em_andamento: 'Em andamento', resolvida: 'Resolvida', recusada: 'Recusada' };
window.msgCache = {};
function msgEsc(t) {
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
async function ppvdAtualizarBadgeMensagens() {
  const els = document.querySelectorAll('.msg-badge, #msgBadge');
  if (!els.length || !ppvdSupa || !ppvdUser || !ppvdPerfil || !ppvdPerfil.aprovado) return;
  let q = ppvdSupa.from('mensagens').select('id', { count: 'exact', head: true });
  q = ppvdPerfil.is_admin ? q.eq('lida_admin', false) : q.eq('autor_id', ppvdUser.id).eq('resposta_lida', false);
  const { count } = await q;
  const dica = count > 0 ? (ppvdPerfil.is_admin ? count + ' mensagem(ns) nova(s)' : count + ' resposta(s) nova(s)') : '';
  els.forEach(el => {
    if (el.id === 'msgBadge') { // botão ✉ do topo
      el.textContent = count > 0 ? ' ' + count : '';
      el.style.cssText = count > 0 ? 'background:var(--alert);color:#fff;border-radius:9px;padding:0 6px;margin-left:4px;font-weight:700' : '';
    } else { el.textContent = count > 0 ? String(count) : ''; el.hidden = !(count > 0); }
    el.title = dica;
  });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) ppvdAtualizarBadgeMensagens(); });

function msgCartao(m, souAdmin) {
  const statusCls = { aberta: 'ppvd-badge-critica', em_andamento: 'ppvd-badge-azul', resolvida: 'ppvd-badge-verde', recusada: 'ppvd-badge-semcaso' }[m.status] || 'ppvd-badge-semcaso';
  const pedido = m.tipo === 'apagar_visita' || m.tipo === 'reiniciar_caso';
  let h = `<div class="ppvd-card" style="margin-bottom:12px">`;
  h += `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px">`;
  h += `<span class="ppvd-badge ppvd-badge-media">${MSG_TIPOS[m.tipo] || msgEsc(m.tipo)}</span>`;
  h += `<span class="ppvd-badge ${statusCls}">${MSG_STATUS[m.status] || msgEsc(m.status)}</span>`;
  h += `<span style="color:var(--muted);font-size:12px">${ppvdFmtDT(m.created_at)}`;
  if (souAdmin) h += ` &middot; ${msgEsc(m.autor_nome)} (${msgEsc(m.autor_cargo)}, ${msgEsc(m.autor_cidade)})`;
  h += `</span></div>`;
  if (m.assunto) h += `<div style="font-weight:600;margin-bottom:4px">${msgEsc(m.assunto)}</div>`;
  h += `<div style="white-space:pre-wrap">${msgEsc(m.texto)}</div>`;
  if (m.reds_numero) h += `<div style="margin-top:6px;font-size:12px;color:var(--muted)">Caso: ${msgEsc(m.reds_numero)} <button class="ppvd-btn" onclick="ppvdAbrirCaso('${msgEsc(m.reds_numero)}')">Abrir caso ▸</button></div>`;
  if (m.resposta) h += `<div class="def-box" style="margin:10px 0 0"><b>Resposta${m.respondido_por ? ' de ' + msgEsc(m.respondido_por) : ''}${m.respondido_em ? ' &middot; ' + ppvdFmtDT(m.respondido_em) : ''}</b><br><span style="white-space:pre-wrap">${msgEsc(m.resposta)}</span></div>`;
  if (souAdmin) {
    h += `<div style="margin-top:10px"><textarea id="msgResp-${m.id}" rows="2" style="width:100%" placeholder="Resposta ao autor (opcional)"></textarea>`;
    h += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">`;
    if (pedido && m.status !== 'resolvida') h += `<button class="ppvd-btn ppvd-btn-primary" onclick="msgExecutar('${m.id}')">Executar pedido</button>`;
    h += `<button class="ppvd-btn" onclick="msgResponder('${m.id}','resolvida')">Responder e resolver</button>`;
    h += `<button class="ppvd-btn" onclick="msgResponder('${m.id}','em_andamento')">Em andamento</button>`;
    h += `<button class="ppvd-btn" style="border-color:var(--alert);color:var(--alert)" onclick="msgResponder('${m.id}','recusada')">Recusar</button>`;
    h += `</div></div>`;
  }
  return h + `</div>`;
}

async function renderMensagensPage() {
  let html = `<div class="page-title">Mensagens</div>`;
  if (!ppvdSupa || !ppvdUser) {
    html += `<div class="def-box">Entre com sua conta PPVD (botão "Entrar (PPVD)" no topo) pra enviar e ver mensagens.</div>`;
    document.getElementById('main').innerHTML = html; return;
  }
  if (!ppvdPerfil || !ppvdPerfil.aprovado) {
    html += `<div class="def-box">Seu acesso ainda não foi aprovado — assim que for, você poderá enviar dúvidas, sugestões e solicitações ao administrador por aqui.</div>`;
    document.getElementById('main').innerHTML = html; return;
  }
  const souAdmin = !!ppvdPerfil.is_admin;
  html += `<div class="def-box">${souAdmin ? '<b>Caixa de entrada do administrador.</b> Responda, marque o andamento ou execute os pedidos de exclusão.' : 'Envie <b>dúvidas, sugestões ou solicitações</b> ao administrador do painel. A resposta aparece aqui mesmo (e um número vermelho avisa no botão ✉ Mensagens).'}</div>`;
  html += `<div class="ppvd-card"><b>Nova mensagem</b><br><br>
    <div class="ppvd-field"><label>Tipo</label><select id="msgTipo"><option value="duvida">Dúvida</option><option value="sugestao">Sugestão</option><option value="solicitacao">Solicitação</option></select></div>
    <div class="ppvd-field"><label>Assunto</label><input id="msgAssunto" maxlength="120"></div>
    <div class="ppvd-field"><label>Mensagem</label><textarea id="msgTexto" rows="4" maxlength="4000"></textarea></div>
    <button class="ppvd-btn ppvd-btn-primary" onclick="msgEnviar()">Enviar</button></div>`;
  html += `<div class="page-title" style="margin-top:24px;font-size:16px">${souAdmin ? 'Mensagens recebidas' : 'Minhas mensagens'}</div>`;
  if (souAdmin) html += `<div class="ppvd-field" style="max-width:260px"><label>Mostrar</label><select id="msgFiltro"><option value="pendentes">Pendentes (abertas e em andamento)</option><option value="todas">Todas</option></select></div>`;
  html += `<div id="msgLista"><div class="def-box">Carregando…</div></div>`;
  document.getElementById('main').innerHTML = html;

  let q = ppvdSupa.from('mensagens').select('*').order('created_at', { ascending: false }).limit(200);
  if (!souAdmin) q = q.eq('autor_id', ppvdUser.id);
  const { data, error } = await q;
  const box = document.getElementById('msgLista');
  if (!box) return; // saiu da página enquanto carregava
  if (error) { box.innerHTML = `<div class="def-box">Erro ao carregar mensagens: ${msgEsc(error.message)}</div>`; return; }
  window.msgCache = {}; (data || []).forEach(m => { window.msgCache[m.id] = m; });
  const pintar = () => {
    const f = souAdmin ? document.getElementById('msgFiltro').value : 'todas';
    const lista = (data || []).filter(m => f === 'todas' || m.status === 'aberta' || m.status === 'em_andamento');
    box.innerHTML = lista.length ? lista.map(m => msgCartao(m, souAdmin)).join('') : `<div class="pending-box">Nenhuma mensagem${f === 'pendentes' ? ' pendente' : ''}.</div>`;
  };
  if (souAdmin) document.getElementById('msgFiltro').addEventListener('change', pintar);
  pintar();
  // abrir a caixa = ler: admin marca as novas como lidas; autor marca as respostas como lidas
  const campo = souAdmin ? 'lida_admin' : 'resposta_lida';
  if ((data || []).some(m => m[campo] === false)) {
    await ppvdSupa.from('mensagens').update({ [campo]: true }).eq(campo, false);
    ppvdAtualizarBadgeMensagens();
  }
}

async function msgEnviar() {
  const texto = document.getElementById('msgTexto').value.trim();
  if (!texto) { alert('Escreva a mensagem.'); return; }
  const { error } = await ppvdSupa.from('mensagens').insert({
    tipo: document.getElementById('msgTipo').value, assunto: document.getElementById('msgAssunto').value.trim() || null, texto
  });
  if (error) { alert('Erro ao enviar: ' + error.message); return; }
  estadoUI.limparCampos();
  alert('Mensagem enviada ao administrador.');
  renderMensagensPage();
}

// Usuário sem permissão de apagar pede ao admin (cria uma mensagem ligada ao caso/visita).
async function ppvdSolicitarAoAdmin(tipo, casoId, visitaId) {
  const motivo = prompt(tipo === 'apagar_visita' ? 'Por que essa visita deve ser apagada? (o admin vai receber o pedido)' : 'Por que esse caso deve ser reiniciado? (o admin vai receber o pedido)');
  if (!motivo || !motivo.trim()) return;
  const caso = window.ppvdCasoAtual && window.ppvdCasoAtual.id === casoId ? window.ppvdCasoAtual : null;
  const { error } = await ppvdSupa.from('mensagens').insert({
    tipo, assunto: tipo === 'apagar_visita' ? 'Apagar visita' : 'Reiniciar caso', texto: motivo.trim(),
    caso_id: casoId, visita_id: visitaId || null, reds_numero: caso ? caso.reds_numero : null
  });

  alert('Pedido enviado ao administrador. A resposta aparece em ✉ Mensagens.');
}

async function msgResponder(id, novoStatus) {
  const campo = document.getElementById('msgResp-' + id);
  const txt = campo ? campo.value.trim() : '';
  const upd = { status: novoStatus, resposta_lida: false, lida_admin: true, respondido_por: ppvdPerfil.nome, respondido_em: new Date().toISOString() };

// Admin executa o pedido de exclusão feito por outro usuário.
async function msgExecutar(id) {
  const m = window.msgCache[id];
  if (!m || !ppvdPerfil || !ppvdPerfil.is_admin) return;
  if (m.tipo === 'apagar_visita') {
    if (!m.visita_id) { alert('O pedido não traz a visita.'); return; }
    if (!confirm('Apagar a visita pedida por ' + (m.autor_nome || 'usuário') + '? Não pode ser desfeito.')) return;
    const r = await ppvdExcluirVisita(m.visita_id, m.caso_id);
    if (!r.ok) { alert(r.erro); return; }
  } else if (m.tipo === 'reiniciar_caso') {
    if (!m.caso_id) { alert('O pedido não traz o caso.'); return; }
    if (!confirm('Reiniciar o caso pedido por ' + (m.autor_nome || 'usuário') + '? TODAS as visitas serão apagadas. Não pode ser desfeito.')) return;
    const r = await ppvdReiniciarCasoExec(m.caso_id);
    if (!r.ok) { alert(r.erro); return; }
  } else return;
  const campo = document.getElementById('msgResp-' + id);
  const txt = campo ? campo.value.trim() : '';
  await ppvdSupa.from('mensagens').update({
    status: 'resolvida', resposta_lida: false, lida_admin: true, respondido_por: ppvdPerfil.nome, respondido_em: new Date().toISOString(),
    resposta: txt || 'Pedido executado pelo administrador.'
  }).eq('id', id);
  renderMensagensPage();
}

// Apagar visita (só admin). O supabase-js NÃO dá erro quando a regra do banco impede e 0 linhas são apagadas,
// então confere o que voltou em .select().
async function ppvdExcluirVisita(visitaId, casoId) {
  const { data, error } = await ppvdSupa.from('ppvd_visitas').delete().eq('id', visitaId).select('id');
  if (error) return { ok: false, erro: 'Erro: ' + error.message };
  if (!data || !data.length) return { ok: false, erro: 'Nada foi apagado: só o administrador geral pode apagar visitas (ou a visita já não existe).' };
  if (casoId) {
    const { data: visitas } = await ppvdSupa.from('ppvd_visitas').select('visita_realizada_em').eq('caso_id', casoId);
    const status = !visitas || !visitas.length ? 'aberto' : (visitas.some(v => !v.visita_realizada_em) ? 'em_visita' : 'decisao_cmd');
    await ppvdSupa.from('ppvd_casos').update({ status }).eq('id', casoId).neq('status', 'estabilizada');
  }
  return { ok: true };
}

async function ppvdReiniciarCasoExec(casoId) {
  const { error: errDel } = await ppvdSupa.from('ppvd_visitas').delete().eq('caso_id', casoId).select('id');
  if (errDel) return { ok: false, erro: 'Erro ao apagar visitas: ' + errDel.message };
  const { count } = await ppvdSupa.from('ppvd_visitas').select('id', { count: 'exact', head: true }).eq('caso_id', casoId);
  if (count > 0) return { ok: false, erro: 'As visitas não foram apagadas: só o administrador geral pode reiniciar um caso.' };
  const upd = {
    status: 'aberto', gravidade: null, urgencia: null, tendencia: null,
    gut_final_gravidade: null, gut_final_urgencia: null, gut_final_tendencia: null,
    qtd_retornos: 0, visita_autor_feita: false, visita_vitima_feita: false,
    militar_responsavel: null, militar_responsavel_whatsapp: null, estabilizado_em: null, estabilizado_por: null,
  };
  const { data: caso, error } = await ppvdSupa.from('ppvd_casos').update(upd).eq('id', casoId).select().single();
  if (error) return { ok: false, erro: 'Erro: ' + error.message };
  return { ok: true, caso };
}

// Classificação GUT + identificação num salvamento só (antes eram dois botões, e quem salvava um perdia o que digitou no outro).
async function ppvdSalvarCaso(casoId) {
  const num = (id) => parseInt(document.getElementById(id).value) || null;
  const g = num('ppvdG'), u = num('ppvdU'), t = num('ppvdT');
  const preenchidos = [g, u, t].filter(Boolean).length;
  if (preenchidos > 0 && preenchidos < 3) { alert('Preencha Gravidade, Urgência e Tendência — ou deixe as três em branco.'); return; }
  const upd = {
    gravidade: g, urgencia: u, tendencia: t,
    vitima_nome: document.getElementById('ppvdVitNome').value.trim() || null,
    autor_nome: document.getElementById('ppvdAutNome').value.trim() || null,
    tem_mandado: document.getElementById('ppvdMandado').value === 'true',
    medida_protetiva: document.getElementById('ppvdMP').value === 'true',
    pelotao: document.getElementById('ppvdPelotao').value.trim() || null,
    destacamento: document.getElementById('ppvdDestacamento').value.trim() || null,
  };
  const { error } = await ppvdSupa.from('ppvd_casos').update(upd).eq('id', casoId);
  if (error) { alert('Erro: ' + error.message); return; }
  const { data: caso } = await ppvdSupa.from('ppvd_casos').select('*').eq('id', casoId).single();
  await ppvdRenderCaso(caso);
}

function ppvdNormalizarWhatsApp(v) {
  let d = (v || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.length <= 11 && !d.startsWith('55')) d = '55' + d;
  return d;
}
async function ppvdDespacharVD(casoId, isRetorno) {
  const nomeEl = document.getElementById('ppvdRespNome');
  const whatsEl = document.getElementById('ppvdRespWhats');
  const nome = nomeEl ? nomeEl.value.trim() : '';
  const whats = whatsEl ? ppvdNormalizarWhatsApp(whatsEl.value) : '';
  if (!nome || !whats) { alert('Preencha nome e WhatsApp do militar responsável.'); return; }
  const { data: visita, error } = await ppvdSupa.from('ppvd_visitas').insert({
    caso_id: casoId, despachado_por: ppvdPerfil.nome, despachado_em: new Date().toISOString(), guarnicao: nome
  }).select().single();
  if (error) { alert('Erro ao despachar: ' + error.message); return; }
  const upd = { status: 'em_visita', militar_responsavel: nome, militar_responsavel_whatsapp: whats };
  if (isRetorno) upd.qtd_retornos = (window.ppvdCasoAtual ? (window.ppvdCasoAtual.qtd_retornos || 0) + 1 : 1);
  const { data: caso, error: errUpd } = await ppvdSupa.from('ppvd_casos').update(upd).eq('id', casoId).select().single();
  if (errUpd) { alert('Erro: ' + errUpd.message); return; }
  const msg = ppvdMontarMensagemWhatsApp(caso, visita.token);

async function ppvdUploadBos(token, inputId, tipo) {
  const inp = document.getElementById(inputId);
  if (!inp || !inp.files || !inp.files[0]) return null;
  const file = inp.files[0];
  const path = `${token}/${tipo}_${Date.now()}_${file.name}`;
  const { error } = await ppvdSupa.storage.from('ppvd-bos-visita').upload(path, file);
  if (error) { alert(`Erro ao enviar BOS (${tipo}): ` + error.message); return null; }
  return path;
}

async function ppvdSubmeterVisitaPublica(token) {
  const btn = document.getElementById('pvSubmitBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  const bosAutorPath = await ppvdUploadBos(token, 'pvBosAutor', 'autor');
  const bosVitimaPath = await ppvdUploadBos(token, 'pvBosVitima', 'vitima');
  const payload = {
    p_token: token,
    p_visita_autor: document.getElementById('pvAutorFeita').value === 'true',
    p_visita_vitima: document.getElementById('pvVitimaFeita').value === 'true',
    p_situacao: document.getElementById('pvSituacao').value || null,
    p_vitima_presente: document.getElementById('pvVitPresente').value === 'true',
    p_autor_presente: document.getElementById('pvAutPresente').value === 'true',
    p_gut_g: parseInt(document.getElementById('pvG').value) || null,
    p_gut_u: parseInt(document.getElementById('pvU').value) || null,
    p_gut_t: parseInt(document.getElementById('pvT').value) || null,
    p_bos_autor_url: bosAutorPath,
    p_bos_vitima_url: bosVitimaPath,
    p_observacoes: document.getElementById('pvObs').value || null,
  };
  const { error } = await ppvdSupa.rpc('ppvd_submeter_visita', payload);
  if (error) { alert('Erro ao enviar: ' + error.message); btn.disabled = false; btn.textContent = 'Enviar'; return; }
  document.getElementById('main').innerHTML = `<div class="page-title">Visita registrada ✓</div><div class="def-box">Obrigado. O comandante já pode ver o resultado e decidir os próximos passos.</div>`;
}

// ============ Menu novo, filtro por município em botões e "Atenção agora" (protótipo aprovado por Eduardo em 2026-10-09) ============
// Cada indicador do menu mostra quantas cidades estão fora da meta no acumulado (vermelho; amarelo se só há atenção;
// verde 0). A Home ganha o painel "Atenção agora" com os itens mais graves (cidade × indicador), clicáveis.
const MENU_IND = {
  imv: { d: 'mv', tipo: 'teto', nome: 'MV' }, cvpe: { d: 'cvpe', tipo: 'teto', nome: 'CVPE' }, cvpa: { d: 'cvpa', tipo: 'teto', nome: 'CVPA' },
  furto: { d: 'furto', tipo: 'teto', nome: 'Furto Rural' }, pog: { d: 'pog', tipo: 'pog', nome: 'POG' },
  armas: { d: 'armas', tipo: 'piso', nome: 'Armas' }, cavaloaco: { d: 'cavaloaco', tipo: 'piso', nome: 'Cavalo de Aço' },
  rolezinho: { d: 'rolezinho', tipo: 'piso', nome: 'Rolezinho' }, padesc: { d: 'padesc', tipo: 'piso', nome: 'Padrinhos da Escola' },
  saque_seguro: { d: 'saque_seguro', tipo: 'piso', nome: 'Saque Seguro' },
};
const MENU_GRUPO_DE = { imv: 'criminais', cvpe: 'criminais', cvpa: 'criminais', furto: 'outros', esforco_furto: 'outros', armas: 'outros', itvd: 'outros',
  pog: 'operacoes', ppag: 'operacoes', idob: 'operacoes', cavaloaco: 'operacoes', rolezinho: 'operacoes', padesc: 'operacoes', saque_seguro: 'operacoes' };
function canonMun(nome) { const n = normMun(nome); return MUNICIPIOS_CANONICAL.find(m => normMun(m) === n) || nome; }
let MENU_AVAL = null;
function avaliarIndicadoresMenu() {
  if (MENU_AVAL) return MENU_AVAL;
  const itens = [], porPagina = {};
  const add = (pagina, nomeInd, mun, status, detalhe, gravidade) => {
    const p = porPagina[pagina] = porPagina[pagina] || { r: 0, a: 0 };
    if (status === 'vermelho') p.r++; else if (status === 'amarelo') p.a++;
    if (status !== 'verde') itens.push({ pagina, indicador: nomeInd, mun: canonMun(mun), status, detalhe, gravidade });
  };
  const idxStatus = (v) => (v >= 95 ? 'verde' : (v >= 85 ? 'amarelo' : 'vermelho'));
  Object.keys(MENU_IND).forEach(pagina => {
    const cfg = MENU_IND[pagina], d = DATA[cfg.d]; if (!d) return;
    const mi = Math.min(MES_ATUAL_IDX, d.total_acum.length - 1);
    porPagina[pagina] = porPagina[pagina] || { r: 0, a: 0 };
    d.municipios.forEach(m => {
      const real = m.realizado_acum[mi], meta = m.meta_acum[mi];
      if (cfg.tipo === 'teto') add(pagina, cfg.nome, m.nome, statusTeto(real, meta), `${real} no ano (teto ${meta})`, (real - meta) / Math.max(meta, 1));
      else if (cfg.tipo === 'pog') { const v = meta ? real / meta * 100 : 100; add(pagina, cfg.nome, m.nome, statusPog(v), `${Math.round(v)}% da meta`, Math.abs(100 - v) / 100); }
      else add(pagina, cfg.nome, m.nome, statusPisoEf(m, d, '_acum', mi), `${real}/${meta} (${meta ? Math.round(real / meta * 100) : 100}%)`, (meta - real) / Math.max(meta, 1));
    });
  });
  { // prisões de furto: >= 50% verde, >= 25% amarelo
    const d = DATA.esforco_furto, mi = Math.min(MES_ATUAL_IDX, d.total_reds_acum.length - 1);
    porPagina.esforco_furto = { r: 0, a: 0 };
    d.municipios.forEach(m => { const r = m.reds_acum[mi], p = m.prisoes_acum[mi], v = r ? p / r * 100 : 100;
      add('esforco_furto', 'Prisões de Furto', m.nome, v >= 50 ? 'verde' : (v >= 25 ? 'amarelo' : 'vermelho'), `${p} prisões / ${r} REDS (${Math.round(v)}%)`, (50 - v) / 100); });
  }
  { // ITVD e IDOB (índices de qualidade)
    const d = DATA.itvd, mi = Math.min(MES_ATUAL_IDX, d.total_trafico_acum.length - 1);
    porPagina.itvd = { r: 0, a: 0 };
    d.municipios.forEach(m => { const t = m.trafico_acum[mi], v = t ? ((t - m.vit_acum[mi] * 2) / t) * 100 : 100; add('itvd', 'ITVD', m.nome, idxStatus(v), `ITVD ${v.toFixed(1)}`, (100 - v) / 100); });
    const b = DATA.idob, mb = Math.min(MES_ATUAL_IDX, b.total_qtdeop_acum.length - 1);
    porPagina.idob = { r: 0, a: 0 };
    b.municipios.forEach(m => { const v = calcIdobIndice(m.qop_acum[mb], m.mv_acum[mb] + m.cvpe_acum[mb] + m.cvpa_acum[mb]); add('idob', 'IDOB', m.nome, idxStatus(v), `IDOB ${v.toFixed(1)}`, (100 - v) / 100); });
  }
  { // PPAG: pior das 3 metas (Y15001, Y07012, Y07014)
    const ys = [['Y15001', DATA.ppag.y15001], ['Y07012', DATA.ppag.y07012], ['Y07014', DATA.ppag.y07014]];
    const mi = Math.min(MES_ATUAL_IDX, ys[0][1].total_acum.length - 1);
    porPagina.ppag = { r: 0, a: 0 };
    ys[0][1].municipios.forEach(m1 => {
      let pior = 'verde', falhas = [];
      ys.forEach(([n, d]) => { const m = d.municipios.find(x => normKey(x.nome) === normKey(m1.nome)); if (!m) return;
        const st = statusPisoEf(m, d, '_acum', mi); if (st !== 'verde') { falhas.push(`${n} ${m.meta_acum[mi] ? Math.round(m.realizado_acum[mi] / m.meta_acum[mi] * 100) : 100}%`); if (st === 'vermelho' || pior === 'verde') pior = st; } });
      add('ppag', 'PPAG', m1.nome, pior, falhas.join(', '), falhas.length / 3);
    });
  }
  itens.sort((a, b) => (a.status === b.status ? b.gravidade - a.gravidade : (a.status === 'vermelho' ? -1 : 1)));
  return (MENU_AVAL = { itens, porPagina });
}

function definirGrupo(g, aberto, salvar = true) {
  g.classList.toggle('aberto', aberto);
  const lab = g.querySelector('.nav-group-label'); if (lab) lab.setAttribute('aria-expanded', String(aberto));
  if (salvar) { try { const est = JSON.parse(localStorage.getItem('menuGrupos70bpm') || '{}'); est[g.dataset.grupo] = aberto; localStorage.setItem('menuGrupos70bpm', JSON.stringify(est)); } catch (e) {} }
  const gb = g.querySelector('.gbd'); if (gb) { const t = parseInt(gb.textContent || '0', 10); gb.hidden = !(t > 0) || aberto; }
}
(function iniciarMenu() {
  try { const est = JSON.parse(localStorage.getItem('menuGrupos70bpm') || '{}'); document.querySelectorAll('.nav-group').forEach(g => { if (g.dataset.grupo in est) definirGrupo(g, !!est[g.dataset.grupo], false); }); } catch (e) {}
  document.querySelectorAll('.nav-group-label').forEach(l => l.addEventListener('click', () => definirGrupo(l.closest('.nav-group'), !l.closest('.nav-group').classList.contains('aberto'))));
  const busca = document.getElementById('menuBusca');
  if (busca) {
    const limpa = (t) => normMun(t).toLowerCase();
    busca.addEventListener('input', () => {
      const q = limpa(busca.value.trim());
      document.body.classList.toggle('menu-buscando', !!q);
      document.querySelectorAll('.nav-btn').forEach(b => { if (b.closest('.sidebar')) b.hidden = !!q && !limpa(b.textContent).includes(q); });
      document.querySelectorAll('.nav-group').forEach(g => { g.hidden = !!q && ![...g.querySelectorAll('.nav-btn')].some(b => !b.hidden); });
    });
    busca.addEventListener('keydown', (e) => { if (e.key === 'Escape') { busca.value = ''; busca.dispatchEvent(new Event('input')); } });
  }
})();

// painel "Atenção agora" (Home): um cartão por cidade (as mais críticas primeiro), com seus problemas clicáveis
function atencaoAgoraHtml() {
  let aval; try { aval = avaliarIndicadoresMenu(); } catch (e) { return ''; }
  const filtro = getMunFiltro();
  const porCidade = {};
  aval.itens.forEach(i => { const c = porCidade[i.mun] = porCidade[i.mun] || { nome: i.mun, v: 0, a: 0, itens: [] }; c.itens.push(i); if (i.status === 'vermelho') c.v++; else c.a++; });
  let cidades = Object.values(porCidade).sort((a, b) => (b.v - a.v) || (b.a - a.a) || a.nome.localeCompare(b.nome));
  if (filtro) cidades = cidades.filter(c => normMun(c.nome) === normMun(filtro));
  const escopo = filtro || `${MUNICIPIOS_CANONICAL.length} cidades`;
  const mes = (DATA.mv.meses || MESES)[Math.min(MES_ATUAL_IDX, DATA.mv.total_acum.length - 1)];
  if (!cidades.length) return `<div class="atencao ok"><div class="hd"><b>✓ Atenção agora</b><span>${escopo}: nenhum indicador fora da meta no acumulado.</span></div></div>`;
  const totV = cidades.reduce((s, c) => s + c.v, 0), totA = cidades.reduce((s, c) => s + c.a, 0);
  const LIM = filtro ? cidades.length : (window.innerWidth < 700 ? 3 : 6); // celular mostra 3 cidades; o resto fica atrás do botão
  const cartao = (c, i) => {
    const mostra = c.itens.slice(0, filtro ? 40 : 4), resto = c.itens.length - mostra.length;
    return `<div class="atn-cidade ${c.v ? 'r' : 'a'}${i >= LIM ? ' atn-extra' : ''}" ${i >= LIM ? 'hidden' : ''}>` +
      `<button type="button" class="atn-nome" data-mun="${c.nome}" title="${filtro ? 'Tirar o filtro desta cidade' : 'Filtrar a Home por esta cidade'}"><span>${c.nome}</span><span class="cont">${c.v ? `<span class="rv">${c.v} ✕</span>` : ''} ${c.a ? `<span class="am">${c.a} !</span>` : ''}</span></button><ul>` +
      mostra.map(it => `<li><button type="button" class="atn-item ${it.status === 'vermelho' ? 'r' : 'a'}" data-pg="${it.pagina}" data-mun="${it.mun}" title="${it.status === 'vermelho' ? 'Fora da meta' : 'Atenção'} — abrir ${it.indicador} em ${it.mun}"><span class="g" aria-hidden="true">${it.status === 'vermelho' ? '✕' : '!'}</span><span>${it.indicador}</span><small>${it.detalhe}</small></button></li>`).join('') +
      `</ul>${resto > 0 ? `<div class="atn-mais-itens">+ ${resto} indicador(es)</div>` : ''}</div>`;
  };
  let h = `<div class="atencao"><div class="hd"><b>⚠ Atenção agora</b><span>${escopo} · acumulado até ${mes} · ${totV} fora da meta, ${totA} em atenção · clique para abrir já filtrado</span></div><div class="atn-grid">`;
  h += cidades.map(cartao).join('') + `</div>`;
  if (cidades.length > LIM) h += `<button type="button" class="atn-mais" data-rotulo="Ver as ${cidades.length} cidades com alertas" data-lim="${LIM}" data-aberto="0">Ver as ${cidades.length} cidades com alertas</button>`;
  return h + `</div>`;
}
function atencaoAgoraLigar() {
  const box = document.querySelector('#main .atencao'); if (!box) return;
  box.addEventListener('click', (e) => {
    const it = e.target.closest('.atn-item');
    if (it) { setMunFiltro(it.dataset.mun); goToPage(it.dataset.pg); return; }
    const nome = e.target.closest('.atn-nome');
    if (nome) {
      setMunFiltro(normMun(getMunFiltro()) === normMun(nome.dataset.mun) ? '' : nome.dataset.mun);
      box.outerHTML = atencaoAgoraHtml(); atencaoAgoraLigar(); highlightMunRows(); return;
    }
    const mais = e.target.closest('.atn-mais');
    if (mais) {
      const abre = mais.dataset.aberto !== '1';
      box.querySelectorAll('.atn-extra').forEach(c => { c.hidden = !abre; });
      mais.dataset.aberto = abre ? '1' : '0'; mais.textContent = abre ? `Mostrar só as ${mais.dataset.lim} mais críticas` : mais.dataset.rotulo;
    }
  });
}

// quadro de cumprimento: abas Mês/Acumulado, cabeçalho e células clicáveis
const QUADRO_COLS_PG = [null, 'imv', 'cvpe', 'cvpa', 'furto', 'armas', 'esforco_furto', 'pog', 'ppag', 'ppag', 'ppag', 'cavaloaco', 'rolezinho', 'padesc', 'saque_seguro', 'idob', 'itvd'];
function avisoRolagemQuadro(box) {
  box.querySelectorAll('.dica-rolagem').forEach(d => d.remove());
  const w = box.querySelector('[data-painel]:not([hidden]) .table-wrap');
  if (w && w.scrollWidth > w.clientWidth + 2) { const d = document.createElement('div'); d.className = 'dica-rolagem on'; d.textContent = '← deslize para ver todas as colunas →'; w.insertAdjacentElement('afterend', d); }
}
function ligarQuadroHome() {
  const box = document.querySelector('#main .quadro-unico'); if (!box) return;
  box.querySelectorAll('table.matriz-home').forEach(t => {
    t.querySelectorAll('thead th').forEach((th, i) => { if (QUADRO_COLS_PG[i]) { th.dataset.pg = QUADRO_COLS_PG[i]; th.title = th.title || 'Abrir a página deste indicador'; } });
    t.querySelectorAll('tbody td').forEach(td => { if (td.cellIndex > 0 && QUADRO_COLS_PG[td.cellIndex]) td.classList.add('cel-clic'); });
  });
  box.addEventListener('click', (e) => {
    const aba = e.target.closest('.aba');
    if (aba) {
      box.querySelectorAll('.aba').forEach(b => { const on = b === aba; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
      box.querySelectorAll('[data-painel]').forEach(p => { p.hidden = p.dataset.painel !== aba.dataset.aba; });
      try { localStorage.setItem('homeAbaQuadro', aba.dataset.aba); } catch (er) {}
      avisoRolagemQuadro(box); return;
    }
    const th = e.target.closest('th[data-pg]');
    if (th) { goToPage(th.dataset.pg); return; }
    const td = e.target.closest('tbody td'); if (!td) return;
    const tr = td.parentElement, total = tr.classList.contains('linha-total');
    if (td.cellIndex === 0) {
      if (total) return;
      const m = canonMun(td.textContent.trim());
      setMunFiltro(normMun(getMunFiltro()) === normMun(m) ? '' : m);
      const at = document.querySelector('#main .atencao'); if (at) { at.outerHTML = atencaoAgoraHtml(); atencaoAgoraLigar(); }
      highlightMunRows(); return;
    }
    const pg = QUADRO_COLS_PG[td.cellIndex]; if (!pg) return;
    setMunFiltro(total ? '' : canonMun(tr.firstElementChild.textContent.trim()));
    goToPage(pg);
  });
  avisoRolagemQuadro(box);
}

// barra de abas do celular + folha de itens
const TABS = [['home', '🏠', 'Home'], ['indicadores', '🎯', 'Indicadores'], ['operacoes', '🚓', 'Operações'], ['mensagens', '✉', 'Mensagens'], ['menu', '☰', 'Menu']];
function pintarTabbar() {
  const bar = document.getElementById('tabbar'); if (!bar) return;
  let aval = null; try { aval = avaliarIndicadoresMenu(); } catch (e) {}
  const soma = (grupos) => aval ? Object.keys(MENU_GRUPO_DE).filter(p => grupos.includes(MENU_GRUPO_DE[p])).reduce((s, p) => s + ((aval.porPagina[p] || {}).r || 0), 0) : 0;
  const grupoAtual = MENU_GRUPO_DE[currentPageKey];
  const on = (k) => (k === 'home' && currentPageKey === 'home') || (k === 'mensagens' && currentPageKey === 'mensagens') ||
    (k === 'indicadores' && ['criminais', 'outros'].includes(grupoAtual)) || (k === 'operacoes' && grupoAtual === 'operacoes');
  const bdVal = { indicadores: soma(['criminais', 'outros']), operacoes: soma(['operacoes']) };
  bar.innerHTML = TABS.map(([k, ic, nome]) => `<button type="button" class="tab${on(k) ? ' on' : ''}" data-tab="${k}" ${on(k) ? 'aria-current="page"' : ''}><span class="i" aria-hidden="true">${ic}</span>${nome}${bdVal[k] > 0 ? `<span class="bd r">${bdVal[k]}</span>` : ''}${k === 'mensagens' ? '<span class="bd msg msg-badge" hidden></span>' : ''}</button>`).join('');
  ppvdAtualizarBadgeMensagens();
}
function abrirFolha(tipo) {
  const grupos = tipo === 'indicadores' ? ['criminais', 'outros'] : ['operacoes'];
  const box = document.getElementById('folhaBox'); if (!box) return;
  box.innerHTML = grupos.map(gid => { const g = document.querySelector(`.sidebar .nav-group[data-grupo="${gid}"]`); if (!g) return '';
    const nome = g.querySelector('.nav-group-label .nt').textContent;
    return `<div class="grupo-nome">${nome}</div><div class="grade">${[...g.querySelectorAll('.nav-btn')].map(b => b.outerHTML.replace(' active', '')).join('')}</div>`; }).join('');
  box.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => {
    if (b.classList.contains('disabled')) return;
    document.getElementById('folha').classList.remove('on'); goToPage(b.dataset.page);
  }));
  document.getElementById('folha').classList.add('on');
}
(function iniciarTabbar() {
  const bar = document.getElementById('tabbar'), folha = document.getElementById('folha');
  if (!bar || !folha) return;
  bar.addEventListener('click', (e) => {
    const t = e.target.closest('.tab'); if (!t) return;
    const k = t.dataset.tab;
    if (k === 'home' || k === 'mensagens') { folha.classList.remove('on'); goToPage(k); }
    else if (k === 'menu') { folha.classList.remove('on'); document.getElementById('menuToggle').click(); }
    else abrirFolha(k);
  });
  folha.addEventListener('click', (e) => { if (e.target === folha) folha.classList.remove('on'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') folha.classList.remove('on'); });
})();
pintarPilulasMun();
pintarBadgesMenu();

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('disabled')) { renderPending(((btn.querySelector('.nt') || btn).textContent || '').trim()); return; }
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    goToPage(btn.dataset.page);
  });
});

// Se o navegador descartou a aba em segundo plano e recarregou, volta pra onde o usuário
// estava em vez de reiniciar sempre na Home. localStorage (não sessionStorage) desde
// 2026-10-01 — Eduardo relatou que isso continuava acontecendo mesmo depois da correção de
// 09/2026; em mobile (principalmente Safari/iOS) o sistema às vezes limpa o sessionStorage
// junto quando descarta a aba por memória, não só recarrega — localStorage é bem mais
// resistente a isso. Único efeito colateral: se o usuário fechar a aba de propósito e abrir
// o site de novo bem mais tarde, volta pra última página em vez da Home — aceitável, é
// exatamente o comportamento que foi pedido ("não quero perder a continuidade").
let paginaRestaurada = 'home';
try {
  const salva = localStorage.getItem('paginaAtualPPVD');
  if (salva && pages[salva]) paginaRestaurada = salva;
  // Lido ANTES do goToPage() logo abaixo — ele apaga 'ppvdCasoAbertoReds' do localStorage a
  // cada chamada, então precisa capturar o valor aqui pra ppvdTentarRestaurarCaso() usar
  // depois (ver comentário ali). Achado por Eduardo em 2026-10-01.
  ppvdCasoAbertoRedsNaCarga = localStorage.getItem('ppvdCasoAbertoReds');
} catch (e) {}
if (!(location.hash || '').startsWith('#visita=')) {
  goToPage(paginaRestaurada);
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.page === paginaRestaurada);
  });
} // se for link publico de visita (#visita=...), ppvdCheckVisitaPublica ja assumiu o #main — nao sobrescreve

// Menu recolhível no celular (a barra lateral vira gaveta abaixo de 900px).
(function menuMobile() {
  const btn = document.getElementById('menuToggle'), fundo = document.getElementById('navBackdrop');
  if (!btn || !fundo) return;
  const set = (aberto) => {
    document.body.classList.toggle('nav-open', aberto);
    btn.setAttribute('aria-expanded', String(aberto));
    btn.setAttribute('aria-label', aberto ? 'Fechar menu' : 'Abrir menu');
  };
  btn.addEventListener('click', () => set(!document.body.classList.contains('nav-open')));
  fundo.addEventListener('click', () => set(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') set(false); });
  document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => set(false)));
  window.addEventListener('resize', () => { if (window.innerWidth > 900) set(false); });
})();

// Semântica pra leitor de tela (análise de 2026-10-09): o título de cada página (.page-title,
// que é um <div> montado por ~25 renders diferentes) passa a ser o <h1> da página.
(function tituloComoH1() {
  const main = document.getElementById('main');
  if (!main) return;
  const marcar = () => {
    const t = main.querySelector('.page-title');
    if (t && t.getAttribute('role') !== 'heading') { t.setAttribute('role', 'heading'); t.setAttribute('aria-level', '1'); }
  };
  new MutationObserver(marcar).observe(main, { childList: true });
  marcar();
})();

// Regra de acesso diário ao SiGOp (pedido de Eduardo em 2026-10-09): todo comandante de
// pelotão/destacamento/companhia precisa acessar o SiGOp pelo menos uma vez por dia. No 1º
// acesso do dia ao painel (por navegador) aparece este pop-up bloqueando a tela; clicar no
// link do SiGOp registra o dia no localStorage e libera o site. É um lembrete por clique —
// o painel não tem como confirmar que a pessoa de fato abriu/usou o SiGOp (site externo).
(function sigopGateDiario() {
  if ((location.hash || '').startsWith('#visita=')) return; // link público de visita não é bloqueado
  const hoje = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
  const CHAVE = 'sigopAcessoDia';
  try { if (localStorage.getItem(CHAVE) === hoje) return; } catch (e) {}
  const url = SIGOP_LINKS.mv;
  const overlay = document.createElement('div');
  overlay.id = 'sigopGate';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.innerHTML = `<div class="sg-box">
    <h2>Acesso diário ao SiGOp</h2>
    <p>Todo comandante de Pelotão, Destacamento e Companhia deve acessar o SiGOp <b>pelo menos uma vez por dia</b>. Para liberar o painel, clique no botão abaixo e acesse o SiGOp.</p>
    <a class="btn-sigop" id="sigopGateLink" href="${url}" target="_blank" rel="noopener noreferrer"><span>Acessar o SiGOp agora</span><span class="arrow">&#8599;</span></a>
    <p class="sg-note">Ao clicar, o aviso fecha e o painel fica liberado até o fim do dia.</p>
  </div>`;
  document.body.appendChild(overlay);
  const liberar = () => {
    try { localStorage.setItem(CHAVE, hoje); } catch (e) {}
    overlay.remove();
  };
  const link = document.getElementById('sigopGateLink');
  link.addEventListener('click', liberar);
  link.addEventListener('auxclick', liberar);
  link.focus();
})();
</script>
